crease in airline travel, so the TSA is now rushing to get new **[xxx]** on the line. Part of the issue is that airports have only so much room for screening lanes. Another factor may be that more people are trying to **[xxx]** their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\n>\n> 开始精读：\n>\n> Part of the issue is that the government did not **[xxx]** the steep increase in airline travel, / so the TSA is now rushing to get new **[xxx]** on the line. / Part of the issue is that airports have only so much room for screening lanes. / Another factor may be that more people are trying to **[xxx]** their carry-on bags / to avoid checked-baggage fees, / though the airlines strongly dispute this.\n>\n> 顺着英文顺序读：\n>\n> 问题的一部分是政府没有 **[xxx]** 航空出行的急剧增加， / 所以TSA现在正赶着把新的 **[xxx]** 安排上线。 / 问题的一部分是机场只有那么多空间供安检通道使用。 / 另一个因素可能是更多人正试图 **[xxx]** 他们的随身行李 / 来避免托运行李费用， / 尽管航空公司强烈反驳这一点。\n\n现在回到A，把旅客处理行李的做法与限制要求分开看：\n\n> Another factor may be that more people are trying to **[xxx]** their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\n\nA的 `restrictions on carry-on bags` 是有关部门或航空公司施加的限制；原文围绕 `their carry-on bags` 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。\n\n另外，原文用may be，结尾又写航空公司强烈争辩这一解释。A既换掉了行为主体，也把一个尚有争议的可能因素写成了明确的新限制。不能把“旅客怎样处理行李”和“机场怎样限制行李”混成同一件事。\n\n**第四段写的是机场对行李施加新限制，还是旅客为了避开费用在处理自己的行李？**\n\n后者。more people是主语，to avoid checked-baggage fees是目的，原文没有把这件事写成新的限制政策。\n\n因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. New restrictions on carry-on bags.</h3>\n<blockquote>\n<p>对随身行李的新限制</p>\n</blockquote>\n<p>把A接回题干，它说的是：美国主要机场等待时间长，是因为对随身行李出台了新限制。</p>\n<p>A的 <code>restrictions on carry-on bags</code> 与第四段的 <code>carry-on bags</code> 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Part of the issue is that the government did not <span class=\"mask\">[xxx]</span> the steep increase in airline travel, so the TSA is now rushing to get new <span class=\"mask\">[xxx]</span> on the line. Part of the issue is that airports have only so much room for screening lanes. Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.</p>\n<p>开始精读：</p>\n<p>Part of the issue is that the government did not <span class=\"mask\">[xxx]</span> the steep increase in airline travel, / so the TSA is now rushing to get new <span class=\"mask\">[xxx]</span> on the line. / Part of the issue is that airports have only so much room for screening lanes. / Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their carry-on bags / to avoid checked-baggage fees, / though the airlines strongly dispute this.</p>\n<p>顺着英文顺序读：</p>\n<p>问题的一部分是政府没有 <span class=\"mask\">[xxx]</span> 航空出行的急剧增加， / 所以TSA现在正赶着把新的 <span class=\"mask\">[xxx]</span> 安排上线。 / 问题的一部分是机场只有那么多空间供安检通道使用。 / 另一个因素可能是更多人正试图 <span class=\"mask\">[xxx]</span> 他们的随身行李 / 来避免托运行李费用， / 尽管航空公司强烈反驳这一点。</p>\n</blockquote>\n<p>现在回到A，把旅客处理行李的做法与限制要求分开看：</p>\n<blockquote>\n<p>Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.</p>\n</blockquote>\n<p>A的 <code>restrictions on carry-on bags</code> 是有关部门或航空公司施加的限制；原文围绕 <code>their carry-on bags</code> 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。</p>\n<p>另外，原文用may be，结尾又写航空公司强烈争辩这一解释。A既换掉了行为主体，也把一个尚有争议的可能因素写成了明确的新限制。不能把“旅客怎样处理行李”和“机场怎样限制行李”混成同一件事。</p>\n<p><strong>第四段写的是机场对行李施加新限制，还是旅客为了避开费用在处理自己的行李？</strong></p>\n<p>后者。more people是主语，to avoid checked-baggage fees是目的，原文没有把这件事写成新的限制政策。</p>\n<p>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,614,996,263],[168,890,997,190]],"questionRects":[[188,475,868,32],[233,528,461,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `restrictions on carry-on bags` 与第四段的 `carry-on bags` 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[3],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"carry-on bags","visibleOptionAnchor":"restrictions on carry-on bags"}}}},{"section":"22题","raw":"### B. The **[xxx]** efficiency of the TSA.\n\n> TSA的 **[xxx]** 效率\n\n把B接回题干，它说的是：美国主要机场等待时间长，是由于TSA的效率 **[xxx]**。\n\nB的 `efficiency of the TSA` 谈TSA办事效率；第三段的 `have resulted in long waits` 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。\n\n> **[xxx]** security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International. It is not yet clear how much more **[xxx]** airline security has become—but the lines are obvious.\n\n`have resulted in long waits` 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 `efficiency of the TSA` 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。\n\n段末尤其要分清：作者说安保在某方面改善了多少还不清楚，但队伍看得见。这不是一份已经确定TSA效率变化的结论。第四段又分别列旅客增加、通道空间和行李做法，不能把这些不同原因压成B那一个机构效率判断。\n\n**原文把长队归因于措施与出行增加，能不能仅凭队伍很长就确定TSA效率发生了某种变化？**\n\n不能。排队结果不等于效率测量，原文列出的原因也不是效率变化这件事。\n\nB把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. The <span class=\"mask\">[xxx]</span> efficiency of the TSA.</h3>\n<blockquote>\n<p>TSA的 <span class=\"mask\">[xxx]</span> 效率</p>\n</blockquote>\n<p>把B接回题干，它说的是：美国主要机场等待时间长，是由于TSA的效率 <span class=\"mask\">[xxx]</span>。</p>\n<p>B的 <code>efficiency of the TSA</code> 谈TSA办事效率；第三段的 <code>have resulted in long waits</code> 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。</p>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International. It is not yet clear how much more <span class=\"mask\">[xxx]</span> airline security has become—but the lines are obvious.</p>\n</blockquote>\n<p><code>have resulted in long waits</code> 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 <code>efficiency of the TSA</code> 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。</p>\n<p>段末尤其要分清：作者说安保在某方面改善了多少还不清楚，但队伍看得见。这不是一份已经确定TSA效率变化的结论。第四段又分别列旅客增加、通道空间和行李做法，不能把这些不同原因压成B那一个机构效率判断。</p>\n<p><strong>原文把长队归因于措施与出行增加，能不能仅凭队伍很长就确定TSA效率发生了某种变化？</strong></p>\n<p>不能。排队结果不等于效率测量，原文列出的原因也不是效率变化这件事。</p>\n<p>B把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,614,996,263],[168,890,997,190]],"questionRects":[[188,475,868,32],[233,581,490,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `efficiency of the TSA` 谈TSA办事效率；第三段的 `have resulted in long waits` 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"have resulted in long waits","visibleOptionAnchor":"efficiency of the TSA"}}}},{"section":"22题","raw":"### C. An increase in the number of travelers.\n\n> 旅客数量的增加\n\n把C接回题干，它说的是：美国主要机场等待时间长，其中一个原因是旅客数量增加。\n\nC的 `number of travelers` 与第三段的 `a rise in airline travel` 都涉及航空出行的人数增加，所以回看这部分和后面的have resulted in，看增加与等待是否被原文明说成因果。\n\n> **[xxx]** security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International.\n\n`a rise in airline travel` 是航空出行增加，C用 `number of travelers` 把它落到旅客数量上，所说的变化方向都是增加。due to the improving economy and low oil prices先交代出行为什么增加；后面的have resulted in则进一步说明这些因素怎样造成long waits。两层因果不要倒着读。\n\n原文没有说“旅客增加是唯一原因”，C也没有加only，只是在Which contributes to的问题下提供一个促成因素。combined with说明还有安保措施这个因素一同起作用，不会因此否定旅客增加本身的贡献。第四段的steep increase in airline travel也继续提到同一个增长。\n\n**原文把航空出行增加与安保措施一起接到long waits，能不能支持“旅客增加是一个原因”？**\n\n能。它在have resulted in前面直接参与构成原因，且C没有把“一个因素”夸大成“唯一因素”。\n\n人数增加、等待增加的方向和因果都接得上，因此保留C。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. An increase in the number of travelers.</h3>\n<blockquote>\n<p>旅客数量的增加</p>\n</blockquote>\n<p>把C接回题干，它说的是：美国主要机场等待时间长，其中一个原因是旅客数量增加。</p>\n<p>C的 <code>number of travelers</code> 与第三段的 <code>a rise in airline travel</code> 都涉及航空出行的人数增加，所以回看这部分和后面的have resulted in，看增加与等待是否被原文明说成因果。</p>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International.</p>\n</blockquote>\n<p><code>a rise in airline travel</code> 是航空出行增加，C用 <code>number of travelers</code> 把它落到旅客数量上，所说的变化方向都是增加。due to the improving economy and low oil prices先交代出行为什么增加；后面的have resulted in则进一步说明这些因素怎样造成long waits。两层因果不要倒着读。</p>\n<p>原文没有说“旅客增加是唯一原因”，C也没有加only，只是在Which contributes to的问题下提供一个促成因素。combined with说明还有安保措施这个因素一同起作用，不会因此否定旅客增加本身的贡献。第四段的steep increase in airline travel也继续提到同一个增长。</p>\n<p><strong>原文把航空出行增加与安保措施一起接到long waits，能不能支持“旅客增加是一个原因”？</strong></p>\n<p>能。它在have resulted in前面直接参与构成原因，且C没有把“一个因素”夸大成“唯一因素”。</p>\n<p>人数增加、等待增加的方向和因果都接得上，因此保留C。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[168,614,996,263],[168,890,997,190]],"questionRects":[[188,475,868,32],[233,634,518,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `number of travelers` 与第三段的 `a rise in airline travel` 都涉及航空出行的人数增加，所以回看这部分和后面的have resulted in，看增加与等待是否被原文明说成因果。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"a rise in airline travel","visibleOptionAnchor":"number of travelers"}}}},{"section":"22题","raw":"### D. Frequent unexpected secret checks.\n\n> 频繁而出乎意料的秘密检查\n\n把D接回题干，它说的是：美国主要机场等待时间长，是因为频繁而出乎意料的秘密检查。\n\nD的 `Frequent unexpected secret checks` 与第三段的 `a secret check` 都提到秘密检查，因此回到该段第一句，再把它与后一句写长队的内容区分开。\n\n> Last year, the Transportation Security Administration (TSA) found in a secret check that **[xxx]** investigators were able to **[xxx]** weapons—both fake and real—past airport security nearly every time they tried.\n\n原文的 `a secret check` 是去年一次调查检查，句子在报告调查人员在机场安检中做了什么。D却写 `Frequent unexpected secret checks`，把单次调查说成反复进行的、出乎意料的秘密检查，并让它直接承担排长队的原因。\n\nnearly every time they tried也不能给Frequent补依据。every time修饰的是调查人员尝试带武器通过的情况，不等于航空旅客不断受到秘密抽查。后一句用since then转到之后的安保措施，再接航空出行增加与长时间等待；调查的发现和其后的安检安排，在时间顺序与行为内容上都不同。\n\n**“调查人员几乎每次尝试”能不能推出旅客因为频繁秘密检查而排长队？**\n\n不能。尝试的主体是调查人员，而原文的秘密检查是发现情况的调查，不是反复拖慢旅客的日常程序。\n\nD把调查中的多次尝试换成检查频率，又把先前调查换成长队的直接原因。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. Frequent unexpected secret checks.</h3>\n<blockquote>\n<p>频繁而出乎意料的秘密检查</p>\n</blockquote>\n<p>把D接回题干，它说的是：美国主要机场等待时间长，是因为频繁而出乎意料的秘密检查。</p>\n<p>D的 <code>Frequent unexpected secret checks</code> 与第三段的 <code>a secret check</code> 都提到秘密检查，因此回到该段第一句，再把它与后一句写长队的内容区分开。</p>\n<blockquote>\n<p>Last year, the Transportation Security Administration (TSA) found in a secret check that <span class=\"mask\">[xxx]</span> investigators were able to <span class=\"mask\">[xxx]</span> weapons—both fake and real—past airport security nearly every time they tried.</p>\n</blockquote>\n<p>原文的 <code>a secret check</code> 是去年一次调查检查，句子在报告调查人员在机场安检中做了什么。D却写 <code>Frequent unexpected secret checks</code>，把单次调查说成反复进行的、出乎意料的秘密检查，并让它直接承担排长队的原因。</p>\n<p>nearly every time they tried也不能给Frequent补依据。every time修饰的是调查人员尝试带武器通过的情况，不等于航空旅客不断受到秘密抽查。后一句用since then转到之后的安保措施，再接航空出行增加与长时间等待；调查的发现和其后的安检安排，在时间顺序与行为内容上都不同。</p>\n<p><strong>“调查人员几乎每次尝试”能不能推出旅客因为频繁秘密检查而排长队？</strong></p>\n<p>不能。尝试的主体是调查人员，而原文的秘密检查是发现情况的调查，不是反复拖慢旅客的日常程序。</p>\n<p>D把调查中的多次尝试换成检查频率，又把先前调查换成长队的直接原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,614,996,263]],"questionRects":[[188,475,868,32],[233,687,468,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `Frequent unexpected secret checks` 与第三段的 `a secret check` 都提到秘密检查，因此回到该段第一句，再把它与后一句写长队的内容区分开。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","time","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"a secret check","visibleOptionAnchor":"Frequent unexpected secret checks"}}}},{"section":"22题","raw":"### 22题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n> **22题选C。**","contextRaw":"","html":"<h3>22题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>22题选C。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,475,868,32]],"scrollTarget":"auto","meta":{"kind":"result","qid":"22"}},{"section":"23题","raw":"## 23题\n\n> The word “expedited” (Para. 5) is closest in meaning to ______.  \n> 第五段中的expedited，意思最接近哪个词？\n\n题干的Para. 5已经指定第五段，被考的词是expedited。先完整读第五段，保留这个词本身，看它修饰什么，以及后一句怎样解释相关安排的效果。\n\n> 原文参考：\n>\n> There is one step the TSA could take that would not require **[xxx]** airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.\n>\n> 开始精读：\n>\n> There is one step the TSA could take / that would not require **[xxx]** airports or rushing to hire: / Enroll more people in the PreCheck program. / PreCheck is supposed to be a win-win for travelers and the TSA. / Passengers who pass a background check / are eligible to use expedited screening lanes. / This allows the TSA to focus on travelers who are higher risk, / saving time for everyone involved. / The TSA wants to enroll 25 million people in PreCheck.\n>\n> 顺着英文顺序读：\n>\n> 有一个步骤TSA可以采取 / 它不要求 **[xxx]** 机场或者匆忙招聘： / 让更多人加入PreCheck预检计划。 / PreCheck按设想应该让旅客和TSA双赢。 / 通过背景审查的旅客 / 有资格使用expedited安检通道。 / 这让TSA能够重点关注风险更高的旅客， / 为所有参与者节省时间。 / TSA想让两千五百万人加入PreCheck。","contextRaw":"","html":"<h2>23题</h2>\n<blockquote>\n<p>The word “expedited” (Para. 5) is closest in meaning to ______.<br />\n第五段中的expedited，意思最接近哪个词？</p>\n</blockquote>\n<p>题干的Para. 5已经指定第五段，被考的词是expedited。先完整读第五段，保留这个词本身，看它修饰什么，以及后一句怎样解释相关安排的效果。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>There is one step the TSA could take that would not require <span class=\"mask\">[xxx]</span> airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.</p>\n<p>开始精读：</p>\n<p>There is one step the TSA could take / that would not require <span class=\"mask\">[xxx]</span> airports or rushing to hire: / Enroll more people in the PreCheck program. / PreCheck is supposed to be a win-win for travelers and the TSA. / Passengers who pass a background check / are eligible to use expedited screening lanes. / This allows the TSA to focus on travelers who are higher risk, / saving time for everyone involved. / The TSA wants to enroll 25 million people in PreCheck.</p>\n<p>顺着英文顺序读：</p>\n<p>有一个步骤TSA可以采取 / 它不要求 <span class=\"mask\">[xxx]</span> 机场或者匆忙招聘： / 让更多人加入PreCheck预检计划。 / PreCheck按设想应该让旅客和TSA双赢。 / 通过背景审查的旅客 / 有资格使用expedited安检通道。 / 这让TSA能够重点关注风险更高的旅客， / 为所有参与者节省时间。 / TSA想让两千五百万人加入PreCheck。</p>\n</blockquote>\n","articleRects":[[168,1087,996,229]],"questionRects":[[188,791,868,35]],"scrollTarget":"auto","meta":{"kind":"question","qid":"23"}},{"section":"23题","raw":"### A. quieter\n\n> 更安静的\n\n把A接回题干，它说的是：第五段的expedited意思最接近“更安静的”。\n\nA的 `quieter` 说声音更小，而第五段的 `saving time` 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\n\n> Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\n\n`quieter` 比较的是声音大小；`saving time` 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\n\n一个安静的通道并不自然导致所有人省时间。即使现实里安静与快速可以同时存在，这道词义题也只能用作者已经给出的解释来判断，不能自行给这个通道添加另一个优点。\n\n**作者用“给所有人省时间”解释通道效果，能不能把expedited理解为声音更安静？**\n\n不能。上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\n\nA没有接上后一句给出的解释方向。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. quieter</h3>\n<blockquote>\n<p>更安静的</p>\n</blockquote>\n<p>把A接回题干，它说的是：第五段的expedited意思最接近“更安静的”。</p>\n<p>A的 <code>quieter</code> 说声音更小，而第五段的 <code>saving time</code> 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。</p>\n<blockquote>\n<p>Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.</p>\n</blockquote>\n<p><code>quieter</code> 比较的是声音大小；<code>saving time</code> 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。</p>\n<p>一个安静的通道并不自然导致所有人省时间。即使现实里安静与快速可以同时存在，这道词义题也只能用作者已经给出的解释来判断，不能自行给这个通道添加另一个优点。</p>\n<p><strong>作者用“给所有人省时间”解释通道效果，能不能把expedited理解为声音更安静？</strong></p>\n<p>不能。上下文的结果落在时间上，而quieter把比较的尺度换成了声音。</p>\n<p>A没有接上后一句给出的解释方向。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,1087,996,229]],"questionRects":[[188,791,868,35],[233,851,126,20]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `quieter` 说声音更小，而第五段的 `saving time` 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"saving time","visibleOptionAnchor":"quieter"}}}},{"section":"23题","raw":"### B. faster\n\n> 更快的\n\n把B接回题干，它说的是：第五段的expedited意思最接近“更快的”。\n\nB的 `faster` 表示速度更快，后文的 `saving time for everyone involved` 表示给所有参与者省时间；两者能形成结果关系，所以回看背景审查、通道使用和时间节省这连续两句。\n\n> Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\n\n原文先按是否通过背景审查分出一部分旅客，让他们有资格使用某类通道，再把检查注意力放在风险更高的人身上。这种安排带来的结果明写为 `saving time for everyone involved`。B的 `faster` 正好解释了通道怎样在时间上产生改善。\n\n这里不是见到time就机械选快，而是先检查它修饰的screening lanes，再看This指回的安排怎样省时。通道、分流、时间结果都接在一起，“更快的安检通道”能够顺着读下去，也没有额外引入价格或通道宽度。\n\n**把expedited换成faster，能不能让通道安排与后面的节省时间顺着接起来？**\n\n能。更快的安检通道与节省时间相对应，也能放回原来的名词短语中。\n\nB既符合被修饰的通道，又符合作者随后解释的效果。\n\n**第一轮判断：B保留。**","contextRaw":"","html":"<h3>B. faster</h3>\n<blockquote>\n<p>更快的</p>\n</blockquote>\n<p>把B接回题干，它说的是：第五段的expedited意思最接近“更快的”。</p>\n<p>B的 <code>faster</code> 表示速度更快，后文的 <code>saving time for everyone involved</code> 表示给所有参与者省时间；两者能形成结果关系，所以回看背景审查、通道使用和时间节省这连续两句。</p>\n<blockquote>\n<p>Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.</p>\n</blockquote>\n<p>原文先按是否通过背景审查分出一部分旅客，让他们有资格使用某类通道，再把检查注意力放在风险更高的人身上。这种安排带来的结果明写为 <code>saving time for everyone involved</code>。B的 <code>faster</code> 正好解释了通道怎样在时间上产生改善。</p>\n<p>这里不是见到time就机械选快，而是先检查它修饰的screening lanes，再看This指回的安排怎样省时。通道、分流、时间结果都接在一起，“更快的安检通道”能够顺着读下去，也没有额外引入价格或通道宽度。</p>\n<p><strong>把expedited换成faster，能不能让通道安排与后面的节省时间顺着接起来？</strong></p>\n<p>能。更快的安检通道与节省时间相对应，也能放回原来的名词短语中。</p>\n<p>B既符合被修饰的通道，又符合作者随后解释的效果。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[168,1087,996,229]],"questionRects":[[188,791,868,35],[233,898,108,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `faster` 表示速度更快，后文的 `saving time for everyone involved` 表示给所有参与者省时间；两者能形成结果关系，所以回看背景审查、通道使用和时间节省这连续两句。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"saving time for everyone involved","visibleOptionAnchor":"faster"}}}},{"section":"23题","raw":"### C. wider\n\n> 更宽的\n\n把C接回题干，它说的是：第五段的expedited意思最接近“更宽的”。\n\nC的 `wider` 说空间宽度；第五段的 `saving time` 说时间结果，因此回到描述通道使用条件的句子，看看通道的区别是空间变化还是检查安排。\n\n> Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\n\n`wider` 需要的是更大的横向空间，而这两句给出的区别是“通过背景审查的人可以使用”。之后的This接着说把注意力放到高风险旅客上，最后落在 `saving time`，没有说通道被拓宽。\n\n第四段确实提过机场只有有限空间，但那是解释为什么普通安检能力受到限制，不能拿来给第五段这个形容词改意思。第五段恰恰提出一个不必匆忙招聘的做法；这里的通行差异来自预先审查和分流，而不是展示新旧两条通道有多宽。\n\n**有资格使用某类通道并让所有人省时，是否已经说明那条通道在空间上更宽？**\n\n不能。准入条件和时间结果都不等于宽度比较，原文也没有进行空间尺寸的对照。\n\nC把前文的空间话题搬来解释这里的通道性质，读错了当前句子的解释关系。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. wider</h3>\n<blockquote>\n<p>更宽的</p>\n</blockquote>\n<p>把C接回题干，它说的是：第五段的expedited意思最接近“更宽的”。</p>\n<p>C的 <code>wider</code> 说空间宽度；第五段的 <code>saving time</code> 说时间结果，因此回到描述通道使用条件的句子，看看通道的区别是空间变化还是检查安排。</p>\n<blockquote>\n<p>Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.</p>\n</blockquote>\n<p><code>wider</code> 需要的是更大的横向空间，而这两句给出的区别是“通过背景审查的人可以使用”。之后的This接着说把注意力放到高风险旅客上，最后落在 <code>saving time</code>，没有说通道被拓宽。</p>\n<p>第四段确实提过机场只有有限空间，但那是解释为什么普通安检能力受到限制，不能拿来给第五段这个形容词改意思。第五段恰恰提出一个不必匆忙招聘的做法；这里的通行差异来自预先审查和分流，而不是展示新旧两条通道有多宽。</p>\n<p><strong>有资格使用某类通道并让所有人省时，是否已经说明那条通道在空间上更宽？</strong></p>\n<p>不能。准入条件和时间结果都不等于宽度比较，原文也没有进行空间尺寸的对照。</p>\n<p>C把前文的空间话题搬来解释这里的通道性质，读错了当前句子的解释关系。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,890,997,190],[168,1087,996,229]],"questionRects":[[188,791,868,35],[233,951,110,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `wider` 说空间宽度；第五段的 `saving time` 说时间结果，因此回到描述通道使用条件的句子，看看通道的区别是空间变化还是检查安排。"],"evidenceParagraphPids":[3,4],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"saving time","visibleOptionAnchor":"wider"}}}},{"section":"23题","raw":"### D. cheaper\n\n> 更便宜的\n\n把D接回题干，它说的是：第五段的expedited意思最接近“更便宜的”。\n\nD的 `cheaper` 说花钱较少，而第五段的 `saving time` 明写节省的对象是时间，所以回看这句结果，不把“省”一概理解成省钱。\n\n> This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\n\n`saving time` 中time是明确的宾语；D的 `cheaper` 却要把它解释成价格降低。原文介绍的是旅客通过背景审查后有资格走某类通道，以及这样怎样改变TSA分配检查注意力的方式，并没有拿两个收费水平来比较。\n\n时间节省当然可能给人带来实际好处，但好处不等于选项中的价钱便宜。这里问一个具体单词在第五段的意思，不能把通道使用的全部可能收益都装进这个形容词，更不能从“为所有人节省”里漏掉time。\n\n**saving后面明写time，能不能据此把expedited解释为价格更便宜？**\n\n不能。原文限定了节省时间，cheaper描述的则是货币成本，比较对象已经不同。\n\nD把省时换成省钱，不能完成这个词在句中的解释。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. cheaper</h3>\n<blockquote>\n<p>更便宜的</p>\n</blockquote>\n<p>把D接回题干，它说的是：第五段的expedited意思最接近“更便宜的”。</p>\n<p>D的 <code>cheaper</code> 说花钱较少，而第五段的 <code>saving time</code> 明写节省的对象是时间，所以回看这句结果，不把“省”一概理解成省钱。</p>\n<blockquote>\n<p>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.</p>\n</blockquote>\n<p><code>saving time</code> 中time是明确的宾语；D的 <code>cheaper</code> 却要把它解释成价格降低。原文介绍的是旅客通过背景审查后有资格走某类通道，以及这样怎样改变TSA分配检查注意力的方式，并没有拿两个收费水平来比较。</p>\n<p>时间节省当然可能给人带来实际好处，但好处不等于选项中的价钱便宜。这里问一个具体单词在第五段的意思，不能把通道使用的全部可能收益都装进这个形容词，更不能从“为所有人节省”里漏掉time。</p>\n<p><strong>saving后面明写time，能不能据此把expedited解释为价格更便宜？</strong></p>\n<p>不能。原文限定了节省时间，cheaper描述的则是货币成本，比较对象已经不同。</p>\n<p>D把省时换成省钱，不能完成这个词在句中的解释。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,1087,996,229]],"questionRects":[[188,791,868,35],[233,1004,136,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `cheaper` 说花钱较少，而第五段的 `saving time` 明写节省的对象是时间，所以回看这句结果，不把“省”一概理解成省钱。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"saving time","visibleOptionAnchor":"cheaper"}}}},{"section":"23题","raw":"### 23题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n> **23题选B。**","contextRaw":"","html":"<h3>23题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>23题选B。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,791,868,35]],"scrollTarget":"auto","meta":{"kind":"result","qid":"23"}},{"section":"24题","raw":"## 24题\n\n> One problem with the PreCheck program is ______.  \n> PreCheck计划存在的一个问题是什么？\n\n题干给出PreCheck这个计划名称。第五段已经完整读过，往下第六段仍然反复出现PreCheck，并接着谈该计划的情况。现在把第六段完整读下来，再判断one problem所问的问题。\n\n> 原文参考：\n>\n> It has not gotten anywhere close to that, and one big reason is **[xxx]** shock: Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level. But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\n>\n> 开始精读：\n>\n> It has not gotten anywhere close to that, / and one big reason is **[xxx]** shock: / Passengers must pay $85 every five years / to process their background checks. / Since the beginning, this price tag has been PreCheck’s fatal flaw. / Upcoming reforms might bring the price to a more reasonable level. / But Congress should look into doing so directly, / by helping to finance PreCheck enrollment / or to cut costs in other ways.\n>\n> 顺着英文顺序读：\n>\n> 它还远没有接近那个数目， / 而一个很大的原因是 **[xxx]** 冲击： / 旅客每五年必须支付85美元 / 来办理他们的背景审查。 / 从一开始，这个标价就是PreCheck的致命缺陷。 / 即将到来的改革可能把价格带到更合理的水平。 / 但是国会应该研究直接这样做， / 通过帮助资助PreCheck报名 / 或者用别的方式削减费用。","contextRaw":"","html":"<h2>24题</h2>\n<blockquote>\n<p>One problem with the PreCheck program is ______.<br />\nPreCheck计划存在的一个问题是什么？</p>\n</blockquote>\n<p>题干给出PreCheck这个计划名称。第五段已经完整读过，往下第六段仍然反复出现PreCheck，并接着谈该计划的情况。现在把第六段完整读下来，再判断one problem所问的问题。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It has not gotten anywhere close to that, and one big reason is <span class=\"mask\">[xxx]</span> shock: Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level. But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.</p>\n<p>开始精读：</p>\n<p>It has not gotten anywhere close to that, / and one big reason is <span class=\"mask\">[xxx]</span> shock: / Passengers must pay $85 every five years / to process their background checks. / Since the beginning, this price tag has been PreCheck’s fatal flaw. / Upcoming reforms might bring the price to a more reasonable level. / But Congress should look into doing so directly, / by helping to finance PreCheck enrollment / or to cut costs in other ways.</p>\n<p>顺着英文顺序读：</p>\n<p>它还远没有接近那个数目， / 而一个很大的原因是 <span class=\"mask\">[xxx]</span> 冲击： / 旅客每五年必须支付85美元 / 来办理他们的背景审查。 / 从一开始，这个标价就是PreCheck的致命缺陷。 / 即将到来的改革可能把价格带到更合理的水平。 / 但是国会应该研究直接这样做， / 通过帮助资助PreCheck报名 / 或者用别的方式削减费用。</p>\n</blockquote>\n","articleRects":[[168,1323,996,223]],"questionRects":[[188,1109,686,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"24"}},{"section":"24题","raw":"### A. a dramatic **[xxx]** of its scale\n\n> 它的规模发生显著的 **[xxx]**\n\n把A接回题干，它说的是：PreCheck计划的一个问题，是其规模出现显著的 **[xxx]**。\n\nA的 `its scale` 指计划规模，第六段的 `not gotten anywhere close to that` 回接第五段的目标人数；两处都涉及参加计划的人数，因此把这句与25 million的目标放在一起看。\n\n> The TSA wants to enroll 25 million people in PreCheck.\n>\n> It has not gotten anywhere close to that, and one big reason is **[xxx]** shock: Passengers must pay $85 every five years to process their background checks.\n\n第五段给的是TSA想达到的人数，第六段用 `not gotten anywhere close to that` 说实际情况还远没接近。A的 `its scale` 因而确实有一个人数层面的联系：报名计划涉及多少人，这在文中不是凭空出现的。\n\n但a dramatic后面是 **[xxx]**，它是说规模发生何种情况的核心。不能把它当成自己熟悉的某个变化词，然后自行加上“以前如何、后来如何”。目前读清的是实际人数与目标有距离，不是A所含那个名词的具体意思。既不能因为scale眼熟就确认，也不能直接把这个未知名词规定成与原文相反。\n\n**知道参加人数远未接近目标，是否已经足够看清A对规模作出的完整判断？**\n\n还不能。scale与人数能接上，但dramatic后面的名词没有读清，无法确定A究竟怎样描述这一规模。\n\nA先留下，人数与目标之间的距离已经读清，但规模描述的核心名词还没有读清。\n\n**第一轮判断：A保留。**","contextRaw":"","html":"<h3>A. a dramatic <span class=\"mask\">[xxx]</span> of its scale</h3>\n<blockquote>\n<p>它的规模发生显著的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把A接回题干，它说的是：PreCheck计划的一个问题，是其规模出现显著的 <span class=\"mask\">[xxx]</span>。</p>\n<p>A的 <code>its scale</code> 指计划规模，第六段的 <code>not gotten anywhere close to that</code> 回接第五段的目标人数；两处都涉及参加计划的人数，因此把这句与25 million的目标放在一起看。</p>\n<blockquote>\n<p>The TSA wants to enroll 25 million people in PreCheck.</p>\n<p>It has not gotten anywhere close to that, and one big reason is <span class=\"mask\">[xxx]</span> shock: Passengers must pay $85 every five years to process their background checks.</p>\n</blockquote>\n<p>第五段给的是TSA想达到的人数，第六段用 <code>not gotten anywhere close to that</code> 说实际情况还远没接近。A的 <code>its scale</code> 因而确实有一个人数层面的联系：报名计划涉及多少人，这在文中不是凭空出现的。</p>\n<p>但a dramatic后面是 <span class=\"mask\">[xxx]</span>，它是说规模发生何种情况的核心。不能把它当成自己熟悉的某个变化词，然后自行加上“以前如何、后来如何”。目前读清的是实际人数与目标有距离，不是A所含那个名词的具体意思。既不能因为scale眼熟就确认，也不能直接把这个未知名词规定成与原文相反。</p>\n<p><strong>知道参加人数远未接近目标，是否已经足够看清A对规模作出的完整判断？</strong></p>\n<p>还不能。scale与人数能接上，但dramatic后面的名词没有读清，无法确定A究竟怎样描述这一规模。</p>\n<p>A先留下，人数与目标之间的距离已经读清，但规模描述的核心名词还没有读清。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[168,1087,996,229],[168,1323,996,223]],"questionRects":[[188,1109,686,34],[233,1162,434,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `its scale` 指计划规模，第六段的 `not gotten anywhere close to that` 回接第五段的目标人数；两处都涉及参加计划的人数，因此把这句与25 million的目标放在一起看。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"not gotten anywhere close to that","visibleOptionAnchor":"its scale"}}}},{"section":"24题","raw":"### B. its wrongly-directed implementation\n\n> 它方向错误的实施\n\n把B接回题干，它说的是：PreCheck计划的一个问题，是实施方向错误。\n\nB的 `wrongly-directed implementation` 批评实施方向，第五段的 `a win-win for travelers and the TSA` 评价计划安排的用途；因此先回看这个评价，再接第六段指出的具体障碍，比较到底错在方向还是卡在推行条件。\n\n> PreCheck is supposed to be a win-win for travelers and the TSA.\n>\n> Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level.\n\n第五段说 `a win-win for travelers and the TSA`，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。这一安排的目标和基本方向得到了正面说明。B的 `wrongly-directed implementation` 则把问题说成实施朝错方向走。\n\n第六段并没有要求把目标或分流方向改掉，而是连续指向this price tag和更合理的价格。计划还没有达到目标人数，说明实施有障碍，不等于实施方向错误；同一计划可以方向可取，却因收费条件而推不动。B把“未充分实现”与“方向选错”混成了一个判断。\n\n**作者称计划按设想能双赢，却指出收费是缺陷，这是否等于否定其实施方向？**\n\n不等于。被要求调整的是报名费用，作者并未否定预检分流本身的作用。\n\nB把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. its wrongly-directed implementation</h3>\n<blockquote>\n<p>它方向错误的实施</p>\n</blockquote>\n<p>把B接回题干，它说的是：PreCheck计划的一个问题，是实施方向错误。</p>\n<p>B的 <code>wrongly-directed implementation</code> 批评实施方向，第五段的 <code>a win-win for travelers and the TSA</code> 评价计划安排的用途；因此先回看这个评价，再接第六段指出的具体障碍，比较到底错在方向还是卡在推行条件。</p>\n<blockquote>\n<p>PreCheck is supposed to be a win-win for travelers and the TSA.</p>\n<p>Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level.</p>\n</blockquote>\n<p>第五段说 <code>a win-win for travelers and the TSA</code>，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。这一安排的目标和基本方向得到了正面说明。B的 <code>wrongly-directed implementation</code> 则把问题说成实施朝错方向走。</p>\n<p>第六段并没有要求把目标或分流方向改掉，而是连续指向this price tag和更合理的价格。计划还没有达到目标人数，说明实施有障碍，不等于实施方向错误；同一计划可以方向可取，却因收费条件而推不动。B把“未充分实现”与“方向选错”混成了一个判断。</p>\n<p><strong>作者称计划按设想能双赢，却指出收费是缺陷，这是否等于否定其实施方向？</strong></p>\n<p>不等于。被要求调整的是报名费用，作者并未否定预检分流本身的作用。</p>\n<p>B把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,1087,996,229],[168,1323,996,223]],"questionRects":[[188,1109,686,34],[233,1215,478,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `wrongly-directed implementation` 批评实施方向，第五段的 `a win-win for travelers and the TSA` 评价计划安排的用途；因此先回看这个评价，再接第六段指出的具体障碍，比较到底错在方向还是卡在推行条件。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","scope","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"a win-win for travelers and the TSA","visibleOptionAnchor":"wrongly-directed implementation"}}}},{"section":"24题","raw":"### C. the government’s reluctance to back it\n\n> 政府不愿支持它\n\n把C接回题干，它说的是：PreCheck计划的一个问题，是政府不愿意支持这个计划。\n\nC的 `government’s reluctance` 是政府的不愿意；第五段的 `The TSA wants to enroll` 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。\n\n> The TSA wants to enroll 25 million people in PreCheck.\n>\n> But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\n\n`The TSA wants to enroll` 明说TSA想扩大报名人数。C却用 `government’s reluctance` 把政府态度在整体范围上概括成不愿支持，至少不能把这一机构主动扩大计划的意愿也算作不愿意。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。\n\n应当做某事与不愿做某事之间不能直接画等号。前者可能是在建议提高力度、改变方式或加快行动；只有原文出现明确拒绝或消极意愿，才有理由写reluctance。这里实际写了TSA的目标以及国会可采取的具体方式，不能把未做到位一律转译成主观上不愿支持。\n\n**“国会应该直接帮助”能不能反推出“政府不愿支持”，并覆盖TSA已经表明的扩大意愿？**\n\n不能。should是建议，wants是已有意愿，两者都没有给出政府不愿支持这一事实。\n\nC把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. the government’s reluctance to back it</h3>\n<blockquote>\n<p>政府不愿支持它</p>\n</blockquote>\n<p>把C接回题干，它说的是：PreCheck计划的一个问题，是政府不愿意支持这个计划。</p>\n<p>C的 <code>government’s reluctance</code> 是政府的不愿意；第五段的 <code>The TSA wants to enroll</code> 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。</p>\n<blockquote>\n<p>The TSA wants to enroll 25 million people in PreCheck.</p>\n<p>But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.</p>\n</blockquote>\n<p><code>The TSA wants to enroll</code> 明说TSA想扩大报名人数。C却用 <code>government’s reluctance</code> 把政府态度在整体范围上概括成不愿支持，至少不能把这一机构主动扩大计划的意愿也算作不愿意。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。</p>\n<p>应当做某事与不愿做某事之间不能直接画等号。前者可能是在建议提高力度、改变方式或加快行动；只有原文出现明确拒绝或消极意愿，才有理由写reluctance。这里实际写了TSA的目标以及国会可采取的具体方式，不能把未做到位一律转译成主观上不愿支持。</p>\n<p><strong>“国会应该直接帮助”能不能反推出“政府不愿支持”，并覆盖TSA已经表明的扩大意愿？</strong></p>\n<p>不能。should是建议，wants是已有意愿，两者都没有给出政府不愿支持这一事实。</p>\n<p>C把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,1087,996,229],[168,1323,996,223]],"questionRects":[[188,1109,686,34],[233,1268,508,31]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `government’s reluctance` 是政府的不愿意；第五段的 `The TSA wants to enroll` 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","scope","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"The TSA wants to enroll","visibleOptionAnchor":"government’s reluctance"}}}},{"section":"24题","raw":"### D. an **[xxx]** price for enrollment\n\n> 一个 **[xxx]** 的报名价格\n\n把D接回题干，它说的是：PreCheck计划的一个问题，是报名价格 **[xxx]**。\n\nD的 `price for enrollment` 与第六段的 `this price tag` 都说参加预检的价格，所以回到每五年支付85美元这句，再看this price tag后面的评价和改价建议。\n\n> Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level.\n\n`price for enrollment` 的对象能和 `this price tag` 接上。先有具体金额85美元，再由this指回这个金额，接着写它是fatal flaw，下一句又提出more reasonable level。这不是路过提了一笔钱，而是把费用放在计划缺陷和改革的连续说明中。\n\n不过D的形容词仍是 **[xxx]**。本段已经能够确认作者认为收费需要改进，但不能把D那个未读清的词直接译成自己希望的意思。D有很强的价格联系；A也保留了人数规模方面的联系。先把两项各自说清的部分留住，尚未读清的判断不往里面填。\n\n**原文连续谈金额、价格缺陷和改价建议，能否让D进入候选，而不先补出其形容词？**\n\n能。报名价格正是本段明说的障碍所在，但D的具体评价词仍需结合后续整篇理解来判断。\n\n因此D保留，与A形成这一题暂时没有完全拉开的两项。\n\n**第一轮判断：D保留。**","contextRaw":"","html":"<h3>D. an <span class=\"mask\">[xxx]</span> price for enrollment</h3>\n<blockquote>\n<p>一个 <span class=\"mask\">[xxx]</span> 的报名价格</p>\n</blockquote>\n<p>把D接回题干，它说的是：PreCheck计划的一个问题，是报名价格 <span class=\"mask\">[xxx]</span>。</p>\n<p>D的 <code>price for enrollment</code> 与第六段的 <code>this price tag</code> 都说参加预检的价格，所以回到每五年支付85美元这句，再看this price tag后面的评价和改价建议。</p>\n<blockquote>\n<p>Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level.</p>\n</blockquote>\n<p><code>price for enrollment</code> 的对象能和 <code>this price tag</code> 接上。先有具体金额85美元，再由this指回这个金额，接着写它是fatal flaw，下一句又提出more reasonable level。这不是路过提了一笔钱，而是把费用放在计划缺陷和改革的连续说明中。</p>\n<p>不过D的形容词仍是 <span class=\"mask\">[xxx]</span>。本段已经能够确认作者认为收费需要改进，但不能把D那个未读清的词直接译成自己希望的意思。D有很强的价格联系；A也保留了人数规模方面的联系。先把两项各自说清的部分留住，尚未读清的判断不往里面填。</p>\n<p><strong>原文连续谈金额、价格缺陷和改价建议，能否让D进入候选，而不先补出其形容词？</strong></p>\n<p>能。报名价格正是本段明说的障碍所在，但D的具体评价词仍需结合后续整篇理解来判断。</p>\n<p>因此D保留，与A形成这一题暂时没有完全拉开的两项。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[168,1323,996,223]],"questionRects":[[188,1109,686,34],[233,1321,489,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `price for enrollment` 与第六段的 `this price tag` 都说参加预检的价格，所以回到每五年支付85美元这句，再看this price tag后面的评价和改价建议。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"this price tag","visibleOptionAnchor":"price for enrollment"}}}},{"section":"24题","raw":"### 24题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D保留。\n\n这一轮留下A和D，先继续做后面的题。","contextRaw":"","html":"<h3>24题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下A和D，先继续做后面的题。</p>\n","articleRects":[],"questionRects":[[188,1109,686,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"24"}},{"section":"25题","raw":"## 25题\n\n**Which of the following would be the best title for the text?**\n\n下列哪一项最适合作为本文的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Getting Stuck in Security Lines**\n\n困在安检长队中\n\nB. **PreCheck—a Belated Solution**\n\nPreCheck——一个迟来的解决办法\n\nC. **Less Screening for More Safety**\n\n更少的安检换来更高的安全\n\nD. **Underused PreCheck Lanes**\n\n使用不足的PreCheck通道","contextRaw":"","html":"<h2>25题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下列哪一项最适合作为本文的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Getting Stuck in Security Lines</strong></p>\n<p>困在安检长队中</p>\n<p>B. <strong>PreCheck—a Belated Solution</strong></p>\n<p>PreCheck——一个迟来的解决办法</p>\n<p>C. <strong>Less Screening for More Safety</strong></p>\n<p>更少的安检换来更高的安全</p>\n<p>D. <strong>Underused PreCheck Lanes</strong></p>\n<p>使用不足的PreCheck通道</p>\n","articleRects":[],"questionRects":[[188,1426,776,27]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"25"}},{"section":"25题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 从提前两小时变成三小时写起，展示一些美国主要机场的安检队伍和旅客耗时。 | 先摆出眼前的问题 |\n| 2 | 先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。 | 再说为什么不能只看一头 |\n| 3 | 把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。 | 接着交代事情怎么变成这样 |\n| 4 | 分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。 | 然后把几个原因分开说 |\n| 5 | 提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。 | 接着提出一个可行的办法 |\n| 6 | 说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。 | 再说这个办法卡在哪里 |\n| 7 | 把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。 | 最后说该让办法真正起作用了 |","contextRaw":"","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>从提前两小时变成三小时写起，展示一些美国主要机场的安检队伍和旅客耗时。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[168,260,997,111],[168,378,997,229],[168,614,996,263],[168,890,997,190],[168,1087,996,229],[168,1323,996,223],[168,1559,996,111]],"questionRects":[[188,1426,776,27]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"25","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"25题","raw":"### A. Getting Stuck in Security Lines\n\n> 困在安检长队中\n\n如果A是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先让读者看到旅客被安检长队耽误，必须更早到机场。 | 先摆出眼前的问题 |\n| 2 | 再说明安全固然重要，但不能无视排队给旅客带来的代价。 | 再说为什么不能只看一头 |\n| 3 | 接着解释长队怎样在安保安排和出行增加中形成。 | 接着交代事情怎么变成这样 |\n| 4 | 然后拆开造成排队的几项现实原因。 | 然后把几个原因分开说 |\n| 5 | 接着提出能够分流旅客、节省等待时间的预检办法。 | 接着提出一个可行的办法 |\n| 6 | 再解释为什么这个缓解长队的办法还没有充分起作用。 | 再说这个办法卡在哪里 |\n| 7 | 最后要求改善资源使用，让多数旅客不再继续承受不必要的等待。 | 最后说该让办法真正起作用了 |\n\nA的Getting Stuck先对应开头旅客需要提前两三小时，再对应后文long waits和结尾unnecessary lines。它并不是只概括“排队”一个名词：第二段讨论为什么不能让旅客承担无限时间代价，第三、四段说明长队成因，第五、六段找办法并解释办法受阻，都是在处理同一个等待问题。\n\n后半篇的PreCheck不必被标题逐字点名，因为它是作者为长队问题提出的解决工具。把A代入七行，前面的现象、原因和后面的方案、障碍、催促能够按顺序相接，没有哪一大块需要另找文章中心。\n\n**标题说“困在长队中”，能否同时容纳作者后来寻找减少等待的办法？**\n\n能。解决办法始终在回应这个被困的问题，而不是另换成一个与长队无关的新话题。A保留。","contextRaw":"","html":"<h3>A. Getting Stuck in Security Lines</h3>\n<blockquote>\n<p>困在安检长队中</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先让读者看到旅客被安检长队耽误，必须更早到机场。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明安全固然重要，但不能无视排队给旅客带来的代价。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着解释长队怎样在安保安排和出行增加中形成。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后拆开造成排队的几项现实原因。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>接着提出能够分流旅客、节省等待时间的预检办法。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>再解释为什么这个缓解长队的办法还没有充分起作用。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求改善资源使用，让多数旅客不再继续承受不必要的等待。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<p>A的Getting Stuck先对应开头旅客需要提前两三小时，再对应后文long waits和结尾unnecessary lines。它并不是只概括“排队”一个名词：第二段讨论为什么不能让旅客承担无限时间代价，第三、四段说明长队成因，第五、六段找办法并解释办法受阻，都是在处理同一个等待问题。</p>\n<p>后半篇的PreCheck不必被标题逐字点名，因为它是作者为长队问题提出的解决工具。把A代入七行，前面的现象、原因和后面的方案、障碍、催促能够按顺序相接，没有哪一大块需要另找文章中心。</p>\n<p><strong>标题说“困在长队中”，能否同时容纳作者后来寻找减少等待的办法？</strong></p>\n<p>能。解决办法始终在回应这个被困的问题，而不是另换成一个与长队无关的新话题。A保留。</p>\n","articleRects":[[168,260,997,111],[168,378,997,229],[168,614,996,263],[168,890,997,190],[168,1087,996,229],[168,1323,996,223],[168,1559,996,111]],"questionRects":[[188,1426,776,27],[233,1479,426,32]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"A"}},{"section":"25题","raw":"### B. PreCheck—a Belated Solution\n\n> PreCheck——一个迟来的解决办法\n\n如果B是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先以排队为背景，引出一个本来早该出现却迟迟没有出现的解决办法。 | 先摆出眼前的问题 |\n| 2 | 再说明旅客为什么迫切需要这个办法，突出迟到所带来的代价。 | 再说为什么不能只看一头 |\n| 3 | 接着交代为什么发现安保问题后仍没有及时拿出预检方案。 | 接着交代事情怎么变成这样 |\n| 4 | 然后分析提出预检方案被拖延的几个原因。 | 然后把几个原因分开说 |\n| 5 | 接着宣布PreCheck终于作为新方案出现。 | 接着提出一个可行的办法 |\n| 6 | 再说明这个刚出现的方案还需要完善哪些配套条件。 | 再说这个办法卡在哪里 |\n| 7 | 最后肯定迟来的办法，并要求把它推行起来。 | 最后说该让办法真正起作用了 |\n\nB最吸引人的地方是PreCheck确实占了后三段。但a Belated Solution不仅点名方案，还把“迟来”作为对方案的关键判断。若按B写，第三、四段理应解释为什么这个办法迟迟未出现，第五段理应突出它终于被提出；实际第三、四段主要解释机场长队，第五段介绍的是一个已经有名称、通道和报名目标的现成计划。\n\n第六段说没接近报名目标，并批评费用，不等于说方案本身刚刚出现。结尾long past time催促它真正发挥作用，也不能自动倒回成“提出方案太迟”。方案出现得迟，与已有方案迟迟没有做好，是不同时间关系。\n\n**已有计划应当早日运转好，是否等于作者在介绍一个刚刚迟到的方案？**\n\n不等于。B把改善迫切性改成方案出现的时间判断，并缩掉前半篇大量独立的长队分析，排除。","contextRaw":"","html":"<h3>B. PreCheck—a Belated Solution</h3>\n<blockquote>\n<p>PreCheck——一个迟来的解决办法</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先以排队为背景，引出一个本来早该出现却迟迟没有出现的解决办法。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明旅客为什么迫切需要这个办法，突出迟到所带来的代价。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着交代为什么发现安保问题后仍没有及时拿出预检方案。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后分析提出预检方案被拖延的几个原因。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>接着宣布PreCheck终于作为新方案出现。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>再说明这个刚出现的方案还需要完善哪些配套条件。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后肯定迟来的办法，并要求把它推行起来。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<p>B最吸引人的地方是PreCheck确实占了后三段。但a Belated Solution不仅点名方案，还把“迟来”作为对方案的关键判断。若按B写，第三、四段理应解释为什么这个办法迟迟未出现，第五段理应突出它终于被提出；实际第三、四段主要解释机场长队，第五段介绍的是一个已经有名称、通道和报名目标的现成计划。</p>\n<p>第六段说没接近报名目标，并批评费用，不等于说方案本身刚刚出现。结尾long past time催促它真正发挥作用，也不能自动倒回成“提出方案太迟”。方案出现得迟，与已有方案迟迟没有做好，是不同时间关系。</p>\n<p><strong>已有计划应当早日运转好，是否等于作者在介绍一个刚刚迟到的方案？</strong></p>\n<p>不等于。B把改善迫切性改成方案出现的时间判断，并缩掉前半篇大量独立的长队分析，排除。</p>\n","articleRects":[[168,260,997,111],[168,378,997,229],[168,614,996,263],[168,890,997,190],[168,1087,996,229],[168,1323,996,223],[168,1559,996,111]],"questionRects":[[188,1426,776,27],[233,1532,410,26]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"B"}},{"section":"25题","raw":"### C. Less Screening for More Safety\n\n> 更少的安检换来更高的安全\n\n如果C是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先展示检查过多怎样导致问题，为减少安检作铺垫。 | 先摆出眼前的问题 |\n| 2 | 再比较检查数量与安全，说明检查并非越多越安全。 | 再说为什么不能只看一头 |\n| 3 | 接着给出减少检查反而提高安全的事实对照。 | 接着交代事情怎么变成这样 |\n| 4 | 然后解释为什么更少检查会带来更安全的结果。 | 然后把几个原因分开说 |\n| 5 | 接着提出减少检查次数或项目的具体办法。 | 接着提出一个可行的办法 |\n| 6 | 再指出落实少检查方案遇到的障碍。 | 再说这个办法卡在哪里 |\n| 7 | 最后明确倡议通过减少安检来提高安全。 | 最后说该让办法真正起作用了 |\n\nC同时出现Screening与Safety，看上去贴近第二段的安全交换，也容易让人联想到第五段的分流。然而Less Screening for More Safety要求全文建立一个很具体的方向：检查更少，所以安全更高。实际第五段明写的是让TSA关注风险更高的人、给所有人省时间，没有比较减少检查前后安全提高多少。\n\n第三段还特意说安保变得怎样的效果尚不清楚，眼前能看到的是队伍。若选择C，就要把未确定的安全结果改成标题里的肯定收益。七行对照下来，成因、收费、报名规模的说明也并不是围绕“减少检查次数”安排的。\n\n**更有针对性地分配检查注意力，能否直接概括为少做安检便得到更多安全？**\n\n不能。C增加了原文没有建立的检查数量与安全提升关系，排除。","contextRaw":"","html":"<h3>C. Less Screening for More Safety</h3>\n<blockquote>\n<p>更少的安检换来更高的安全</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先展示检查过多怎样导致问题，为减少安检作铺垫。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再比较检查数量与安全，说明检查并非越多越安全。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着给出减少检查反而提高安全的事实对照。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后解释为什么更少检查会带来更安全的结果。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>接着提出减少检查次数或项目的具体办法。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>再指出落实少检查方案遇到的障碍。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后明确倡议通过减少安检来提高安全。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<p>C同时出现Screening与Safety，看上去贴近第二段的安全交换，也容易让人联想到第五段的分流。然而Less Screening for More Safety要求全文建立一个很具体的方向：检查更少，所以安全更高。实际第五段明写的是让TSA关注风险更高的人、给所有人省时间，没有比较减少检查前后安全提高多少。</p>\n<p>第三段还特意说安保变得怎样的效果尚不清楚，眼前能看到的是队伍。若选择C，就要把未确定的安全结果改成标题里的肯定收益。七行对照下来，成因、收费、报名规模的说明也并不是围绕“减少检查次数”安排的。</p>\n<p><strong>更有针对性地分配检查注意力，能否直接概括为少做安检便得到更多安全？</strong></p>\n<p>不能。C增加了原文没有建立的检查数量与安全提升关系，排除。</p>\n","articleRects":[[168,260,997,111],[168,378,997,229],[168,614,996,263],[168,890,997,190],[168,1087,996,229],[168,1323,996,223],[168,1559,996,111]],"questionRects":[[188,1426,776,27],[233,1585,427,31]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"C"}},{"section":"25题","raw":"### D. Underused PreCheck Lanes\n\n> 使用不足的PreCheck通道\n\n如果D是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先直接展示PreCheck通道空闲或利用不足这一现象。 | 先摆出眼前的问题 |\n| 2 | 再说明这些通道利用不足对安全与旅客的影响。 | 再说为什么不能只看一头 |\n| 3 | 接着交代预检通道为何逐渐变得利用不足。 | 接着交代事情怎么变成这样 |\n| 4 | 然后列出影响这些通道利用率的几项原因。 | 然后把几个原因分开说 |\n| 5 | 接着提出增加预检通道利用率的办法。 | 接着提出一个可行的办法 |\n| 6 | 再解释参与费用如何限制利用率。 | 再说这个办法卡在哪里 |\n| 7 | 最后要求把这些具体通道充分用起来。 | 最后说该让办法真正起作用了 |\n\nD在结尾能找到接近的画面：预检通道与大多数旅客排队形成对照，第六段也说报名人数不足。但把D代入全文，第一至四段就都应当围绕预检通道利用率展开；实际这些段先讨论美国机场普遍的安检队伍、旅客时间代价和多种原因，PreCheck到第五段才作为办法进入。\n\n这并不是“标题出现得晚就一定错”。真正的问题是D把解决办法中一个局部的使用状态，抬成覆盖全部段落的中心。前面的空间限制、航空出行增加和安检代价，不能都改写成预检通道利用不足的成因，否则就改变了作者本来的展开对象。\n\n**后三段涉及的预检利用问题，能否替代前四段已经建立的整个安检长队问题？**\n\n不能。D覆盖一个具体障碍，却装不下全文为何讨论它，排除。","contextRaw":"","html":"<h3>D. Underused PreCheck Lanes</h3>\n<blockquote>\n<p>使用不足的PreCheck通道</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先直接展示PreCheck通道空闲或利用不足这一现象。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明这些通道利用不足对安全与旅客的影响。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着交代预检通道为何逐渐变得利用不足。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后列出影响这些通道利用率的几项原因。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>接着提出增加预检通道利用率的办法。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>再解释参与费用如何限制利用率。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求把这些具体通道充分用起来。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<p>D在结尾能找到接近的画面：预检通道与大多数旅客排队形成对照，第六段也说报名人数不足。但把D代入全文，第一至四段就都应当围绕预检通道利用率展开；实际这些段先讨论美国机场普遍的安检队伍、旅客时间代价和多种原因，PreCheck到第五段才作为办法进入。</p>\n<p>这并不是“标题出现得晚就一定错”。真正的问题是D把解决办法中一个局部的使用状态，抬成覆盖全部段落的中心。前面的空间限制、航空出行增加和安检代价，不能都改写成预检通道利用不足的成因，否则就改变了作者本来的展开对象。</p>\n<p><strong>后三段涉及的预检利用问题，能否替代前四段已经建立的整个安检长队问题？</strong></p>\n<p>不能。D覆盖一个具体障碍，却装不下全文为何讨论它，排除。</p>\n","articleRects":[[168,260,997,111],[168,378,997,229],[168,614,996,263],[168,890,997,190],[168,1087,996,229],[168,1323,996,223],[168,1559,996,111]],"questionRects":[[188,1426,776,27],[233,1638,375,26]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"D"}},{"section":"25题","raw":"### 25题主旨结果\n\n四项与全文的展开逐段比较后，A能够保留文章最后落实的判断。\n\n> **25题选A。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Getting Stuck in Security Lines / 困在安检长队中**","contextRaw":"","html":"<h3>25题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，A能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>25题选A。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Getting Stuck in Security Lines / 困在安检长队中</strong></p>\n","articleRects":[],"questionRects":[[188,1426,776,27],[233,1479,426,32]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"25"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","contextRaw":"","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查24题：A还是D？\n\n第一遍留下：\n\n- A. a dramatic **[xxx]** of its scale\n- D. an **[xxx]** price for enrollment\n\n主旨底牌是：\n\n> **Getting Stuck in Security Lines / 困在安检长队中**\n\n也就是：文章始终在追问多数旅客为什么还困在安检长队中，后面的PreCheck是为了让这些等待得到缓解。\n\n第一遍读第六段时，A的scale可以联系到实际人数远未接近两千五百万的目标；D的price for enrollment可以联系到每五年85美元的费用。A对规模究竟说了什么，D对价格用了什么评价，都有一处没有读清，所以两项都留下来。\n\n我们先把题干和两个选项接起来。\n\nA说PreCheck的问题是规模发生显著的 **[xxx]**；D说问题是报名价格 **[xxx]**。两项不能擅自补译。现在能够比较的是：A把判断落在人数规模，D把判断落在报名条件。\n\n现在拿主旨来检查。\n\n先看A。为了缓解长队，第五段提出让更多人加入PreCheck；第六段说没接近目标，是先摆出办法尚未达到的结果。只停在“参加的人不够多”，还没有回答这个办法为何没有发挥应有作用。A可以贴住这个结果，但其未知名词不能凭空变成一条说明规模如何变化的事实。\n\n再看D。文章在人数不足之后立刻用one big reason接85美元费用，又把this price tag称为fatal flaw，并要求更合理的价格及cut costs。收费这件事不仅在本段被连续展开，也能接回全文的问题：原本用于省时的预检计划需要更多人参加，而报名条件正是作者要求着手处理的地方。D抓住的是这项办法推不动时被明确解释、被要求修改的环节。\n\n因此，与A停在规模状态相比，D在“长队—提出分流办法—报名条件需要改进”这个推进里获得了更充分的支持。主旨帮助确定作者此处着力说明的层次，并没有替我们揭开两个 **[xxx]**。这一轮按原文对价格的集中评价与改进要求选择D。\n\n>
