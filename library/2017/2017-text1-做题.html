<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","contextRaw":"","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","contextRaw":"","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"### 21. The crash of EgyptAir Flight 804 is mentioned to ______.\n\n提到埃及航空804航班坠毁，是为了说明什么？\n\n这一题问：例子作用题。","contextRaw":"","html":"<h3>21. The crash of EgyptAir Flight 804 is mentioned to ______.</h3>\n<p>提到埃及航空804航班坠毁，是为了说明什么？</p>\n<p>这一题问：例子作用题。</p>\n","articleRects":[],"questionRects":[[188,158,760,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"21"}},{"section":"先读题干","raw":"### 22. Which of the following contributes to long waits at major airports?\n\n以下哪一项会造成主要机场的长时间等待？\n\n这一题问：细节题。","contextRaw":"","html":"<h3>22. Which of the following contributes to long waits at major airports?</h3>\n<p>以下哪一项会造成主要机场的长时间等待？</p>\n<p>这一题问：细节题。</p>\n","articleRects":[],"questionRects":[[188,475,868,32]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"22"}},{"section":"先读题干","raw":"### 23. The word “expedited” (Para. 5) is closest in meaning to ______.\n\n第五段中的expedited，意思最接近哪个词？\n\n这一题问：词义题。","contextRaw":"","html":"<h3>23. The word “expedited” (Para. 5) is closest in meaning to ______.</h3>\n<p>第五段中的expedited，意思最接近哪个词？</p>\n<p>这一题问：词义题。</p>\n","articleRects":[],"questionRects":[[188,791,868,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"23"}},{"section":"先读题干","raw":"### 24. One problem with the PreCheck program is ______.\n\nPreCheck计划存在的一个问题是什么？\n\n这一题问：细节题。","contextRaw":"","html":"<h3>24. One problem with the PreCheck program is ______.</h3>\n<p>PreCheck计划存在的一个问题是什么？</p>\n<p>这一题问：细节题。</p>\n","articleRects":[],"questionRects":[[188,1109,686,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"24"}},{"section":"先读题干","raw":"### 25. Which of the following would be the best title for the text?\n\n下列哪一项最适合作为本文的标题？\n\n这一题问：全文作者观点 / 全文主旨题。","contextRaw":"","html":"<h3>25. Which of the following would be the best title for the text?</h3>\n<p>下列哪一项最适合作为本文的标题？</p>\n<p>这一题问：全文作者观点 / 全文主旨题。</p>\n","articleRects":[],"questionRects":[[188,1426,776,27]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"25"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, since then, combined with, while |\n| 态度词 / 评价词 | 先抓个大概好坏 | willing, tragic, fatal flaw, reasonable |\n| 动作词 | 先看谁做了什么 | tolerate, enroll, pay, cut |\n| 结果词 | 看最后出了什么事 | long waits, saving time, not gotten anywhere close |\n| 重复主题词 | 大概知道老在说什么 | security, travelers, TSA, PreCheck |","contextRaw":"","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>But, since then, combined with, while</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>willing, tragic, fatal flaw, reasonable</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>tolerate, enroll, pay, cut</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>long waits, saving time, not gotten anywhere close</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>security, travelers, TSA, PreCheck</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"k 廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。","contextRaw":"","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，等题目问到某个对象时能较快回到它所在的位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现提前两小时、现在三小时、美国主要机场、安检队伍；中间有安检程序、更高安全、航空出行增长、长时间等待、背景审查；后面又出现旅客必须支付、致命缺陷、国会、让计划运转。</p>\n<p>到这里还不能自然地说清楚：坠机为什么被提起、航空出行与排队怎样相接、预检安排如何省时、报名费用为什么被反复写到。这些碎片暂时只帮助认出谈到了哪些事情；它们之间的关系，等题目问到时再回去读。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","contextRaw":"","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"21题","raw":"## 21题\n\n> The crash of EgyptAir Flight 804 is mentioned to ______.  \n> 提到埃及航空804航班坠毁，是为了说明什么？\n\n题干直接给出EgyptAir Flight 804这一事件，第二段出现同一个航班名称。问的是提到这件事的作用，不只是事故发生了什么，因此先把第二段完整读下来，看例子前后各接着什么。\n\n> 原文参考：\n>\n> Americans are willing to tolerate **[xxx]** security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have **[xxx]** over the Mediterranean Sea, provides another tragic reminder of why. But demanding too much of air travelers or providing too little security in return **[xxx]** public support for the process. And it should: Wasted time is a drag on Americans’ economic and private lives, not to mention **[xxx]**.\n>\n> 开始精读：\n>\n> Americans are willing to tolerate **[xxx]** security procedures / in return for increased safety. / The crash of EgyptAir Flight 804, / which terrorists may have **[xxx]** over the Mediterranean Sea, / provides another tragic reminder of why. / But demanding too much of air travelers / or providing too little security in return / **[xxx]** public support for the process. / And it should: / Wasted time is a drag on Americans’ economic and private lives, / not to mention **[xxx]**.\n>\n> 顺着英文顺序读：\n>\n> 美国人愿意忍受 **[xxx]** 安检程序 / 来换取更高的安全。 / 埃及航空804航班的坠毁， / 恐怖分子可能在地中海上空对它做了 **[xxx]**， / 又提供了一次悲剧性的提醒，提醒这是为什么。 / 但是，向航空旅客要求太多 / 或者作为回报提供太少的安全 / 会 **[xxx]** 公众对这套程序的支持。 / 而且它就应该如此： / 被浪费的时间是美国人经济生活和私人生活的拖累， / 更不用说 **[xxx]** 了。","contextRaw":"","html":"<h2>21题</h2>\n<blockquote>\n<p>The crash of EgyptAir Flight 804 is mentioned to ______.<br />\n提到埃及航空804航班坠毁，是为了说明什么？</p>\n</blockquote>\n<p>题干直接给出EgyptAir Flight 804这一事件，第二段出现同一个航班名称。问的是提到这件事的作用，不只是事故发生了什么，因此先把第二段完整读下来，看例子前后各接着什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why. But demanding too much of air travelers or providing too little security in return <span class=\"mask\">[xxx]</span> public support for the process. And it should: Wasted time is a drag on Americans’ economic and private lives, not to mention <span class=\"mask\">[xxx]</span>.</p>\n<p>开始精读：</p>\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures / in return for increased safety. / The crash of EgyptAir Flight 804, / which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, / provides another tragic reminder of why. / But demanding too much of air travelers / or providing too little security in return / <span class=\"mask\">[xxx]</span> public support for the process. / And it should: / Wasted time is a drag on Americans’ economic and private lives, / not to mention <span class=\"mask\">[xxx]</span>.</p>\n<p>顺着英文顺序读：</p>\n<p>美国人愿意忍受 <span class=\"mask\">[xxx]</span> 安检程序 / 来换取更高的安全。 / 埃及航空804航班的坠毁， / 恐怖分子可能在地中海上空对它做了 <span class=\"mask\">[xxx]</span>， / 又提供了一次悲剧性的提醒，提醒这是为什么。 / 但是，向航空旅客要求太多 / 或者作为回报提供太少的安全 / 会 <span class=\"mask\">[xxx]</span> 公众对这套程序的支持。 / 而且它就应该如此： / 被浪费的时间是美国人经济生活和私人生活的拖累， / 更不用说 <span class=\"mask\">[xxx]</span> 了。</p>\n</blockquote>\n","articleRects":[[168,378,997,229]],"questionRects":[[188,158,760,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"21"}},{"section":"21题","raw":"### A. stress the **[xxx]** to strengthen security worldwide\n\n> 强调在全球加强安保的 **[xxx]**\n\n把A接回题干，它说的是：提到埃及航空804航班坠毁，是为了强调在全球加强安保的 **[xxx]**。\n\nA的 `strengthen security worldwide` 谈加强安保，第二段的 `increased safety` 也谈安全增加；因此回看这句以及紧接着的坠机例子，看看例子是在解释前一句，还是另起一个全球性的倡议。\n\n> Americans are willing to tolerate **[xxx]** security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have **[xxx]** over the Mediterranean Sea, provides another tragic reminder of why.\n\n先看前一句的主语Americans和动作are willing to tolerate：这里写的是美国人为什么愿意接受安检。`increased safety` 是他们想换来的东西，不是作者正在向全世界发布的要求。下一句末尾的why接着问“为什么愿意”，于是坠机事件就是对这个理由的提醒。\n\nA把这一步写成 `strengthen security worldwide`，不仅多出worldwide的范围，还把“解释已有的容忍”改成“强调加强安保”。坠机发生在地中海上空，并不使它在这段中的作用变成全球倡议；发生地点和用例目的要分开。\n\n**这里的why是在追问美国人为什么容忍安检，还是要求全世界怎样加强安保？**\n\n前者。它接的是前一句的愿意忍受安检，而不是一个尚未提出的全球行动要求。\n\nA即使保留中间的 **[xxx]**，后面的全球范围和行动方向也已经换掉了这一例子的说明对象。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. stress the <span class=\"mask\">[xxx]</span> to strengthen security worldwide</h3>\n<blockquote>\n<p>强调在全球加强安保的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把A接回题干，它说的是：提到埃及航空804航班坠毁，是为了强调在全球加强安保的 <span class=\"mask\">[xxx]</span>。</p>\n<p>A的 <code>strengthen security worldwide</code> 谈加强安保，第二段的 <code>increased safety</code> 也谈安全增加；因此回看这句以及紧接着的坠机例子，看看例子是在解释前一句，还是另起一个全球性的倡议。</p>\n<blockquote>\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why.</p>\n</blockquote>\n<p>先看前一句的主语Americans和动作are willing to tolerate：这里写的是美国人为什么愿意接受安检。<code>increased safety</code> 是他们想换来的东西，不是作者正在向全世界发布的要求。下一句末尾的why接着问“为什么愿意”，于是坠机事件就是对这个理由的提醒。</p>\n<p>A把这一步写成 <code>strengthen security worldwide</code>，不仅多出worldwide的范围，还把“解释已有的容忍”改成“强调加强安保”。坠机发生在地中海上空，并不使它在这段中的作用变成全球倡议；发生地点和用例目的要分开。</p>\n<p><strong>这里的why是在追问美国人为什么容忍安检，还是要求全世界怎样加强安保？</strong></p>\n<p>前者。它接的是前一句的愿意忍受安检，而不是一个尚未提出的全球行动要求。</p>\n<p>A即使保留中间的 <span class=\"mask\">[xxx]</span>，后面的全球范围和行动方向也已经换掉了这一例子的说明对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,378,997,229]],"questionRects":[[188,158,760,34],[233,211,664,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `strengthen security worldwide` 谈加强安保，第二段的 `increased safety` 也谈安全增加；因此回看这句以及紧接着的坠机例子，看看例子是在解释前一句，还是另起一个全球性的倡议。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"increased safety","visibleOptionAnchor":"strengthen security worldwide"}}}},{"section":"21题","raw":"### B. explain American’s tolerance of current security checks\n\n> 解释美国人对当前安检的容忍\n\n把B接回题干，它说的是：提到埃及航空804航班坠毁，是为了解释美国人为什么容忍当前安检。\n\nB的 `tolerance of current security checks` 与第二段的 `are willing to tolerate` 都在说接受安检，所以回到这一句，再看下一句末尾的why究竟接着解释什么。\n\n> Americans are willing to tolerate **[xxx]** security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have **[xxx]** over the Mediterranean Sea, provides another tragic reminder of why.\n\nB里的tolerance是名词，原文 `are willing to tolerate` 是“愿意忍受”这一动作，讲的是同一种态度。security checks和security procedures也指向同一套安检事情。这里还要把in return for接上：美国人接受安检，不是喜欢排队，而是为了换取更多安全。\n\n后一句先提坠机，再说它提供了一个tragic reminder of why。why没有另立对象，而是回扣刚说完的容忍理由。B的 `tolerance of current security checks` 正好把前一句的态度和后一句的例子合起来了，不需要确定飞机被怎样 **[xxx]**，也没有把例子写成机场建设问题。\n\n**B能不能同时接住“愿意忍受安检”和“坠机提醒为什么”这两层内容？**\n\n能。前一句给出美国人的态度与交换条件，后一例子提醒人们安全风险，使这种容忍有了具体理由。\n\n所以B不是只碰到security一个词，而是保留了“例子解释容忍原因”这整个关系。\n\n**第一轮判断：B保留。**","contextRaw":"","html":"<h3>B. explain American’s tolerance of current security checks</h3>\n<blockquote>\n<p>解释美国人对当前安检的容忍</p>\n</blockquote>\n<p>把B接回题干，它说的是：提到埃及航空804航班坠毁，是为了解释美国人为什么容忍当前安检。</p>\n<p>B的 <code>tolerance of current security checks</code> 与第二段的 <code>are willing to tolerate</code> 都在说接受安检，所以回到这一句，再看下一句末尾的why究竟接着解释什么。</p>\n<blockquote>\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why.</p>\n</blockquote>\n<p>B里的tolerance是名词，原文 <code>are willing to tolerate</code> 是“愿意忍受”这一动作，讲的是同一种态度。security checks和security procedures也指向同一套安检事情。这里还要把in return for接上：美国人接受安检，不是喜欢排队，而是为了换取更多安全。</p>\n<p>后一句先提坠机，再说它提供了一个tragic reminder of why。why没有另立对象，而是回扣刚说完的容忍理由。B的 <code>tolerance of current security checks</code> 正好把前一句的态度和后一句的例子合起来了，不需要确定飞机被怎样 <span class=\"mask\">[xxx]</span>，也没有把例子写成机场建设问题。</p>\n<p><strong>B能不能同时接住“愿意忍受安检”和“坠机提醒为什么”这两层内容？</strong></p>\n<p>能。前一句给出美国人的态度与交换条件，后一例子提醒人们安全风险，使这种容忍有了具体理由。</p>\n<p>所以B不是只碰到security一个词，而是保留了“例子解释容忍原因”这整个关系。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[168,378,997,229]],"questionRects":[[188,158,760,34],[233,264,716,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `tolerance of current security checks` 与第二段的 `are willing to tolerate` 都在说接受安检，所以回到这一句，再看下一句末尾的why究竟接着解释什么。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"are willing to tolerate","visibleOptionAnchor":"tolerance of current security checks"}}}},{"section":"21题","raw":"### C. highlight the necessity of upgrading major U.S. airports\n\n> 突出升级美国主要机场的必要性\n\n把C接回题干，它说的是：提到埃及航空804航班坠毁，是为了突出升级美国主要机场的必要性。\n\nC的 `upgrading major U.S. airports` 指机场升级；要判断这个升级要求是否由坠机例子带出，仍要看第二段的 `reminder of why`，因为它直接写明了例子在这里起提醒作用。\n\n> The crash of EgyptAir Flight 804, which terrorists may have **[xxx]** over the Mediterranean Sea, provides another tragic reminder of why.\n\n`reminder of why` 往前接到美国人愿意忍受安检，提醒的是为什么需要付出一定时间换取安全。C的 `upgrading major U.S. airports` 却把承担动作的对象换成机场设施，还加进“升级”这一工程性的做法。\n\n不能因为安检在机场发生，就把所有涉及安检的例子都理解成呼吁升级机场。这里没有说这次坠机由哪座美国机场的设施造成，也没有以此提出改建要求。第二段后面的时间浪费和生活拖累，仍在衡量旅客承受的代价，不是在列机场应当更换的设备。\n\n**坠机提醒旅客为什么重视安全，能不能直接改写成美国主要机场必须升级？**\n\n不能。前者解释一种态度，后者要求对另一对象采取具体措施，二者之间缺了原文没有建立的联系。\n\nC把安检所在的地点当成了例子要论证的对象，机场升级不是这句why所接的内容。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. highlight the necessity of upgrading major U.S. airports</h3>\n<blockquote>\n<p>突出升级美国主要机场的必要性</p>\n</blockquote>\n<p>把C接回题干，它说的是：提到埃及航空804航班坠毁，是为了突出升级美国主要机场的必要性。</p>\n<p>C的 <code>upgrading major U.S. airports</code> 指机场升级；要判断这个升级要求是否由坠机例子带出，仍要看第二段的 <code>reminder of why</code>，因为它直接写明了例子在这里起提醒作用。</p>\n<blockquote>\n<p>The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why.</p>\n</blockquote>\n<p><code>reminder of why</code> 往前接到美国人愿意忍受安检，提醒的是为什么需要付出一定时间换取安全。C的 <code>upgrading major U.S. airports</code> 却把承担动作的对象换成机场设施，还加进“升级”这一工程性的做法。</p>\n<p>不能因为安检在机场发生，就把所有涉及安检的例子都理解成呼吁升级机场。这里没有说这次坠机由哪座美国机场的设施造成，也没有以此提出改建要求。第二段后面的时间浪费和生活拖累，仍在衡量旅客承受的代价，不是在列机场应当更换的设备。</p>\n<p><strong>坠机提醒旅客为什么重视安全，能不能直接改写成美国主要机场必须升级？</strong></p>\n<p>不能。前者解释一种态度，后者要求对另一对象采取具体措施，二者之间缺了原文没有建立的联系。</p>\n<p>C把安检所在的地点当成了例子要论证的对象，机场升级不是这句why所接的内容。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,378,997,229]],"questionRects":[[188,158,760,34],[233,317,728,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","s \"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>这里 <code>private lives</code> 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。真正产生影响的主语是Wasted time，后面用is a drag说明浪费时间带来的拖累。D的 <code>privacy protection</code> 则是防止个人信息或私人领域被侵犯，已经把“生活被耽误”换成“隐私需要保护”。</p>\n<p>再把它接回题干，题干问的是坠机例子为什么被提到，而不是安检可能引出的任何社会议题。前面的why仍然回扣安全与容忍，后面的private lives也没有把它转向隐私。只抓private这个相近词，会漏掉time才是这句话正在批评的东西。</p>\n<p><strong>浪费时间拖累私人生活，等不等于作者在用坠机事件讨论隐私保护？</strong></p>\n<p>不等于。时间代价与隐私保护是不同问题，原文句子的主语、影响和所接例子都没有变成隐私。</p>\n<p>D把private lives的生活范围换成privacy protection的保护议题，不能解释该例子的作用。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,378,997,229]],"questionRects":[[188,158,760,34],[233,370,619,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `privacy protection` 要找的是隐私方面的保护；第二段出现了 `private lives`，两处都带有“私人”的意思，因此回看private lives所在的完整句，确认它说的究竟是哪一种影响。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"private lives","visibleOptionAnchor":"privacy protection"}}}},{"section":"21题","raw":"### 21题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n> **21题选B。**","contextRaw":"","html":"<h3>21题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>21题选B。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,158,760,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"21"}},{"section":"22题","raw":"## 22题\n\n> Which of the following contributes to long waits at major airports?  \n> 以下哪一项会造成主要机场的长时间等待？\n\n题干问long waits的原因。粗读时我依稀记得第三段留下过“长时间等待”这个碎片，先回到第三段完整读；如果某个选项另提一个尚未读过的具体对象，再顺着它找。\n\n> 原文参考：\n>\n> Last year, the Transportation Security Administration (TSA) found in a secret check that **[xxx]** investigators were able to **[xxx]** weapons—both fake and real—past airport security nearly every time they tried. **[xxx]** security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International. It is not yet clear how much more **[xxx]** airline security has become—but the lines are obvious.\n>\n> 开始精读：\n>\n> Last year, / the Transportation Security Administration (TSA) found in a secret check / that **[xxx]** investigators were able to **[xxx]** weapons—both fake and real—past airport security / nearly every time they tried. / **[xxx]** security measures since then, / combined with a rise in airline travel / due to the improving economy and low oil prices, / have resulted in long waits at major airports / such as Chicago’s O’Hare International. / It is not yet clear / how much more **[xxx]** airline security has become—but the lines are obvious.\n>\n> 顺着英文顺序读：\n>\n> 去年， / 运输安全管理局（TSA）在一次秘密检查中发现 / **[xxx]** 调查人员能够把武器——假的和真的都有——**[xxx]** 过机场安检 / 几乎每次尝试都是如此。 / 那以后 **[xxx]** 的安保措施， / 加上航空出行的增加 / 由于经济改善和低油价， / 已经造成主要机场的长时间等待 / 比如芝加哥的奥黑尔国际机场。 / 现在还不清楚 / 航空安保变得多么更 **[xxx]** 了——但是队伍是显而易见的。","contextRaw":"","html":"<h2>22题</h2>\n<blockquote>\n<p>Which of the following contributes to long waits at major airports?<br />\n以下哪一项会造成主要机场的长时间等待？</p>\n</blockquote>\n<p>题干问long waits的原因。粗读时我依稀记得第三段留下过“长时间等待”这个碎片，先回到第三段完整读；如果某个选项另提一个尚未读过的具体对象，再顺着它找。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Last year, the Transportation Security Administration (TSA) found in a secret check that <span class=\"mask\
