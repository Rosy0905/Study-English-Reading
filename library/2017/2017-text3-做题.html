 <span class=\"mask\">[xxx]</span> 的概念。 / 它衡量那些不重要的东西 / 却漏掉那些重要的东西。 / 按照最近的大多数衡量， / 英国的GDP一直是西方世界的 <span class=\"mask\">[xxx]</span>， / 伴随着创纪录的低失业率和高增长数字。 / 如果一切都进展得这么好， / 那为什么一千七百多万人投票支持英国脱欧， / 尽管有人警告这可能给他们国家的经济前景带来什么？</p>\n</blockquote>\n","articleRects":[[168,239,996,151],[168,398,997,273]],"questionRects":[[188,158,633,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"31"}},{"section":"31题","raw":"### A. praised the UK for its GDP\n\n> 称赞英国的GDP\n\n把A接回题干，它说的是：作者引用肯尼迪，是因为他称赞了英国的GDP。\n\nA的 `praised the UK` 把肯尼迪的评价限定到英国，第一段的 `a country’s GDP` 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\n\n> Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.”\n\n`a country’s GDP` 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 `praised the UK` 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。\n\n第二段的低失业率和高增长也不能倒灌给肯尼迪。那是作者讨论英国现状时摆出的数字，与前面引用某人的话不是同一层叙述。看到全文前两段都提GDP，就把英国的数字表现归到肯尼迪名下，会同时读错说话人和态度。\n\n**引语说GDP漏掉使生活值得过的东西，能不能当作肯尼迪对英国GDP的赞美？**\n\n不能。引语既没有专指英国，也没有赞美GDP，而是在指出它未能衡量的重要内容。\n\nA把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. praised the UK for its GDP</h3>\n<blockquote>\n<p>称赞英国的GDP</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者引用肯尼迪，是因为他称赞了英国的GDP。</p>\n<p>A的 <code>praised the UK</code> 把肯尼迪的评价限定到英国，第一段的 <code>a country’s GDP</code> 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。</p>\n<blockquote>\n<p>Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.”</p>\n</blockquote>\n<p><code>a country’s GDP</code> 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 <code>praised the UK</code> 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。</p>\n<p>第二段的低失业率和高增长也不能倒灌给肯尼迪。那是作者讨论英国现状时摆出的数字，与前面引用某人的话不是同一层叙述。看到全文前两段都提GDP，就把英国的数字表现归到肯尼迪名下，会同时读错说话人和态度。</p>\n<p><strong>引语说GDP漏掉使生活值得过的东西，能不能当作肯尼迪对英国GDP的赞美？</strong></p>\n<p>不能。引语既没有专指英国，也没有赞美GDP，而是在指出它未能衡量的重要内容。</p>\n<p>A把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,239,996,151],[168,398,997,273]],"questionRects":[[188,158,633,34],[233,211,379,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `praised the UK` 把肯尼迪的评价限定到英国，第一段的 `a country’s GDP` 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","scope","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"a country’s GDP","visibleOptionAnchor":"praised the UK"}}}},{"section":"31题","raw":"### B. identified GDP with happiness\n\n> 把GDP与幸福等同起来\n\n把B接回题干，它说的是：作者引用肯尼迪，是因为他把GDP与幸福等同起来。\n\nB的 `identified GDP with happiness` 说两者等同，第一段的 `except that which makes life worthwhile` 则直接限定GDP没有量到什么，因此回看except这个转折点后面的内容。\n\n> Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.”\n\n`except that which makes life worthwhile` 不是给GDP增加一项功能，而是从everything里面划出一个例外：让生活值得过的东西不在GDP的衡量之中。B的 `identified GDP with happiness` 却把二者说成同一回事，方向正好相反。\n\n不要只读everything，再看到life就认为GDP与幸福有关，因此B也对。真正决定关系的是except。第二段进一步说它衡量不重要的东西，却漏掉重要的东西，仍在强调遗漏，而不是补上一条GDP等于幸福的定义。\n\n**except把有价值的生活排除在GDP衡量之外，这能与“GDP等同幸福”并存为同一个意思吗？**\n\n不能。原文强调两者不能简单等同，B却取消了这个差别。\n\nB不是换了一种表达，而是把排除关系改成等同关系。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. identified GDP with happiness</h3>\n<blockquote>\n<p>把GDP与幸福等同起来</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者引用肯尼迪，是因为他把GDP与幸福等同起来。</p>\n<p>B的 <code>identified GDP with happiness</code> 说两者等同，第一段的 <code>except that which makes life worthwhile</code> 则直接限定GDP没有量到什么，因此回看except这个转折点后面的内容。</p>\n<blockquote>\n<p>Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.”</p>\n</blockquote>\n<p><code>except that which makes life worthwhile</code> 不是给GDP增加一项功能，而是从everything里面划出一个例外：让生活值得过的东西不在GDP的衡量之中。B的 <code>identified GDP with happiness</code> 却把二者说成同一回事，方向正好相反。</p>\n<p>不要只读everything，再看到life就认为GDP与幸福有关，因此B也对。真正决定关系的是except。第二段进一步说它衡量不重要的东西，却漏掉重要的东西，仍在强调遗漏，而不是补上一条GDP等于幸福的定义。</p>\n<p><strong>except把有价值的生活排除在GDP衡量之外，这能与“GDP等同幸福”并存为同一个意思吗？</strong></p>\n<p>不能。原文强调两者不能简单等同，B却取消了这个差别。</p>\n<p>B不是换了一种表达，而是把排除关系改成等同关系。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,239,996,151],[168,398,997,273]],"questionRects":[[188,158,633,34],[233,264,412,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `identified GDP with happiness` 说两者等同，第一段的 `except that which makes life worthwhile` 则直接限定GDP没有量到什么，因此回看except这个转折点后面的内容。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"except that which makes life worthwhile","visibleOptionAnchor":"identified GDP with happiness"}}}},{"section":"31题","raw":"### C. misinterpreted the role of GDP\n\n> 误解了GDP的作用\n\n把C接回题干，它说的是：作者引用肯尼迪，是因为他误解了GDP的作用。\n\nC的 `misinterpreted the role of GDP` 要求作者指出肯尼迪理解有误；第二段的 `It measures things that do not matter and misses things that do` 继续评价GDP的衡量范围，因此把这句与引语一起看，确认作者是在纠错还是沿着同一问题往下说。\n\n> Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.”\n>\n> It measures things that do not matter and misses things that do.\n\n`It measures things that do not matter and misses things that do` 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。C的 `misinterpreted the role of GDP` 则把肯尼迪当成理解错误、需要被纠正的对象。原文后续并没有给他纠错，反而沿着“量到了什么、漏掉了什么”展开问题。\n\n“某人批评一个指标”和“作者认为这个人误解指标”不能互换。要使C成立，作者需要指出肯尼迪哪一处说错，再提供相反解释；现在读到的是同向补充。这里不能把被批评的GDP换成正在被批评的肯尼迪。\n\n**后一句继续说GDP漏掉重要内容，是在纠正肯尼迪，还是沿用他指出的问题？**\n\n后者。作者接着谈同一种遗漏，没有把肯尼迪的说法列为错误观点。\n\nC错把被引用来提出问题的人当成文章要驳斥的人。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. misinterpreted the role of GDP</h3>\n<blockquote>\n<p>误解了GDP的作用</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者引用肯尼迪，是因为他误解了GDP的作用。</p>\n<p>C的 <code>misinterpreted the role of GDP</code> 要求作者指出肯尼迪理解有误；第二段的 <code>It measures things that do not matter and misses things that do</code> 继续评价GDP的衡量范围，因此把这句与引语一起看，确认作者是在纠错还是沿着同一问题往下说。</p>\n<blockquote>\n<p>Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.”</p>\n<p>It measures things that do not matter and misses things that do.</p>\n</blockquote>\n<p><code>It measures things that do not matter and misses things that do</code> 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。C的 <code>misinterpreted the role of GDP</code> 则把肯尼迪当成理解错误、需要被纠正的对象。原文后续并没有给他纠错，反而沿着“量到了什么、漏掉了什么”展开问题。</p>\n<p>“某人批评一个指标”和“作者认为这个人误解指标”不能互换。要使C成立，作者需要指出肯尼迪哪一处说错，再提供相反解释；现在读到的是同向补充。这里不能把被批评的GDP换成正在被批评的肯尼迪。</p>\n<p><strong>后一句继续说GDP漏掉重要内容，是在纠正肯尼迪，还是沿用他指出的问题？</strong></p>\n<p>后者。作者接着谈同一种遗漏，没有把肯尼迪的说法列为错误观点。</p>\n<p>C错把被引用来提出问题的人当成文章要驳斥的人。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,239,996,151],[168,398,997,273]],"questionRects":[[188,158,633,34],[233,317,419,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `misinterpreted the role of GDP` 要求作者指出肯尼迪理解有误；第二段的 `It measures things that do not matter and misses things that do` 继续评价GDP的衡量范围，因此把这句与引语一起看，确认作者是在纠错还是沿着同一问题往下说。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"It measures things that do not matter and misses things that do","visibleOptionAnchor":"misinterpreted the role of GDP"}}}},{"section":"31题","raw":"### D. had a **[xxx]** opinion of GDP\n\n> 对GDP持一种 **[xxx]** 的评价\n\n把D接回题干，它说的是：作者引用肯尼迪，是因为他对GDP持有 **[xxx]** 的评价。\n\nD的 `opinion of GDP` 指肯尼迪对GDP的看法，第一段的 `everything except` 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。\n\n> Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.”\n\n`opinion of GDP` 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。`everything except` 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。\n\nD中修饰opinion的词仍是 **[xxx]**，不能直接把它译成某个态度词。不过其他三项分别增加英国这个对象、把排除关系写成等同、把肯尼迪改成被纠错的人，都已与引语及接下来的叙述不合。D保留了真正正在发生的事情：作者引用一个人对GDP的评价。\n\n**引语是否确实表达了肯尼迪对GDP衡量能力的一种评价，而不是赞英国或把幸福等同GDP？**\n\n能。except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\n\nD保留；所依靠的是人物、对象与引语方向，而不是先补出被遮住的形容词。\n\n**第一轮判断：D保留。**","contextRaw":"","html":"<h3>D. had a <span class=\"mask\">[xxx]</span> opinion of GDP</h3>\n<blockquote>\n<p>对GDP持一种 <span class=\"mask\">[xxx]</span> 的评价</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者引用肯尼迪，是因为他对GDP持有 <span class=\"mask\">[xxx]</span> 的评价。</p>\n<p>D的 <code>opinion of GDP</code> 指肯尼迪对GDP的看法，第一段的 <code>everything except</code> 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。</p>\n<blockquote>\n<p>Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.”</p>\n</blockquote>\n<p><code>opinion of GDP</code> 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。<code>everything except</code> 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。</p>\n<p>D中修饰opinion的词仍是 <span class=\"mask\">[xxx]</span>，不能直接把它译成某个态度词。不过其他三项分别增加英国这个对象、把排除关系写成等同、把肯尼迪改成被纠错的人，都已与引语及接下来的叙述不合。D保留了真正正在发生的事情：作者引用一个人对GDP的评价。</p>\n<p><strong>引语是否确实表达了肯尼迪对GDP衡量能力的一种评价，而不是赞英国或把幸福等同GDP？</strong></p>\n<p>能。except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。</p>\n<p>D保留；所依靠的是人物、对象与引语方向，而不是先补出被遮住的形容词。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[168,239,996,151],[168,398,997,273]],"questionRects":[[188,158,633,34],[233,370,368,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `opinion of GDP` 指肯尼迪对GDP的看法，第一段的 `everything except` 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"everything except","visibleOptionAnchor":"opinion of GDP"}}}},{"section":"31题","raw":"### 31题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n> **31题选D。**","contextRaw":"","html":"<h3>31题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<blockquote>\n<p><strong>31题选D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,158,633,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"31"}},{"section":"32题","raw":"## 32题\n\n> It can be inferred from Paragraph 2 that ______.  \n> 从第二段可以推知什么？\n\n题干的Paragraph 2明确指定第二段，这一段已经在31题完整读过。现在复用它，重点回到经济数字与脱欧选择放在一起的反问，再逐项比较，不重复张贴整段翻译。","contextRaw":"","html":"<h2>32题</h2>\n<blockquote>\n<p>It can be inferred from Paragraph 2 that ______.<br />\n从第二段可以推知什么？</p>\n</blockquote>\n<p>题干的Paragraph 2明确指定第二段，这一段已经在31题完整读过。现在复用它，重点回到经济数字与脱欧选择放在一起的反问，再逐项比较，不重复张贴整段翻译。</p>\n","articleRects":[[168,398,997,273]],"questionRects":[[188,475,643,32]],"scrollTarget":"auto","meta":{"kind":"question","qid":"32"}},{"section":"32题","raw":"### A. GDP as the measure of success is widely defied in the UK\n\n> GDP作为成功尺度在英国受到广泛质疑\n\n把A接回题干，它说的是：第二段可以推知，在英国，把GDP当作成功尺度的做法受到广泛质疑。\n\nA的 `widely defied in the UK` 涉及英国人对一种成功判断的不接受，第二段的 `over 17 million people vote for Brexit` 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\n\n> By most recent measures, the UK’s GDP has been the **[xxx]** of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country’s economic prospects?\n\n作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 `over 17 million people vote for Brexit`。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 `widely defied in the UK` 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\n\nwidely可以由一千七百多万人的规模得到支撑；被质疑的是GDP“作为成功尺度”，不是GDP数字必然造假，也不是所有经济活动都不重要。把A的限定读全，它与反问关注的“为什么数字好却不能代表大家认可现状”能够接上。\n\n**作者用大量投票者与漂亮的增长数字相对照，是否在质疑仅凭GDP就判定成功？**\n\n能。反问的力量正在于按GDP看似成功，却不能解释如此广泛的不满或不同选择。\n\nA保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\n\n**第一轮判断：A保留。**","contextRaw":"","html":"<h3>A. GDP as the measure of success is widely defied in the UK</h3>\n<blockquote>\n<p>GDP作为成功尺度在英国受到广泛质疑</p>\n</blockquote>\n<p>把A接回题干，它说的是：第二段可以推知，在英国，把GDP当作成功尺度的做法受到广泛质疑。</p>\n<p>A的 <code>widely defied in the UK</code> 涉及英国人对一种成功判断的不接受，第二段的 <code>over 17 million people vote for Brexit</code> 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。</p>\n<blockquote>\n<p>By most recent measures, the UK’s GDP has been the <span class=\"mask\">[xxx]</span> of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country’s economic prospects?</p>\n</blockquote>\n<p>作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 <code>over 17 million people vote for Brexit</code>。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 <code>widely defied in the UK</code> 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。</p>\n<p>widely可以由一千七百多万人的规模得到支撑；被质疑的是GDP“作为成功尺度”，不是GDP数字必然造假，也不是所有经济活动都不重要。把A的限定读全，它与反问关注的“为什么数字好却不能代表大家认可现状”能够接上。</p>\n<p><strong>作者用大量投票者与漂亮的增长数字相对照，是否在质疑仅凭GDP就判定成功？</strong></p>\n<p>能。反问的力量正在于按GDP看似成功，却不能解释如此广泛的不满或不同选择。</p>\n<p>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[168,398,997,273]],"questionRects":[[188,475,643,32],[233,528,762,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `widely defied in the UK` 涉及英国人对一种成功判断的不接受，第二段的 `over 17 million people vote for Brexit` 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"over 17 million people vote for Brexit","visibleOptionAnchor":"widely defied in the UK"}}}},{"section":"32题","raw":"### B. policymakers in the UK are paying less attention to GDP\n\n> 英国政策制定者对GDP的关注正在减少\n\n把B接回题干，它说的是：第二段可以推知，英国政策制定者越来越少关注GDP。\n\nB的 `paying less attention to GDP` 是关注程度随时间下降，原文的 `for over half a century` 却是在交代GDP有用性问题持续了多久，因此回看带policymakers的首句。\n\n> The question of GDP and its usefulness has **[xxx]** policymakers for over half a century. Many argue that it is a **[xxx]** concept. It measures things that do not matter and misses things that do.\n\n`for over half a century` 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。B的 `paying less attention to GDP` 却要求有越来越少关注的变化。持续争论GDP有没有用，与已经减少注意力，是两种不同的事情。\n\nMany argue的主体还是many，没有把所有议论者都限定成英国政策制定者。下文介绍英国的高增长与脱欧选择，也是在说明GDP难以解释现状，并不等于政府机构减少了对它的关注。B同时补上特定主体和注意力变化，超出了该段所写的争论。\n\n**对GDP的有用性争论了半个多世纪，能否直接推出英国政策制定者如今关注得更少？**\n\n不能。争论持续的时间不是关注减少的趋势，原文也没有给出前后关注程度的对照。\n\nB把长期存在的问题改成了一种未说明的行为变化。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. policymakers in the UK are paying less attention to GDP</h3>\n<blockquote>\n<p>英国政策制定者对GDP的关注正在减少</p>\n</blockquote>\n<p>把B接回题干，它说的是：第二段可以推知，英国政策制定者越来越少关注GDP。</p>\n<p>B的 <code>paying less attention to GDP</code> 是关注程度随时间下降，原文的 <code>for over half a century</code> 却是在交代GDP有用性问题持续了多久，因此回看带policymakers的首句。</p>\n<blockquote>\n<p>The question of GDP and its usefulness has <span class=\"mask\">[xxx]</span> policymakers for over half a century. Many argue that it is a <span class=\"mask\">[xxx]</span> concept. It measures things that do not matter and misses things that do.</p>\n</blockquote>\n<p><code>for over half a century</code> 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。B的 <code>paying less attention to GDP</code> 却要求有越来越少关注的变化。持续争论GDP有没有用，与已经减少注意力，是两种不同的事情。</p>\n<p>Many argue的主体还是many，没有把所有议论者都限定成英国政策制定者。下文介绍英国的高增长与脱欧选择，也是在说明GDP难以解释现状，并不等于政府机构减少了对它的关注。B同时补上特定主体和注意力变化，超出了该段所写的争论。</p>\n<p><strong>对GDP的有用性争论了半个多世纪，能否直接推出英国政策制定者如今关注得更少？</strong></p>\n<p>不能。争论持续的时间不是关注减少的趋势，原文也没有给出前后关注程度的对照。</p>\n<p>B把长期存在的问题改成了一种未说明的行为变化。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,398,997,273]],"questionRects":[[188,475,643,32],[233,581,740,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `paying less attention to GDP` 是关注程度随时间下降，原文的 `for over half a century` 却是在交代GDP有用性问题持续了多久，因此回看带policymakers的首句。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","time","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"for over half a century","visibleOptionAnchor":"paying less attention to GDP"}}}},{"section":"32题","raw":"### C. the UK will contribute less to the world economy\n\n> 英国对世界经济的贡献将会减少\n\n把C接回题干，它说的是：第二段可以推知，英国将减少对世界经济的贡献。\n\nC的 `world economy` 把判断放在全球，第二段的 `their country’s economic prospects` 说的却是英国自己的经济前景，因此回看反问句末尾的警告对象与表达程度。\n\n> If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country’s economic prospects?\n\n`their country’s economic prospects` 是这个国家自身的前景，不是它在 `world economy` 中贡献了多少。C还用了will contribute less，把一个关于可能影响的警告改成未来贡献一定减少的结论。原文用what it could do，并没有给出这项确定预测，更没有计算英国在世界经济中的份额。\n\n这句话的作用是让漂亮的国内经济数字与大量投票者的选择相碰撞，追问GDP衡量出了什么。不能把提到经济警告的背景，抽出来改写成全文未提供的国际经济结论。英国经济变化和英国对全球的贡献，即使有关联，也需要另外的论证。\n\n**对英国自身经济前景的可能风险警告，能否直接当作它对全球贡献将减少的确定结论？**\n\n不能。对象从本国前景扩大到全球贡献，可能性又被改成确定性。\n\nC在范围和程度上都增加了原文没有作出的判断。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. the UK will contribute less to the world economy</h3>\n<blockquote>\n<p>英国对世界经济的贡献将会减少</p>\n</blockquote>\n<p>把C接回题干，它说的是：第二段可以推知，英国将减少对世界经济的贡献。</p>\n<p>C的 <code>world economy</code> 把判断放在全球，第二段的 <code>their country’s economic prospects</code> 说的却是英国自己的经济前景，因此回看反问句末尾的警告对象与表达程度。</p>\n<blockquote>\n<p>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country’s economic prospects?</p>\n</blockquote>\n<p><code>their country’s economic prospects</code> 是这个国家自身的前景，不是它在 <code>world economy</code> 中贡献了多少。C还用了will contribute less，把一个关于可能影响的警告改成未来贡献一定减少的结论。原文用what it could do，并没有给出这项确定预测，更没有计算英国在世界经济中的份额。</p>\n<p>这句话的作用是让漂亮的国内经济数字与大量投票者的选择相碰撞，追问GDP衡量出了什么。不能把提到经济警告的背景，抽出来改写成全文未提供的国际经济结论。英国经济变化和英国对全球的贡献，即使有关联，也需要另外的论证。</p>\n<p><strong>对英国自身经济前景的可能风险警告，能否直接当作它对全球贡献将减少的确定结论？</strong></p>\n<p>不能。对象从本国前景扩大到全球贡献，可能性又被改成确定性。</p>\n<p>C在范围和程度上都增加了原文没有作出的判断。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,398,997,273]],"questionRects":[[188,475,643,32],[233,634,647,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `world economy` 把判断放在全球，第二段的 `their country’s economic prospects` 说的却是英国自己的经济前景，因此回看反问句末尾的警告对象与表达程度。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","degree","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"their country’s economic prospects","visibleOptionAnchor":"world economy"}}}},{"section":"32题","raw":"### D. the UK is reluctant to **[xxx]** its economic pattern\n\n> 英国不愿 **[xxx]** 它的经济模式\n\n把D接回题干，它说的是：第二段可以推知，英国不愿意 **[xxx]** 自身的经济模式。\n\nD的 `is reluctant to` 说国家不愿采取某个动作，第二段的 `vote for Brexit` 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。\n\n> If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country’s economic prospects?\n\n`vote for Brexit` 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 `is reluctant to` 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。\n\n中间动作 **[xxx]** 没读清，不应据此猜它是哪一种改动；但不愿意这一态度、整个国家这个主体、经济模式这个对象都已经出现。它们并不是反问句中的投票者、投票行为与经济前景。不能把一个群体作了某种选择，直接写成国家不愿对经济模式做事。\n\n**大量人投票脱欧，是否就说明英国对自身经济模式抱有某种明确的不愿意态度？**\n\n不能。反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\n\nD先换了主体和动作对象，再加主观意愿，不能由该段推出。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. the UK is reluctant to <span class=\"mask\">[xxx]</span> its economic pattern</h3>\n<blockquote>\n<p>英国不愿 <span class=\"mask\">[xxx]</span> 它的经济模式</p>\n</blockquote>\n<p>把D接回题干，它说的是：第二段可以推知，英国不愿意 <span class=\"mask\">[xxx]</span> 自身的经济模式。</p>\n<p>D的 <code>is reluctant to</code> 说国家不愿采取某个动作，第二段的 <code>vote for Brexit</code> 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。</p>\n<blockquote>\n<p>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country’s economic prospects?</p>\n</blockquote>\n<p><code>vote for Brexit</code> 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 <code>is reluctant to</code> 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。</p>\n<p>中间动作 <span class=\"mask\">[xxx]</span> 没读清，不应据此猜它是哪一种改动；但不愿意这一态度、整个国家这个主体、经济模式这个对象都已经出现。它们并不是反问句中的投票者、投票行为与经济前景。不能把一个群体作了某种选择，直接写成国家不愿对经济模式做事。</p>\n<p><strong>大量人投票脱欧，是否就说明英国对自身经济模式抱有某种明确的不愿意态度？</strong></p>\n<p>不能。反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。</p>\n<p>D先换了主体和动作对象，再加主观意愿，不能由该段推出。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,398,997,273]],"questionRects":[[188,475,643,32],[233,687,658,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `is reluctant to` 说国家不愿采取某个动作，第二段的 `vote for Brexit` 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"vote for Brexit","visibleOptionAnchor":"is reluctant to"}}}},{"section":"32题","raw":"### 32题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n> **32题选A。**","contextRaw":"","html":"<h3>32题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>32题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,475,643,32]],"scrollTarget":"auto","meta":{"kind":"result","qid":"32"}},{"section":"33题","raw":"## 33题\n\n> Which of the following is true about the recent annual study?  \n> 关于最近的年度研究，下列哪一项正确？\n\n题干里的annual study，让我想起粗读时依稀记得的“年度研究”碎片，位置在第三段。这个碎片只帮助找位置，还没有说明研究怎样做或结论如何。先把第三段完整读一遍，再分别核对四项。\n\n> 原文参考：\n>\n> A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is **[xxx]** into **[xxx]** improvements for its citizens. Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more **[xxx]** assessment of how countries are performing.\n>\n> 开始精读：\n>\n> A recent annual study of countries and their ability to convert growth into well-being / sheds some light on that question. / Across the 163 countries measured, / the UK is one of the poorest performers / in ensuring that economic growth is **[xxx]** into **[xxx]** improvements for its citizens. / Rather than just focusing on GDP, / over 40 different sets of criteria from health, education and civil society engagement / have been measured / to get a more **[xxx]** assessment of how countries are performing.\n>\n> 顺着英文顺序读：\n>\n> 最近一项年度研究，研究各国及其把增长转化为福祉的能力， / 给那个问题带来一些解释。 / 在被衡量的163个国家中， / 英国是表现最差的国家之一， / 在确保经济增长被 **[xxx]** 为给公民带来的 **[xxx]** 改善这件事上。 / 而不是仅仅关注GDP， / 来自健康、教育和公民社会参与的四十多组不同标准 / 已经被衡量， / 来获得一个更 **[xxx]** 的评价，评价各国表现如何。","contextRaw":"","html":"<h2>33题</h2>\n<blockquote>\n<p>Which of the following is true about the recent annual study?<br />\n关于最近的年度研究，下列哪一项正确？</p>\n</blockquote>\n<p>题干里的annual study，让我想起粗读时依稀记得的“年度研究”碎片，位置在第三段。这个碎片只帮助找位置，还没有说明研究怎样做或结论如何。先把第三段完整读一遍，再分别核对四项。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is <span class=\"mask\">[xxx]</span> into <span class=\"mask\">[xxx]</span> improvements for its citizens. Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more <span class=\"mask\">[xxx]</span> assessment of how countries are performing.</p>\n<p>开始精读：</p>\n<p>A recent annual study of countries and their ability to convert growth into well-being / sheds some light on that question. / Across the 163 countries measured, / the UK is one of the poorest performers / in ensuring that economic growth is <span class=\"mask\">[xxx]</span> into <span class=\"mask\">[xxx]</span> improvements for its citizens. / Rather than just focusing on GDP, / over 40 different sets of criteria from health, education and civil society engagement / have been measured / to get a more <span class=\"mask\">[xxx]</span> assessment of how countries are performing.</p>\n<p>顺着英文顺序读：</p>\n<p>最近一项年度研究，研究各国及其把增长转化为福祉的能力， / 给那个问题带来一些解释。 / 在被衡量的163个国家中， / 英国是表现最差的国家之一， / 在确保经济增长被 <span class=\"mask\">[xxx]</span> 为给公民带来的 <span class=\"mask\">[xxx]</span> 改善这件事上。 / 而不是仅仅关注GDP， / 来自健康、教育和公民社会参与的四十多组不同标准 / 已经被衡量， / 来获得一个更 <span class=\"mask\">[xxx]</span> 的评价，评价各国表现如何。</p>\n</blockquote>\n","articleRects":[[168,678,996,273]],"questionRects":[[188,792,801,32]],"scrollTarget":"auto","meta":{"kind":"question","qid":"33"}},{"section":"33题","raw":"### A. It excludes GDP as an indicator.\n\n> 它把GDP排除在指标之外\n\n把A接回题干，它说的是：最近这项年度研究把GDP排除在衡量指标之外。\n\nA的 `excludes GDP` 与第三段的 `Rather than just focusing on GDP` 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\n\n> Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more **[xxx]** assessment of how countries are performing.\n\n`Rather than just focusing on GDP` 否定的是just focusing，即“只关注GDP”。A的 `excludes GDP` 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\n\n段首还说研究各国把增长转成福祉的能力，经济增长与福祉都在讨论中。研究不是把增长赶出视野，而是问增长有没有带来人的改善。A看到了rather than，却漏了just，于是把不再局限于一个指标误写成彻底排除这个指标。\n\n**“不只盯着GDP”能不能翻成“完全排除GDP”？**\n\n不能。just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\n\nA把原文“不仅仅”的范围改成“完全不”，否定对象不同。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. It excludes GDP as an indicator.</h3>\n<blockquote>\n<p>它把GDP排除在指标之外</p>\n</blockquote>\n<p>把A接回题干，它说的是：最近这项年度研究把GDP排除在衡量指标之外。</p>\n<p>A的 <code>excludes GDP</code> 与第三段的 <code>Rather than just focusing on GDP</code> 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。</p>\n<blockquote>\n<p>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more <span class=\"mask\">[xxx]</span> assessment of how countries are performing.</p>\n</blockquote>\n<p><code>Rather than just focusing on GDP</code> 否定的是just focusing，即“只关注GDP”。A的 <code>excludes GDP</code> 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。</p>\n<p>段首还说研究各国把增长转成福祉的能力，经济增长与福祉都在讨论中。研究不是把增长赶出视野，而是问增长有没有带来人的改善。A看到了rather than，却漏了just，于是把不再局限于一个指标误写成彻底排除这个指标。</p>\n<p><strong>“不只盯着GDP”能不能翻成“完全排除GDP”？</strong></p>\n<p>不能。just限定的是关注范围单一，删去just才会变成对GDP本身的排除。</p>\n<p>A把原文“不仅仅”的范围改成“完全不”，否定对象不同。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,678,996,273]],"questionRects":[[188,792,801,32],[233,845,438,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `excludes GDP` 与第三段的 `Rather than just focusing on GDP` 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Rather than just focusing on GDP","visibleOptionAnchor":"excludes GDP"}}}},{"section":"33题","raw":"### B. It is sponsored by 163 countries.\n\n> 它由163个国家资助\n\n把B接回题干，它说的是：最近这项年度研究由163个国家出资支持。\n\nB的 `sponsored by 163 countries` 与第三段的 `the 163 countries measured` 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。\n\n> Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is **[xxx]** into **[xxx]** improvements for its citizens.\n\n`the 163 countries measured` 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 `sponsored by 163 countries` 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。\n\nAcross之后比较英国在这些国家中的表现，也进一步说明163是样本覆盖范围：作者在一个国家集合中作横向比较。原段没有说资金从哪里来、谁委托了研究、哪些国家共同组织。不能因为数目完全相同，就忽略数目前后的动作不同。\n\n**163个国家被研究衡量，是否等于163个国家共同赞助这项研究？**\n\n不等于。被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。\n\nB保留了数字却调换了国家在研究中的身份。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. It is sponsored by 163 countries.</h3>\n<blockquote>\n<p>它由163个国家资助</p>\n</blockquote>\n<p>把B接回题干，它说的是：最近这项年度研究由163个国家出资支持。</p>\n<p>B的 <code>sponsored by 163 countries</code> 与第三段的 <code>the 163 countries measured</code> 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。</p>\n<blockquote>\n<p>Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is <span class=\"mask\">[xxx]</span> into <span class=\"mask\">[xxx]</span> improvements for its citizens.</p>\n</blockquote>\n<p><code>the 163 countries measured</code> 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 <code>sponsored by 163 countries</code> 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。</p>\n<p>Across之后比较英国在这些国家中的表现，也进一步说明163是样本覆盖范围：作者在一个国家集合中作横向比较。原段没有说资金从哪里来、谁委托了研究、哪些国家共同组织。不能因为数目完全相同，就忽略数目前后的动作不同。</p>\n<p><strong>163个国家被研究衡量，是否等于163个国家共同赞助这项研究？</strong></p>\n<p>不等于。被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。</p>\n<p>B保留了数字却调换了国家在研究中的身份。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,678,996,273]],"questionRects":[[188,792,801,32],[233,898,437,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `sponsored by 163 countries` 与第三段的 `the 163 countries measured` 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"the 163 countries measured","visibleOptionAnchor":"sponsored by 163 countries"}}}},{"section":"33题","raw":"### C. Its criteria are questionable.\n\n> 它的标准值得怀疑\n\n把C接回题干，它说的是：最近这项年度研究所采用的标准值得怀疑。\n\nC的 `criteria are questionable` 评价研究标准不可靠，第三段的 `sheds some light on that question` 则说明研究对前面疑问的作用，因此把段首评价与段末列标准的部分一起看。\n\n> A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.\n>\n> Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more **[xxx]** assessment of how countries are performing.\n\n`sheds some light on that question` 说这项研究帮助解释了前面的问题。C的 `criteria are questionable` 却把怀疑落到研究的标准上。作者确实正在追问GDP作为尺度是否足够，但那不能自动变成“新研究采用的健康、教育等标准也可疑”。\n\n后半段是在说明研究扩展了哪些衡量项目，并没有逐项指出它们存在错误，也没有否定这些项目所得到的解释。把一个旧衡量方法受到质疑，与用于回答该质疑的新研究混在一起，便会把批评对象转错。这里作者借研究帮助理解英国表现，而不是接着拆穿这项研究。\n\n**作者正在质疑GDP是否足够，是否就等于他也质疑这项年度研究的标准？**\n\n不能。该研究被写成解释问题的材料，不是同一个受批评的对象。\n\nC把对GDP单一尺度的疑问移到了新研究标准上。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. Its criteria are questionable.</h3>\n<blockquote>\n<p>它的标准值得怀疑</p>\n</blockquote>\n<p>把C接回题干，它说的是：最近这项年度研究所采用的标准值得怀疑。</p>\n<p>C的 <code>criteria are questionable</code> 评价研究标准不可靠，第三段的 <code>sheds some light on that question</code> 则说明研究对前面疑问的作用，因此把段首评价与段末列标准的部分一起看。</p>\n<blockquote>\n<p>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.</p>\n<p>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more <span class=\"mask\">[xxx]</span> assessment of how countries are performing.</p>\n</blockquote>\n<p><code>sheds some light on that question</code> 说这项研究帮助解释了前面的问题。C的 <code>criteria are questionable</code> 却把怀疑落到研究的标准上。作者确实正在追问GDP作为尺度是否足够，但那不能自动变成“新研究采用的健康、教育等标准也可疑”。</p>\n<p>后半段是在说明研究扩展了哪些衡量项目，并没有逐项指出它们存在错误，也没有否定这些项目所得到的解释。把一个旧衡量方法受到质疑，与用于回答该质疑的新研究混在一起，便会把批评对象转错。这里作者借研究帮助理解英国表现，而不是接着拆穿这项研究。</p>\n<p><strong>作者正在质疑GDP是否足够，是否就等于他也质疑这项年度研究的标准？</strong></p>\n<p>不能。该研究被写成解释问题的材料，不是同一个受批评的对象。</p>\n<p>C把对GDP单一尺度的疑问移到了新研究标准上。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,678,996,273]],"questionRects":[[188,792,801,32],[233,951,378,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `criteria are questionable` 评价研究标准不可靠，第三段的 `sheds some light on that question` 则说明研究对前面疑问的作用，因此把段首评价与段末列标准的部分一起看。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"sheds some light on that question","visibleOptionAnchor":"criteria are questionable"}}}},{"section":"33题","raw":"### D. Its results are **[xxx]**.\n\n> 它的结果是 **[xxx]** 的\n\n把D接回题干，它说的是：最近这项年度研究得到的结果具有 **[xxx]** 的性质。\n\nD的 `Its results` 指研究发现，第三段的 `sheds some light on that question` 直接说研究能帮助理解前面的疑问，因此回看首句，再看英国的表现这一具体发现。\n\n> A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is **[xxx]** into **[xxx]** improvements for its citizens.\n\n`Its results` 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。`sheds some light on that question` 则说明这些发现为何被放到这里：第二段留下“数字好看却有很多人不接受现状”的疑问，研究从增长与福祉之间的关系提供了解释。\n\nD的评价词是 **[xxx]**，仍不能逐字补出。但是它至少没有说研究删除GDP、由样本国家资助或标准被否定。结合已经读到的研究用途，D是保留下来的对结果性质的概括。这里先理解结果在段落中帮助回答了什么，再决定它有没有与其余三项同样的对象错误。\n\n**原文是否明确说明这项研究能对前面的疑问提供解释，而非仅仅罗列163这个数字？**\n\n能。首句直接写sheds some light，随后用英国的具体表现展开这个解释。\n\nD保留；它所评价的研究结果确有本段的作用说明可接。\n\n**第一轮判断：D保留。**","contextRaw":"","html":"<h3>D. Its results are <span class=\"mask\">[xxx]</span>.</h3>\n<blockquote>\n<p>它的结果是 <span class=\"mask\">[xxx]</span> 的</p>\n</blockquote>\n<p>把D接回题干，它说的是：最近这项年度研究得到的结果具有 <span class=\"mask\">[xxx]</span> 的性质。</p>\n<p>D的 <code>Its results</code> 指研究发现，第三段的 <code>sheds some light on that question</code> 直接说研究能帮助理解前面的疑问，因此回看首句，再看英国的表现这一具体发现。</p>\n<blockquote>\n<p>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is <span class=\"mask\">[xxx]</span> into <span class=\"mask\">[xxx]</span> improvements for its citizens.</p>\n</blockquote>\n<p><code>Its results</code> 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。<code>sheds some light on that question</code> 则说明这些发现为何被放到这里：第二段留下“数字好看却有很多人不接受现状”的疑问，研究从增长与福祉之间的关系提供了解释。</p>\n<p>D的评价词是 <span class=\"mask\">[xxx]</span>，仍不能逐字补出。但是它至少没有说研究删除GDP、由样本国家资助或标准被否定。结合已经读到的研究用途，D是保留下来的对结果性质的概括。这里先理解结果在段落中帮助回答了什么，再决定它有没有与其余三项同样的对象错误。</p>\n<p><strong>原文是否明确说明这项研究能对前面的疑问提供解释，而非仅仅罗列163这个数字？</strong></p>\n<p>能。首句直接写sheds some light，随后用英国的具体表现展开这个解释。</p>\n<p>D保留；它所评价的研究结果确有本段的作用说明可接。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[168,678,996,273]],"questionRects":[[188,792,801,32],[233,1004,370,31]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `Its results` 指研究发现，第三段的 `sheds some light on that question` 直接说研究能帮助理解前面的疑问，因此回看首句，再看英国的表现这一具体发现。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"sheds some light on that question","visibleOptionAnchor":"Its results"}}}},{"section":"33题","raw":"### 33题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n> **33题选D。**","contextRaw":"","html":"<h3>33题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<blockquote>\n<p><strong>33题选D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,792,801,32]],"scrollTarget":"auto","meta":{"kind":"result","qid":"33"}},{"section":"34题","raw":"## 34题\n\n> In the last two paragraphs, the author suggests that ______.  \n> 在最后两段，作者提出什么建议？\n\n题干的last two paragraphs明确要求最后两段，也就是第六、七段。先分别完整读这两个自然段，再比较作者怎样从衡量问题接到政策做法；不能只读末句而漏掉前一段。\n\n> 原文参考：\n>\n> So, what Kennedy was referring to was that while GDP has been the most common method for measuring the economic activity of nations, as a measure, it is no longer enough. It does not include important factors such as **[xxx]** quality or education **[xxx]**—all things that contribute to a person’s sense of well-being.\n>\n> 开始精读：\n>\n> So, what Kennedy was referring to was / that while GDP has been the most common method / for measuring the economic activity of nations, / as a measure, it is no longer enough. / It does not include important factors / such as **[xxx]** quality or education **[xxx]**— / all things that contribute to a person’s sense of well-being.\n>\n> 顺着英文顺序读：\n>\n> 所以，肯尼迪所指的是， / 尽管GDP一直是最常见的方法 / 用来衡量各国的经济活动， / 作为一种衡量，它已经不够了。 / 它没有包括重要因素， / 比如 **[xxx]** 质量或者教育 **[xxx]**—— / 都是有助于一个人的幸福感的东西。\n\n> 原文参考：\n>\n> The **[xxx]** hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth. But policymakers who **[xxx]** efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted **[xxx]** and may even see progress.\n>\n> 开始精读：\n>\n> The **[xxx]** hit to growth / predicted around the world and in the UK / could lead to a decline in the everyday services / we depend on for our well-being and for growth. / But policymakers who **[xxx]** efforts on improving well-being / rather than simply worrying about GDP figures / could avoid the forecasted **[xxx]** / and may even see progress.\n>\n> 顺着英文顺序读：\n>\n> 对增长的 **[xxx]** 打击， / 在全世界和英国被预测到， / 可能导致日常服务的下降， / 我们为了福祉和增长而依赖的那些服务。 / 但是那些把努力 **[xxx]** 在改善福祉上的政策制定者， / 而不是仅仅担心GDP数字， / 可能避免被预测的 **[xxx]**， / 甚至可能看到进步。","contextRaw":"","html":"<h2>34题</h2>\n<blockquote>\n<p>In the last two paragraphs, the author suggests that ______.<br />\n在最后两段，作者提出什么建议？</p>\n</blockquote>\n<p>题干的last two paragraphs明确要求最后两段，也就是第六、七段。先分别完整读这两个自然段，再比较作者怎样从衡量问题接到政策做法；不能只读末句而漏掉前一段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>So, what Kennedy was referring to was that while GDP has been the most common method for measuring the economic activity of nations, as a measure, it is no longer enough. It does not include important factors such as <span class=\"mask\">[xxx]</span> quality or education <span class=\"mask\">[xxx]</span>—all things that contribute to a person’s sense of well-being.</p>\n<p>开始精读：</p>\n<p>So, what Kennedy was referring to was / that while GDP has been the most common method / for measuring the economic activity of nations, / as a measure, it is no longer enough. / It does not include important factors / such as <span class=\"mask\">[xxx]</span> quality or education <span class=\"mask\">[xxx]</span>— / all things that contribute to a person’s sense of well-being.</p>\n<p>顺着英文顺序读：</p>\n<p>所以，肯尼迪所指的是， / 尽管GDP一直是最常见的方法 / 用来衡量各国的经济活动， / 作为一种衡量，它已经不够了。 / 它没有包括重要因素， / 比如 <span class=\"mask\">[xxx]</span> 质量或者教育 <span class=\"mask\">[xxx]</span>—— / 都是有助于一个人的幸福感的东西。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>The <span class=\"mask\">[xxx]</span> hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth. But policymakers who <span class=\"mask\">[xxx]</span> efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted <span class=\"mask\">[xxx]</span> and may even see progress.</p>\n<p>开始精读：</p>\n<p>The <span class=\"mask\">[xxx]</span> hit to growth / predicted around the world and in the UK / could lead to a decline in the everyday services / we depend on for our well-being and for growth. / But policymakers who <span class=\"mask\">[xxx]</span> efforts on improving well-being / rather than simply worrying about GDP figures / could avoid the forecasted <span class=\"mask\">[xxx]</span> / and may even see progress.</p>\n<p>顺着英文顺序读：</p>\n<p>对增长的 <span class=\"mask\">[xxx]</span> 打击， / 在全世界和英国被预测到， / 可能导致日常服务的下降， / 我们为了福祉和增长而依赖的那些服务。 / 但是那些把努力 <span class=\"mask\">[xxx]</span> 在改善福祉上的政策制定者， / 而不是仅仅担心GDP数字， / 可能避免被预测的 <span class=\"mask\">[xxx]</span>， / 甚至可能看到进步。</p>\n</blockquote>\n","articleRects":[[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1109,782,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"34"}},{"section":"34题","raw":"### A. the UK is preparing for an economic boom\n\n> 英国正在为一场经济繁荣作准备\n\n把A接回题干，它说的是：作者在最后两段建议或表明，英国正在为经济繁荣作准备。\n\nA的 `an economic boom` 指经济繁荣，第七段的 `a decline in the everyday services` 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。\n\n> The **[xxx]** hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\n\n原文先说增长受打击，可能造成 `a decline in the everyday services`，与出现 `an economic boom` 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。\n\nA还加了is preparing for，要求英国已经在为繁荣准备。原文只是提出政策制定者可以怎样用力，并没有报道英国正在开展一套迎接繁荣的行动。不能把一种有条件的可能改善，扩大成国家正在准备的经济繁荣。\n\n**增长冲击下可能出现的政策改进，能不能改写为英国已在准备经济繁荣？**\n\n不能。原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\n\nA在经济方向、现实状态和结果程度上都过了头。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. the UK is preparing for an economic boom</h3>\n<blockquote>\n<p>英国正在为一场经济繁荣作准备</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者在最后两段建议或表明，英国正在为经济繁荣作准备。</p>\n<p>A的 <code>an economic boom</code> 指经济繁荣，第七段的 <code>a decline in the everyday services</code> 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。</p>\n<blockquote>\n<p>The <span class=\"mask\">[xxx]</span> hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.</p>\n</blockquote>\n<p>原文先说增长受打击，可能造成 <code>a decline in the everyday services</code>，与出现 <code>an economic boom</code> 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。</p>\n<p>A还加了is preparing for，要求英国已经在为繁荣准备。原文只是提出政策制定者可以怎样用力，并没有报道英国正在开展一套迎接繁荣的行动。不能把一种有条件的可能改善，扩大成国家正在准备的经济繁荣。</p>\n<p><strong>增长冲击下可能出现的政策改进，能不能改写为英国已在准备经济繁荣？</strong></p>\n<p>不能。原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。</p>\n<p>A在经济方向、现实状态和结果程度上都过了头。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1109,782,34],[233,1162,570,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `an economic boom` 指经济繁荣，第七段的 `a decline in the everyday services` 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","time","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"a decline in the everyday services","visibleOptionAnchor":"an economic boom"}}}},{"section":"34题","raw":"### B. it is **[xxx]** to consider factors beyond GDP\n\n> 考虑GDP以外的因素是 **[xxx]** 的\n\n把B接回题干，它说的是：作者在最后两段建议，考虑GDP之外的因素是 **[xxx]** 的。\n\nB的 `factors beyond GDP` 与第六段的 `It does not include important factors` 正好涉及被GDP遗漏的因素，因此回看作者先说够不够，再列遗漏内容的这两句。\n\n> as a measure, it is no longer enough. It does not include important factors such as **[xxx]** quality or education **[xxx]**—all things that contribute to a person’s sense of well-being.\n\n`factors beyond GDP` 可以接到 `It does not include important factors`：这些是GDP没有涵盖，却又影响幸福感的东西。作者还明确说it is no longer enough，先否定“GDP已经够用”，再解释为什么不够。B的动作consider，至少与作者把这些遗漏因素重新放进讨论相容。\n\n但it is后面的评价词 **[xxx]** 决定“考虑这些因素”在B中到底受到怎样的判断。不能因为作者说重要，就直接替它填一个熟悉形容词。现在B的对象和动作很贴近第六段；D又可能概括第七段政策怎样处理问题，两个层面还要分清。\n\n**作者已经说GDP不够并列出遗漏因素，是否就等于B整句话每一部分都已经读清？**\n\n还不能。考虑对象非常明确，但B的评价词仍未读清，暂时不能把完整判断直接定死。\n\nB先保留，因为它抓住了作者实际展开的遗漏因素。\n\n**第一轮判断：B保留。**","contextRaw":"","html":"<h3>B. it is <span class=\"mask\">[xxx]</span> to consider factors beyond GDP</h3>\n<blockquote>\n<p>考虑GDP以外的因素是 <span class=\"mask\">[xxx]</span> 的</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者在最后两段建议，考虑GDP之外的因素是 <span class=\"mask\">[xxx]</span> 的。</p>\n<p>B的 <code>factors beyond GDP</code> 与第六段的 <code>It does not include important factors</code> 正好涉及被GDP遗漏的因素，因此回看作者先说够不够，再列遗漏内容的这两句。</p>\n<blockquote>\n<p>as a measure, it is no longer enough. It does not include important factors such as <span class=\"mask\">[xxx]</span> quality or education <span class=\"mask\">[xxx]</span>—all things that contribute to a person’s sense of well-being.</p>\n</blockquote>\n<p><code>factors beyond GDP</code> 可以接到 <code>It does not include important factors</code>：这些是GDP没有涵盖，却又影响幸福感的东西。作者还明确说it is no longer enough，先否定“GDP已经够用”，再解释为什么不够。B的动作consider，至少与作者把这些遗漏因素重新放进讨论相容。</p>\n<p>但it is后面的评价词 <span class=\"mask\">[xxx]</span> 决定“考虑这些因素”在B中到底受到怎样的判断。不能因为作者说重要，就直接替它填一个熟悉形容词。现在B的对象和动作很贴近第六段；D又可能概括第七段政策怎样处理问题，两个层面还要分清。</p>\n<p><strong>作者已经说GDP不够并列出遗漏因素，是否就等于B整句话每一部分都已经读清？</strong></p>\n<p>还不能。考虑对象非常明确，但B的评价词仍未读清，暂时不能把完整判断直接定死。</p>\n<p>B先保留，因为它抓住了作者实际展开的遗漏因素。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1109,782,34],[233,1215,600,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `factors beyond GDP` 与第六段的 `It does not include important factors` 正好涉及被GDP遗漏的因素，因此回看作者先说够不够，再列遗漏内容的这两句。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"It does not include important factors","visibleOptionAnchor":"factors beyond GDP"}}}},{"section":"34题","raw":"### C. high GDP foreshadows an economic decline\n\n> 高GDP预示经济下滑\n\n把C接回题干，它说的是：作者在最后两段表明，高GDP预示着经济下滑。\n\nC的 `high GDP foreshadows` 把高GDP当作未来下滑的信号，第七段的 `hit to growth` 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。\n\n> The **[xxx]** hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\n\n`hit to growth` 是增长受到打击，后面could lead to接日常服务下降。C的 `high GDP foreshadows` 却让高GDP成为预示经济下滑的信号，主语、所接结果和关系都被改动。高增长数字未必反映生活很好，与高GDP会预示增长下滑，是两个不同判断。\n\n第六段说的是GDP作为衡量不够，因为没有包括影响福祉的重要因素；它并没有说GDP一高，经济就会开始走低。把“衡量不到生活质量”误读成“能够预报经济衰退”，恰好给GDP添上了原文从未给出的预测作用。\n\n**原文说增长受到打击可能影响日常服务，能否改成高GDP本身预示经济下滑？**\n\n不能。原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\n\nC把指标不足与经济趋势预测混在一起。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. high GDP foreshadows an economic decline</h3>\n<blockquote>\n<p>高GDP预示经济下滑</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者在最后两段表明，高GDP预示着经济下滑。</p>\n<p>C的 <code>high GDP foreshadows</code> 把高GDP当作未来下滑的信号，第七段的 <code>hit to growth</code> 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。</p>\n<blockquote>\n<p>The <span class=\"mask\">[xxx]</span> hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.</p>\n</blockquote>\n<p><code>hit to growth</code> 是增长受到打击，后面could lead to接日常服务下降。C的 <code>high GDP foreshadows</code> 却让高GDP成为预示经济下滑的信号，主语、所接结果和关系都被改动。高增长数字未必反映生活很好，与高GDP会预示增长下滑，是两个不同判断。</p>\n<p>第六段说的是GDP作为衡量不够，因为没有包括影响福祉的重要因素；它并没有说GDP一高，经济就会开始走低。把“衡量不到生活质量”误读成“能够预报经济衰退”，恰好给GDP添上了原文从未给出的预测作用。</p>\n<p><strong>原文说增长受到打击可能影响日常服务，能否改成高GDP本身预示经济下滑？</strong></p>\n<p>不能。原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。</p>\n<p>C把指标不足与经济趋势预测混在一起。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1109,782,34],[233,1268,579,31]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `high GDP foreshadows` 把高GDP当作未来下滑的信号，第七段的 `hit to growth` 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","causality","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"hit to growth","visibleOptionAnchor":"high GDP foreshadows"}}}},{"section":"34题","raw":"### D. it requires **[xxx]** to handle economic issues\n\n> 处理经济问题需要 **[xxx]**\n\n把D接回题干，它说的是：作者在最后两段建议，处理经济问题需要 **[xxx]**。\n\nD的 `handle economic issues` 谈政策如何处理经济问题，第七段的 `policymakers who` 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。\n\n> But policymakers who **[xxx]** efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted **[xxx]** and may even see progress.\n\n`policymakers who` 后面确实在谈政策制定者怎样投入努力，D的 `handle economic issues` 因而在人物活动上有联系。原文把improving well-being与simply worrying about GDP figures作对照，不是只给一个增长数字，而是在提出处理问题的方向。\n\nD的requires后面是 **[xxx]**，这个名词控制需要怎样做事。单看可读部分，它比B概括得宽，但宽并不自动等于错；如果该名词表达的处理要求能够包含原文的转向，就还可能接上。现在只能说D未明确点出遗漏因素或福祉，尚不能据此给那个名词补一种意思再排除。\n\n**原文正在谈政策制定者如何用力，能否仅因D说得较宽就立刻否定其尚未读清的处理要求？**\n\n还不能。它有政策做法这一联系，但要求的核心名词不清楚，还要判断全文究竟强调具体目标还是一般做法。\n\nD暂留，与B形成二选一，待全文中心明确后再检查两者的覆盖范围。\n\n**第一轮判断：D保留。**","contextRaw":"","html":"<h3>D. it requires <span class=\"mask\">[xxx]</span> to handle economic issues</h3>\n<blockquote>\n<p>处理经济问题需要 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把D接回题干，它说的是：作者在最后两段建议，处理经济问题需要 <span class=\"mask\">[xxx]</span>。</p>\n<p>D的 <code>handle economic issues</code> 谈政策如何处理经济问题，第七段的 <code>policymakers who</code> 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。</p>\n<blockquote>\n<p>But policymakers who <span class=\"mask\">[xxx]</span> efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted <span class=\"mask\">[xxx]</span> and may even see progress.</p>\n</blockquote>\n<p><code>policymakers who</code> 后面确实在谈政策制定者怎样投入努力，D的 <code>handle economic issues</code> 因而在人物活动上有联系。原文把improving well-being与simply worrying about GDP figures作对照，不是只给一个增长数字，而是在提出处理问题的方向。</p>\n<p>D的requires后面是 <span class=\"mask\">[xxx]</span>，这个名词控制需要怎样做事。单看可读部分，它比B概括得宽，但宽并不自动等于错；如果该名词表达的处理要求能够包含原文的转向，就还可能接上。现在只能说D未明确点出遗漏因素或福祉，尚不能据此给那个名词补一种意思再排除。</p>\n<p><strong>原文正在谈政策制定者如何用力，能否仅因D说得较宽就立刻否定其尚未读清的处理要求？</strong></p>\n<p>还不能。它有政策做法这一联系，但要求的核心名词不清楚，还要判断全文究竟强调具体目标还是一般做法。</p>\n<p>D暂留，与B形成二选一，待全文中心明确后再检查两者的覆盖范围。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1109,782,34],[233,1321,589,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `handle economic issues` 谈政策如何处理经济问题，第七段的 `policymakers who` 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"policymakers who","visibleOptionAnchor":"handle economic issues"}}}},{"section":"34题","raw":"### 34题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D保留。\n\n这一轮留下B和D，先继续做后面的题。","contextRaw":"","html":"<h3>34题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下B和D，先继续做后面的题。</p>\n","articleRects":[],"questionRects":[[188,1109,782,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n**Which of the following is the best title for the text?**\n\n下列哪一项最适合作为本文的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Brexit, the UK’s Gateway to Well-being**\n\n英国脱欧，英国通向福祉的大门\n\nB. **Robert F. Kennedy, a Terminator of GDP**\n\n罗伯特·F.肯尼迪，GDP的终结者\n\nC. **High GDP But Inadequate Well-being, a UK Lesson**\n\n高GDP却福祉不足，英国的一课\n\nD. **GDP Figures, a Window on Global Economic Health**\n\nGDP数字，观察全球经济健康的窗口","contextRaw":"","html":"<h2>35题</h2>\n<p><strong>Which of the following is the best title for the text?</strong></p>\n<p>下列哪一项最适合作为本文的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Brexit, the UK’s Gateway to Well-being</strong></p>\n<p>英国脱欧，英国通向福祉的大门</p>\n<p>B. <strong>Robert F. Kennedy, a Terminator of GDP</strong></p>\n<p>罗伯特·F.肯尼迪，GDP的终结者</p>\n<p>C. <strong>High GDP But Inadequate Well-being, a UK Lesson</strong></p>\n<p>高GDP却福祉不足，英国的一课</p>\n<p>D. <strong>GDP Figures, a Window on Global Economic Health</strong></p>\n<p>GDP数字，观察全球经济健康的窗口</p>\n","articleRects":[],"questionRects":[[188,1426,685,27]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"35"}},{"section":"35题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。 | 先说一句话带出的疑问 |\n| 2 | 对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。 | 再把眼前的反差拿来追问 |\n| 3 | 引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。 | 接着拿一项调查作解释 |\n| 4 | 把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。 | 然后换几种情况放在一起看 |\n| 5 | 提醒富国：不再把GDP置于原来那个衡量位置，看到的国家成功景象会不同。 | 再把前面的比较变成提醒 |\n| 6 | 回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。 | 接着回到开头说清真正的问题 |\n| 7 | 说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。 | 最后说应该把力气放在哪里 |","contextRaw":"","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。</td>\n  <td>先说一句话带出的疑问</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。</td>\n  <td>再把眼前的反差拿来追问</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。</td>\n  <td>接着拿一项调查作解释</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。</td>\n  <td>然后换几种情况放在一起看</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>提醒富国：不再把GDP置于原来那个衡量位置，看到的国家成功景象会不同。</td>\n  <td>再把前面的比较变成提醒</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。</td>\n  <td>接着回到开头说清真正的问题</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。</td>\n  <td>最后说应该把力气放在哪里</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[168,239,996,151],[168,398,997,273],[168,678,996,273],[167,958,999,233],[168,1198,997,72],[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1426,685,27]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"35","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"35题","raw":"### A. Brexit, the UK’s Gateway to Well-being\n\n> 英国脱欧，英国通向福祉的大门\n\n如果A是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先把脱欧作为英国获得幸福的机会提出。 | 先说一句话带出的疑问 |\n| 2 | 再说明留在原有状态为什么妨碍英国人幸福，脱欧为何回应这一需求。 | 再把眼前的反差拿来追问 |\n| 3 | 接着拿研究证明脱欧能够提高生活福祉。 | 接着拿一项调查作解释 |\n| 4 | 然后比较脱欧与未脱欧国家的福祉变化。 | 然后换几种情况放在一起看 |\n| 5 | 再将比较归结为脱欧是改善生活的一课。 | 再把前面的比较变成提醒 |\n| 6 | 接着解释脱欧怎样弥补GDP不足。 | 接着回到开头说清真正的问题 |\n| 7 | 最后主张靠脱欧这条道路实现更好生活。 | 最后说应该把力气放在哪里 |\n\nA把Brexit写成Gateway，意思是脱欧本身能把英国带向福祉。文章确实由脱欧切入，也确实把福祉作为后面的关注对象，但这两个名词出现在同一篇里，不代表作者建立了“脱欧带来福祉”的正面因果。第一段反而提GDP被预测放缓，最后一段也讨论增长受到打击可能使服务下降。\n\n第三段研究比较的是各国将增长转成公民改善的能力，不是脱欧前后生活质量的实验；第四段也不是按是否脱欧分组。因此A的第三、四行会要求文章提供根本没有提供的比较。\n\n**借脱欧选择提出GDP的问题，能不能改写成作者主张脱欧是幸福之门？**\n\n不能。脱欧是引出反差的事件，不是被证实能提升福祉的办法，A排除。","contextRaw":"","html":"<h3>A. Brexit, the UK’s Gateway to Well-being</h3>\n<blockquote>\n<p>英国脱欧，英国通向福祉的大门</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先把脱欧作为英国获得幸福的机会提出。</td>\n  <td>先说一句话带出的疑问</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明留在原有状态为什么妨碍英国人幸福，脱欧为何回应这一需求。</td>\n  <td>再把眼前的反差拿来追问</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着拿研究证明脱欧能够提高生活福祉。</td>\n  <td>接着拿一项调查作解释</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后比较脱欧与未脱欧国家的福祉变化。</td>\n  <td>然后换几种情况放在一起看</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再将比较归结为脱欧是改善生活的一课。</td>\n  <td>再把前面的比较变成提醒</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>接着解释脱欧怎样弥补GDP不足。</td>\n  <td>接着回到开头说清真正的问题</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后主张靠脱欧这条道路实现更好生活。</td>\n  <td>最后说应该把力气放在哪里</td>\n</tr>\n</tbody>\n</table>\n<p>A把Brexit写成Gateway，意思是脱欧本身能把英国带向福祉。文章确实由脱欧切入，也确实把福祉作为后面的关注对象，但这两个名词出现在同一篇里，不代表作者建立了“脱欧带来福祉”的正面因果。第一段反而提GDP被预测放缓，最后一段也讨论增长受到打击可能使服务下降。</p>\n<p>第三段研究比较的是各国将增长转成公民改善的能力，不是脱欧前后生活质量的实验；第四段也不是按是否脱欧分组。因此A的第三、四行会要求文章提供根本没有提供的比较。</p>\n<p><strong>借脱欧选择提出GDP的问题，能不能改写成作者主张脱欧是幸福之门？</strong></p>\n<p>不能。脱欧是引出反差的事件，不是被证实能提升福祉的办法，A排除。</p>\n","articleRects":[[168,239,996,151],[168,398,997,273],[168,678,996,273],[167,958,999,233],[168,1198,997,72],[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1426,685,27],[233,1479,543,32]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"A"}},{"section":"35题","raw":"### B. Robert F. Kennedy, a Terminator of GDP\n\n> 罗伯特·F.肯尼迪，GDP的终结者\n\n如果B是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先以肯尼迪为中心，提出他将终结GDP的观点。 | 先说一句话带出的疑问 |\n| 2 | 再说明他如何批评并否定GDP的存在。 | 再把眼前的反差拿来追问 |\n| 3 | 接着用调查支持彻底弃用GDP。 | 接着拿一项调查作解释 |\n| 4 | 然后比较不再使用GDP的国家与继续使用者。 | 然后换几种情况放在一起看 |\n| 5 | 再提出所有国家应结束GDP衡量。 | 再把前面的比较变成提醒 |\n| 6 | 接着回到肯尼迪的个人作用，强调他终结旧指标。 | 接着回到开头说清真正的问题 |\n| 7 | 最后要求废除GDP而不是只作补充。 | 最后说应该把力气放在哪里 |\n\nB的Terminator很强，要求肯尼迪不仅批评GDP，而且是把GDP终结掉的人。原文开头借他说话，第六段再解释其所指，确实有首尾照应；但这并不使整篇变成人物文章。中间的英国选择、年度研究与国家比较，都在讨论衡量标准与生活改善，不在介绍肯尼迪如何推动一项制度结束。\n\n尤其第六段承认GDP是衡量经济活动最常用的方法，然后说as a measure it is no longer enough。不够全面需要看更多因素，并不等于必须终结GDP。第三段的Rather than just focusing也是否定只看它，而非排除它。\n\n**GDP作为单一尺度不够用，是否就意味着作者让肯尼迪充当GDP的终结者？**\n\n不能。B既把引语人物抬成中心，也把不足扩大成彻底终结，排除。","contextRaw":"","html":"<h3>B. Robert F. Kennedy, a Terminator of GDP</h3>\n<blockquote>\n<p>罗伯特·F.肯尼迪，GDP的终结者</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先以肯尼迪为中心，提出他将终结GDP的观点。</td>\n  <td>先说一句话带出的疑问</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明他如何批评并否定GDP的存在。</td>\n  <td>再把眼前的反差拿来追问</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着用调查支持彻底弃用GDP。</td>\n  <td>接着拿一项调查作解释</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后比较不再使用GDP的国家与继续使用者。</td>\n  <td>然后换几种情况放在一起看</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再提出所有国家应结束GDP衡量。</td>\n  <td>再把前面的比较变成提醒</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>接着回到肯尼迪的个人作用，强调他终结旧指标。</td>\n  <td>接着回到开头说清真正的问题</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求废除GDP而不是只作补充。</td>\n  <td>最后说应该把力气放在哪里</td>\n</tr>\n</tbody>\n</table>\n<p>B的Terminator很强，要求肯尼迪不仅批评GDP，而且是把GDP终结掉的人。原文开头借他说话，第六段再解释其所指，确实有首尾照应；但这并不使整篇变成人物文章。中间的英国选择、年度研究与国家比较，都在讨论衡量标准与生活改善，不在介绍肯尼迪如何推动一项制度结束。</p>\n<p>尤其第六段承认GDP是衡量经济活动最常用的方法，然后说as a measure it is no longer enough。不够全面需要看更多因素，并不等于必须终结GDP。第三段的Rather than just focusing也是否定只看它，而非排除它。</p>\n<p><strong>GDP作为单一尺度不够用，是否就意味着作者让肯尼迪充当GDP的终结者？</strong></p>\n<p>不能。B既把引语人物抬成中心，也把不足扩大成彻底终结，排除。</p>\n","articleRects":[[168,239,996,151],[168,398,997,273],[168,678,996,273],[167,958,999,233],[168,1198,997,72],[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1426,685,27],[233,1532,565,26]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"B"}},{"section":"35题","raw":"### C. High GDP But Inadequate Well-being, a UK Lesson\n\n> 高GDP却福祉不足，英国的一课\n\n如果C是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先指出GDP与使生活值得过的内容之间存在遗漏。 | 先说一句话带出的疑问 |\n| 2 | 再用英国数字好看却不能解释人的选择，突出增长与生活感受的反差。 | 再把眼前的反差拿来追问 |\n| 3 | 接着用研究说明英国把增长转成福祉的表现不足。 | 接着拿一项调查作解释 |\n| 4 | 然后比较其他国家，说明GDP较低也可能有生活改善。 | 然后换几种情况放在一起看 |\n| 5 | 再提醒富国不能把GDP当作足够的成功尺度。 | 再把前面的比较变成提醒 |\n| 6 | 接着明确GDP遗漏影响幸福的重要内容。 | 接着回到开头说清真正的问题 |\n| 7 | 最后要求政策更关注福祉，而非只看增长数字。 | 最后说应该把力气放在哪里 |\n\nC中的High GDP But Inadequate Well-being保留了全文最重要的反差：漂亮的增长数字并不能保证生活改善充分。a UK Lesson又说明英国不是全部研究对象，而是用来给读者和其他富国提供提醒的案例。这样既可以放进英国的具体材料，也能容纳后面的多国比较。\n\n第一、二段提出问题，第三、四段用研究与国家差异解释，第五段明确说rich countries can learn，第六段概括GDP为何不够，第七段转到政策应该关注的福祉。C无需把任何一大段的对象改成脱欧优越性、人物成就或GDP万能。\n\n**C能否同时覆盖“英国反差”“多国研究”“不能只看GDP”和“改进福祉的建议”？**\n\n能。四者都是增长数字不等于充分生活改善这一提醒的不同层次。C保留。","contextRaw":"","html":"<h3>C. High GDP But Inadequate Well-being, a UK Lesson</h3>\n<blockquote>\n<p>高GDP却福祉不足，英国的一课</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先指出GDP与使生活值得过的内容之间存在遗漏。</td>\n  <td>先说一句话带出的疑问</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再用英国数字好看却不能解释人的选择，突出增长与生活感受的反差。</td>\n  <td>再把眼前的反差拿来追问</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着用研究说明英国把增长转成福祉的表现不足。</td>\n  <td>接着拿一项调查作解释</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后比较其他国家，说明GDP较低也可能有生活改善。</td>\n  <td>然后换几种情况放在一起看</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再提醒富国不能把GDP当作足够的成功尺度。</td>\n  <td>再把前面的比较变成提醒</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>接着明确GDP遗漏影响幸福的重要内容。</td>\n  <td>接着回到开头说清真正的问题</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求政策更关注福祉，而非只看增长数字。</td>\n  <td>最后说应该把力气放在哪里</td>\n</tr>\n</tbody>\n</table>\n<p>C中的High GDP But Inadequate Well-being保留了全文最重要的反差：漂亮的增长数字并不能保证生活改善充分。a UK Lesson又说明英国不是全部研究对象，而是用来给读者和其他富国提供提醒的案例。这样既可以放进英国的具体材料，也能容纳后面的多国比较。</p>\n<p>第一、二段提出问题，第三、四段用研究与国家差异解释，第五段明确说rich countries can learn，第六段概括GDP为何不够，第七段转到政策应该关注的福祉。C无需把任何一大段的对象改成脱欧优越性、人物成就或GDP万能。</p>\n<p><strong>C能否同时覆盖“英国反差”“多国研究”“不能只看GDP”和“改进福祉的建议”？</strong></p>\n<p>能。四者都是增长数字不等于充分生活改善这一提醒的不同层次。C保留。</p>\n","articleRects":[[168,239,996,151],[168,398,997,273],[168,678,996,273],[167,958,999,233],[168,1198,997,72],[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1426,685,27],[233,1585,689,32]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"C"}},{"section":"35题","raw":"### D. GDP Figures, a Window on Global Economic Health\n\n> GDP数字，观察全球经济健康的窗口\n\n如果D是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先提出GDP数字能帮助观察全球经济健康。 | 先说一句话带出的疑问 |\n| 2 | 再用英国数字展示这种观察的有效性。 | 再把眼前的反差拿来追问 |\n| 3 | 接着用国际研究验证GDP可以可靠衡量国家表现。 | 接着拿一项调查作解释 |\n| 4 | 然后比较各国GDP并由此判断经济健康。 | 然后换几种情况放在一起看 |\n| 5 | 再总结这种数字窗口值得继续采用。 | 再把前面的比较变成提醒 |\n| 6 | 接着回应对GDP的疑问，重申它足够重要和全面。 | 接着回到开头说清真正的问题 |\n| 7 | 最后要求政策继续依靠GDP来判断整体状况。 | 最后说应该把力气放在哪里 |\n\nD把GDP写成观察Global Economic Health的窗口，整篇若照此发展，应该不断验证GDP作为观察工具的有效性。实际第二段追问好看数字为何解释不了人的选择，第三段用GDP以外的四十多组标准补充，第六段明说no longer enough。它们并不是在展示GDP这一窗口有多可靠。\n\n经济活动的多少与人的福祉不是相同对象。原文承认GDP常用于测量经济活动，但正因为文章需要看健康、教育等被它漏掉的东西，才展开后面分析。D保留了一个高频名词，却削掉了作者对该名词适用范围的质疑，也漏掉英国教训和福祉方向。\n\n**一篇反复说明GDP不够的文章，能否概括成赞示GDP数字观察整体健康的功能？**\n\n不能。D把受检验的尺度写成足够的观察依据，整体方向不合，排除。","contextRaw":"","html":"<h3>D. GDP Figures, a Window on Global Economic Health</h3>\n<blockquote>\n<p>GDP数字，观察全球经济健康的窗口</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先提出GDP数字能帮助观察全球经济健康。</td>\n  <td>先说一句话带出的疑问</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再用英国数字展示这种观察的有效性。</td>\n  <td>再把眼前的反差拿来追问</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着用国际研究验证GDP可以可靠衡量国家表现。</td>\n  <td>接着拿一项调查作解释</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后比较各国GDP并由此判断经济健康。</td>\n  <td>然后换几种情况放在一起看</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再总结这种数字窗口值得继续采用。</td>\n  <td>再把前面的比较变成提醒</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>接着回应对GDP的疑问，重申它足够重要和全面。</td>\n  <td>接着回到开头说清真正的问题</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求政策继续依靠GDP来判断整体状况。</td>\n  <td>最后说应该把力气放在哪里</td>\n</tr>\n</tbody>\n</table>\n<p>D把GDP写成观察Global Economic Health的窗口，整篇若照此发展，应该不断验证GDP作为观察工具的有效性。实际第二段追问好看数字为何解释不了人的选择，第三段用GDP以外的四十多组标准补充，第六段明说no longer enough。它们并不是在展示GDP这一窗口有多可靠。</p>\n<p>经济活动的多少与人的福祉不是相同对象。原文承认GDP常用于测量经济活动，但正因为文章需要看健康、教育等被它漏掉的东西，才展开后面分析。D保留了一个高频名词，却削掉了作者对该名词适用范围的质疑，也漏掉英国教训和福祉方向。</p>\n<p><strong>一篇反复说明GDP不够的文章，能否概括成赞示GDP数字观察整体健康的功能？</strong></p>\n<p>不能。D把受检验的尺度写成足够的观察依据，整体方向不合，排除。</p>\n","articleRects":[[168,239,996,151],[168,398,997,273],[168,678,996,273],[167,958,999,233],[168,1198,997,72],[168,1278,998,192],[168,1478,997,192]],"questionRects":[[188,1426,685,27],[233,1638,697,31]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"D"}},{"section":"35题","raw":"### 35题主旨结果\n\n四项与全文的展开逐段比较后，C能够保留文章最后落实的判断。\n\n> **35题选C。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**High GDP But Inadequate Well-being, a UK Lesson / 高GDP却福祉不足，英国的一课**","contextRaw":"","html":"<h3>35题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，C能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>35题选C。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>High GDP But Inadequate Well-being, a UK Lesson / 高GDP却福祉不足，英国的一课</strong></p>\n","articleRects":[],"questionRects":[[188,1426,685,27],[233,1585,689,32]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"35"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","contextRaw":"","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查34题：B还是D？\n\n第一遍留下：\n\n- B. it is **[xxx]** to consider factors beyond GDP\n- D. it requires **[xxx]** to handle economic issues\n\n主旨底牌是：\n\n> **High GDP But Inadequate Well-being, a UK Lesson / 高GDP却福祉不足，英国的一课**\n\n也就是：英国这一案例提醒我们，增长数字好看并不保证福祉充分，政策必须把GDP之外影响生活的因素重新放进考虑。\n\n第一遍读最后两段时，B的factors beyond GDP能接到GDP遗漏important factors，D的handle economic issues能接到政策制定者
