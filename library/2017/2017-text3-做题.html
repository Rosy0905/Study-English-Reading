<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","contextRaw":"","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","contextRaw":"","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"### 31. Robert F. Kennedy is cited because he ______.\n\n引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？\n\n这一题问：例子作用题。","contextRaw":"","html":"<h3>31. Robert F. Kennedy is cited because he ______.</h3>\n<p>引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？</p>\n<p>这一题问：例子作用题。</p>\n","articleRects":[],"questionRects":[[188,158,633,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"### 32. It can be inferred from Paragraph 2 that ______.\n\n从第二段可以推知什么？\n\n这一题问：推断题。","contextRaw":"","html":"<h3>32. It can be inferred from Paragraph 2 that ______.</h3>\n<p>从第二段可以推知什么？</p>\n<p>这一题问：推断题。</p>\n","articleRects":[],"questionRects":[[188,475,643,32]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"### 33. Which of the following is true about the recent annual study?\n\n关于最近的年度研究，下列哪一项正确？\n\n这一题问：细节题。","contextRaw":"","html":"<h3>33. Which of the following is true about the recent annual study?</h3>\n<p>关于最近的年度研究，下列哪一项正确？</p>\n<p>这一题问：细节题。</p>\n","articleRects":[],"questionRects":[[188,792,801,32]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"### 34. In the last two paragraphs, the author suggests that ______.\n\n在最后两段，作者提出什么建议？\n\n这一题问：作者观点题。","contextRaw":"","html":"<h3>34. In the last two paragraphs, the author suggests that ______.</h3>\n<p>在最后两段，作者提出什么建议？</p>\n<p>这一题问：作者观点题。</p>\n","articleRects":[],"questionRects":[[188,1109,782,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"### 35. Which of the following is the best title for the text?\n\n下列哪一项最适合作为本文的标题？\n\n这一题问：全文作者观点 / 全文主旨题。","contextRaw":"","html":"<h3>35. Which of the following is the best title for the text?</h3>\n<p>下列哪一项最适合作为本文的标题？</p>\n<p>这一题问：全文作者观点 / 全文主旨题。</p>\n","articleRects":[],"questionRects":[[188,1426,685,27]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | except, If, Rather than, Yet, But |\n| 态度词 / 评价词 | 先抓个大概好坏 | do not matter, poorest, no longer enough |\n| 动作词 | 先看谁做了什么 | measures, misses, convert, improve |\n| 结果词 | 看最后出了什么事 | high growth, improvements, progress |\n| 重复主题词 | 大概知道老在说什么 | GDP, UK, growth, well-being |","contextRaw":"","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>except, If, Rather than, Yet, But</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>do not matter, poorest, no longer enough</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>measures, misses, convert, improve</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>high growth, improvements, progress</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>GDP, UK, growth, well-being</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"Robert F. Kennedy once said that a country’s GDP measures “everything ex 担心、国内生产总值数字、甚至取得进展。","contextRaw":"1、罗伯特·肯尼迪、曾经说过、一国国内生产总值、英国投票离开、欧盟、预计放缓。\n\n2、国内生产总值及其用途、半个多世纪、不重要、英国国内生产总值、低失业率、高增长数字。\n\n3、年度研究、把增长转化为福祉、一百六十三个国家、英国、表现最差者、健康与教育、公民社会参与。\n\n4、各自挑战、一致主题、经济复苏、健康与教育、主要经济体、巨大改善、环境。\n\n5、一课、富国、国家成功。\n\n6、肯尼迪、最常用方法、经济活动、已经不够、重要因素。","html":"<div class=\"coarseStack\"><div class=\"coarseDone\"><p>1、罗伯特·肯尼迪、曾经说过、一国国内生产总值、英国投票离开、欧盟、预计放缓。</p>\n</div><div class=\"coarseDone\"><p>2、国内生产总值及其用途、半个多世纪、不重要、英国国内生产总值、低失业率、高增长数字。</p>\n</div><div class=\"coarseDone\"><p>3、年度研究、把增长转化为福祉、一百六十三个国家、英国、表现最差者、健康与教育、公民社会参与。</p>\n</div><div class=\"coarseDone\"><p>4、各自挑战、一致主题、经济复苏、健康与教育、主要经济体、巨大改善、环境。</p>\n</div><div class=\"coarseDone\"><p>5、一课、富国、国家成功。</p>\n</div><div class=\"coarseDone\"><p>6、肯尼迪、最常用方法、经济活动、已经不够、重要因素。</p>\n</div><div class=\"coarsePara currentFocus\"><p>7、全球、英国、日常服务、我们的福祉、改善福祉、而不是只担心、国内生产总值数字、甚至取得进展。</p>\n</div></div>","articleRects":[[168,1478,997,192]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","coarse":true,"pid":6,"form":3}},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，等题目问到某个对象时能较快回到它所在的位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现肯尼迪、国内生产总值、英国投票离开欧盟；中间有低失业率、高增长数字、年度研究、把增长转化为福祉、健康与教育；后面又有富国、重要因素、日常服务、改善福祉、取得进展。\n\n到这里还不能自然地说清楚：经济数字好与投票选择为什么放在一起、研究究竟比较什么、不同国家之间的差别怎样解释、最后要改进的是哪一方面。这些碎片暂时只帮助认出谈到了哪些事情；它们之间的关系，等题目问到时再回去读。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。","contextRaw":"","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，等题目问到某个对象时能较快回到它所在的位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现肯尼迪、国内生产总值、英国投票离开欧盟；中间有低失业率、高增长数字、年度研究、把增长转化为福祉、健康与教育；后面又有富国、重要因素、日常服务、改善福祉、取得进展。</p>\n<p>到这里还不能自然地说清楚：经济数字好与投票选择为什么放在一起、研究究竟比较什么、不同国家之间的差别怎样解释、最后要改进的是哪一方面。这些碎片暂时只帮助认出谈到了哪些事情；它们之间的关系，等题目问到时再回去读。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","contextRaw":"","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> Robert F. Kennedy is cited because he ______.  \n> 引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？\n\n题干直接给出Robert F. Kennedy，第一段开头就出现这个人名。问的是作者为什么引用他，所以先读第一段；再把相邻的第二段完整读下来，看作者接着如何处理这一观点，避免只凭引语猜作者立场。\n\n> 原文参考：\n>\n> Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.” With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a **[xxx]** moment to **[xxx]** what he was referring to.\n>\n> 开始精读：\n>\n> Robert F. Kennedy once said / that a country’s GDP measures “everything except that which makes life worthwhile.” / With Britain voting to leave the European Union, / and GDP already predicted to slow as a result, / it is now a **[xxx]** moment / to **[xxx]** what he was referring to.\n>\n> 顺着英文顺序读：\n>\n> 罗伯特·F.肯尼迪曾经说 / 一个国家的GDP衡量“一切，除了使生活值得过的那些东西”。 / 随着英国投票离开欧盟， / 而GDP已经被预测会因此放缓， / 现在是一个 **[xxx]** 的时刻， / 去 **[xxx]** 他所指的是什么。\n\n> 原文参考：\n>\n> The question of GDP and its usefulness has **[xxx]** policymakers for over half a century. Many argue that it is a **[xxx]** concept. It measures things that do not matter and misses things that do. By most recent measures, the UK’s GDP has been the **[xxx]** of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country’s economic prospects?\n>\n> 开始精读：\n>\n> The question of GDP and its usefulness has **[xxx]** policymakers for over half a century. / Many argue that it is a **[xxx]** concept. / It measures things that do not matter / and misses things that do. / By most recent measures, / the UK’s GDP has been the **[xxx]** of the Western world, / with record low unemployment and high growth figures. / If everything was going so well, / then why did over 17 million people vote for Brexit, / despite the warnings about what it could do to their country’s economic prospects?\n>\n> 顺着英文顺序读：\n>\n> GDP及其有用性这个问题已经 **[xxx]** 政策制定者超过半个世纪了。 / 许多人认为它是一个 **[xxx]** 的概念。 / 它衡量那些不重要的东西 / 却漏掉那些重要的东西。 / 按照最近的大多数衡量， / 英国的GDP一直是西方世界的 **[xxx]**， / 伴随着创纪录的低失业率和高增长数字。 / 如果一切都进展得这么好， / 那为什么一千七百多万人投票支持英国脱欧， / 尽管有人警告这可能给他们国家的经济前景带来什么？","contextRaw":"","html":"<h2>31题</h2>\n<blockquote>\n<p>Robert F. Kennedy is cited because he ______.<br />\n引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？</p>\n</blockquote>\n<p>题干直接给出Robert F. Kennedy，第一段开头就出现这个人名。问的是作者为什么引用他，所以先读第一段；再把相邻的第二段完整读下来，看作者接着如何处理这一观点，避免只凭引语猜作者立场。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Robert F. Kennedy once said that a country’s GDP measures “everything except that which makes life worthwhile.” With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a
