 图表题 | The figures reveal unequal access to the same public service. | 这些数据揭示获得同一公共服务的机会不均等。 |\n| 图表题 | Public demand for transparent decisions rose during the period. | 这一时期公众对透明决策的需求上升。 |\n| **文本评论题** | **The passage distinguishes a legal judgement from an ethical evaluation.** | **短文区分法律判断与道德评价。** |\n| 文本评论题 | The author supports A while insisting on safeguards against unfair treatment. | 作者支持A，同时坚持设立防止不公平待遇的保障。 |\n| 文本评论题 | The discussion connects public responsibility with the equal worth of individuals. | 讨论将公共责任与个人的平等价值联系起来。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture contrasts privileged access with equal treatment.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画将特权接触与平等对待作对比。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is listening to B while remaining accountable to the wider public.\u003c/td>\n\u003ctd>A正倾听B，同时仍须向更广大公众负责。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene draws attention to the difference between personal favour and public duty.\u003c/td>\n\u003ctd>画面提醒人们区分私人偏袒与公共职责。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The proportion of people expressing trust in A increased from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>表示信任A的人群比例由X升至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures reveal unequal access to the same public service.\u003c/td>\n\u003ctd>这些数据揭示获得同一公共服务的机会不均等。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Public demand for transparent decisions rose during the period.\u003c/td>\n\u003ctd>这一时期公众对透明决策的需求上升。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage distinguishes a legal judgement from an ethical evaluation.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文区分法律判断与道德评价。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author supports A while insisting on safeguards against unfair treatment.\u003c/td>\n\u003ctd>作者支持A，同时坚持设立防止不公平待遇的保障。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion connects public responsibility with the equal worth of individuals.\u003c/td>\n\u003ctd>讨论将公共责任与个人的平等价值联系起来。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Allowing Supporters to Purchase Decisions\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Drawing a Boundary around Official Acts\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. A Limited Ruling with a Larger Democratic Meaning\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Making Every Gift Legally Harmless\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Why Representatives Must Still Hear People\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Transparency as a Condition of Equal Access\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Disapproval Is Not the Same as a Criminal Test\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A court can find conduct unattractive while rejecting the legal reasoning used to convict someone. These judgements address different questions. The first concerns what citizens should admire or condemn; the second concerns whether a defined offence has been proved under the applicable rules. Confusing them can make a narrow legal decision appear to endorse behaviour it actually criticises. A careful reading keeps the expression of disgust separate from the test required for criminal punishment.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>The phrase official act matters because not every contact with a public official is a decision on public business. Arranging a meeting may provide access without settling a particular issue. A criminal case must therefore identify the relevant action and the benefit connected to it, rather than treating every unpleasant exchange as identical. Defining the boundary carefully protects the force of the law by making clear what must actually be demonstrated.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>Representative government depends on officials receiving information from the people they serve. Constituents may ask for help with complicated procedures or bring a neglected concern to attention. If every response automatically threatened a bribery prosecution, ordinary representation would become difficult. This does not grant supporters a right to whatever they request. It explains why listening and assistance must remain possible while improper exchanges are still subject to legal scrutiny.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>The ability to hear people fairly depends on public visibility. Meeting records, lobbying rules and information about financial interests can make preferential access harder to hide. Such safeguards matter because an official should not offer a special hearing merely because someone has made a gift or contribution. Transparency is therefore connected to equality: citizens need ways to see whether the access promised by representative government is being distributed on an improper basis.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>A precise criminal boundary and a demanding ethical standard can support each other. The law should identify offences clearly, while citizens should insist that public service respects their equal worth. Neither aim is fulfilled by a system in which connections can simply be bought. A ruling that preserves legitimate representation can thus be welcomed without treating all favouritism as acceptable. Its larger value depends on combining legal clarity with transparent and accountable government.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>An official may accept gifts in circumstances that the public finds deeply unattractive. A court reviewing a conviction must nevertheless ask a more specific question: whether the conduct meets the legal definition of the crime charged. Moral disapproval and that legal test should not be treated as interchangeable.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>A meeting, for example, can allow a constituent to explain a bureaucratic problem without guaranteeing the decision that person wants. Officials need to be able to hear such concerns. Otherwise a rule intended to prevent bribery could also obstruct the ordinary exchanges through which representative government functions.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>A healthy democracy rests on the equal worth of its members. The belief that official connections are for sale undermines that principle and weakens trust. Citizens therefore have reason to demand standards of integrity that work alongside precise criminal rules rather than using either as a substitute for the other.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>The legal test may turn on what counts as an official act. A decision on a particular public matter differs from simply arranging an introduction or a meeting. Evidence must establish the relevant act and its connection to a benefit, rather than rely only on the unpleasant appearance of a relationship.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>Representative government, however, does not promise privileged access to whoever gives the most. If listening is a public duty, the opportunity to be heard should not depend on a gift or campaign contribution. Protecting legitimate contact consequently makes safeguards against preferential treatment more, not less, important.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Visibility can expose a troubling difference between the treatment of an ordinary citizen and that of a wealthy supporter. Even where a criminal charge cannot be proved, that difference may deserve criticism and political consequences. A lawful boundary is not a complete description of the conduct a healthy democracy should expect.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>These safeguards include transparent records of meetings, workable lobbying rules and disclosure of financial interests. They give citizens information with which to question an official’s choices. Without such visibility, a formally narrow criminal rule could leave the public unable to judge whether access was being distributed fairly.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>Working alongside one another, clarity in law and integrity in public life allow a balanced judgement. A court’s reasoning may be sound even when the underlying behaviour remains objectionable. Supporting legitimate representation need not mean tolerating purchased influence; it can strengthen the case for transparent government that treats people fairly.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2017英语一Text 4重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>rare\u003c/td>\n\u003ctd>a.罕见的\u003c/td>\n\u003ctd>unanimous ruling\u003c/td>\n\u003ctd>一致裁决\u003c/td>\n\u003ctd c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>equal treatment\u003c/td>\n\u003ctd>平等对待\u003c/td>\n\u003ctd>undermine\u003c/td>\n\u003ctd>v.损害\u003c/td>\n\u003ctd>good governance\u003c/td>\n\u003ctd>良治\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>inherent worth\u003c/td>\n\u003ctd>内在价值\u003c/td>\n\u003ctd>individual\u003c/td>\n\u003ctd>n.个人\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>第8段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>ruling\u003c/td>\n\u003ctd>n.裁决\u003c/td>\n\u003ctd>step forward\u003c/td>\n\u003ctd>向前的一步\u003c/td>\n\u003ctd>struggle against\u003c/td>\n\u003ctd>与……斗争\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>corruption\u003c/td>\n\u003ctd>n.腐败\u003c/td>\n\u003ctd>favoritism\u003c/td>\n\u003ctd>n.偏袒\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell. But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>In a rare unanimous ruling, / the US Supreme Court has overturned / the corruption conviction / of a former Virginia governor, / Robert McDonnell.\u003c/p>\n\u003cp>But it did so / while holding its nose / at the ethics of his conduct, / which included accepting gifts / such as a Rolex watch and a Ferrari automobile / from a company / seeking access to government.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>在一次罕见的全体一致裁决中，/ 美国最高法院推翻了 / 腐败定罪 / 对前弗吉尼亚州州长的，/ 罗伯特·麦克唐纳。\u003c/p>\n\u003cp>但它这样做时 / 捏着鼻子 / 对他行为的道德，/ 这包括接受礼物 / 比如劳力士手表和法拉利汽车 / 从一家公司 / 寻求接触政府的。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>美国最高法院在一次罕见的全体一致裁决中，推翻了对前弗吉尼亚州州长罗伯特·麦克唐纳的腐败定罪。但法院这样做时对他的行为道德表示不齿，他曾从一家寻求接触政府的公司那里接受了劳力士手表和法拉利汽车等礼物。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>The high court&#39;s decision said the judge in Mr. McDonnell&#39;s trial failed to tell a jury that it must look only at his &quot;official acts,&quot; or the former governor&#39;s decisions on &quot;specific&quot; and &quot;unsettled&quot; issues related to his duties.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>The high court&#39;s decision said / the judge in Mr. McDonnell&#39;s trial / failed to tell a jury / that it must look only at / his &quot;official acts,&quot; / or the former governor&#39;s decisions / on &quot;specific&quot; and &quot;unsettled&quot; issues / related to his duties.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>高等法院的决定说 / 麦克唐纳先生审判中的法官 / 未能告诉陪审团 / 它必须只看 / 他的&quot;官方行为&quot;，/ 或前州长的决定 / 关于&quot;具体&quot;和&quot;未解决&quot;的问题 / 与他的职责相关的。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>最高法院的裁决指出，麦克唐纳案审判法官未能告诉陪审团，他们必须只关注他的&quot;官方行为&quot;，即前州长对与其职责相关的&quot;具体&quot;和&quot;未解决&quot;问题所做的决定。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Merely helping a gift-giver gain access to other officials, unless done with clear intent to pressure those officials, is not corruption, the justices found.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Merely helping a gift-giver / gain access to other officials, / unless done with clear intent / to pressure those officials, / is not corruption, / the justices found.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>仅仅帮助送礼者 / 获得接触其他官员的机会，/ 除非是带着明确意图 / 向那些官员施压，/ 不构成腐败，/ 大法官们认定。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>大法官们认定，仅仅帮助送礼者接触其他官员，除非带有向那些官员施压的明确意图，否则不构成腐败。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>The court did suggest that accepting favors in return for opening doors is &quot;distasteful&quot; and &quot;nasty.&quot; But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>The court did suggest / that accepting favors / in return for opening doors / is &quot;distasteful&quot; and &quot;nasty.&quot;\u003c/p>\n\u003cp>But under anti-bribery laws, / proof must be made / of concrete benefits, / such as approval of a contract or regulation.\u003c/p>\n\u003cp>Simply arranging a meeting, / making a phone call, / or hosting an event / is not an &quot;official act&quot;.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>法院确实暗示 / 接受好处 / 以换取开门 / 是&quot;令人厌恶的&quot;和&quot;恶劣的&quot;。\u003c/p>\n\u003cp>但在反贿赂法律下，/ 必须证明 / 具体利益，/ 比如批准合同或法规。\u003c/p>\n\u003cp>仅仅安排会面，/ 打电话，/ 或主办活动 / 不是&quot;官方行为&quot;。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>法院确实表示，为开门而接受好处是&quot;令人厌恶的&quot;和&quot;恶劣的&quot;。但根据反贿赂法，必须证明存在具体利益，如批准合同或法规。仅仅安排会面、打电话或主办活动不构成&quot;官方行为&quot;。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>The court&#39;s ruling is legally sound in defining a kind of favoritism that is not criminal. Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery. &quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>The court&#39;s ruling is legally sound / in defining a kind of favoritism / that is not criminal.\u003c/p>\n\u003cp>Elected leaders must be allowed / to help supporters / deal with bureaucratic problems / without fear of prosecution for bribery.\u003c/p>\n\u003cp>&quot;The basic compact / underlying representative government,&quot; / wrote Chief Justice John Roberts / for the court, / &quot;assumes that public officials / will hear from their constituents / and act on their concerns.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>法院的裁决在法律上是合理的 / 在定义一种偏袒 / 不是犯罪的。\u003c/p>\n\u003cp>民选领导人必须被允许 / 帮助支持者 / 处理官僚问题 / 而不用担心因贿赂被起诉。\u003c/p>\n\u003cp>&quot;基本契约 / 代议制政府背后的，&quot; / 首席大法官约翰·罗伯茨写道 / 代表法院，/ &quot;假定公职人员 / 会倾听选民的声音 / 并根据他们的关切采取行动。&quot;\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>法院的裁决在法律上是合理的，它定义了一种不构成犯罪的偏袒。民选领导人必须被允许帮助支持者处理官僚问题，而不用担心因贿赂被起诉。首席大法官约翰·罗伯茨代表法院写道：&quot;代议制政府的基本契约假定，公职人员会倾听选民的声音并根据他们的关切采取行动。&quot;\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government. Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift. This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected leader&#39;s source of wealth.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>But the ruling reinforces the need / for citizens and their elected representatives, / not the courts, / to ensure equality of access / to government.\u003c/p>\n\u003cp>Officials must not be allowed / to play favorites / in providing information / or in arranging meetings / simply because an individual or group / provides a campaign donation / or a personal gift.\u003c/p>\n\u003cp>This type of integrity / requires well-enforced laws / in government transparency, / such as records of official meetings, / rules on lobbying, / and information about / each elected leader&#39;s source of wealth.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>但这项裁决强化了需要 / 公民和他们的民选代表，/ 而不是法院，/ 来确保平等接触 / 政府。\u003c/p>\n\u003cp>官员不能被允许 / 偏袒某些人 / 在提供信息方面 / 或在安排会议方面 / 仅仅因为个人或团体 / 提供竞选捐款 / 或个人礼物。\u003c/p>\n\u003cp>这种类型的廉正 / 需要执行良好的法律 / 在政府透明度方面，/ 比如官方会议记录，/ 游说规则，/ 以及信息关于 / 每位民选领导人的财富来源。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>但这项裁决强调了需要由公民和他们的民选代表，而非法院，来确保公众平等接触政府的机会。不能允许官员仅仅因为某个人或团体提供了竞选捐款或个人礼物，就在提供信息或安排会议时偏袒他们。这种廉正需要在政府透明度方面有执行良好的法律，如官方会议记录、游说规则，以及每位民选领导人财富来源的信息。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>Favoritism in official access can fan public perceptions of corruption. But it is not always corruption. Rather officials must avoid double standards, or different types of access for average people and the wealthy. If connections can be bought, a basic premise of democratic society – that all are equal in treatment by government – is undermined. Good governance rests on an understanding of the inherent worth of each individual.\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>Favoritism in official access / can fan public perceptions / of corruption.\u003c/p>\n\u003cp>But it is not always corruption.\u003c/p>\n\u003cp>Rather officials must avoid / double standards, / or different types of access / for average people and the wealthy.\u003c/p>\n\u003cp>If connections can be bought, / a basic premise of democratic society – / that all are equal / in treatment by government – / is undermined.\u003c/p>\n\u003cp>Good governance rests on / an understanding of / the inherent worth / of each individual.\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>在官方接触中的偏袒 / 可能煽动公众看法 / 关于腐败。\u003c/p>\n\u003cp>但它并不总是腐败。\u003c/p>\n\u003cp>相反官员必须避免 / 双重标准，/ 或不同类型的接触机会 / 对普通人和富人。\u003c/p>\n\u003cp>如果关系可以被购买，/ 民主社会的基本前提 – / 所有人都平等 / 在政府对待方面 – / 就被破坏了。\u003c/p>\n\u003cp>良好的治理建立在 / 理解 / 内在价值 / 每个个体的。\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>在官方接触中的偏袒可能会加剧公众对腐败的看法。但这并不总是腐败。相反，官员必须避免双重标准，避免给普通人和富人不同的接触机会。如果关系可以被购买，民主社会的基本前提——政府平等对待所有人——就会被破坏。良好的治理建立在理解每个个体内在价值的基础上。\u003c/p>\n\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>The court&#39;s ruling is a step forward in the struggle against both corruption and official favoritism.\u003c/p>\n\u003ch3>意群划分 · 第8段\u003c/h3>\n\u003cp>The court&#39;s ruling is / a step forward / in the struggle / against both corruption / and official favoritism.\u003c/p>\n\u003ch3>意群翻译 · 第8段\u003c/h3>\n\u003cp>法院的裁决是 / 向前一步 / 在斗争中 / 反对腐败 / 和官方偏袒。\u003c/p>\n\u003ch3>标准译文 · 第8段\u003c/h3>\n\u003cp>法院的裁决是在反对腐败和官方偏袒斗争中向前迈出的一步。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>In a rare unanimous ruling → the US Supreme Court has overturned → the corruption conviction：(of a former Virginia governor：(Robert McDonnell)).\u003c/p>\n\u003cp>But it did so：(while holding its nose：(at the ethics of his conduct))：(which included accepting gifts：(such as a Rolex watch and a Ferrari automobile)：(from a company：(seeking access to government))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>The high court&#39;s decision said：(the judge：(in Mr. McDonnell&#39;s trial) → failed to tell a jury：(that it must look only at → his &quot;official acts&quot;：(or the former governor&#39;s decisions：(on &quot;specific&quot; and &quot;unsettled&quot; issues：(related to his duties))))).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Merely helping a gift-giver：(gain access to other officials) → unless done with clear intent：(to pressure those officials) → is not corruption → the justices found.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>The court did suggest：(that accepting favors：(in return for opening doors) → is &quot;distasteful&quot; and &quot;nasty&quot;).\u003c/p>\n\u003cp>But under anti-bribery laws → proof must be made：(of concrete benefits)：(such as approval of a contract or regulation).\u003c/p>\n\u003cp>Simply arranging a meeting + making a phone call + or hosting an event → is not an &quot;official act&quot;.\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>The court&#39;s ruling is legally sound：(in defining a kind of favoritism：(that is not criminal)).\u003c/p>\n\u003cp>Elected leaders must be allowed → to help supporters：(deal with bureaucratic problems)：(without fear of prosecution for bribery).\u003c/p>\n\u003cp>&quot;The basic compact：(underlying representative government)&quot; → wrote Chief Justice John Roberts：(for the court) → &quot;assumes：(that public officials → will hear from their constituents + act on their concerns).&quot;\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>But the ruling reinforces the need：(for citizens and their elected representatives + not the courts) → to ensure equality of access：(to government).\u003c/p>\n\u003cp>Officials must not be allowed → to play favorites：(in providing information + in arranging meetings)：(simply because an individual or group → provides a campaign donation + a personal gift).\u003c/p>\n\u003cp>This type of integrity → requires well-enforced laws：(in government transparency)：(such as records of official meetings + rules on lobbying + information about：(each elected leader&#39;s source of wealth)).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>Favoritism in official access → can fan public perceptions：(of corruption).\u003c/p>\n\u003cp>But it is not always corruption.\u003c/p>\n\u003cp>Rather officials must avoid：(double standards + different types of access：(for average people and the wealthy)).\u003c/p>\n\u003cp>If connections can be bought → a basic premise of democratic society：(that all are equal：(in treatment by government)) → is undermined.\u003c/p>\n\u003cp>Good governance rests on：(an understanding of：(the inherent worth：(of each individual))).\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>The court&#39;s ruling is → a step forward：(in the struggle：(against both corruption + official favoritism)).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>在一次罕见的全体一致裁决中 → 美国最高法院推翻了 → 腐败定罪：(对前弗吉尼亚州州长的：(罗伯特·麦克唐纳))。\u003c/p>\n\u003cp>但它这样做时：(捏着鼻子：(对他行为的道德))：(这包括接受礼物：(比如劳力士手表和法拉利汽车)：(从一家公司：(寻求接触政府的)))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>高等法院的决定说：(法官：(在麦克唐纳先生审判中的) → 未能告诉陪审团：(它必须只看 → 他的&quot;官方行为&quot;：(或前州长的决定：(关于&quot;具体&quot;和&quot;未解决&quot;的问题：(与他的职责相关的)))))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>仅仅帮助送礼者：(获得接触其他官员的机会) → 除非是带着明确意图：(向那些官员施压) → 不构成腐败 → 大法官们认定。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>法院确实暗示：(接受好处：(以换取开门) → 是&quot;令人厌恶的&quot;和&quot;恶劣的&quot;)。\u003c/p>\n\u003cp>但在反贿赂法律下 → 必须证明：(具体利益)：(比如批准合同或法规)。\u003c/p>\n\u003cp>仅仅安排会面 + 打电话 + 或主办活动 → 不是&quot;官方行为&quot;。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>法院的裁决在法律上是合理的：(在定义一种偏袒：(不是犯罪的))。\u003c/p>\n\u003cp>民选领导人必须被允许 → 帮助支持者：(处理官僚问题)：(而不用担心因贿赂被起诉)。\u003c/p>\n\u003cp>&quot;基本契约：(代议制政府背后的)&quot; → 首席大法官约翰·罗伯茨写道：(代表法院) → &quot;假定：(公职人员 → 会倾听选民的声音 + 根据他们的关切采取行动)。&quot;\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>但这项裁决强化了需要：(公民和他们的民选代表 + 而不是法院) → 来确保平等接触：(政府)。\u003c/p>\n\u003cp>官员不能被允许 → 偏袒某些人：(在提供信息方面 + 在安排会议方面)：(仅仅因为个人或团体 → 提供竞选捐款 + 个人礼物)。\u003c/p>\n\u003cp>这种类型的廉正 → 需要执行良好的法律：(在政府透明度方面)：(比如官方会议记录 + 游说规则 + 信息关于：(每位民选领导人的财富来源))。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>在官方接触中的偏袒 → 可能煽动公众看法：(关于腐败)。\u003c/p>\n\u003cp>但它并不总是腐败。\u003c/p>\n\u003cp>相反官员必须避免：(双重标准 + 不同类型的接触机会：(对普通人和富人))。\u003c/p>\n\u003cp>如果关系可以被购买 → 民主社会的基本前提：(所有人都平等：(在政府对待方面)) → 就被破坏了。\u003c/p>\n\u003cp>良好的治理建立在：(理解：(内在价值：(每个个体的)))。\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>法院的裁决是 → 向前一步：(在斗争中：(反对腐败 + 官方偏袒))。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>The high court&#39;s decision said the judge in Mr. McDonnell&#39;s trial failed to tell a jury that it must look only at his &quot;official acts,&quot; or the former governor&#39;s decisions on &quot;specific&quot; and &quot;unsettled&quot; issues related to his duties.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>The high court&#39;s decision said / the judge in Mr. McDonnell&#39;s trial / failed to tell a jury / that it must look only at / his &quot;official acts,&quot; / or the former governor&#39;s decisions / on &quot;specific&quot; and &quot;unsettled&quot; issues / related to his duties.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>高等法院的决定说 / 麦克唐纳先生审判中的法官 / 未能告诉陪审团 / 它必须只看 / 他的&quot;官方行为&quot;，/ 或前州长的决定 / 关于&quot;具体&quot;和&quot;未解决&quot;的问题 / 与他的职责相关的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并法院对原审程序的判断。：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院认为，原审法官未能向陪审团说明适用界限\u003c/p>\n\u003c/blockquote>\n\u003cp>再将official acts与or后的解释合在一起。：\u003c/p>\n\u003cblockquote>\n\u003cp>应只看官方行为，即州长对职责内具体且未决问题所作的决定\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院认为，原审法官未能向陪审团说明适用界限；应只看官方行为，即州长对职责内具体且未决问题所作的决定。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院指出，法官未告诉陪审团只能考察官方行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>先讲未完成的告知，再把must look only作为告知内容；or是换一种说法解释官方行为，不是另列不相干的行为。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院的决定说，麦克唐纳审判中的法官没有告诉陪审团，他们必须只考察他的“官方行为”，也就是这位前州长对职责内“具体”且“未解决”问题所作的决定。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>failed to tell指出审判指引存在问题，不是陪审团已经确认官员没有收礼。\u003c/p>\n\u003cp>specific和unsettled同时限定事务，体现刑事定罪标准的具体边界。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院的裁决指出，麦克唐纳案审判法官未能告诉陪审团，他们必须只关注他的&quot;官方行为&quot;，即前州长对与其职责相关的&quot;具体&quot;和&quot;未解决&quot;问题所做的决定。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第5段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;The basic compact / underlying representative government,&quot; / wrote Chief Justice John Roberts / for the court, / &quot;assumes that public officials / will hear from their constituents / and act on their concerns.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;基本契约 / 代议制政府背后的，&quot; / 首席大法官约翰·罗伯茨写道 / 代表法院，/ &quot;假定公职人员 / 会倾听选民的声音 / 并根据他们的关切采取行动。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把插入语移开，合并引语主干。：\u003c/p>\n\u003cblockquote>\n\u003cp>代议制政府的基本契约作出一项假定\u003c/p>\n\u003c/blockquote>\n\u003cp>再把公职人员应有的两个动作合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>倾听选民的意见，并根据他们的关切采取行动\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>代议制政府的基本契约作出一项假定；倾听选民的意见，并根据他们的关切采取行动。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>代议制的基本契约假定官员会倾听并回应选民。\u003c/p>\n\u003c/blockquote>\n\u003cp>将罗伯茨代表法院写道放在句首或引语间，不能误作compact的定语；hear from与act on同为官员的动作。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>首席大法官约翰·罗伯茨代表法院写道：“构成代议制政府基础的契约，假定公职人员会听取选民的意见，并就他们的关切采取行动。”\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>underlying说明这一契约构成政府运作基础，不是写一份具体商业合同。\u003c/p>\n\u003cp>act on concerns是回应关切，不能扩大成必须满足所有个人要求。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>首席大法官约翰·罗伯茨代表法院写道：&quot;代议制政府的基本契约假定，公职人员会倾听选民的声音并根据他们的关切采取行动。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected leader&#39;s source of wealth.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>This type of integrity / requires well-enforced laws / in government transparency, / such as records of official meetings, / rules on lobbying, / and information about / each elected leader&#39;s source of wealth.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>这种类型的廉正 / 需要执行良好的法律 / 在政府透明度方面，/ 比如官方会议记录，/ 游说规则，/ 以及信息关于 / 每位民选领导人的财富来源。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并实现廉正所需的条件。：\u003c/p>\n\u003cblockquote>\n\u003cp>这种廉正要求政府透明度方面的法律得到有效执行\u003c/p>\n\u003c/blockquote>\n\u003cp>再把such as后的三项并列举例合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>官方会议记录、游说规则以及民选领导人的财富来源信息\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>这种廉正要求政府透明度方面的法律得到有效执行；官方会议记录、游说规则以及民选领导人的财富来源信息。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>廉正需要得到良好执行的透明度法律。\u003c/p>\n\u003c/blockquote>\n\u003cp>先放原则性要求，再用“如”引出三项例子；wealth的来源归属于每位民选领导人，不接成会议或游说机构的财富。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>这种廉正要求政府透明度方面的法律得到良好执行，比如有关官方会议记录、游说的规则，以及每位民选领导人的财富来源信息。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>well-enforced不只是纸面上有法律，还要求实施有效。\u003c/p>\n\u003cp>such as是例子而不是封闭清单，不能译成透明制度只包含这三项。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>这种廉正需要在政府透明度方面有执行良好的法律，如官方会议记录、游说规则，以及每位民选领导人财富来源的信息。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>40题\u003c/h2>\n\u003cp>\u003cstrong>The author’s attitude toward the court’s ruling is ______.\u003c/strong>\u003c/p>\n\u003cp>作者对法院这项裁决持什么态度？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>sarcastic\u003c/strong>\u003c/p>\n\u003cp>讽刺的\u003c/p>\n\u003cp>B. \u003cstrong>tolerant\u003c/strong>\u003c/p>\n\u003cp>容忍的\u003c/p>\n\u003cp>C. \u003cstrong>skeptical\u003c/strong>\u003c/p>\n\u003cp>怀疑的\u003c/p>\n\u003cp>D. \u003cstrong>supportive\u003c/strong>\u003c/p>\n\u003cp>支持的\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。\u003c/td>\n\u003ctd>先说处理结果与行为评价的不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。\u003c/td>\n\u003ctd>再说作出处理依据的边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明帮助送礼者接触其他官员并非一概属于腐败，另有意图方面的限定。\u003c/td>\n\u003ctd>接着举出不能一概算在内的情形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。\u003c/td>\n\u003ctd>然后把不喜欢与应怎样处理分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。\u003c/td>\n\u003ctd>再说为什么这样的区分有道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。\u003c/td>\n\u003ctd>接着提醒还有另一件事需要做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。\u003c/td>\n\u003ctd>然后说清这件事为什么重要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>以a step forward明确评价裁决在反腐败与反官方偏袒两方面的意义。\u003c/td>\n\u003ctd>最后说整个处理值不值得肯定\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>The author’s attitude toward the court’s ruling is ______.\u003c/strong>\u003c/p>\n\u003ch3>A. sarcastic\u003c/h3>\n\u003cp>讽刺的\u003c/p>\n\u003ch4>如果 A 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>讽刺的\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>用撤销定罪与鄙视行为之间的反差，以反话方式嘲讽法院的处理。\u003c/td>\n\u003ctd>先说处理结果与行为评价的不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>表面复述公务行为界限，实则通过夸张其狭窄暗示裁决荒唐。\u003c/td>\n\u003ctd>再说作出处理依据的边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>列出不构罪的接触行为，以讽刺口吻表现逃避追责有多容易。\u003c/td>\n\u003ctd>接着举出不能一概算在内的情形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>把道德厌恶和法律处理并列，借两者落差继续嘲弄法院标准。\u003c/td>\n\u003ctd>然后把不喜欢与应怎样处理分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>先假意承认正常代表活动的理由，再以反语暴露该理由的不足。\u003c/td>\n\u003ctd>再说为什么这样的区分有道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提醒还要防范偏袒，借新增负担反讽裁决留下的麻烦。\u003c/td>\n\u003ctd>接着提醒还有另一件事需要做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>指出公平原则的重要，以此加深对处理结果的讥刺。\u003c/td>\n\u003ctd>然后说清这件事为什么重要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>以表面赞美、实际否定的反话收束，使讽刺立场完整。\u003c/td>\n\u003ctd>最后说整个处理值不值得肯定\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A会让人想到第一段holding its nose和第四段nasty，因为这两处确有负面意味。但它们评价的是麦克唐纳收礼及为人开门的行为，题干问的却是作者对court’s ruling的态度。对象不同，不能把对行为的不满直接搬到裁决上。\u003c/p>\n\u003cp>第五段明写legally sound，随后给出代议制应回应选民的理由，结尾又说a step forward。若这些都是反话，附近理应出现足以反转字面肯定的讽刺结构；实际中间在认真解释法律边界和后续平等责任，没有把肯定翻成嘲笑。\u003c/p>\n\u003cp>作者嫌恶收礼行为，是否就说明他在讽刺限制腐败定罪的这项裁决？\u003c/p>\n\u003cp>不能。原文反复将行为评价与裁决评价分开，A把对象混同，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward the court’s ruling is ______.\u003c/strong>\u003c/p>\n\u003ch3>B. tolerant\u003c/h3>\n\u003cp>容忍的\u003c/p>\n\u003ch4>如果 B 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>容忍的\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>区分法院处理结果与对行为的厌恶，表示虽不喜欢裁决仍愿接受。\u003c/td>\n\u003ctd>先说处理结果与行为评价的不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释公务行为边界，作为勉强容忍裁决的法律理由。\u003c/td>\n\u003ctd>再说作出处理依据的边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>举出不应一概入罪的情形，说明裁决并非全无可取之处。\u003c/td>\n\u003ctd>接着举出不能一概算在内的情形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>把不喜欢行为与适当处罚分开，维持有保留的接受。\u003c/td>\n\u003ctd>然后把不喜欢与应怎样处理分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>承认保护正常回应选民有道理，但不过度赞扬这一处理。\u003c/td>\n\u003ctd>再说为什么这样的区分有道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提醒偏袒仍需其他规则约束，说明容忍裁决附有条件。\u003c/td>\n\u003ctd>接着提醒还有另一件事需要做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>解释公平接触不可丢失，划出容忍的限度。\u003c/td>\n\u003ctd>然后说清这件事为什么重要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>以可以接受但仍有所保留的评价结尾，而不积极肯定为进步。\u003c/td>\n\u003ctd>最后说整个处理值不值得肯定\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的tolerant表示作者容许或勉强接受，并不等同于主动支持。第一段一边推翻定罪一边对行为反感，容易让人以为作者也是“不喜欢但忍着”。然而那是法院处理法律与行为评价的并存，不能直接决定作者对裁决的态度。\u003c/p>\n\u003cp>第五段作者自己的legally sound不是“虽有问题也先忍受”，而是认可法律上的区分，并解释民选代表为何必须能够正常帮助选民。末段a step forward又赋予裁决积极意义。若B成立，表格末行应该落在接受其存在而非肯定其进展，实际力度明显更积极。\u003c/p>\n\u003cp>认为裁决在法律上合理并称其向前迈进，仅仅是容忍它存在吗？\u003c/p>\n\u003cp>不是。B弱化了作者已明确表达的正面评价，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward the court’s ruling is ______.\u003c/strong>\u003c/p>\n\u003ch3>C. skeptical\u003c/h3>\n\u003cp>怀疑的\u003c/p>\n\u003ch4>如果 C 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>怀疑的\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从撤销定罪与鄙视行为的反差提出疑问：这个结果是否真的妥当。\u003c/td>\n\u003ctd>先说处理结果与行为评价的不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>审视公务行为边界，指出其中可能排除本该追责的行为。\u003c/td>\n\u003ctd>再说作出处理依据的边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>列举不构罪情形，讨论它们是否会给隐性腐败留下空间。\u003c/td>\n\u003ctd>接着举出不能一概算在内的情形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认法律不能等同道德，仍怀疑当前划分是否足够可靠。\u003c/td>\n\u003ctd>然后把不喜欢与应怎样处理分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>让步承认回应选民的理由有道理，再保留对裁决适用的疑虑。\u003c/td>\n\u003ctd>再说为什么这样的区分有道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提醒透明约束需求，说明现有处理尚未解决的问题。\u003c/td>\n\u003ctd>接着提醒还有另一件事需要做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>说明平等接触为何重要，并以此检验裁决是否达到要求。\u003c/td>\n\u003ctd>然后说清这件事为什么重要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>收束为需要观察和进一步论证的怀疑评价，不下积极结论。\u003c/td>\n\u003ctd>最后说整个处理值不值得肯定\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C需要作者对裁决的可靠性或合理性持疑问。第六、七段确实说还要防止偏袒、避免双重标准，但这些要求并不是对裁决法律理由的否定。文章先肯定区分正常回应与犯罪，再提出公民、代表和公开规则应继续承担的责任，是两件相互补充的事情。\u003c/p>\n\u003cp>第五段的legally sound给出法律上的肯定，最后的a step forward又收束为积极判断。若仍怀疑，结尾应留下不确定或质疑；实际作者没有停在“是否正确”这个问题上，而是在肯定后继续说明如何维护平等。\u003c/p>\n\u003cp>说裁决之后还有治理工作要做，是否就等于作者怀疑这项裁决本身？\u003c/p>\n\u003cp>不能。后续责任没有推翻前面的合理性判断，C排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward the court’s ruling is ______.\u003c/strong>\u003c/p>\n\u003ch3>D. supportive\u003c/h3>\n\u003cp>支持的\u003c/p>\n\u003ch4>如果 D 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>支持的\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>明确区分撤销刑事定罪与鄙视收礼行为，为支持法律上的处理澄清层次。\u003c/td>\n\u003ctd>先说处理结果与行为评价的不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释只看具体未决职责事项的公务行为边界。\u003c/td>\n\u003ctd>再说作出处理依据的边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>举引见和接触并不自动构罪的情形，防止定罪范围被无限扩大。\u003c/td>\n\u003ctd>接着举出不能一概算在内的情形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认行为令人反感，但用具体利益门槛说明应怎样依法处理。\u003c/td>\n\u003ctd>然后把不喜欢与应怎样处理分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>以正常回应选民的代表制需要，论证这种区分合理。\u003c/td>\n\u003ctd>再说为什么这样的区分有道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>转而提醒公众和民选代表还须用透明规则保障公平接触。\u003c/td>\n\u003ctd>接着提醒还有另一件事需要做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>解释防止双重标准为什么关系每个人的平等价值。\u003c/td>\n\u003ctd>然后说清这件事为什么重要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>将裁决评价为反腐败和反偏袒斗争中的进步，明确支持。\u003c/td>\n\u003ctd>最后说整个处理值不值得肯定\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D把题干对象牢牢放在court’s ruling上。第五段直接称裁决legally sound，并说明公职人员正常回应选民不应一概面临贿赂追责；最后一段又明确称其a step forward，正反两处关键信息的评价方向一致。\u003c/p>\n\u003cp>支持这一裁决并不等于赞成收礼和偏袒。第一、四段留下对不当行为的负面评价，第六、七段要求平等接触与可执行规则，都是把“哪些行为算犯罪”与“公共治理还应达到什么标准”分开。正因为区分清楚，作者能够既支持法律边界，也要求继续反偏袒。\u003c/p>\n\u003cp>D能否同时容纳法律上的肯定、对收礼的不满以及后续平等要求？\u003c/p>\n\u003cp>能。三者评价对象不同，没有冲突；结尾明确支持裁决取得的进展。D保留。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003ch3>40题结论\u003c/h3>\n\u003cp>\u003cstrong>40. D. supportive\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>supportive / 支持的\u003c/strong>\u003c/p>\n\u003ch2>36题\u003c/h2>\n\u003cblockquote>\n\u003cp>The underlined sentence (Para. 1) most probably shows that the court ______.\u003cbr>第一段画线句最可能说明法院持何种态度或采取什么做法？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>句意与态度题。题干要求判断“第一段画线句最可能说明法院持何种态度或采取什么做法？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell. But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\u003c/p>\n\u003cp>The high court&#39;s decision said the judge in Mr. McDonnell&#39;s trial failed to tell a jury that it must look only at his &quot;official acts,&quot; or the former governor&#39;s decisions on &quot;specific&quot; and &quot;unsettled&quot; issues related to his duties.\u003c/p>\n\u003c/blockquote>\n\u003cp>法院撤销定罪，却对收礼行为的道德性嗤之以鼻，随后解释一审没有严格界定公务行为。\u003c/p>\n\u003ch3>A. made no compromise in convicting McDonnell\u003c/h3>\n\u003cblockquote>\n\u003cp>在给麦克唐纳定罪时毫不妥协\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 convicting McDonnell 指对麦克唐纳定罪，第一段的 overturned the corruption conviction 说的也是该项定罪，因此回到画线句前一句，再看did so所指的法院动作。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>overturned the corruption conviction 是把原有腐败定罪推翻，A的 convicting McDonnell 却让法院继续承担“定罪”这个动作。画线句里的did so指回的是推翻定罪，不会因为后面出现捏鼻子的态度，就突然变成坚持给他定罪。\u003c/p>\n\u003cp>A的司法动作方向与原文相反，后面的态度描写不能将它变回定罪。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第一段画线句表明法院在给麦克唐纳定罪时毫不妥协。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 convicting McDonnell 指对麦克唐纳定罪，第一段的 overturned the corruption conviction 说的也是该项定罪，因此回到画线句前一句，再看did so所指的法院动作。\u003c/p>\n\u003cp>overturned the corruption conviction 是把原有腐败定罪推翻，A的 convicting McDonnell 却让法院继续承担“定罪”这个动作。画线句里的did so指回的是推翻定罪，不会因为后面出现捏鼻子的态度，就突然变成坚持给他定罪。\u003c/p>\n\u003cp>这里有两层需要分开：法院对定罪作了什么处理，以及它对这个人的行为持什么态度。But正是把二者放在不完全一致的方向上。对收礼行为反感，仍可以不认可原来的法律定罪；A把行为评价直接换成了定罪结果，因而读反了前一句的动作。\u003c/p>\n\u003cp>overturned已经明确改变了定罪，A却把动作写成继续定罪。\u003c/p>\n\u003cp>A的司法动作方向与原文相反，后面的态度描写不能将它变回定罪。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell.\u003c/p>\n\u003cp>法院撤销定罪，却对收礼行为的道德性嗤之以鼻，随后解释一审没有严格界定公务行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The court upheld McDonnell’s conviction without compromise.\u003c/p>\n\u003cp>法院毫不妥协地维持了对麦克唐纳的定罪。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际overturned说的是撤销，不能因法院厌恶行为就推成维持刑事判罪；两种评价分属法律与道德层次。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持法律界限的澄清，同时不认可行为道德。本题问法院对行为的态度，要区分撤销刑事定罪与赞成这种行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>made no compromise in convicting McDonnell\u003cbr>在给麦克唐纳定罪时毫不妥协\u003c/p>\n\u003c/blockquote>\n\u003cp>A的司法动作方向与原文相反，后面的态度描写不能将它变回定罪。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. avoided defining the extent of McDonnell’s duties\u003c/h3>\n\u003cblockquote>\n\u003cp>回避界定麦克唐纳的职责范围\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 extent of McDonnell’s duties 与第二段的 his duties 都涉及职责，因此把第二段完整读一遍，查看法院究竟回避了职责问题，还是正在说明应如何限定它。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>related to his duties 放在对official acts的解释里，法院要求陪审团只看这些公务行为，并进一步说是有关specific等问题的决定。B的 extent of McDonnell’s duties 因而不能说完全不相关，但avoided defining与这里正在作出的限定相反。\u003c/p>\n\u003cp>must look only及其后面的解释都在作限定，不是在避而不谈。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The high court&#39;s decision said the judge in Mr. McDonnell&#39;s trial failed to tell a jury that it must look only at his &quot;official acts,&quot; or the former governor&#39;s decisions on &quot;specific&quot; and &quot;unsettled&quot; issues related to his duties.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第一段画线句表明法院回避界定麦克唐纳的职责范围。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 extent of McDonnell’s duties 与第二段的 his duties 都涉及职责，因此把第二段完整读一遍，查看法院究竟回避了职责问题，还是正在说明应如何限定它。\u003c/p>\n\u003cp>related to his duties 放在对official acts的解释里，法院要求陪审团只看这些公务行为，并进一步说是有关specific等问题的决定。B的 extent of McDonnell’s duties 因而不能说完全不相关，但avoided defining与这里正在作出的限定相反。\u003c/p>\n\u003cp>failed to tell的主语是此前审判中的judge，不是最高法院回避说明；最高法院恰恰指出那个法官未把限定讲清楚。再回到画线句，它描述对conduct的态度，也没有把话题变成不愿界定职责。B既调换了说话内容，也容易把被批评的原审法官与现在作裁决的法院混为一体。\u003c/p>\n\u003cp>must look only及其后面的解释都在作限定，不是在避而不谈。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The high court&#39;s decision said the judge in Mr. McDonnell&#39;s trial failed to tell a jury that it must look only at his &quot;official acts,&quot; or the former governor&#39;s decisions on &quot;specific&quot; and &quot;unsettled&quot; issues related to his duties.\u003c/p>\n\u003cp>法院撤销定罪，却对收礼行为的道德性嗤之以鼻，随后解释一审没有严格界定公务行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The court avoided stating the limits of McDonnell’s official duties.\u003c/p>\n\u003cp>法院回避说明麦克唐纳官方职责的边界。\u003c/p>\n\u003c/blockquote>\n\u003cp>下一段恰好要求将official acts限定到具体未决职责问题。假设会让后文的界限说明失去依据。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持法律界限的澄清，同时不认可行为道德。本题问法院对行为的态度，要区分撤销刑事定罪与赞成这种行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>avoided defining the extent of McDonnell’s duties\u003cbr>回避界定麦克唐纳的职责范围\u003c/p>\n\u003c/blockquote>\n\u003cp>must look only及其后面的解释都在作限定，不是在避而不谈。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. was contemptuous of McDonnell’s conduct\u003c/h3>\n\u003cblockquote>\n\u003cp>鄙视麦克唐纳的行为\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“was [xxx] of McDonnell’s conduct”，保留了相应遮挡。当时的定位线索是：C的 McDonnell’s conduct 与第一段的 holding its nose 所指向的行为评价相连，所以回看at后面的his conduct以及收礼例子，判断这里谈的是人的行为还是定罪是否有效。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>McDonnell’s conduct 正是his conduct，后面的which included又具体列收下手表和汽车等行为。holding its nose 用捏鼻子的姿态来描写法院面对这些行为的反应，这显然不是在欣赏礼物或认可行为；But也把这种反应与前一句推翻定罪区分开。\u003c/p>\n\u003cp>conduct与其后例子界定了评价对象，捏鼻子的姿态则表达法院面对这类行为的反应。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第一段画线句表明法院鄙视麦克唐纳的行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 McDonnell’s conduct 与第一段的 holding its nose 所指向的行为评价相连，所以回看at后面的his conduct以及收礼例子，判断这里谈的是人的行为还是定罪是否有效。\u003c/p>\n\u003cp>McDonnell’s conduct 正是his conduct，后面的which included又具体列收下手表和汽车等行为。holding its nose 用捏鼻子的姿态来描写法院面对这些行为的反应，这显然不是在欣赏礼物或认可行为；But也把这种反应与前一句推翻定罪区分开。\u003c/p>\n\u003cp>A改变司法动作，B改谈职责界定，D说拒绝评论，都没有保留这层已发生的评价。C先留下，不把行为令人反感与依法应否定罪混成一件事。\u003c/p>\n\u003cp>conduct与其后例子界定了评价对象，捏鼻子的姿态则表达法院面对这类行为的反应。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\u003c/p>\n\u003cp>法院撤销定罪，却对收礼行为的道德性嗤之以鼻，随后解释一审没有严格界定公务行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The court overturned the conviction while showing contempt for the ethics of the conduct.\u003c/p>\n\u003cp>法院推翻了定罪，同时对该行为的道德性质表达轻蔑。\u003c/p>\n\u003c/blockquote>\n\u003cp>holding its nose表达厌恶，while将厌恶与撤销并置。二者可以同时成立，选项只概括对行为的道德评价。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持法律界限的澄清，同时不认可行为道德。本题问法院对行为的态度，要区分撤销刑事定罪与赞成这种行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>was contemptuous of McDonnell’s conduct\u003cbr>鄙视麦克唐纳的行为\u003c/p>\n\u003c/blockquote>\n\u003cp>conduct与其后例子界定了评价对象，捏鼻子的姿态则表达法院面对这类行为的反应。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. refused to comment on McDonnell’s ethics\u003c/h3>\n\u003cblockquote>\n\u003cp>拒绝评论麦克唐纳的道德\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 refused to comment 指拒绝作评价，而画线句的 holding its nose 恰恰是在呈现反应，因此回看这个姿态与his conduct之间的连接，确认是否真的没有评论。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>holding its nose 不是沉默，也不是不知道怎样评价，而是对行为作出一个有明显感情色彩的姿态。D的 refused to comment 却说法院没有评论，直接取消了画线句正在描述的评价。这里使用形象表达，不意味着评价不存在。\u003c/p>\n\u003cp>前一句推翻定罪，也不能被解释成法院回避道德问题。But it did so while说明“做了法律上的这个处理，同时仍有对行为的另一反应”。原文恰恰要让两层并存；D把司法处理没有维持定罪误认为对行为不置一词，漏掉了while之后整层内容。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第一段画线句表明法院拒绝评论麦克唐纳的道德。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 refused to comment 指拒绝作评价，而画线句的 holding its nose 恰恰是在呈现反应，因此回看这个姿态与his conduct之间的连接，确认是否真的没有评论。\u003c/p>\n\u003cp>holding its nose 不是沉默，也不是不知道怎样评价，而是对行为作出一个有明显感情色彩的姿态。D的 refused to comment 却说法院没有评论，直接取消了画线句正在描述的评价。这里使用形象表达，不意味着评价不存在。\u003c/p>\n\u003cp>前一句推翻定罪，也不能被解释成法院回避道德问题。But it did so while说明“做了法律上的这个处理，同时仍有对行为的另一反应”。原文恰恰要让两层并存；D把司法处理没有维持定罪误认为对行为不置一词，漏掉了while之后整层内容。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\u003c/p>\n\u003cp>法院撤销定罪，却对收礼行为的道德性嗤之以鼻，随后解释一审没有严格界定公务行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The court refused to express any ethical judgment on the conduct.\u003c/p>\n\u003cp>法院拒绝对该行为作出任何道德判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>画线句已明确表达对道德的反感，第四段还有distasteful与nasty；不作评论无法容纳这些态度词。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持法律界限的澄清，同时不认可行为道德。本题问法院对行为的态度，要区分撤销刑事定罪与赞成这种行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>refused to comment on McDonnell’s ethics\u003cbr>拒绝评论麦克唐纳的道德\u003c/p>\n\u003c/blockquote>\n\u003cp>前一句推翻定罪，也不能被解释成法院回避道德问题。But it did so while说明“做了法律上的这个处理，同时仍有对行为的另一反应”。原文恰恰要让两层并存；D把司法处理没有维持定罪误认为对行为不置一词，漏掉了while之后整层内容。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>36题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>36. C. was contemptuous of McDonnell’s conduct\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：overturned the corruption conviction 是把原有腐败定罪推翻，A的 convicting McDonnell 却让法院继续承担“定罪”这个动作。\u003c/p>\n\u003cp>B：related to his duties 放在对official acts的解释里，法院要求陪审团只看这些公务行为，并进一步说是有关specific等问题的决定。\u003c/p>\n\u003cp>C：McDonnell’s conduct 正是his conduct，后面的which included又具体列收下手表和汽车等行为。\u003c/p>\n\u003cp>D：holding its nose 不是沉默，也不是不知道怎样评价，而是对行为作出一个有明显感情色彩的姿态。\u003c/p>\n\u003ch2>37题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraph 4, an official act is deemed corruptive only if it involves ______.\u003cbr>根据第四段，一项公务行为只有涉及什么才被认定具有腐败性质？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>条件细节题。题干要求判断“根据第四段，一项公务行为只有涉及什么才被认定具有腐败性质？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The court did suggest that accepting favors in return for opening doors is &quot;distasteful&quot; and &quot;nasty.&quot; But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003c/blockquote>\n\u003cp>法院认为仅开门引见令人反感，但反贿赂法要求具体利益的证据，例如批准合同或规定；单纯会面、电话与活动不算。\u003c/p>\n\u003ch3>A. concrete returns for gift-givers\u003c/h3>\n\u003cblockquote>\n\u003cp>给予送礼者的具体回报\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“[xxx] returns for gift-givers”，保留了相应遮挡。当时的定位线索是：A的 returns for gift-givers 谈送礼人取得的回报，第四段的 benefits 后面列合同或规定的批准，因此回看这些利益与前面收好处、为人开门之间是什么关系。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>returns for gift-givers 中for限定了回报流向送礼一方。原文的 benefits 通过approval of a contract or regulation举例，不再只是收了什么礼物，而是公务处理能让请托一方取得什么结果。A保留了这一利益流向。\u003c/p>\n\u003cp>A保留了受益者与回报方向，未改变原文反贿赂判断所关注的事情。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按第四段，一项公务行为被认定为腐败，需要涉及给予送礼者的具体回报。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 returns for gift-givers 谈送礼人取得的回报，第四段的 benefits 后面列合同或规定的批准，因此回看这些利益与前面收好处、为人开门之间是什么关系。\u003c/p>\n\u003cp>returns for gift-givers 中for限定了回报流向送礼一方。原文的 benefits 通过approval of a contract or regulation举例，不再只是收了什么礼物，而是公务处理能让请托一方取得什么结果。A保留了这一利益流向。\u003c/p>\n\u003cp>但后面的例子与not an official act的对照已经说明：仅安排会面、打电话还不等于文中要求的那类利益。A不像B把礼物本身当回报，也不像C、D另换成泄密或毁约，可以留下来。\u003c/p>\n\u003cp>这里在说明公务处理给请托者带来的结果，而不是数官员收了多大一份礼。\u003c/p>\n\u003cp>A保留了受益者与回报方向，未改变原文反贿赂判断所关注的事情。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003cp>法院认为仅开门引见令人反感，但反贿赂法要求具体利益的证据，例如批准合同或规定；单纯会面、电话与活动不算。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The gift-giver must receive a concrete benefit such as approval of a contract.\u003c/p>\n\u003cp>送礼者必须得到具体利益，例如合同获批。\u003c/p>\n\u003c/blockquote>\n\u003cp>具体回报与concrete benefits同向，合同获批说明得到的是公务决定上的实际利益，区别于仅获得接触机会。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持严格区分腐败与一般偏袒的主旨要求保留刑事证明门槛。本题具体条件仍须看concrete benefits，不能只凭礼物的大小定罪。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>concrete returns for gift-givers\u003cbr>给予送礼者的具体回报\u003c/p>\n\u003c/blockquote>\n\u003cp>A保留了受益者与回报方向，未改变原文反贿赂判断所关注的事情。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. sizable gains in the form of gifts\u003c/h3>\n\u003cblockquote>\n\u003cp>以礼物形式获得的大额收益\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 in the form of gifts 指礼物这种收受形式，第四段的 approval of a contract or regulation 则是所举的利益例子，因此将二者对照，看看法律判断讨论的是礼物多大，还是公务决定带来什么结果。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>in the form of gifts 把利益放在收礼这一端，原文的 approval of a contract or regulation 却是在说合同或规定得到批准，这不是官员收到手表、汽车那类礼物。B抓住前文谈收好处，便忽略But后面法律要求另有相应利益的证据。\u003c/p>\n\u003cp>B把回报的流向与形式都换成收礼一端，又多加了sizable。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The court did suggest that accepting favors in return for opening doors is &quot;distasteful&quot; and &quot;nasty.&quot; But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按第四段，一项公务行为被认定为腐败，需要涉及以礼物形式获得的大额收益。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 in the form of gifts 指礼物这种收受形式，第四段的 approval of a contract or regulation 则是所举的利益例子，因此将二者对照，看看法律判断讨论的是礼物多大，还是公务决定带来什么结果。\u003c/p>\n\u003cp>in the form of gifts 把利益放在收礼这一端，原文的 approval of a contract or regulation 却是在说合同或规定得到批准，这不是官员收到手表、汽车那类礼物。B抓住前文谈收好处，便忽略But后面法律要求另有相应利益的证据。\u003c/p>\n\u003cp>sizable还增加数量或价值很大的要求。第四段所作的区分不是礼物大就构成、小就不构成，而是要看所要求证明的公务利益与单纯安排接触之间的差别。只讨论收到的礼物及其规模，会漏掉真正要核对的交换另一端。\u003c/p>\n\u003cp>B把回报的流向与形式都换成收礼一端，又多加了sizable。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The court did suggest that accepting favors in return for opening doors is &quot;distasteful&quot; and &quot;nasty.&quot; But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003cp>法院认为仅开门引见令人反感，但反贿赂法要求具体利益的证据，例如批准合同或规定；单纯会面、电话与活动不算。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>An official act is corrupt whenever the official receives a sufficiently expensive gift.\u003c/p>\n\u003cp>只要官员收到足够昂贵的礼物，其官方行为就是腐败。\u003c/p>\n\u003c/blockquote>\n\u003cp>礼物金额只写收礼一端，实际门槛还要求回报中的具体公务利益；昂贵礼物不能代替被证明的交换另一端。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持严格区分腐败与一般偏袒的主旨要求保留刑事证明门槛。本题具体条件仍须看concrete benefits，不能只凭礼物的大小定罪。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>sizable gains in the form of gifts\u003cbr>以礼物形式获得的大额收益\u003c/p>\n\u003c/blockquote>\n\u003cp>B把回报的流向与形式都换成收礼一端，又多加了sizable。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. leaking secrets intentionally\u003c/h3>\n\u003cblockquote>\n\u003cp>故意泄露秘密\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 leaking secrets intentionally 描述泄密行为，第四段的 approval of a contract or regulation 描述法律所关注的利益例子；因此回看such as后面，比较被举出来的行为是哪一种。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>approval of a contract or regulation 是批准合同或规定，C的 leaking secrets intentionally 则是故意把秘密泄露出去，动作与对象都不相同。段末的making a phone call也不能给泄密补依据：打电话只是一种联系行为，并不说明谈话内容是秘密，更不说明发生了泄露。\u003c/p>\n\u003cp>题干还问only if，C等于把故意泄密写成必要条件。原段明明用合同、规定的批准说明所需利益，C却将这些实例排除在必要条件之外。不能拿一个通常听起来负面的行为，替换文章此处实际界定的条件。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Simply arranging a meeting, making a phone call, or hosting an event i
