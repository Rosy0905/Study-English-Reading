s not an &quot;official act&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按第四段，一项公务行为被认定为腐败，需要涉及故意泄露秘密。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 leaking secrets intentionally 描述泄密行为，第四段的 approval of a contract or regulation 描述法律所关注的利益例子；因此回看such as后面，比较被举出来的行为是哪一种。\u003c/p>\n\u003cp>approval of a contract or regulation 是批准合同或规定，C的 leaking secrets intentionally 则是故意把秘密泄露出去，动作与对象都不相同。段末的making a phone call也不能给泄密补依据：打电话只是一种联系行为，并不说明谈话内容是秘密，更不说明发生了泄露。\u003c/p>\n\u003cp>题干还问only if，C等于把故意泄密写成必要条件。原段明明用合同、规定的批准说明所需利益，C却将这些实例排除在必要条件之外。不能拿一个通常听起来负面的行为，替换文章此处实际界定的条件。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003cp>法院认为仅开门引见令人反感，但反贿赂法要求具体利益的证据，例如批准合同或规定；单纯会面、电话与活动不算。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The official must have intentionally leaked government secrets.\u003c/p>\n\u003cp>官员必须曾故意泄露政府机密。\u003c/p>\n\u003c/blockquote>\n\u003cp>泄密既不是段中的必要条件，也不能由安排会面推得；原文例子是合同或规定获批。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持严格区分腐败与一般偏袒的主旨要求保留刑事证明门槛。本题具体条件仍须看concrete benefits，不能只凭礼物的大小定罪。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>leaking secrets intentionally\u003cbr>故意泄露秘密\u003c/p>\n\u003c/blockquote>\n\u003cp>题干还问only if，C等于把故意泄密写成必要条件。原段明明用合同、规定的批准说明所需利益，C却将这些实例排除在必要条件之外。不能拿一个通常听起来负面的行为，替换文章此处实际界定的条件。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. breaking contracts officially\u003c/h3>\n\u003cblockquote>\n\u003cp>以官方身份违约\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 breaking contracts 与第四段的 approval of a contract 都出现合同，但一个是破坏、一个是批准，因此直接回到这个例子核对动作。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>approval of a contract 是让合同获得批准，D的 breaking contracts 是破坏或违背合同，两者不能因为contracts相同就互换。原文用批准举例，是说明公务决定能够给送礼者带来怎样的利益，而不是说一切合同必须遭到破坏才涉及腐败。\u003c/p>\n\u003cp>approval与breaking的动作方向不同，officially不会消除这处差别。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The court did suggest that accepting favors in return for opening doors is &quot;distasteful&quot; and &quot;nasty.&quot; But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按第四段，一项公务行为被认定为腐败，需要涉及以官方身份违约。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 breaking contracts 与第四段的 approval of a contract 都出现合同，但一个是破坏、一个是批准，因此直接回到这个例子核对动作。\u003c/p>\n\u003cp>approval of a contract 是让合同获得批准，D的 breaking contracts 是破坏或违背合同，两者不能因为contracts相同就互换。原文用批准举例，是说明公务决定能够给送礼者带来怎样的利益，而不是说一切合同必须遭到破坏才涉及腐败。\u003c/p>\n\u003cp>officially也不能把breaking修正回来。即使都发生在公务场景中，动作仍然相反。后面还并列regulation，说明作者不是在专讲毁约行为，而是在列可能带来利益的公务决定类别。D既改了动作，又把必要条件收缩到合同破坏这一个行为。\u003c/p>\n\u003cp>approval与breaking的动作方向不同，officially不会消除这处差别。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The court did suggest that accepting favors in return for opening doors is &quot;distasteful&quot; and &quot;nasty.&quot; But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an &quot;official act&quot;.\u003c/p>\n\u003cp>法院认为仅开门引见令人反感，但反贿赂法要求具体利益的证据，例如批准合同或规定；单纯会面、电话与活动不算。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The official must have broken a contract in an official capacity.\u003c/p>\n\u003cp>官员必须以官方身份违反合同。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文提合同是approval of a contract，不是违反合同，不能借contract将审批利益改成违约行为。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持严格区分腐败与一般偏袒的主旨要求保留刑事证明门槛。本题具体条件仍须看concrete benefits，不能只凭礼物的大小定罪。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>breaking contracts officially\u003cbr>以官方身份违约\u003c/p>\n\u003c/blockquote>\n\u003cp>approval与breaking的动作方向不同，officially不会消除这处差别。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>37题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>37. A. concrete returns for gift-givers\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：returns for gift-givers 中for限定了回报流向送礼一方。\u003c/p>\n\u003cp>B：in the form of gifts 把利益放在收礼这一端，原文的 approval of a contract or regulation 却是在说合同或规定得到批准，这不是官员收到手表、汽车那类礼物。\u003c/p>\n\u003cp>C：approval of a contract or regulation 是批准合同或规定，C的 leaking secrets intentionally 则是故意把秘密泄露出去，动作与对象都不相同。\u003c/p>\n\u003cp>D：approval of a contract 是让合同获得批准，D的 breaking contracts 是破坏或违背合同，两者不能因为contracts相同就互换。\u003c/p>\n\u003ch2>38题\u003c/h2>\n\u003cblockquote>\n\u003cp>The court’s ruling is based on the assumption that public officials are ______.\u003cbr>法院裁决所依据的关于公职人员的假定是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>依据细节题。题干要求判断“法院裁决所依据的关于公职人员的假定是什么？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The court&#39;s ruling is legally sound in defining a kind of favoritism that is not criminal. Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery. &quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>法院允许民选领导帮助公众处理官僚问题，代表制政府以官员听取并回应选民关切为基本约定。\u003c/p>\n\u003ch3>A. allowed to focus on the concerns of their supporters\u003c/h3>\n\u003cblockquote>\n\u003cp>可以专注于支持者的关切\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 focus on the concerns of their supporters 与第五段的 help supporters 都涉及支持者，所以先回到这句与后面的代议制假定；接着完整读相邻的下一段，查看它怎样限定这种帮助，分清回应选民与偏向特定人群。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>help supporters 单独看确实与A的 focus on the concerns of their supporters 有联系，这正是A容易被留下的地方。但第五段在解释基本前提时用的是their constituents，即他们代表的选民，范围不限于支持者；第六段随即禁止因为捐款或礼物而play favorites。\u003c/p>\n\u003cp>后文明确禁止因捐款或礼物而偏袒，基本假定的范围也是所代表的选民而非特选的支持群体。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>裁决所依据的假定是，公职人员可以专注于支持者的关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 focus on the concerns of their supporters 与第五段的 help supporters 都涉及支持者，所以先回到这句与后面的代议制假定；接着完整读相邻的下一段，查看它怎样限定这种帮助，分清回应选民与偏向特定人群。\u003c/p>\n\u003cp>help supporters 单独看确实与A的 focus on the concerns of their supporters 有联系，这正是A容易被留下的地方。但第五段在解释基本前提时用的是their constituents，即他们代表的选民，范围不限于支持者；第六段随即禁止因为捐款或礼物而play favorites。\u003c/p>\n\u003cp>所以这里允许正常回应，不是允许把支持自己的一批人作为特殊重点。focus on配合their supporters，会把公共回应义务缩成对支持者的偏重。原文一面允许帮助，另一面限定不能给予特殊通道，两句话必须同时保留，不能只截第一句的supporters。\u003c/p>\n\u003cp>后文明确禁止因捐款或礼物而偏袒，基本假定的范围也是所代表的选民而非特选的支持群体。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.\u003c/p>\n\u003cp>法院允许民选领导帮助公众处理官僚问题，代表制政府以官员听取并回应选民关切为基本约定。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Officials are entitled to concentrate on supporters’ concerns.\u003c/p>\n\u003cp>官员有权集中关注支持者的关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文hear from constituents保障回应选民，不给支持者特殊优先权。下一段明令不得因捐款礼物play favorites，限制了这种扩大。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持的法律界限要为正常代表活动保留空间；这种支持与后文公平接触并存，不是给支持者专属优待或一切偏袒免责。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>allowed to focus on the concerns of their supporters\u003cbr>可以专注于支持者的关切\u003c/p>\n\u003c/blockquote>\n\u003cp>后文明确禁止因捐款或礼物而偏袒，基本假定的范围也是所代表的选民而非特选的支持群体。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. qualified to deal independently with bureaucratic issues\u003c/h3>\n\u003cblockquote>\n\u003cp>有资格独立处理官僚问题\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 qualified to deal independently 强调资格与独立能力，第五段的 must be allowed to help supporters 则强调应当允许帮助，因此回看must be allowed与随后assumes的表述，判断是在讨论能力还是职责。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>must be allowed to help supporters 是正常帮助行为应受到允许，不等于 qualified to deal independently 所说的专业资格或独立处置能力。随后assumes把前提讲得更清楚：听取选民意见，并对他们关心的问题采取行动。这是一种代表关系中的回应义务。\u003c/p>\n\u003cp>B的independently还要求独自处理，而原句help supporters反而是公职人员帮助别人的关系，并没有把是否独立列为前提。即使公职人员现实中需要能力，这段也不是在评价任职资格，更没有提供能力测试。不能用同样出现deal就忽略其前后的义务、对象与方式。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.\u003c/p>\n\u003cp>&quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>裁决所依据的假定是，公职人员有资格独立处理官僚问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 qualified to deal independently 强调资格与独立能力，第五段的 must be allowed to help supporters 则强调应当允许帮助，因此回看must be allowed与随后assumes的表述，判断是在讨论能力还是职责。\u003c/p>\n\u003cp>must be allowed to help supporters 是正常帮助行为应受到允许，不等于 qualified to deal independently 所说的专业资格或独立处置能力。随后assumes把前提讲得更清楚：听取选民意见，并对他们关心的问题采取行动。这是一种代表关系中的回应义务。\u003c/p>\n\u003cp>B的independently还要求独自处理，而原句help supporters反而是公职人员帮助别人的关系，并没有把是否独立列为前提。即使公职人员现实中需要能力，这段也不是在评价任职资格，更没有提供能力测试。不能用同样出现deal就忽略其前后的义务、对象与方式。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.\u003c/p>\n\u003cp>&quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003cp>法院允许民选领导帮助公众处理官僚问题，代表制政府以官员听取并回应选民关切为基本约定。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Officials can independently solve bureaucratic problems because they are professionally qualified.\u003c/p>\n\u003cp>官员因具备专业资格，可以独立解决官僚程序问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>must be allowed讨论正当权限，未证明专业能力或独立解决所有官僚问题。假设把可以帮助变成资格与能力判断。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持的法律界限要为正常代表活动保留空间；这种支持与后文公平接触并存，不是给支持者专属优待或一切偏袒免责。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>qualified to deal independently with bureaucratic issues\u003cbr>有资格独立处理官僚问题\u003c/p>\n\u003c/blockquote>\n\u003cp>B的independently还要求独自处理，而原句help supporters反而是公职人员帮助别人的关系，并没有把是否独立列为前提。即使公职人员现实中需要能力，这段也不是在评价任职资格，更没有提供能力测试。不能用同样出现deal就忽略其前后的义务、对象与方式。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. justified in addressing the needs of their constituents\u003c/h3>\n\u003cblockquote>\n\u003cp>回应选民的需要具有正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 addressing the needs of their constituents 与第五段的 act on their concerns 都说回应选民的问题，所以回到带assumes的引语，直接核对裁决所依据的假定。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>addressing the needs of their constituents 保留了原文的选民对象，act on their concerns 则说明不仅听取，还要针对关切行动。前面的hear from与后面的act on连起来，就是公共代表应当回应其选民的需要，而不是对少数送礼者承诺特别利益。\u003c/p>\n\u003cp>C的justified强调这种回应具有正当性，可以与本段must be allowed和legally sound相接。第六段又禁止偏袒，说明正当的是一般回应职责，不是任何以回应为名的特殊照顾。这样读C，既不取消代表应有的工作，也不把其工作都当成贿赂。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>裁决所依据的假定是，公职人员回应选民的需要具有正当性。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 addressing the needs of their constituents 与第五段的 act on their concerns 都说回应选民的问题，所以回到带assumes的引语，直接核对裁决所依据的假定。\u003c/p>\n\u003cp>addressing the needs of their constituents 保留了原文的选民对象，act on their concerns 则说明不仅听取，还要针对关切行动。前面的hear from与后面的act on连起来，就是公共代表应当回应其选民的需要，而不是对少数送礼者承诺特别利益。\u003c/p>\n\u003cp>C的justified强调这种回应具有正当性，可以与本段must be allowed和legally sound相接。第六段又禁止偏袒，说明正当的是一般回应职责，不是任何以回应为名的特殊照顾。这样读C，既不取消代表应有的工作，也不把其工作都当成贿赂。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003cp>法院允许民选领导帮助公众处理官僚问题，代表制政府以官员听取并回应选民关切为基本约定。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Public officials may properly hear from constituents and act on their concerns.\u003c/p>\n\u003cp>公职人员可正当地倾听选民并回应他们的关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>justified概括代表制的基本约定，addressing the needs对应听取并行动。它没有删除公平规则，也没有许诺解决每项需求。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持的法律界限要为正常代表活动保留空间；这种支持与后文公平接触并存，不是给支持者专属优待或一切偏袒免责。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>justified in addressing the needs of their constituents\u003cbr>回应选民的需要具有正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>C的justified强调这种回应具有正当性，可以与本段must be allowed和legally sound相接。第六段又禁止偏袒，说明正当的是一般回应职责，不是任何以回应为名的特殊照顾。这样读C，既不取消代表应有的工作，也不把其工作都当成贿赂。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. exempt from conviction on the charge of favoritism\u003c/h3>\n\u003cblockquote>\n\u003cp>可免于因偏袒而被定罪\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“[xxx] from conviction on the charge of favoritism”，保留了相应遮挡。当时的定位线索是：D的 conviction on the charge of favoritism 谈定罪问题，第五段的 without fear of prosecution for bribery 也涉及法律追责，因此回看这一限制附着在哪一种行为上，再与assumes的内容区别开。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>without fear of prosecution for bribery 附在正常帮助支持者处理问题的行为之后，不是一个脱离行为条件、适用于所有偏袒指控的法律待遇。D的 conviction on the charge of favoritism 却把话题换成公职人员面对某项指控时如何定罪。\u003c/p>\n\u003cp>回应义务是论证前提，正常履职与追责的边界是在它之后说明的。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.\u003c/p>\n\u003cp>&quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>裁决所依据的假定是，公职人员可免于因偏袒而被定罪。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 conviction on the charge of favoritism 谈定罪问题，第五段的 without fear of prosecution for bribery 也涉及法律追责，因此回看这一限制附着在哪一种行为上，再与assumes的内容区别开。\u003c/p>\n\u003cp>without fear of prosecution for bribery 附在正常帮助支持者处理问题的行为之后，不是一个脱离行为条件、适用于所有偏袒指控的法律待遇。D的 conviction on the charge of favoritism 却把话题换成公职人员面对某项指控时如何定罪。\u003c/p>\n\u003cp>题干问based on the assumption，本段assumes后面明写的前提是听取并回应选民。哪些行为不构成犯罪，是在这个前提之下解释出的法律边界，不是前提本身。\u003c/p>\n\u003cp>回应义务是论证前提，正常履职与追责的边界是在它之后说明的。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.\u003c/p>\n\u003cp>&quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;\u003c/p>\n\u003cp>法院允许民选领导帮助公众处理官僚问题，代表制政府以官员听取并回应选民关切为基本约定。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Officials are immune from conviction whenever favoritism is involved.\u003c/p>\n\u003cp>只要涉及偏袒，官员就免于定罪。\u003c/p>\n\u003c/blockquote>\n\u003cp>a kind of favoritism not criminal只排除某一类行为自动构罪，不能变成无论具体利益或施压都免责；完整条件仍须保留。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持的法律界限要为正常代表活动保留空间；这种支持与后文公平接触并存，不是给支持者专属优待或一切偏袒免责。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>exempt from conviction on the charge of favoritism\u003cbr>可免于因偏袒而被定罪\u003c/p>\n\u003c/blockquote>\n\u003cp>回应义务是论证前提，正常履职与追责的边界是在它之后说明的。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>38题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>38. C. justified in addressing the needs of their constituents\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：help supporters 单独看确实与A的 focus on the concerns of their supporters 有联系，这正是A容易被留下的地方。\u003c/p>\n\u003cp>B：must be allowed to help supporters 是正常帮助行为应受到允许，不等于 qualified to deal independently 所说的专业资格或独立处置能力。\u003c/p>\n\u003cp>C：addressing the needs of their constituents 保留了原文的选民对象，act on their concerns 则说明不仅听取，还要针对关切行动。\u003c/p>\n\u003cp>D：without fear of prosecution for bribery 附在正常帮助支持者处理问题的行为之后，不是一个脱离行为条件、适用于所有偏袒指控的法律待遇。\u003c/p>\n\u003ch2>39题\u003c/h2>\n\u003cblockquote>\n\u003cp>Well-enforced laws in government transparency are needed to ______.\u003cbr>政府透明方面得到良好执行的法律，是为实现什么目的而需要的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>目的题。题干要求判断“政府透明方面得到良好执行的法律，是为实现什么目的而需要的？”，先按第6、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government. Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift. This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected leader&#39;s source of wealth.\u003c/p>\n\u003cp>Favoritism in official access can fan public perceptions of corruption. But it is not always corruption. Rather officials must avoid double standards, or different types of access for average people and the wealthy. If connections can be bought, a basic premise of democratic society – that all are equal in treatment by government – is undermined. Good governance rests on an understanding of the inherent worth of each individual.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者要求公民与代表保障平等接触，列会议记录、游说规则与财富来源透明作为约束，防止礼物和捐款换取优待。\u003c/p>\n\u003ch3>A. awaken the conscience of officials\u003c/h3>\n\u003cblockquote>\n\u003cp>唤醒官员的良知\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 awaken the conscience of officials 说官员内心发生变化，第六段的 ensure equality of access to government 则给出外在公共目标，因此回看这种需要接到哪一层，再看具体法律例子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>ensure equality of access to government 说的是公众接触政府时应当受到平等对待，接着通过会议记录、游说规则、财富来源信息来落实。A的 awaken the conscience of officials 把目标改成官员内在良知被唤醒，原文却没有描述官员悔悟或思想转变。\u003c/p>\n\u003cp>外部记录与规则的作用，是让公务行为有可查的信息和限制，而不是先证明官员在内心变好。即使有人因此更自觉，也不是本段已经说出的法律需要。A把制度对行为的约束换成了道德心理教育，不能解释作者为什么接连列这些公开信息。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.\u003c/p>\n\u003cp>This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected leader&#39;s source of wealth.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>严格执行政府透明法律，是为了唤醒官员的良知。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 awaken the conscience of officials 说官员内心发生变化，第六段的 ensure equality of access to government 则给出外在公共目标，因此回看这种需要接到哪一层，再看具体法律例子。\u003c/p>\n\u003cp>ensure equality of access to government 说的是公众接触政府时应当受到平等对待，接着通过会议记录、游说规则、财富来源信息来落实。A的 awaken the conscience of officials 把目标改成官员内在良知被唤醒，原文却没有描述官员悔悟或思想转变。\u003c/p>\n\u003cp>外部记录与规则的作用，是让公务行为有可查的信息和限制，而不是先证明官员在内心变好。即使有人因此更自觉，也不是本段已经说出的法律需要。A把制度对行为的约束换成了道德心理教育，不能解释作者为什么接连列这些公开信息。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.\u003c/p>\n\u003cp>This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected leader&#39;s source of wealth.\u003c/p>\n\u003cp>作者要求公民与代表保障平等接触，列会议记录、游说规则与财富来源透明作为约束，防止礼物和捐款换取优待。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Transparency rules are intended mainly to awaken officials’ moral conscience.\u003c/p>\n\u003cp>透明度规则主要旨在唤醒官员的道德良心。\u003c/p>\n\u003c/blockquote>\n\u003cp>公开记录与规则提供可检查的约束，并非只唤醒内心良知。实际以ensure equality说明目的，没有把道德觉醒作为结果。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持裁决同时要求防范官员偏袒，本题应回答如何保障公众得到平等对待。目标是公平接触，不仅是列出法律涉及的某项活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>awaken the conscience of officials\u003cbr>唤醒官员的良知\u003c/p>\n\u003c/blockquote>\n\u003cp>外部记录与规则的作用，是让公务行为有可查的信息和限制，而不是先证明官员在内心变好。即使有人因此更自觉，也不是本段已经说出的法律需要。A把制度对行为的约束换成了道德心理教育，不能解释作者为什么接连列这些公开信息。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. allow for certain kinds of lobbying\u003c/h3>\n\u003cblockquote>\n\u003cp>允许某些形式的游说\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“allow for certain kinds of [xxx]”，保留了相应遮挡。当时的定位线索是：B的 certain kinds of 像是在区分哪些活动可以进行，第六段的 rules on lobbying 则是作者举出的一类行为规则，所以回看such as这组例子与前面的禁止偏袒之间怎么相接。读完全文后，做题模式再经交叉验证排除B，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>第6段先提出citizens、elected representatives和courts应确保equality of access to government，接着禁止因捐款或私人礼物而偏袒某些人，最后才列举会议记录、游说规则及财富来源信息。\u003c/p>\n\u003cp>题干问透明度法律为何必要，要沿requires回接前文的廉正和平等接触。C概括这层目的，B则把举例中的一个制度工具升成总目的，回答范围和层级都变窄。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.\u003c/p>\n\u003cp>This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected leader&#39;s source of wealth.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>严格执行政府透明法律，是为了允许某些形式的游说。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 certain kinds of 像是在区分哪些活动可以进行，第六段的 rules on lobbying 则是作者举出的一类行为规则，所以回看such as这组例子与前面的禁止偏袒之间怎么相接。\u003c/p>\n\u003cp>第6段先提出citizens、elected representatives和courts应确保equality of access to government，接着禁止因捐款或私人礼物而偏袒某些人，最后才列举会议记录、游说规则及财富来源信息。\u003c/p>\n\u003cp>B从rules on lobbying抽出“允许某些游说”作为立法目的，但规则只是实现政府透明度的一种措施。规则可能包含许可或限制，原文没有用allow certain kinds说明这些法律的总目标。\u003c/p>\n\u003cp>题干问透明度法律为何必要，要沿requires回接前文的廉正和平等接触。C概括这层目的，B则把举例中的一个制度工具升成总目的，回答范围和层级都变窄。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.\u003c/p>\n\u003cp>This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected leader&#39;s source of wealth.\u003c/p>\n\u003cp>作者要求公民与代表保障平等接触，列会议记录、游说规则与财富来源透明作为约束，防止礼物和捐款换取优待。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The chief purpose of transparency law is to permit certain forms of lobbying.\u003c/p>\n\u003cp>透明度法律的主要目的是允许某些游说形式。\u003c/p>\n\u003c/blockquote>\n\u003cp>游说规则是列举的手段之一，不能取代前面的平等目标。把管理某种活动改成许可活动，会缩掉会议记录与财富公开共同服务的目的。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持裁决同时要求防范官员偏袒，本题应回答如何保障公众得到平等对待。目标是公平接触，不仅是列出法律涉及的某项活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>allow for certain kinds of lobbying\u003cbr>允许某些形式的游说\u003c/p>\n\u003c/blockquote>\n\u003cp>题干问透明度法律为何必要，要沿requires回接前文的廉正和平等接触。C概括这层目的，B则把举例中的一个制度工具升成总目的，回答范围和层级都变窄。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. guarantee fair play in official access\u003c/h3>\n\u003cblockquote>\n\u003cp>保障接触政府机会的公平\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“guarantee [xxx] play in official access”，保留了相应遮挡。当时的定位线索是：C的 official access 与第六段的 equality of access to government 都说接触政府的机会，因此回看段首的目标，再看为什么捐款礼物不能成为特殊照顾的理由。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>official access 对应的是向政府获取信息、安排会面这一类接触。equality of access to government 又明确指出这些接触应具备什么性质，后一句用must not be allowed to play favorites说明不能因为收钱收礼而改变对待。C的guarantee也与这里的ensure相接。\u003c/p>\n\u003cp>它的对象与保障动作都很接近段首，B则保留了规则可能区分合法活动的一层。先让两项各自站在它能接到的位置，再用全文看法律安排到底要维护什么。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.\u003c/p>\n\u003cp>Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>严格执行政府透明法律，是为了保障接触政府机会的公平。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 official access 与第六段的 equality of access to government 都说接触政府的机会，因此回看段首的目标，再看为什么捐款礼物不能成为特殊照顾的理由。\u003c/p>\n\u003cp>official access 对应的是向政府获取信息、安排会面这一类接触。equality of access to government 又明确指出这些接触应具备什么性质，后一句用must not be allowed to play favorites说明不能因为收钱收礼而改变对待。C的guarantee也与这里的ensure相接。\u003c/p>\n\u003cp>它的对象与保障动作都很接近段首，B则保留了规则可能区分合法活动的一层。先让两项各自站在它能接到的位置，再用全文看法律安排到底要维护什么。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.\u003c/p>\n\u003cp>Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.\u003c/p>\n\u003cp>作者要求公民与代表保障平等接触，列会议记录、游说规则与财富来源透明作为约束，防止礼物和捐款换取优待。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Transparency rules should ensure fair access to government regardless of gifts or donations.\u003c/p>\n\u003cp>透明度规则应确保无论有无礼物或捐款，人们都有公平接触政府的机会。\u003c/p>\n\u003c/blockquote>\n\u003cp>fair play对应equality of access；不因送礼区别对待说明公平的具体内容，后文反对双重标准继续支持它。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持裁决同时要求防范官员偏袒，本题应回答如何保障公众得到平等对待。目标是公平接触，不仅是列出法律涉及的某项活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>guarantee fair play in official access\u003cbr>保障接触政府机会的公平\u003c/p>\n\u003c/blockquote>\n\u003cp>它的对象与保障动作都很接近段首，B则保留了规则可能区分合法活动的一层。先让两项各自站在它能接到的位置，再用全文看法律安排到底要维护什么。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. inspire hopes in average people\u003c/h3>\n\u003cblockquote>\n\u003cp>激起普通人的希望\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 inspire hopes 说激发心理上的希望，第六段的 ensure equality 则说确保一种公共关系，因此回看ensure后面的具体内容，比较承诺的到底是感受还是待遇。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>ensure equality 要落实的是接触政府的平等性，而D的 inspire hopes 只要求普通人受到鼓舞、产生期待。一个人心里有希望，并不等于真的可以与送礼捐款的人平等获得信息或会面机会；原段明确要求的比心理感受具体得多。\u003c/p>\n\u003cp>前者要求改变或保障实际对待，后者只是心理状态，两者不能互相替代。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>严格执行政府透明法律，是为了激起普通人的希望。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 inspire hopes 说激发心理上的希望，第六段的 ensure equality 则说确保一种公共关系，因此回看ensure后面的具体内容，比较承诺的到底是感受还是待遇。\u003c/p>\n\u003cp>ensure equality 要落实的是接触政府的平等性，而D的 inspire hopes 只要求普通人受到鼓舞、产生期待。一个人心里有希望，并不等于真的可以与送礼捐款的人平等获得信息或会面机会；原段明确要求的比心理感受具体得多。\u003c/p>\n\u003cp>后面的公务会议记录、财富来源等例子，也都是让行为可以记录、监督和规范，不是在安排面向公众的鼓舞宣传。普通人可能因此更有信心，但那是可能伴随的感受，不能替代作者明写的制度目标。D把实际待遇换成了情绪结果。\u003c/p>\n\u003cp>前者要求改变或保障实际对待，后者只是心理状态，两者不能互相替代。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.\u003c/p>\n\u003cp>作者要求公民与代表保障平等接触，列会议记录、游说规则与财富来源透明作为约束，防止礼物和捐款换取优待。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Transparency law exists to give ordinary people a sense of hope.\u003c/p>\n\u003cp>透明度法律的存在是为了给普通人带来希望感。\u003c/p>\n\u003c/blockquote>\n\u003cp>让公众怀有希望是可能联想的效果，文章要求的却是实际接触与待遇相等，不能用情绪改善替代制度保障。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>supportive\u003cbr>支持的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持裁决同时要求防范官员偏袒，本题应回答如何保障公众得到平等对待。目标是公平接触，不仅是列出法律涉及的某项活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>inspire hopes in average people\u003cbr>激起普通人的希望\u003c/p>\n\u003c/blockquote>\n\u003cp>前者要求改变或保障实际对待，后者只是心理状态，两者不能互相替代。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>39题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>39. C. guarantee fair play in official access\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：ensure equality of access to government 说的是公众接触政府时应当受到平等对待，接着通过会议记录、游说规则、财富来源信息来落实。\u003c/p>\n\u003cp>B：第6段先提出citizens、elected representatives和courts应确保equality of access to government，接着禁止因捐款或私人礼物而偏袒某些人，最后才列举会议记录、游说规则及财富来源信息。\u003c/p>\n\u003cp>C：official access 对应的是向政府获取信息、安排会面这一类接触。\u003c/p>\n\u003cp>D：ensure equality 要落实的是接触政府的平等性，而D的 inspire hopes 只要求普通人受到鼓舞、产生期待。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：法院裁决的矛盾性\u003c/strong>（段落1-2核心事件） 最高法院推翻麦克唐纳腐败定罪 // 但对其道德行为表示不齿（接受劳力士、法拉利等礼物）→ 原因：原审法官未正确指导陪审团（必须只看&quot;官方行为&quot;：涉及具体和未解决的职责相关问题）\u003c/p>\n\u003cp>↓（法律标准澄清）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：腐败的法律界定\u003c/strong>（段落3-4法律分析） 不构成腐败：仅帮助送礼者接触官员（除非有明确施压意图）→ 法院态度：【承认此类行为&quot;令人厌恶&quot; // 但法律要求证明具体利益（如批准合同）】→ 非官方行为：安排会面、打电话、主办活动\u003c/p>\n\u003cp>↓（法理基础）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：裁决的法理依据\u003c/strong>（段落5法律原理） 裁决合理性：定义了不构成犯罪的偏袒 → 民选领导人权利：帮助支持者处理官僚问题（无需担心贿赂指控）→ 代议制政府基本契约：公职人员应倾听并回应选民关切\u003c/p>\n\u003cp>↓（平衡机制）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：确保公平的制度需求\u003c/strong>（段落6制度建设） 责任主体：公民和民选代表（而非法院）确保平等接触 → 禁止行为：因捐款或礼物而偏袒（提供信息或安排会议）→ 透明度法律要求：【会议记录 + 游说规则 + 财富来源信息】\u003c/p>\n\u003cp>↓（深层思考）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：民主治理的核心原则\u003c/strong>（段落7-8价值观与评价） 偏袒vs腐败：（偏袒可能引发腐败看法 // 但并非总是腐败）→ 核心要求：避免双重标准（平等对待普通人和富人）→ 民主基石：【关系不能被购买 + 政府平等对待所有人 + 理解每个人的内在价值】→ 总体评价：裁决是反腐败和反偏袒斗争的进步\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：最高法院的裁决在法律上合理地区分了腐败与非犯罪性偏袒，但同时强调需要通过制度建设而非司法途径来确保政府的公平接触，维护民主社会平等原则。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Allowing Supporters to Purchase Decisions\u003c/p>\n\u003cp>B. Drawing a Boundary around Official Acts\u003c/p>\n\u003cp>C. A Limited Ruling with a Larger Democratic Meaning\u003c/p>\n\u003cp>D. Making Every Gift Legally Harmless\u003c/p>\n\u003cp>E. Why Representatives Must Still Hear People\u003c/p>\n\u003cp>F. Transparency as a Condition of Equal Access\u003c/p>\n\u003cp>G. Disapproval Is Not the Same as a Criminal Test\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A court can find conduct unattractive while rejecting the legal reasoning used to convict someone. These judgements address different questions. The first concerns what citizens should admire or condemn; the second concerns whether a defined offence has been proved under the applicable rules. Confusing them can make a narrow legal decision appear to endorse behaviour it actually criticises. A careful reading keeps the expression of disgust separate from the test required for criminal punishment.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>The phrase official act matters because not every contact with a public official is a decision on public business. Arranging a meeting may provide access without settling a particular issue. A criminal case must therefore identify the relevant action and the benefit connected to it, rather than treating every unpleasant exchange as identical. Defining the boundary carefully protects the force of the law by making clear what must actually be demonstrated.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>Representative government depends on officials receiving information from the people they serve. Constituents may ask for help with complicated procedures or bring a neglected concern to attention. If every response automatically threatened a bribery prosecution, ordinary representation would become difficult. This does not grant supporters a right to whatever they request. It explains why listening and assistance must remain possible while improper exchanges are still subject to legal scrutiny.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>The ability to hear people fairly depends on public visibility. Meeting records, lobbying rules and information about financial interests can make preferential access harder to hide. Such safeguards matter because an official should not offer a special hearing merely because someone has made a gift or contribution. Transparency is therefore connected to equality: citizens need ways to see whether the access promised by representative government is being distributed on an improper basis.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>A precise criminal boundary and a demanding ethical standard can support each other. The law should identify offences clearly, while citizens should insist that public service respects their equal worth. Neither aim is fulfilled by a system in which connections can simply be bought. A ruling that preserves legitimate representation can thus be welcomed without treating all favouritism as acceptable. Its larger value depends on combining legal clarity with transparent and accountable government.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：G. Disapproval Is Not the Same as a Criminal Test / 道德反感不同于刑事认定\u003c/strong>\u003c/p>\n\u003cp>区分道德批评与定罪规则，解释撤销定罪不等于赞同行为。\u003c/p>\n\u003cblockquote>\n\u003cp>A court can find conduct unattractive while rejecting the legal reasoning used to convict someone.\u003c/p>\n\u003cp>A careful reading keeps the expression of disgust separate from the test required for criminal punishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分道德批评与定罪规则 → 解释撤销定罪不等于赞同行为。\u003c/p>\n\u003c/blockquote>\n\u003cp>Disapproval对应公众或法院对行为反感，Criminal Test对应依照规则证明特定罪名；Not the Same保留道德评价与法律判断的不同对象。\u003c/p>\n\u003cp>最强干扰项D（Making Every Gift Legally Harmless）容易因相同话题进入考虑。但要求依法证明犯罪，不是宣布任何收礼都无害。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：B. Drawing a Boundary around Official Acts / 划定官方行为的边界\u003c/strong>\u003c/p>\n\u003cp>用会面与具体决策的区别解释官方行为边界。\u003c/p>\n\u003cblockquote>\n\u003cp>The phrase official act matters because not every contact with a public official is a decision on public business.\u003c/p>\n\u003cp>Defining the boundary carefully protects the force of the law by making clear what must actually be demonstrated.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>用会面与具体决策的区别解释官方行为边界。\u003c/p>\n\u003c/blockquote>\n\u003cp>Boundary对应区分会面接触与对具体公事作决定，Official Acts对应法律所要求识别并证明的官方行动。\u003c/p>\n\u003cp>最强干扰项A（Allowing Supporters to Purchase Decisions）容易因相同话题进入考虑。但区别接触与决定不允许购买决定，反而要求明确证明具体违法行为。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：E. Why Representatives Must Still Hear People / 代表为何仍须倾听民众\u003c/strong>\u003c/p>\n\u003cp>说明倾听选民是代议制职能，并保留反贿赂界限。\u003c/p>\n\u003cblockquote>\n\u003cp>Representative government depends on officials receiving information from the people they serve.\u003c/p>\n\u003cp>It explains why listening and assistance must remain possible while improper exchanges are still subject to legal scrutiny.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明倾听选民是代议制职能 → 并保留反贿赂界限。\u003c/p>\n\u003c/blockquote>\n\u003cp>Representatives对应为选民服务的官员，Must Still Hear People对应他们仍需听取问题并提供正常帮助；标题没有赋予任何人必获满足的权利。\u003c/p>\n\u003cp>最强干扰项A（Allowing Supporters to Purchase Decisions）容易因相同话题进入考虑。但回应关切不是满足一切要求，更不是用捐款购买官方决定。\u003c/p>\n\u003cp>\u003cstrong>43题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Transparency as a Condition of Equal Access / 以透明保障平等接触\u003c/strong>\u003c/p>\n\u003cp>将会议记录等透明措施与防止金钱左右接触机会相连。\u003c/p>\n\u003cblockquote>\n\u003cp>The ability to hear people fairly depends on public visibility.\u003c/p>\n\u003cp>Transparency is therefore connected to equality: citizens need ways to see whether the access promised by representative government is being distributed on an improper basis.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将会议记录等透明措施与防止金钱左右接触机会相连。\u003c/p>\n\u003c/blockquote>\n\u003cp>Transparency对应会议记录、游说规则及财务披露，Equal Access对应接触官员不应取决于礼物或捐款；标题把制度手段和目的接在一起。\u003c/p>\n\u003cp>最强干扰项D（Making Every Gift Legally Harmless）容易因相同话题进入考虑。但建立监督要求表明收礼及捐款关联仍需审查，不是全面免除责任。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：C. A Limited Ruling with a Larger Democratic Meaning / 有限裁决的更大民主意义\u003c/strong>\u003c/p>\n\u003cp>将法律明确性与平等廉正结合，说明支持裁决的条件和意义。\u003c/p>\n\u003cblockquote>\n\u003cp>A precise criminal boundary and a demanding ethical standard can support each other.\u003c/p>\n\u003cp>Its larger value depends on combining legal clarity with transparent and accountable government.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将法律明确性与平等廉正结合 → 说明支持裁决的条件和意义。\u003c/p>\n\u003c/blockquote>\n\u003cp>Limited Ruling对应明确刑事行为边界，Larger Democratic Meaning对应平等价值与公共问责；标题容纳支持裁决和反对买关系这两种并不冲突的立场。\u003c/p>\n\u003cp>最强干扰项A（Allowing Supporters to Purchase Decisions）容易因相同话题进入考虑。但最终明确拒绝购买关系，支持合法代表活动不等于认可金钱交易。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>An official may accept gifts in circumstances that the public finds deeply unattractive. A court reviewing a conviction must nevertheless ask a more specific question: whether the conduct meets the legal definition of the crime charged. Moral disapproval and that legal test should not be treated as interchangeable.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>A meeting, for example, can allow a constituent to explain a bureaucratic problem without guaranteeing the decision that person wants. Officials need to be able to hear such concerns. Otherwise a rule intended to prevent bribery could also obstruct the ordinary exchanges through which representative government functions.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>A healthy democracy rests on the equal worth of its members. The belief that official connections are for sale undermines that principle and weakens trust. Citizens therefore have reason to demand standards of integrity that work alongside precise criminal rules rather than using either as a substitute for the other.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>The legal test may turn on what counts as an official act. A decision on a particular public matter differs from simply arranging an introduction or a meeting. Evidence must establish the relevant act and its connection to a benefit, rather than rely only on the unpleasant appearance of a relationship.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>Representative government, however, does not promise privileged access to whoever gives the most. If listening is a public duty, the opportunity to be heard should not depend on a gift or campaign contribution. Protecting legitimate contact consequently makes safeguards against preferential treatment more, not less, important.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Visibility can expose a troubling difference between the treatment of an ordinary citizen and that of a wealthy supporter. Even where a criminal charge cannot be proved, that difference may deserve criticism and political consequences. A lawful boundary is not a complete description of the conduct a healthy democracy should expect.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>These safeguards include transparent records of meetings, workable lobbying rules and disclosure of financial interests. They give citizens information with which to question an official’s choices. Without such visibility, a formally narrow criminal rule could leave the public unable to judge whether access was being distributed fairly.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>Working alongside one another, clarity in law and integrity in public life allow a balanced judgement. A court’s reasoning may be sound even when the underlying behaviour remains objectionable. Supporting legitimate representation need not mean tolerating purchased influence; it can strengthen the case for transparent government that treats people fairly.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出道德评价与犯罪定义的区分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用会面解释合法倾听的必要性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>由偏袒危害推进到平等价值与双重标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>具体说明官方行为的认定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>转折指出倾听必须平等\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明透明能揭示尚未定罪但应被批评的偏袒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>将防护措施落实到透明规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>综合两条标准，落到支持合法代表和廉正政府\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出道德评价与犯罪定义的区分 → 具体说明官方行为的认定 → 用会面解释合法倾听的必要性 → 转折指出倾听必须平等 → 将防护措施落实到透明规则 → 说明透明能揭示尚未定罪但应被批评的偏袒 → 由偏袒危害推进到平等价值与双重标准 → 综合两条标准，落到支持合法代表和廉正政府\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → B → E → G → F → C → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、B、G、F、C。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → D → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Moral disapproval and that legal test should not be treated as interchangeable.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The legal test may turn on what counts as an official act.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A meeting, for example, can allow a constituent to explain a bureaucratic problem without guaranteeing the decision that person wants.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>legal test\u003c/code>，D继续处理这一对象，完成“具体说明官方行为的认定”。到本段末尾，讨论又落到\u003ccode>a meeting\u003c/code>，这正好为下一段“用会面解释合法倾听的必要性”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出道德评价与犯罪定义的区分 → 具体说明官方行为的认定 → 用会面解释合法倾听的必要性\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“用会面解释合法倾听的必要性”。它也属于同一论题，但若直接放在这里，就会跳过“具体说明官方行为的认定”这一必要环节；其段首“A meeting, for example, can allow a constituent to explain a bureaucratic problem without guaranteeing the decision that person wants.”需要的前提与A当前收束的对象不一致，后续也接不出B所需的\u003ccode>a meeting\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是D → B → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Evidence must establish the relevant act and its connection to a benefit, rather than rely only on the unpleasant appearance of a relationship.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A meeting, for example, can allow a constituent to explain a bureaucratic problem without guaranteeing the decision that person wants.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Representative government, however, does not promise privileged access to whoever gives the most.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a meeting\u003c/code>，B继续处理这一对象，完成“用会面解释合法倾听的必要性”。到本段末尾，讨论又落到\u003ccode>representative government\u003c/code>，这正好为下一段“转折指出倾听必须平等”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>具体说明官方行为的认定 → 用会面解释合法倾听的必要性 → 转折指出倾听必须平等\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“具体说明官方行为的认定”。它也属于同一论题，但若直接放在这里，就会跳过“用会面解释合法倾听的必要性”这一必要环节；其段首“The legal test may turn on what counts as an official act.”需要的前提与D当前收束的对象不一致，后续也接不出E所需的\u003ccode>representative government\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → G → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Protecting legitimate contact consequently makes safeguards against preferential treatment more, not less, important.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>These safeguards include transparent records of meetings, workable lobbying rules and disclosure of financial interests.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Visibility can expose a troubling difference between the treatment of an ordinary citizen and that of a wealthy supporter.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>safeguards\u003c/code>，G继续处理这一对象，完成“将防护措施落实到透明规则”。到本段末尾，讨论又落到\u003ccode>visibility\u003c/code>，这正好为下一段“说明透明能揭示尚未定罪但应被批评的偏袒”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>转折指出倾听必须平等 → 将防护措施落实到透明规则 → 说明透明能揭示尚未定罪但应被批评的偏袒\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“说明透明能揭示尚未定罪但应被批评的偏袒”。它也属于同一论题，但若直接放在这里，就会跳过“将防护措施落实到透明规则”这一必要环节；其段首“Visibility can expose a troubling difference between the treatment of an ordinary citizen and that of a wealthy supporter.”需要的前提与E当前收束的对象不一致，后续也接不出F所需的\u003ccode>visibility\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是G → F → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Without such visibility, a formally narrow criminal rule could leave the public unable to judge whether access was being distributed fairly.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Visibility can expose a troubling difference between the treatment of an ordinary citizen and that of a wealthy supporter.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A healthy democracy rests on the equal worth of its members.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>visibility\u003c/code>，F继续处理这一对象，完成“说明透明能揭示尚未定罪但应被批评的偏袒”。到本段末尾，讨论又落到\u003ccode>a healthy democracy\u003c/code>，这正好为下一段“由偏袒危害推进到平等价值与双重标准”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将防护措施落实到透明规则 → 说明透明能揭示尚未定罪但应被批评的偏袒 → 由偏袒危害推进到平等价值与双重标准\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“将防护措施落实到透明规则”。它也属于同一论题，但若直接放在这里，就会跳过“说明透明能揭示尚未定罪但应被批评的偏袒”这一必要环节；其段首“These safeguards include transparent records of meetings, workable lobbying rules and disclosure of financial interests.”需要的前提与G当前收束的对象不一致，后续也接不出C所需的\u003ccode>a healthy democracy\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是F → C → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A lawful boundary is not a complete description of the conduct a healthy democracy should expect.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A healthy democracy rests on the equal worth of its members.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Working alongside one another, clarity in law and integrity in public life allow a balanced judgement.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a healthy democracy\u003c/code>，C继续处理这一对象，完成“由偏袒危害推进到平等价值与双重标准”。到本段末尾，讨论又落到\u003ccode>work alongside\u003c/code>，这正好为下一段“综合两条标准，落到支持合法代表和廉正政府”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明透明能揭示尚未定罪但应被批评的偏袒 → 由偏袒危害推进到平等价值与双重标准 → 综合两条标准，落到支持合法代表和廉正政府\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“说明透明能揭示尚未定罪但应被批评的偏袒”。它也属于同一论题，但若直接放在这里，就会跳过“由偏袒危害推进到平等价值与双重标准”这一必要环节；其段首“Visibility can expose a troubling difference between the treatment of an ordinary citizen and that of a wealthy supporter.”需要的前提与F当前收束的对象不一致，后续也接不出H所需的\u003ccode>work alongside\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>integrity in public service\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>公共服务中的廉正\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>equal respect\u003c/td>\n\u003ctd>平等尊重\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>independent judgement\u003c/td>\n\u003ctd>独立判断\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>transparent decision-making\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>透明决策\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>attentive listening\u003c/td>\n\u003ctd>认真倾听\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>self-discipline\u003c/td>\n\u003ctd>自律\u003c/td>\n\u003ctd>人生哲理类：自律\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>mutual trust\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>相互信任\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a sense of fairness\u003c/td>\n\u003ctd>公平意识\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible leadership\u003c/td>\n\u003ctd>负责任的领导\u003c/td>\n\u003ctd>人生哲理类：榜样\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture contrasts privileged access with equal treatment.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画将特权接触与平等对待作对比。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is listening to B while remaining accountable to the wider public.\u003c/td>\n\u003ctd>A正倾听B，同时仍须向更广大公众负责。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene draws attention to the difference between personal favour and public duty.\u003c/td>\n\u003ctd>画面提醒人们区分私人偏袒与公共职责。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The proportion of people expressing trust in A increased from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>表示信任A的人群比例由X升至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures reveal unequal access to the same public service.\u003c/td>\n\u003ctd>这些数据揭示获得同一公共服务的机会不均等。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Public demand for transparent decisions rose during the period.\u003c/td>\n\u003ctd>这一时期公众对透明决策的需求上升。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage distinguishes a legal judgement from an ethical evaluation.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文区分法律判断与道德评价。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author supports A while insisting on safeguards against unfair treatment.\u003c/td>\n\u003ctd>作者支持A，同时坚持设立防止不公平待遇的保障。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion connects public responsibility with the equal worth of individuals.\u003c/td>\n\u003ctd>讨论将公共责任与个人的平等价值联系起来。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";

function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
