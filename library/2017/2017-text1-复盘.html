，句子在报告调查人员在机场安检中做了什么。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"22","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>22. C. An increase in the number of travelers.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：A的 restrictions on carry-on bags 是有关部门或航空公司施加的限制；原文围绕 their carry-on bags 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。\u003c/p>\n\u003cp>B：have resulted in long waits 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。\u003c/p>\n\u003cp>C：a rise in airline travel 是航空出行增加，C用 number of travelers 把它落到旅客数量上，所说的变化方向都是增加。\u003c/p>\n\u003cp>D：原文的 a secret check 是去年一次调查检查，句子在报告调查人员在机场安检中做了什么。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"23题 · 题干、题型与核心出处","level":2,"raw":"## 23题\n\n> The word “expedited” (Para. 5) is closest in meaning to ______.  \n> 第五段中的expedited，意思最接近哪个词？\n\n### 题型\n\n词义题。题干要求判断“第五段中的expedited，意思最接近哪个词？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> There is one step the TSA could take that would not require remodeling airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.\n\n通过背景审查的旅客可用专门通道，TSA于是把资源集中于较高风险者，为所有人节省时间。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"23","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The word “expedited” (Para. 5) is closest in meaning to ______.\u003cbr>第五段中的expedited，意思最接近哪个词？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>词义题。题干要求判断“第五段中的expedited，意思最接近哪个词？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>There is one step the TSA could take that would not require remodeling airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003c/blockquote>\n\u003cp>通过背景审查的旅客可用专门通道，TSA于是把资源集中于较高风险者，为所有人节省时间。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. quieter","level":3,"raw":"### A. quieter\n\n> 更安静的\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\n\n**错误类型：第一类——歪曲原意。**\n\nquieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\n\n上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\n\n**命题人借用的原文材料：**\n\n> Passengers who pass a background check are eligible to use expedited screening lanes.\n>\n> This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"23","option":"A"},"focusId":"focus-q23-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>更安静的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>quieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\u003c/p>\n\u003cp>上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass a background check are eligible to use expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. quieter","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第五段expedited screening lanes中的expedited表示更安静的。\n\nA的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\n\nquieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\n\n一个安静的通道并不自然导致所有人省时间。即使现实里安静与快速可以同时存在，这道词义题也只能用作者已经给出的解释来判断，不能自行给这个通道添加另一个优点。\n\n上下文的结果落在时间上，而quieter把比较的尺度换成了声音。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"23","option":"A"},"focusId":"focus-q23-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>更安静的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>quieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\u003c/p>\n\u003cp>上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass a background check are eligible to use expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第五段expedited screening lanes中的expedited表示更安静的。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\u003c/p>\n\u003cp>quieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\u003c/p>\n\u003cp>一个安静的通道并不自然导致所有人省时间。即使现实里安静与快速可以同时存在，这道词义题也只能用作者已经给出的解释来判断，不能自行给这个通道添加另一个优点。\u003c/p>\n\u003cp>上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. quieter","level":4,"raw":"#### 写作视角法\n\n原文第5段是这样写的：\n\n> Passengers who pass a background check are eligible to use expedited screening lanes.\n>\n> This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\n>\n> 通过背景审查的旅客可用专门通道，TSA于是把资源集中于较高风险者，为所有人节省时间。\n\n把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Passengers who pass the check may use quieter lanes with less noise.\n>\n> 通过核查的乘客可使用噪声更小的安静通道。\n\n更安静需要噪声或环境描述，后文却用节省时间解释通道作用，没有讨论声音。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"23","option":"A"},"focusId":"focus-q23-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>更安静的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>quieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\u003c/p>\n\u003cp>上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass a background check are eligible to use expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第五段expedited screening lanes中的expedited表示更安静的。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\u003c/p>\n\u003cp>quieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\u003c/p>\n\u003cp>一个安静的通道并不自然导致所有人省时间。即使现实里安静与快速可以同时存在，这道词义题也只能用作者已经给出的解释来判断，不能自行给这个通道添加另一个优点。\u003c/p>\n\u003cp>上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass a background check are eligible to use expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003cp>通过背景审查的旅客可用专门通道，TSA于是把资源集中于较高风险者，为所有人节省时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass the check may use quieter lanes with less noise.\u003c/p>\n\u003cp>通过核查的乘客可使用噪声更小的安静通道。\u003c/p>\n\u003c/blockquote>\n\u003cp>更安静需要噪声或环境描述，后文却用节省时间解释通道作用，没有讨论声音。\u0 e TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.\n>\n> It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck's fatal flaw. Upcoming reforms might bring the price to a more reasonable level. But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\n>\n> The TSA cannot continue diverting resources into underused PreCheck lanes while most of the traveling public suffers in unnecessary lines. It is long past time to make the program work.\n\n计划希望招募2500万人，实际远未达到；作者把高报名费称为fatal flaw，建议直接资助或另设降费办法。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"24","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>One problem with the PreCheck program is ______.\u003cbr>PreCheck计划存在的一个问题是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>问题细节题。题干要求判断“PreCheck计划存在的一个问题是什么？”，先按第5、6、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>There is one step the TSA could take that would not require remodeling airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck&#39;s fatal flaw. Upcoming reforms might bring the price to a more reasonable level. But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\u003c/p>\n\u003cp>The TSA cannot continue diverting resources into underused PreCheck lanes while most of the traveling public suffers in unnecessary lines. It is long past time to make the program work.\u003c/p>\n\u003c/blockquote>\n\u003cp>计划希望招募2500万人，实际远未达到；作者把高报名费称为fatal flaw，建议直接资助或另设降费办法。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. a dramatic reduction of its scale","level":3,"raw":"### A. a dramatic reduction of its scale\n\n> 规模大幅缩减\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“a dramatic [xxx] of its scale”，保留了相应遮挡。当时的定位线索是：A的 its scale 指计划规模，第六段的 not gotten anywhere close to that 回接第五段的目标人数；两处都涉及参加计划的人数，因此把这句与25 million的目标放在一起看。读完全文后，做题模式再经交叉验证排除A，最终选择D。\n\n**错误类型：第一类——歪曲原意。**\n\n第5段的2500万人是计划希望达到的报名人数，第6段的has not gotten anywhere close说明实际规模远未接近目标。两个位置组成的是实际值与目标值的差距。\n\n后文用sticker shock、85美元和fatal flaw解释报名不足，再建议降低价格。D的报名费过高对应这一明确成因；A则把横向的目标差距改成了纵向的规模下降。\n\n**命题人借用的原文材料：**\n\n> The TSA wants to enroll 25 million people in PreCheck.\n>\n> It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks.","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"A"},"focusId":"focus-q24-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>规模大幅缩减\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“a dramatic [xxx] of its scale”，保留了相应遮挡。当时的定位线索是：A的 its scale 流。实际称其win-win，并要求降费扩大参与，是支持方向而修补实施条件。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. its wrongly-directed implementation","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Getting Stuck in Security Lines  \n> 困在安检长队中\n\n把这个主旨直接代入24题题干：\n\n> 文章要让有用的预检方案真正缓解队伍，题干应回答阻碍使用的条件。人数不及目标与规模已经下降要分开，价格是否合理则有局部评价。\n\nB实际说的是：\n\n> its wrongly-directed implementation  \n> 实施方向错误\n\nB把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。\n\n从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"24","option":"B"},"focusId":"focus-q24-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-B-0\">\u003cblockquote>\n\u003cp>实施方向错误\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 wrongly-directed implementation 批评实施方向，第五段的 a win-win for travelers and the TSA 评价计划安排的用途；因此先回看这个评价，再接第六段指出的具体障碍，比较到底错在方向还是卡在推行条件。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>第五段说 a win-win for travelers and the TSA，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。这一安排的目标和基本方向得到了正面说明。B的 wrongly-directed implementation 则把问题说成实施朝错方向走。\u003c/p>\n\u003cp>B把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>PreCheck is supposed to be a win-win for travelers and the TSA.\u003c/p>\n\u003cp>Since the beginning, this price tag has been PreCheck&#39;s fatal flaw.\u003c/p>\n\u003cp>Upcoming reforms might bring the price to a more reasonable level.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focu 价。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its wrongly-directed implementation\u003cbr>实施方向错误\u003c/p>\n\u003c/blockquote>\n\u003cp>B把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the government’s reluctance to back it","level":3,"raw":"### C. the government’s reluctance to back it\n\n> 政府不愿支持\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C的 government’s reluctance 是政府的不愿意；第五段的 The TSA wants to enroll 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。\n\n**错误类型：第三类——无中生有。**\n\nThe TSA wants to enroll 明说TSA想扩大报名人数。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。\n\nC把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\n\n**命题人借用的原文材料：**\n\n> The TSA wants to enroll 25 million people in PreCheck.\n>\n> But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.","context":{"mode":"image","asset":"questions","focus":[250,2102,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"C"},"focusId":"focus-q24-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-C-0\">\u003cblockquote>\n\u003cp>政府不愿支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 government’s reluctance 是政府的不愿意；第五段的 The TSA wants to enroll 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>The TSA wants to enroll 明说TSA想扩大报名人数。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。\u003c/p>\n\u003cp>C把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the government’s reluctance to back it","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> PreCheck计划的一个问题是政府不愿支持。\n\nC的 government’s reluctance 是政府的不愿意；第五段的 The TSA wants to enroll 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。\n\nThe TSA wants to enroll 明说TSA想扩大报名人数。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。\n\n应当做某事与不愿做某事之间不能直接画等号。前者可能是在建议提高力度、改变方式或加快行动；只有原文出现明确拒绝或消极意愿，才有理由写reluctance。这里实际写了TSA的目标以及国会可采取的具体方式，不能把未做到位一律转译成主观上不愿支持。\n\nshould是建议，wants是已有意愿，两者都没有给出政府不愿支持这一事实。\n\nC把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。","context":{"mode":"image","asset":"questions","focus":[250,2102,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"24","option":"C"},"focusId":"focus-q24-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-C-0\">\u003cblockquote>\n\u003cp>政府不愿支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 government’s reluctance 是政府的不愿意；第五段的 The TSA wants to enroll 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>The TSA wants to enroll 明说TSA想扩大报名人数。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。\u003c/p>\n\u003cp>C把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>But Congress should look into doing so directly, by helping to finance PreCheck enrollment o n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The government is unwilling to support the program.\u003c/p>\n\u003cp>政府不愿支持该计划。\u003c/p>\n\u003c/blockquote>\n\u003cp>不愿支持应有拒绝的态度或行动。TSA明确要扩大规模，Congress should是作者提出资助建议，不能倒推出政府已经拒绝。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the government’s reluctance to back it","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Getting Stuck in Security Lines  \n> 困在安检长队中\n\n把这个主旨直接代入24题题干：\n\n> 文章要让有用的预检方案真正缓解队伍，题干应回答阻碍使用的条件。人数不及目标与规模已经下降要分开，价格是否合理则有局部评价。\n\nC实际说的是：\n\n> the government’s reluctance to back it  \n> 政府不愿支持\n\nC把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\n\n从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：C错误。**","context":{"mode":"image","asset":"questions","focus":[250,2102,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"24","option":"C"},"focusId":"focus-q24-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-C-0\">\u003cblockquote>\n\u003cp>政府不愿支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 government’s reluctance 是政府的不愿意；第五段的 The TSA wants to enroll 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>The TSA wants to enroll 明说TSA想扩大报名人数。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。\u003c/p>\n\u003cp>C把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\u003c/p>\n\u0 先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"24题结论","level":2,"raw":"### 24题结论\n\n> **24. D. an unreasonable price for enrollment**\n\nA：第5段的2500万人是计划希望达到的报名人数，第6段的has not gotten anywhere close说明实际规模远未接近目标。\n\nB：第五段说 a win-win for travelers and the TSA，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。\n\nC：The TSA wants to enroll 明说TSA想扩大报名人数。\n\nD：price for enrollment 的对象能和 this price tag 接上。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"24","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>24. D. an unreasonable price for enrollment\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：第5段的2500万人是计划希望达到的报名人数，第6段的has not gotten anywhere close说明实际规模远未接近目标。\u003c/p>\n\u003cp>B：第五段说 a win-win for travelers and the TSA，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。\u003c/p>\n\u003cp>C：The TSA wants to enroll 明说TSA想扩大报名人数。\u003c/p>\n\u003cp>D：price for enrollment 的对象能和 this price tag 接上。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：机场安检现状**（段落1-2问题呈现） 当前困境：提前到达时间从2小时增至3小时（主要机场安检队伍越来越长）→ 平衡困境：【美国人愿意容忍耗时安检换取安全（埃及航空804航班坠毁的提醒）// 但过度要求或安全不足都会削弱支持】→ 负面影响：浪费时间拖累经济和私人生活\n\n↓（原因分析）\n\n**逻辑层次2：长队形成的原因**（段落3-4原因剖析） 安检效果与现实矛盾：【去年秘密检查：武器几乎每次都能通过 → 加强安全措施 + 旅客增长（经济改善+低油价）→ 导致长时间等待】→ 具体原因：【1.政府未预料到旅客急剧增长（TSA急于招聘）+ 2.机场安检通道空间有限 + 3.乘客过度打包随身行李避免托运费（航空公司反驳）】\n\n↓（解决方案）\n\n**逻辑层次3：PreCheck计划的潜力**（段落5解决方案） PreCheck优势：不需要改造机场或急于招聘 → 双赢机制：【通过背景调查的乘客使用快速通道 → TSA专注于高风险旅客 → 节省所有人时间】→ 目标：招募2500万人\n\n↓（实施障碍）\n\n**逻辑层次4：PreCheck的问题与改革**（段落6问题分析） 核心问题：价格震惊（每五年85美元）= PreCheck的致命缺陷 → 结果：远未达到目标 → 改革方向：【即将到来的改革可能降价 + 国会应直接行动（资助注册或削减成本）】\n\n↓（紧迫呼吁）\n\n**逻辑层次5：改革的紧迫性**（段落7结论呼吁） 资源错配：TSA将资源投入未充分使用的PreCheck通道 // 大多数旅客在不必要的队伍中受苦 → 结论：早就该让PreCheck真正运作起来\n\n↑（全文主旨）\n\n全文核心观点：机场安检长队问题日益严重，虽然PreCheck计划提供了双赢解决方案，但其高昂的注册费用成为致命缺陷，需要国会采取行动降低成本，让这个计划真正发挥作用，解决当前资源错配和旅客痛苦的困境。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：机场安检现状\u003c/strong>（段落1-2问题呈现） 当前困境：提前到达时间从2小时增至3小时（主要机场安检队伍越来越长）→ 平衡困境：【美国人愿意容忍耗时安检换取安全（埃及航空804航班坠毁的提醒）// 但过度要求或安全不足都会削弱支持】→ 负面影响：浪费时间拖累经济和私人生活\u003c/p>\n\u003cp>↓（原因分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：长队形成的原因\u003c/strong>（段落3-4原因剖析） 安检效果与现实矛盾：【去年秘密检查：武器几乎每次都能通过 → 加强安全措施 + 旅客增长（经济改善+低油价）→ 导致长时间等待】→ 具体原因：【1.政府未预料到旅客急剧增长（TSA急于招聘）+ 2.机场安检通道空间有限 + 3.乘客过度打包随身行李避免托运费（航空公司反驳）】\u003c/p>\n\u003cp>↓（解决方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：PreCheck计划的潜力\u003c/strong>（段落5解决方案） PreCheck优势：不需要改造机场或急于招聘 → 双赢机制：【通过背景调查的乘客使用快速通道 → TSA专注于高风险旅客 → 节省所有人时间】→ 目标：招募2500万人\u003c/p>\n\u003cp>↓（实施障碍）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：PreCheck的问题与改革\u003c/strong>（段落6问题分析） 核心问题：价格震惊（每五年85美元）= PreCheck的致命缺陷 → 结果：远未达到目标 → 改革方向：【即将到来的改革可能降价 + 国会应直接行动（资助注册或削减成本）】\u003c/p>\n\u003cp>↓（紧迫呼吁）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：改革的紧迫性\u003c/strong>（段落7结论呼吁） 资源错配：TSA将资源投入未充分使用的PreCheck通道 // 大多数旅客在不必要的队伍中受苦 → 结论：早就该让PreCheck真正运作起来\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：机场安检长队问题日益严重，虽然PreCheck计划提供了双赢解决方案，但其高昂的注册费用成为致命缺陷，需要国会采取行动降低成本，让这个计划真正发挥作用，解决当前资源错配和旅客痛苦的困境。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n**答案：D. When Waiting Threatens Support for Security / 等待何时损害对安检的支持**\n\n承认安全需求，再说明时间代价会侵蚀公众支持。\n\n> Travellers may accept an inconvenient procedure when they believe it protects them.\n>\n> Demanding ever more time without making the benefit clear risks weakening that support, even among people who take the possibility of an attack seriously.\n\n段内推进：\n\n> 承认安全需求 → 再说明时间代价会侵蚀公众支持。\n\nWaiting对应工作和家庭时间损失，Threatens Support对应过高时间要求削弱公众对安检的支持；Security保留作者承认必要保护的前提。\n\n最强干扰项E（A Demand to Abandon Airport Checks）容易因相同话题进入考虑。但批评无效等待不等于要求放弃检查；开头已保留安检的合理价值。\n\n**41题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：D. When Waiting Threatens Support for Security / 等待何时损害对安检的支持\u003c/strong>\u003c/p>\n\u003cp>承认安全需求，再说明时间代价会侵蚀公众支持。\u003c/p>\n\u003cblockquote>\n\u003cp>Travellers may accept an inconvenient procedure when they believe it protects them.\u003c/p>\n\u003cp>Demanding ever more time without making the benefit clear risks weakening that support, even among people who take the possibility of an attack seriously.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>承认安全需求 → 再说明时间代价会侵蚀公众支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>Waiting对应工作和家庭时间损失，Threatens Support对应过高时间要求削弱公众对安检的支持；Security保留作者承认必要保护的前提。\u003c/p>\n\u003cp>最强干扰项E（A Demand to Abandon Airport Checks）容易因相同话题进入考虑。但批评无效等待不等于要求放弃检查；开头已保留安检的合理价值。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：A. Several Pressures Behind One Queue / 一条长队背后的多重压力**\n\n分开列出队伍形成的可能原因，说明不能凭表象选措施。\n\n> One visible queue can have several causes.\n>\n> The length of the queue alone does not tell an airport whether it needs more staff, a redesigned process or a better way to distribute passengers.\n\n段内推进：\n\n> 分开列出队伍形成的可能原因 → 说明不能凭表象选措施。\n\nSeveral Pressures对应客流、检查速度、人手、空间及行李因素，One Queue对应这些因素共同产生的可见长队；标题解释同一表象可能有不同成因。\n\n最强干扰项G（Proof That Longer Lines Mean Greater Safety）容易因相同话题进入考虑。但队伍长度只能显示拥堵，不能独立证明实际安全性提高。\n\n**42题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：A. Several Pressures Behind One Queue / 一条长队背后的多重压力\u003c/strong>\u003c/p>\n\u003cp>分开列出队伍形成的可能原因，说明不能凭表象选措施。\u003c/p>\n\u003cblockquote>\n\u003cp>One visible queue can have several causes.\u003c/p>\n\u003cp>The length of the queue alone does not tell an airport whether it needs more staff, a redesigned process or a better way to distribute passengers.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>分开列出队伍形成的可能原因 → 说明不能凭表象选措施。\u003c/p>\n\u003c/blockquote>\n\u003cp>Several Pressures对应客流、检查速度、人手、空间及行李因素，One Queue对应这些因素共同产生的可见长队；标题解释同一表象可能有不同成因。\u003c/p>\n\u003cp>最强干扰项G（Proof That Longer Lines Mean Greater Safety）容易因相同话题进入考虑。但队伍长度只能显示拥堵，不能独立证明实际安全性提高。\u003c/p>\n\u003cp>\u003cstrong>42题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：C. Separating Passengers by Assessed Risk / 按核查后的风险分流乘客**\n\n解释背景核查与快捷通道如何实现按风险分配资源。\n\n> A pre-screening programme offers a different way to use limited resources.\n>\n> Rather, relevant checks occur through a different process, making it possible to save time while concentrating effort where it is most needed.\n\n段内推进：\n\n> 解释背景核查与快捷通道如何实现按风险分配资源。\n\nSeparating Passengers对应快捷通道和其他检查分流，Assessed Risk对应先完成背景核查再判定资格；不能把分流读成不作检查。\n\n最强干扰项E（A Demand to Abandon Airport Checks）容易因相同话题进入考虑。但分流以背景核查为前提，不能概括成取消机场安全程序。\n\n**43题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：C. Separating Passengers by Assessed Risk / 按核查后的风险分流乘客\u003c/strong>\u003c/p>\n\u003cp>解释背景核查与快捷通道如何实现按风险分配资源。\u003c/p>\n\u003cblockquote>\n\u003cp>A pre-screening programme offers a different way to use limited resources.\u003c/p>\n\u003cp>Rather, relevant checks occur through a different process, making it possible to save time while concentrating effort where it is most needed.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释背景核查与快捷通道如何实现按风险分配资源。\u003c/p>\n\u003c/blockquote>\n\u003cp>Separating Passengers对应快捷通道和其他检查分流，Assessed Risk对应先完成背景核查再判定资格；不能把分流读成不作检查。\u003c/p>\n\u003cp>最强干扰项E（A Demand to Abandon Airport Checks）容易因相同话题进入考虑。但分流以背景核查为前提，不能概括成取消机场安全程序。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：B. The Price That Keeps Participation Low / 压低参与率的价格**\n\n由个人费用负担解释预检参与不足及整体分流失效。\n\n> A programme can promise a better experience and still attract too few participants.\n>\n> It limits the scale at which the programme can relieve pressure on the whole system.\n\n段内推进：\n\n> 由个人费用负担解释预检参与不足及整体分流失效。\n\nPrice对应报名费用，Keeps Participation Low对应乘客因费用放弃而使报名不足；标题还连接个人决定与整个体系分流效果。\n\n最强干扰项A（Several Pressures Behind One Queue）容易因相同话题进入考虑。但本段已锁定报名费这个具体障碍，不是在继续罗列长队的全部成因。\n\n**44题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：B. The Price That Keeps Participation Low / 压低参与率的价格\u003c/strong>\u003c/p>\n\u003cp>由个人费用负担解释预检参与不足及整体分流失效。\u003c/p>\n\u003cblockquote>\n\u003cp>A programme can promise a better experience and still attract too few participants.\u003c/p>\n\u003cp>It limits the scale at which the programme can relieve pressure on the whole system.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由个人费用负担解释预检参与不足及整体分流失效。\u003c/p>\n\u003c/blockquote>\n\u003cp>Price对应报名费用，Keeps Participation Low对应乘客因费用放弃而使报名不足；标题还连接个人决定与整个体系分流效果。\u003c/p>\n\u003cp>最强干扰项A（Several Pressures Behind One Queue）容易因相同话题进入考虑。但本段已锁定报名费这个具体障碍，不是在继续罗列长队的全部成因。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：F. Making an Existing Programme Work / 让既有计划真正奏效**\n\n从既有计划的执行障碍转入降低门槛、检验实际效果。\n\n> Before creating another complicated scheme, authorities can ask why an existing one fails to achieve its intended reach.\n>\n> A workable programme must improve the experience of the travelling public as a whole.\n\n段内推进：\n\n> 从既有计划的执行障碍转入降低门槛、检验实际效果。\n\nExisting Programme对应已经设立但参与不足的预检，Making It Work对应降低门槛并检验普通队伍是否真正改善；中心在执行成效。\n\n最强干扰项G（Proof That Longer Lines Mean Greater Safety）容易因相同话题进入考虑。但评价标准是全体旅客等待与必要检查的平衡，不是长队本身代表成效。\n\n**45题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：F. Making an Existing Programme Work / 让既有计划真正奏效\u003c/strong>\u003c/p>\n\u003cp>从既有计划的执行障碍转入降低门槛、检验实际效果。\u003c/p>\n\u003cblockquote>\n\u003cp>Before creating another complicated scheme, authorities can ask why an existing one fails to achieve its intended reach.\u003c/p>\n\u003cp>A workable programme must improve the experience of the travelling public as a whole.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从既有计划的执行障碍转入降低门槛、检验实际效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>Existing Programme对应已经设立但参与不足的预检，Making It Work对应降低门槛并检验普通队伍是否真正改善；中心在执行成效。\u003c/p>\n\u003cp>最强干扰项G（Proof That Longer Lines Mean Greater Safety）容易因相同话题进入考虑。但评价标准是全体旅客等待与必要检查的平衡，不是长队本身代表成效。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出安全与等待代价的平衡 |\n| B | 提出降低门槛且保留核查 |\n| C | 提出背景预检的双赢方案 |\n| D | 要求按整体等候与安全效果验收 |\n| E | 把预期收益转为参与率问题 |\n| F | 回答不报名的价格原因 |\n| G | 解释等待背后的多重压力 |\n| H | 以落实方案、改善公众体验收束 |\n\n全文推进：\n\n> 提出安全与等待代价的平衡 → 解释等待背后的多重压力 → 提出背景预检的双赢方案 → 把预期收益转为参与率问题 → 回答不报名的价格原因 → 提出降低门槛且保留核查 → 要求按整体等候与安全效果验收 → 以落实方案、改善公众体验收束\n\n完整顺序：\n\n**A → G → C → E → F → B → D → H**\n\n41—45：G、C、F、B、D。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出安全与等待代价的平衡\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>提出降低门槛且保留核查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>提出背景预检的双赢方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>要求按整体等候与安全效果验收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>把预期收益转为参与率问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>回答不报名的价格原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>解释等待背后的多重压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以落实方案、改善公众体验收束\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出安全与等待代价的平衡 → 解释等待背后的多重压力 → 提出背景预检的双赢方案 → 把预期收益转为参与率问题 → 回答不报名的价格原因 → 提出降低门槛且保留核查 → 要求按整体等候与安全效果验收 → 以落实方案、改善公众体验收束\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → G → C → E → F → B → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：G、C、F、B、D。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41位于全文第2个位置，完整衔接是A → G → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段A的结尾：\n\n> The challenge for authorities is to preserve safety without allowing waiting to become a needless burden on ordinary life.\n\n候选G的开头：\n\n> Waiting has grown for several reasons that should not be confused.\n\n后段C的开头：\n\n> Reducing those pressures does not always require a larger building.\n\n前文已经落到`waiting`，G继续处理这一对象，完成“解释等待背后的多重压力”。到本段末尾，讨论又落到`these pressures`，这正好为下一段“提出背景预检的双赢方案”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 提出安全与等待代价的平衡 → 解释等待背后的多重压力 → 提出背景预检的双赢方案\n\n最强候选C的功能是“提出背景预检的双赢方案”。它也属于同一论题，但若直接放在这里，就会跳过“解释等待背后的多重压力”这一必要环节；其段首“Reducing those pressures does not always require a larger building.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的`these pressures`。\n\n**41题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41位于全文第2个位置，完整衔接是A → G → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The challenge for authorities is to preserve safety without allowing waiting to become a needless burden on ordinary life.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Waiting has grown for several reasons that should not be confused.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing those pressures does not always require a larger building.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>waiting\u003c/code>，G继续处理这一对象，完成“解释等待背后的多重压力”。到本段末尾，讨论又落到\u003ccode>these pressures\u003c/code>，这正好为下一段“提出背景预检的双赢方案”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出安全与等待代价的平衡 → 解释等待背后的多重压力 → 提出背景预检的双赢方案\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“提出背景预检的双赢方案”。它也属于同一论题，但若直接放在这里，就会跳过“解释等待背后的多重压力”这一必要环节；其段首“Reducing those pressures does not always require a larger building.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的\u003ccode>these pressures\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42位于全文第3个位置，完整衔接是G → C → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段G的结尾：\n\n> Together these pressures produce a problem that simply asking travellers to arrive earlier cannot solve.\n\n候选C的开头：\n\n> Reducing those pressures does not always require a larger building.\n\n后段E的开头：\n\n> That possible gain depends on participation.\n\n前文已经落到`these pressures`，C继续处理这一对象，完成“提出背景预检的双赢方案”。到本段末尾，讨论又落到`a possible gain`，这正好为下一段“把预期收益转为参与率问题”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 解释等待背后的多重压力 → 提出背景预检的双赢方 k on which it depends.\n\n候选D的开头：\n\n> Improved access should be assessed by its effect on the ordinary queue.\n\n后段H的开头：\n\n> When waiting falls without weakening necessary checks, the programme has begun to justify its promise.\n\n前文已经落到`improving access`，D继续处理这一对象，完成“要求按整体等候与安全效果验收”。到本段末尾，讨论又落到`waiting falls`，这正好为下一段“以落实方案、改善公众体验收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 提出降低门槛且保留核查 → 要求按整体等候与安全效果验收 → 以落实方案、改善公众体验收束\n\n最强候选B的功能是“提出降低门槛且保留核查”。它也属于同一论题，但若直接放在这里，就会跳过“要求按整体等候与安全效果验收”这一必要环节；其段首“Lowering that perceived cost could involve a smaller charge or help with payment.”需要的前提与B当前收束的对象不一致，后续也接不出H所需的`waiting falls`。\n\n**45题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45位于全文第7个位置，完整衔接是B → D → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>These are ways of improving access to an existing programme, not proposals to let travellers avoid the background check on which it depends.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Improved access should be assessed by its effect on the ordinary queue.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>When waiting falls without weakening necessary checks, the programme has begun to justify its promise.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>improving access\u003c/code>，D继续处理这一对象，完成“要求按整体等候与安全效果验收”。到本段末尾，讨论又落到\u003ccode>waiting falls\u003c/code>，这正好为下一段“以落实方案、改善公众体验收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出降低门槛且保留核查 → 要求按整体等候与安全效果验收 → 以落实方案、改善公众体验收束\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“提出降低门槛且保留核查”。它也属于同一论题，但若直接放在这里，就会跳过“要求按整体等候与安全效果验收”这一必要环节；其段首“Lowering that perceived cost could involve a smaller charge or help with payment.”需要的前提与B当前收束的对象不一致，后续也接不出H所需的\u003ccode>waiting falls\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **efficient public services** | **高效公共服务** | **社会现象类：生活质量** | **宏观主题** |\n| public trust | 公众信任 | 人生哲理类：理解、信任、宽容 | 宏观主题 |\n| a sense of responsibility | 责任感 | 人生哲理类：责任感、奉献精神 | 个人主题 |\n| **respect for others’ time** | **尊重他人的时间** | **人生哲理类：理解、信任、宽容** | **个人主题** |\n| balanced judgement | 平衡的判断 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| coordinated action | 协调行动 | 人生哲理类：团结合作 | 宏观主题 |\n| **accessible services** | **便利可及的服务** | **社会现象类：生活质量** | **宏观主题** |\n| safer travel | 更安全的出行 | 社会现象类：旅游 | 宏观主题 |\n| practical innovation | 务实创新 | 人生哲理类：创新、开拓、与时俱进 | 个人主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>efficient public services\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>高效公共服务\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：生活质量\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>public trust\u003c/td>\n\u003ctd>公众信任\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a sense of responsibility\u003c/td>\n\u003ctd>责任感\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>respect for others’ time\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>尊重他人的时间\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>balanced judgement\u00 articleAnnotated","label":"2017英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows a long queue beside a little-used alternative route.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画显示一条长队旁边有一条利用不足的替代通道。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is losing valuable time while waiting for an essential service.\u003c/td>\n\u003ctd>A正因等待一项必要服务而损失宝贵时间。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast highlights a gap between a programme’s promise and its actual use.\u003c/td>\n\u003ctd>这一对比突出计划承诺与实际使用之间的差距。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The average waiting time increased from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>平均等待时间从X增加到Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Participation in A remained far below the intended level.\u003c/td>\n\u003ctd>A的参与人数仍远低于预期水平。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures suggest that a high fee may discourage wider participation.\u003c/td>\n\u003ctd>这些数据表明高费用可能阻碍更广泛的参与。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage examines the causes of a delay and a possible way to reduce it.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文分析延误的原因及一种可能的缓解办法。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author accepts the need for A but questions the excessive cost imposed on users.\u003c/td>\n\u003ctd>作者承认A的必要性，但质疑其给使用者带来的过高代价。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion focuses on making an existing programme work more effectively.\u003c/td>\n\u003ctd>讨论聚焦于让既有计划更有效地运行。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Several Pressures Behind One Queue\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. The Price That Keeps Participation Low\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Separating Passengers by Assessed Risk\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. When Waiting Threatens Support for Security\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. A Demand to Abandon Airport Checks\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Making an Existing Programme Work\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Proof That Longer Lines Mean Greater Safety\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>Travellers may accept an inconvenient procedure when they believe it protects them. Their patience is not unlimited, however. Hours lost in a queue affect work, family life and confidence in the organisation responsible. A security system therefore needs public support as well as formal authority. Demanding ever more time without making the benefit clear risks weakening that support, even among people who take the possibility of an attack seriously.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>One visible queue can have several causes. More passengers may arrive, checks may become slower, staff recruitment may lag behind demand, and the building may have limited space for screening lanes. Carry-on luggage can add another complication. These possibilities should be distinguished because they imply different remedies. The length of the queue alone does not tell an airport whether it needs more staff, a redesigned process or a better way to distribute passengers.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>A pre-screening programme offers a different way to use limited resources. Passengers who complete a background check can become eligible for faster lanes. Staff may then devote more attention to travellers who require closer examination. The advantage is not that some people are simply allowed to ignore security. Rather, relevant checks occur through a different process, making it possible to save time while concentrating effort where it is most needed.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>A programme can promise a better experience and still attract too few participants. If enrolment carries a charge that passengers consider excessive, many may decline to join. The result can be a small enrolled group beside a much larger group waiting in ordinary lanes. The fee then becomes more than an individual inconvenience. It limits the scale at which the programme can relieve pressure on the whole system.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>Before creating another complicated scheme, authorities can ask why an existing one fails to achieve its intended reach. Reducing enrolment costs, improving access or helping finance background checks may increase participation. Any change should be judged by whether it actually eases ordinary queues while preserving necessary scrutiny. Underused fast lanes beside exhausted travellers are not evidence of a successful reform. A workable programme must improve the experience of the travelling public as a whole.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>Passengers asked to arrive ever earlier for a domestic flight can see the cost of airport security in hours. They may still accept that cost when protection is credible. The challenge for authorities is to preserve safety without allowing waiting to become a needless burden on ordinary life.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Lowering that perceived cost could involve a smaller charge or help with payment. Authorities could also examine whether processing costs can be reduced. These are ways of improving access to an existing programme, not proposals to let travellers avoid the background check on which it depends.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Reducing those pressures does not always require a larger building. A programme that checks some passengers’ backgrounds in advance can make them eligible for faster screening. It can also free staff to concentrate on people who need closer examination. This creates a possible gain for both passengers and the security agency.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Improved access should be assessed by its effect on the ordinary queue. More enrolled passengers may make better use of fast lanes and release resources for other checks. But registration totals alone are insufficient: the agency must ask whether waiting falls and necessary security work remains effective.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>That possible gain depends on participation. A fast lane used by only a small minority does little for the long queue beside it. If authorities want the programme to change the whole system, they must understand why many otherwise eligible travellers do not enrol.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>One reason for not enrolling is the price. A fee attached to a background check may look modest to administrators but discouraging to a family deciding whether to join. The perceived cost can keep participation far below the level needed for the programme to fulfil its purpose.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>Waiting has grown for several reasons that should not be confused. Passenger numbers can rise at the same time as screening becomes more demanding. Staffing may fail to keep pace, while buildings leave little room for extra lanes. Together these pressures produce a problem that simply asking travellers to arrive earlier cannot solve.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>When waiting falls without weakening necessary checks, the programme has begun to justify its promise. The larger lesson is that security policy needs workable administration as well as serious intentions. Resources placed in an underused solution should be redirected toward making that solution useful to the public.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2017英语一Text 1重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>in advance\u003c/td>\n\u003ctd>提前\u003c/td>\n\u003ctd>authority\u003c/td>\n\u003ctd>n.当局\u003c/td>\n\u003ctd>rec
