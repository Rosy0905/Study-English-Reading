const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| in advance | 提前 | authority | n.当局 | recommend | v.建议 |\n| show up | 出现；到达 | catch a flight | 赶上航班 | domestic | a.国内的 |\n| flight | n.航班 | at least | 至少 | major | a.主要的 |\n| airport | n.机场 | increasingly | ad.日益 | massive | a.庞大的 |\n| security line | 安检队伍 |  |  |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 1重点词与语境","focus":[85,143,925,312],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>in advance\u003c/td>\n\u003ctd>提前\u003c/td>\n\u003ctd>authority\u003c/td>\n\u003ctd>n.当局\u003c/td>\n\u003ctd>recommend\u003c/td>\n\u003ctd>v.建议\u003c/td>\n\u003c/t \u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n"},{"section":"第二鸟 · 精读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\nFirst two hours + now three hours – this is how far in advance：(authorities are recommending → people show up：(to catch a domestic flight))，at least at some major U.S. airports：(with increasingly massive security lines).\n\n### 第2段\n\nAmericans are willing to tolerate：(time-consuming security procedures)：(in return for increased safety).\n\nThe crash of EgyptAir Flight 804：(which terrorists may have downed：(over the Mediterranean Sea)) → provides another tragic reminder：(of why).\n\nBut demanding too much：(of air travelers) // or providing too little security：(in return) → undermines public support：(for the process).\n\nAnd it should：Wasted time is a drag：(on Americans' economic and private lives) + not to mention infuriating.\n\n### 第3段\n\nLast year → the Transportation Security Administration (TSA) found：(in a secret check)：(that undercover investigators → were able to sneak weapons – both fake and real – → past airport security：(nearly every time they tried)).\n\nEnhanced security measures：(since then) + combined with a rise：(in airline travel)：(due to the improving economy + low oil prices) → have resulted in long waits：(at major airports：(such as Chicago's O'Hare International)).\n\nIt is not yet clear：(how much more effective → airline security has become) – // but the lines are obvious.\n\n### 第4段\n\nPart of the issue is：(that the government → did not anticipate → the steep increase：(in airline travel)) → so the TSA → is now rushing：(to get new screeners：(on the line)).\n\nPart of the issue is：(that airports have → only so much room：(for screening lanes)).\n\nAnother factor may be：(that more people → are trying to overpack → their carry-on bags：(to avoid checked-baggage fees)) // though the airlines → strongly dispute this.\n\n### 第5段\n\nThere is one step：(the TSA could take)：(that would not require：(remodeling airports // or rushing to hire))：Enroll more people：(in the PreCheck program).\n\nPreCheck is supposed to be → a win-win：(for travelers and the TSA).\n\nPassengers：(who pass → a background check) → are eligible to use：(expedited screening lanes).\n\nThis allows the TSA → to focus on travelers：(who are higher risk) → saving time：(for everyone involved).\n\nThe TSA wants to enroll → 25 million people：(in PreCheck).\n\n### 第6段\n\nIt has not gotten：(anywhere close to that) + one big reason → is sticker shock：(Passengers must pay → $85 every five years：(to process their background checks)).\n\nSince the beginning → this price tag → has been PreCheck's → fatal flaw.\n\nUpcoming reforms → might bring the price：(to a more reasonable level).\n\nBut Congress should look into：(doing so directly)：(by helping to finance → PreCheck enrollment // or to cut costs：(in other ways)).\n\n### 第7段\n\nThe TSA cannot continue → diverting resources：(into underused PreCheck lanes) // while most of the traveling public → suffers：(in unnecessary lines).\n\nIt is long past time → to make the program work.","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>First two hours + now three hours – this is how far in advance：(authorities are recommending → people show up：(to catch a domestic flight))，at least at some major U.S. airports：(with increasingly massive security lines).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Americans are willing to tolerate：(time-consuming security procedures)：(in return for increased safety).\u003c/p>\n\u003cp>The crash of EgyptAir Flight 804：(which terrorists may have downed：(over the Mediterranean Sea)) → provides another tragic reminder：(of why).\u003c/p>\n\u003cp>But demanding too much：(of air travelers) // or providing too little security：(in return) → undermines public support：(for the process).\u003c/p>\n\u003cp>And it should：Wasted time is a drag：(on Americans&#39; economic and private lives) + not to mention infuriating.\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Last year → the Transportation Security Administration (TSA) found：(in a secret check)：(that undercover investigators → were able to sneak weapons – both fake and real – → past airport security：(nearly every time they tried)).\u003c/p>\n\u003cp>Enhanced security measures：(since then) + combined with a rise：(in airline travel)：(due to the improving economy + low oil prices) → have resulted in long waits：(at major airports：(such as Chicago&#39;s O&#39;Hare International)).\u003c/p>\n\u003cp>It is not yet clear：(how much more effective → airline security has become) – // but the lines are obvious.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Part of the issue is：(that the government → did not anticipate → the steep increase：(in airline travel)) → so the TSA → is now rushing：(to get new screeners：(on the line)).\u003c/p>\n\u003cp>Part of the issue is：(that airports have → only so much room：(for screening lanes)).\u003c/p>\n\u003cp>Another factor may be：(that more people → are trying to overpack → their carry-on bags：(to avoid checked-baggage fees)) // though the airlines → strongly dispute this.\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>There is one step：(the TSA could take)：(that would not require：(remodeling airports // or rushing to hire))：Enroll more people：(in the PreCheck program).\u003c/p>\n\u003cp>PreCheck is supposed to be → a win-win：(for travelers and the TSA).\u003c/p>\n\u003cp>Passengers：(who pass → a background check) → are eligible to use：(expedited screening lanes).\u003c/p>\n\u003cp>This allows the TSA → to focus on travelers：(who are higher risk) → saving time：(for everyone involved).\u003c/p>\n\u003cp>The TSA wants to enroll → 25 million people：(in PreCheck).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>It has not gotten：(anywhere close to that) + one big reason → is sticker shock：(Passengers must pay → $85 every five years：(to process their background checks)).\u003c/p>\n\u003cp>Since the beginning → this price tag → has been PreCheck&#39;s → fatal flaw.\u003c/p>\n\u003cp>Upcoming reforms → might bring the price：(to a more reasonable level).\u003c/p>\n\u003cp>But Congress should look into：(doing so directly)：(by helping to finance → PreCheck enrollment // or to cut costs：(in other ways)).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>The TSA cannot continue → diverting resources：(into underused PreCheck lanes) // while most of the traveling public → suffers：(in unnecessary lines).\u003c/p>\n\u003cp>It is long past time → to make the program work.\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n先是两小时 + 现在三小时 – 这是多久提前：(当局正在建议 → 人们到达：(为了赶上国内航班))，至少在一些主要的美国机场：(有着越来越长的安检队伍)。\n\n### 第2段\n\n美国人愿意容忍：(耗时的安检程序)：(以换取更高的安全性)。\n\n埃及航空804航班的坠毁：(恐怖分子可能击落的：(在地中海上空)) → 提供了另一个悲剧性的提醒：(关于为什么)。\n\n但要求太多：(对航空旅客) // 或提供太少的安全保障：(作为回报) → 会削弱公众支持：(对这个过程)。\n\n而且这是应该的：浪费的时间是一种拖累：(对美国人的经济和私人生活) + 更不用说令人愤怒。\n\n### 第3段\n\n去年 → 运输安全管理局（TSA）发现：(在一次秘密检查中)：(卧底调查员 → 能够携带武器 – 假的和真的 – → 通过机场安检：(几乎每次尝试都成功))。\n\n加强的安全措施：(从那时起) + 结合增长：(在航空旅行中)：(由于经济改善 + 低油价) → 导致了长时间等待：(在主要机场：(比如芝加哥奥黑尔国际机场))。\n\n还不清楚：(多么更有效 → 航空安检已经变得) – // 但队伍是明显的。\n\n### 第4段\n\n问题的一部分是：(政府 → 没有预料到 → 急剧增长：(在航空旅行中)) → 所以TSA → 现在正急于：(让新的安检员：(上岗))。\n\n问题的一部分是：(机场只有 → 这么多空间：(用于安检通道))。\n\n另一个因素可能是：(更多人 → 正试图过度打包 → 他们的随身行李：(为了避免托运行李费)) // 尽管航空公司 → 强烈反驳这一点。\n\n### 第5段\n\n有一个步骤：(TSA可以采取)：(不需要：(改造机场 // 或急于招聘))：让更多人加入：(PreCheck计划)。\n\nPreCheck应该是 → 一个双赢：(对旅客和TSA来说)。\n\n乘客：(通过 → 背景调查的) → 有资格使用：(快速安检通道)。\n\n这使TSA能够 → 专注于旅客：(风险更高的) → 节省时间：(对所有相关人员)。\n\nTSA想要招募 → 2500万人：(加入PreCheck)。\n\n### 第6段\n\n它还没有达到：(接近那个目标) + 一个重要原因 → 是价格震惊：(乘客必须支付 → 每五年85美元：(来处理他们的背景调查))。\n\n从一开始 → 这个价格标签 → 一直是PreCheck的 → 致命缺陷。\n\n即将到来的改革 → 可能会把价格带到：(一个更合理的水平)。\n\n但国会应该考虑：(直接这样做)：(通过帮助资助 → PreCheck注册 // 或削减成本：(以其他方式))。\n\n### 第7段\n\nTSA不能继续 → 转移资源：(到未充分使用的PreCheck通道) // 当大多数旅行公众 → 受苦：(在不必要的队伍中)。\n\n早就该是时候了 → 让这个计划运作起来。","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>先是两小时 + 现在三小时 – 这是多久提前：(当局正在建议 → 人们到达：(为了赶上国内航班))，至少在一些主要的美国机场：(有着越来越长的安检队伍)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>美国人愿意容忍：(耗时的安检程序)：(以换取更高的安全性)。\u003c/p>\n\u003cp>埃及航空804航班的坠毁：(恐怖分子可能击落的：(在地中海上空)) → 提供了另一个悲剧性的提醒：(关于为什么)。\u003c/p>\n\u003cp>但要求太多：(对航空旅客) // 或提供太少的安全保障：(作为回报) → 会削弱公众支持：(对这个过程)。\u003c/p>\n\u003cp>而且这是应该的：浪费的时间是一种拖累：(对美国人的经济和私人生活) + 更不用说令人愤怒。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>去年 → 运输安全管理局（TSA）发现：(在一次秘密检查中)：(卧底调查员 → 能够携带武器 – 假的和真的 – → 通过机场安检：(几乎每次尝试都成功))。\u003c/p>\n\u003cp>加强的安全措施：(从那时起) + 结合增长：(在航空旅行中)：(由于经济改善 + 低油价) → 导致了长时间等待：(在主要机场：(比如芝加哥奥黑尔国际机场))。\u003c/p>\n\u003cp>还不清楚：(多么更有效 → 航空安检已经变得) – // 但队伍是明显的。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>问题的一部分是：(政府 → 没有预料到 → 急剧增长：(在航空旅行中)) → 所以TSA → 现在正急于：(让新的安检员：(上岗))。\u003c/p>\n\u003cp>问题的一部分是：(机场只有 → 这么多空间：(用于安检通道))。\u003c/p>\n\u003cp>另一个因素可能是：(更多人 → 正试图过度打包 → 他们的随身行李：(为了避免托运行李费)) // 尽管航空公司 → 强烈反驳这一点。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>有一个步骤：(TSA可以采取)：(不需要：(改造机场 // 或急于招聘))：让更多人加入：(PreCheck计划)。\u003c/p>\n\u003cp>PreCheck应该是 → 一个双赢：(对旅客和TSA来说)。\u003c/p>\n\u003cp>乘客：(通过 → 背景调查的) → 有资格使用：(快速安检通道)。\u003c/p>\n\u003cp>这使TSA能够 → 专注于旅客：(风险更高的) → 节省时间：(对所有相关人员)。\u003c/p>\n\u003cp>TSA想要招募 → 2500万人：(加入PreCheck)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>它还没有达到：(接近那个目标) + 一个重要原因 → 是价格震惊：(乘客必须支付 → 每五年85美元：(来处理他们的背景调查))。\u003c/p>\n\u003cp>从一开始 → 这个价格标签 → 一直是PreCheck的 → 致命缺陷。\u003c/p>\n\u003cp>即将到来的改革 → 可能会把价格带到：(一个更合理的水平)。\u003c/p>\n\u003cp>但国会应该考虑：(直接这样做)：(通过帮助资助 → PreCheck注册 // 或削减成本：(以其他方式))。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>TSA不能继续 → 转移资源：(到未充分使用的PreCheck通道) // 当大多数旅行公众 → 受苦：(在不必要的队伍中)。\u003c/p>\n\u003cp>早就该是时候了 → 让这个计划运作起来。\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"长难句翻译练习（英一必修，英二选修)","level":2,"raw":"## 长难句翻译练习（英一必修，英二选修 章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"25题 · 题干、题型与核心出处","level":2,"raw":"## 25题\n\n**Which of the following would be the best title for the text?**\n\n下列哪一项最适合作为本文的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Getting Stuck in Security Lines**\n\n困在安检长队中\n\nB. **PreCheck—a Belated Solution**\n\nPreCheck——一个迟来的解决办法\n\nC. **Less Screening for More Safety**\n\n更少的安检换来更高的安全\n\nD. **Underused PreCheck Lanes**\n\n使用不足的PreCheck通道\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 从提前两小时变成三小时写起，展示一些美国主要机场的安检队伍和旅客耗时。 | 先摆出眼前的问题 |\n| 2 | 先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。 | 再说为什么不能只看一头 |\n| 3 | 把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。 | 接着交代事情怎么变成这样 |\n| 4 | 分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。 | 然后把几个原因分开说 |\n| 5 | 提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。 | 接着提出一个可行的办法 |\n| 6 | 说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。 | 再说这个办法卡在哪里 |\n| 7 | 把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。 | 最后说该让办法真正起作用了 |","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"25","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下列哪一项最适合作为本文的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Getting Stuck in Security Lines\u003c/strong>\u003c/p>\n\u003cp>困在安检长队中\u003c/p>\n\u003cp>B. \u003cstrong>PreCheck—a Belated Solution\u003c/strong>\u003c/p>\n\u003cp>PreCheck——一个迟来的解决办法\u003c/p>\n\u003cp>C. \u003cstrong>Less Screening for More Safety\u003c/strong>\u003c/p>\n\u003cp>更少的安检换来更高的安全\u003c/p>\n\u003cp>D. \u003cstrong>Underused PreCheck Lanes\u003c/strong>\u003c/p>\n\u003cp>使用不足的PreCheck通道\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从提前两小时变成三小时写起，展示一些美国主要机场的安检队伍和旅客耗时。\u003c/td>\n\u003ctd>先摆出眼前的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。\u003c/td>\n\u003ctd>再说为什么不能只看一头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。\u003c/td>\n\u003ctd>接着交代事情怎么变成这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。\u003c/td>\n\u003ctd>然后把几个原因分开说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。\u003c/td>\n\u003ctd>接着提出一个可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。\u003c/td>\n\u003ctd>再说这个办法卡在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\u003c/td>\n\u003ctd>最后说该让办法真正起作用了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Getting Stuck in Security Lines","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### A. Getting Stuck in Security Lines\n\n困在安检长队中","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"A"},"focusId":"focus-q25-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>困在安检长队中\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Getting Stuck in Security Lines","level":3,"raw":"#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n困在安检长队中\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 摆出旅客必须提前更久到机场的安检长队问题。 | 先摆出眼前的问题 |\n| 2 | 说明安全需要与时间代价都不能忽略，安检队伍不是越长越值得支持。 | 再说为什么不能只看一头 |\n| 3 | 交代安保加强与客流增加如何共同形成当前排队。 | 接着交代事情怎么变成这样 |\n| 4 | 分别解释招人滞后、通道空间和随身行李等可能成因。 | 然后把几个原因分开说 |\n| 5 | 提出扩大预检参与来减少普遍等待的可行办法。 | 接着提出一个可行的办法 |\n| 6 | 指出报名高价阻碍参与，使这个分流办法难以起效。 | 再说这个办法卡在哪里 |\n| 7 | 要求修正阻碍，让预检真正缓解公众困在安检队伍中的局面。 | 最后说该让办法真正起作用了 |\n\nA的Getting Stuck先对应开头旅客需要提前两三小时，再对应后文long waits和结尾unnecessary lines。它并不是只概括“排队”一个名词：第二段讨论为什么不能让旅客承担无限时间代价，第三、四段说明长队成因，第五、六段找办法并解释办法受阻，都是在处理同一个等待问题。\n\n后半篇的PreCheck不必被标题逐字点名，因为它是作者为长队问题提出的解决工具。把A代入七行，前面的现象、原因和后面的方案、障碍、催促能够按顺序相接，没有哪一大块需要另找文章中心。\n\n标题说“困在长队中”，能否同时容纳作者后来寻找减少等待的办法？\n\n能。解决办法始终在回应这个被困的问题，而不是另换成一个与长队无关的新话题。A保留。\n\n---\n\n判断：\n\n**A 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"A"},"focusId":"focus-q25-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>困在安检长队中\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-A-1\">\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>困在安检长队中\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>摆出旅客必须提前更久到机场的安检长队问题。\u003c/td>\n\u003ctd>先摆出眼前的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明安全需要与时间代价都不能忽略，安检队伍不是越长越值得支持。\u003c/td>\n\u003ctd>再说为什么不能只看一头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>交代安保加强与客流增加如何共同形成当前排队。\u003c/td>\n\u003ctd>接着交代事情怎么变成这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>分别解释招人滞后、通道空间和随身行李等可能成因。\u003c/td>\n\u003ctd>然后把几个原因分开说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提出扩大预检参与来减少普遍等待的可行办法。\u003c/td>\n\u003ctd>接着提出一个可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>指出报名高价阻碍参与，使这个分流办法难以起效。\u003c/td>\n\u003ctd>再说这个办法卡在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求修正阻碍，让预检真正缓解公众困在安检队伍中的局面。\u003c/td>\n\u003ctd>最后说该让办法真正起作用了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A的Getting Stuck先对应开头旅客需要提前两三小时，再对应后文long waits和结尾unnecessary lines。它并不是只概括“排队”一个名词：第二段讨论为什么不能让旅客承担无限时间代价，第三、四段说明长队成因，第五、六段找办法并解释办法受阻，都是在处理同一个等待问题。\u003c/p>\n\u003cp>后半篇的PreCheck不必被标题逐字点名，因为它是作者为长队问题提出的解决工具。把A代入七行，前面的现象、原因和后面的方案、障碍、催促能够按顺序相接，没有哪一大块需要另找文章中心。\u003c/p>\n\u003cp>标题说“困在长队中”，能否同时容纳作者后来寻找减少等待的办法？\u003c/p>\n\u003cp>能。解决办法始终在回应这个被困的问题，而不是另换成一个与长队无关的新话题。A保留。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. PreCheck—a Belated Solution","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### B. PreCheck—a Belated Solution\n\nPreCheck——一个迟来的解决办法","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"B"},"focusId":"focus-q25-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>PreCheck——一个迟来的解决办法\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. PreCheck—a Belated Solution","level":3,"raw":"#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\nPreCheck——一个迟来的解决办法\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 以安检拥堵为眼前问题，指出预检解决办法本应更早出现。 | 先摆出眼前的问题 |\n| 2 | 说明迟来的办法也必须兼顾安全与效率，不能只求速度。 | 再说为什么不能只看一头 |\n| 3 | 追溯迟迟没有采用预检解决方案怎样令排队问题累积。 | 接着交代事情怎么变成这样 |\n| 4 | 分开说明延误推出预检的行政、人员或资源原因。 | 然后把几个原因分开说 |\n| 5 | 提出终于到来的预检方案，展示它为何能够解决旧问题。 | 接着提出一个可行的办法 |\n| 6 | 说明这项迟来方案推出后仍被费用等障碍卡住。 | 再说这个办法卡在哪里 |\n| 7 | 要求把迟到的方案及时落实，弥补此前错失的改进时间。 | 最后说该让办法真正起作用了 |\n\nB最吸引人的地方是PreCheck确实占了后三段。但a Belated Solution不仅点名方案，还把“迟来”作为对方案的关键判断。若按B写，第三、四段理应解释为什么这个办法迟迟未出现，第五段理应突出它终于被提出；实际第三、四段主要解释机场长队，第五段介绍的是一个已经有名称、通道和报名目标的现成计划。\n\n第六段说没接近报名目标，并批评费用，不等于说方案本身刚刚出现。结尾long past time催促它真正发挥作用，也不能自动倒回成“提出方案太迟”。方案出现得迟，与已有方案迟迟没有做好，是不同时间关系。\n\n已有计划应当早日运转好，是否等于作者在介绍一个刚刚迟到的方案？\n\n不等于。B把改善迫切性改成方案出现的时间判断，并缩掉前半篇大量独立的长队分析，排除。\n\n---\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"B"},"focusId":"focus-q25-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>PreCheck——一个迟来的解决办法\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-B-1\">\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>PreCheck——一个迟来的解决办法\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以安检拥堵为眼前问题，指出预检解决办法本应更早出现。\u003c/td>\n\u003ctd>先摆出眼前的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明迟来的办法也必须兼顾安全与效率，不能只求速度。\u003c/td>\n\u003ctd>再说为什么不能只看一头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追溯迟迟没有采用预检解决方案怎样令排队问题累积。\u003c/td>\n\u003ctd>接着交代事情怎么变成这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>分开说明延误推出预检的行政、人员或资源原因。\u003c/td>\n\u003ctd>然后把几个原因分开说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提出终于到来的预检方案，展示它为何能够解决旧问题。\u003c/td>\n\u003ctd>接着提出一个可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明这项迟来方案推出后仍被费用等障碍卡住。\u003c/td>\n\u003ctd>再说这个办法卡在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求把迟到的方案及时落实，弥补此前错失的改进时间。\u003c/td>\n\u003ctd>最后说该让办法真正起作用了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B最吸引人的地方是PreCheck确实占了后三段。但a Belated Solution不仅点名方案，还把“迟来”作为对方案的关键判断。若按B写，第三、四段理应解释为什么这个办法迟迟未出现，第五段理应突出它终于被提出；实际第三、四段主要解释机场长队，第五段介绍的是一个已经有名称、通道和报名目标的现成计划。\u003c/p>\n\u003cp>第六段说没接近报名目标，并批评费用，不等于说方案本身刚刚出现。结尾long past time催促它真正发挥作用，也不能自动倒回成“提出方案太迟”。方案出现得迟，与已有方案迟迟没有做好，是不同时间关系。\u003c/p>\n\u003cp>已有计划应当早日运转好，是否等于作者在介绍一个刚刚迟到的方案？\u003c/p>\n\u003cp>不等于。B把改善迫切性改成方案出现的时间判断，并缩掉前半篇大量独立的长队分析，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Less Screening for More Safety","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### C. Less Screening for More Safety\n\n更少的安检换来更高的安全","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"C"},"focusId":"focus-q25-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>更少的安检换来更高的安全\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Less Screening for More Safety","level":3,"raw":"#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n更少的安检换来更高的安全\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 提出安检过量反而可能损害安全的眼前问题。 | 先摆出眼前的问题 |\n| 2 | 比较检查数量与真正安全效果，说明不能把查得多直接等同于安全高。 | 再说为什么不能只看一头 |\n| 3 | 交代不分风险增加检查怎样占用资源而削弱重点防护。 | 接着交代事情怎么变成这样 |\n| 4 | 分开说明无差别检查在人员、时间和通道上的资源浪费。 | 然后把几个原因分开说 |\n| 5 | 提出减少低风险旅客检查，把力量集中到高风险者以提高安全。 | 接着提出一个可行的办法 |\n| 6 | 指出阻碍减少无效检查的执行条件，说明怎样消除障碍。 | 再说这个办法卡在哪里 |\n| 7 | 要求落实少查低风险者而增强整体安全的方案。 | 最后说该让办法真正起作用了 |\n\nC同时出现Screening与Safety，看上去贴近第二段的安全交换，也容易让人联想到第五段的分流。然而Less Screening for More Safety要求全文建立一个很具体的方向：检查更少，所以安全更高。实际第五段明写的是让TSA关注风险更高的人、给所有人省时间，没有比较减少检查前后安全提高多少。\n\n第三段还特意说安保变得怎样的效果尚不清楚，眼前能看到的是队伍。若选择C，就要把未确定的安全结果改成标题里的肯定收益。七行对照下来，成因、收费、报名规模的说明也并不是围绕“减少检查次数”安排的。\n\n更有针对性地分配检查注意力，能否直接概括为少做安检便得到更多安全？\n\n不能。C增加了原文没有建立的检查数量与安全提升关系，排除。\n\n---\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"C"},"focusId":"focus-q25-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-C-0\">\u003cp>\u003cstrong>Which of the following w itle for the text?**\n\n### D. Underused PreCheck Lanes\n\n使用不足的PreCheck通道","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"D"},"focusId":"focus-q25-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>使用不足的PreCheck通道\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Underused PreCheck Lanes","level":3,"raw":"#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n使用不足的PreCheck通道\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 摆出预检通道闲置、资源没有被充分利用的现象。 | 先摆出眼前的问题 |\n| 2 | 说明通道使用率与安全把关需要同时考虑，不能为填满通道而放弃核查。 | 再说为什么不能只看一头 |\n| 3 | 追溯预检通道为何形成当前利用不足的局面。 | 接着交代事情怎么变成这样 |\n| 4 | 分别说明费用、招募和流程安排怎样让通道空闲。 | 然后把几个原因分开说 |\n| 5 | 提出提高预检通道利用率的具体招募办法。 | 接着提出一个可行的办法 |\n| 6 | 指出提高使用率的方案仍受高价等条件阻挡。 | 再说这个办法卡在哪里 |\n| 7 | 要求消除阻碍，让这些已经设置的预检通道被充分利用。 | 最后说该让办法真正起作用了 |\n\nD在结尾能找到接近的画面：预检通道与大多数旅客排队形成对照，第六段也说报名人数不足。但把D代入全文，第一至四段就都应当围绕预检通道利用率展开；实际这些段先讨论美国机场普遍的安检队伍、旅客时间代价和多种原因，PreCheck到第五段才作为办法进入。\n\n这并不是“标题出现得晚就一定错”。真正的问题是D把解决办法中一个局部的使用状态，抬成覆盖全部段落的中心。前面的空间限制、航空出行增加和安检代价，不能都改写成预检通道利用不足的成因，否则就改变了作者本来的展开对象。\n\n后三段涉及的预检利用问题，能否替代前四段已经建立的整个安检长队问题？\n\n不能。D覆盖一个具体障碍，却装不下全文为何讨论它，排除。\n\n---\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"D"},"focusId":"focus-q25-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>使用不足的PreCheck通道\u003c/p>\n\u0 470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"25","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>25. A. Getting Stuck in Security Lines\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Getting Stuck in Security Lines / 困在安检长队中\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"21题 · 题干、题型与核心出处","level":2,"raw":"## 21题\n\n> The crash of EgyptAir Flight 804 is mentioned to ______.  \n> 提到埃及航空804航班坠毁，是为了说明什么？\n\n### 题型\n\n例子作用题。题干要求判断“提到埃及航空804航班坠毁，是为了说明什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Americans are willing to tolerate time-consuming security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why. But demanding too much of air travelers or providing too little security in return undermines public support for the process. And it should: Wasted time is a drag on Americans' economic and private lives, not to mention infuriating.\n\n先说美国人愿意以耗时安检换取安全，紧接坠机案例解释why，再用But限制可接受的时间与安全交换。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"21","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The crash of EgyptAir Flight 804 is mentioned to ______.\u003cbr>提到埃及航空804航班坠毁，是为了说明什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>例子作用题。题干要求判断“提到埃及航空804航班坠毁，是为了说明什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Americans are willing to tolerate time-consuming security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why. But demanding too much of air travelers or providing too little security in return undermines public support for the process. And it should: Wasted time is a drag on Americans&#39; economic and private lives, not to mention infuriating.\u003c/p>\n\u003c/blockquote>\n\u003cp>先说美国人愿意以耗时安检换取安全，紧接坠机案例解释why，再用But限制可接受的时间与安全交换。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. stress the urgency to strengthen security worldwide","level":3,"raw":"### A. stress the urgency to strengthen security worldwide\n\n> 强调在全球加强安保的紧迫性\n\n**做题模式中的状态：** 第一轮A排除。当时选项呈现为“stress the [xxx] to strengthen security worldwide”，保留了相应遮挡。当时的定位线索是：A的 strengthen security worldwide 谈加强安保，第二段的 increased safety 也谈安全增加；因此回看这句以及紧接着的坠机例子，看看例子是在解释前一句，还是另起一个全球性的倡议。\n\n**错误类型：第一类——歪曲原意。**\n\n先看前一句的主语Americans和动作are willing to tolerate：这里写的是美国人为什么愿意接受安检。increased safety 是他们想换来的东西，不是作者正在向全世界发布的要求。下一句末尾的why接着问“为什么愿意”，于是坠机事件就是对这个理由的提醒。\n\nA把这一步写成 strengthen security worldwide，不仅多出worldwide的范围，还把“解释已有的容忍”改成“强调加强安保”。坠机发生在地中海上空，并不使它在这段中的作用变成全球倡议；发生地点和用例目的要分开。\n\n**命题人借用的原文材料：**\n\n> Americans are willing to tolerate time-consuming security procedures in return for increased safety.\n>\n> The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why.","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"21","option":"A"},"focusId":"focus-q21-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-A-0\">\u003cblockquote>\n\u003cp>强调在全球加强安保的紧迫性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“stress the [xxx] to strengthen security worldwide”，保留了相应遮挡。当时的定位线索是：A的 strengthen security worldwide 谈加强安保，第二段的 increased safety 也谈安全增加；因此回看这句以及紧接着的坠机例子，看看例子是在解释前一句，还是另起一个全球性的倡议。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>先看前一句的主语A ：D的 privacy protection 要找的是隐私方面的保护；第二段出现了 private lives，两处都带有“私人”的意思，因此回看private lives所在的完整句，确认它说的究竟是哪一种影响。\n\n**错误类型：第三类——无中生有。**\n\n这里 private lives 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。真正产生影响的主语是Wasted time，后面用is a drag说明浪费时间带来的拖累。D的 privacy protection 则是防止个人信息或私人领域被侵犯，已经把“生活被耽误”换成“隐私需要保护”。\n\nD把private lives的生活范围换成privacy protection的保护议题，不能解释该例子的作用。\n\n**命题人借用的原文材料：**\n\n> And it should: Wasted time is a drag on Americans' economic and private lives, not to mention infuriating.","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"21","option":"D"},"focusId":"focus-q21-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-D-0\">\u003cblockquote>\n\u003cp>强调保护隐私的重要性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 privacy protection 要找的是隐私方面的保护；第二段出现了 private lives，两处都带有“私人”的意思，因此回看private lives所在的完整句，确认它说的究竟是哪一种影响。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>这里 private lives 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。真正产生影响的主语是Wasted time，后面用is a drag说明浪费时间带来的拖累。D的 privacy protection 则是防止个人信息或私人领域被侵犯，已经把“生活被耽误”换成“隐私需要保护”。\u003c/p>\n\u003cp>D把private lives的生活范围换成privacy protection的保护议题，不能解释该例子的作用。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And it should: Wasted time is a drag on Americans&#39; economic and private lives, not to mention infuriating.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. emphasize the importance of privacy protection","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者提到埃及航空804航班坠毁，是为了强调保护隐私的重要性。\n\nD的 privacy protection 要找的是隐私方面的保护；第二段出现了 private lives，两处都带有“私人”的意思，因此回看private lives所在的完整句，确认它说的究竟是哪一种影响。\n\n这里 private lives 和economic lives并列，是“经济生 rivate lives, not to mention infuriating.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到埃及航空804航班坠毁，是为了强调保护隐私的重要性。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 privacy protection 要找的是隐私方面的保护；第二段出现了 private lives，两处都带有“私人”的意思，因此回看private lives所在的完整句，确认它说的究竟是哪一种影响。\u003c/p>\n\u003cp>这里 private lives 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。真正产生影响的主语是Wasted time，后面用is a drag说明浪费时间带来的拖累。D的 privacy protection 则是防止个人信息或私人领域被侵犯，已经把“生活被耽误”换成“隐私需要保护”。\u003c/p>\n\u003cp>再把它接回题干，题干问的是坠机例子为什么被提到，而不是安检可能引出的任何社会议题。前面的why仍然回扣安全与容忍，后面的private lives也没有把它转向隐私。只抓private这个相近词，会漏掉time才是这句话正在批评的东西。\u003c/p>\n\u003cp>时间代价与隐私保护是不同问题，原文句子的主语、影响和所接例子都没有变成隐私。\u003c/p>\n\u003cp>D把private lives的生活范围换成privacy protection的保护议题，不能解释该例子的作用。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>And it should: Wasted time is a drag on Americans&#39; economic and private lives, not to mention infuriating.\u003c/p>\n\u003cp>先说美国人愿意以耗时安检换取安全，紧接坠机案例解释why，再用But限制可接受的时间与安全交换。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The crash highlights the importance of protecting passengers’ privacy.\u003c/p>\n\u003cp>坠机凸显保护乘客隐私的重要性。\u003c/p>\n\u003c/blockquote>\n\u003cp>隐私路线需要指出个人信息怎样受侵害。实际以坠机提醒安全需求，没有把事故与数据或隐私保护连接。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. emphasize the importance of privacy protection","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Getting Stuck in Security Lines  \n> 困在安检长队中\n\n把这个主旨直接代入21题题干：\n\n> 标题概括安检排队困境，案例应解释人们为何曾愿意承受安检；它不是要求无限加码安保，后面的转折还批评付出与回报失衡。\n\nD实际说的是：\n\n> emphasize the importance of privacy protection  \n> 强调保护隐私的重要性\n\nD把private lives的生活范围换成privacy p  of why 往前接到美国人愿意忍受安检，提醒的是为什么需要付出一定时间换取安全。\n\nD：这里 private lives 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"21","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>21. B. explain American’s tolerance of current security checks\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：先看前一句的主语Americans和动作are willing to tolerate：这里写的是美国人为什么愿意接受安检。\u003c/p>\n\u003cp>B：B里的tolerance是名词，原文 are willing to tolerate 是“愿意忍受”这一动作，讲的是同一种态度。\u003c/p>\n\u003cp>C：reminder of why 往前接到美国人愿意忍受安检，提醒的是为什么需要付出一定时间换取安全。\u003c/p>\n\u003cp>D：这里 private lives 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"22题 · 题干、题型与核心出处","level":2,"raw":"## 22题\n\n> Which of the following contributes to long waits at major airports?  \n> 以下哪一项会造成主要机场的长时间等待？\n\n### 题型\n\n原因细节题。题干要求判断“以下哪一项会造成主要机场的长时间等待？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons – both fake and real – past airport security nearly every time they tried. Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago's O'Hare International. It is not yet clear how much more effective airline security has become – but the lines are obvious.\n>\n> Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line. Part of the issue is that airports have only so much room for screening lanes. Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\n\n第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"question":"22","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Which of the following contributes to long waits at major airports?\u003cbr>以下哪一项会造成主要机场的长时间等待？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“以下哪一项会造成主要机场的长时间等待？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons – both fake and real – past airport security nearly every time they tried. Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago&#39;s O&#39;Hare International. It is not yet clear how much more effective airline security has become – but the lines are obvious.\u003c/p>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line. Part of the issue is that airports have only so much room for screening lanes. Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\u003c/p>\n\u003c/blockquote>\n\u003cp>第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. New restrictions on carry-on bags.","level":3,"raw":"### A. New restrictions on carry-on bags.\n\n> 对随身行李的新限制\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 restrictions on carry-on bags 与第四段的 carry-on bags 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。\n\n**错误类型：第三类——无中生有。**\n\nA的 restrictions on carry-on bags 是有关部门或航空公司施加的限制；原文围绕 their carry-on bags 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。\n\n因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\n\n**命题人借用的原文材料：**\n\n> Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.\n>\n> Part of the issue is that airports have only so much room for screening lanes.\n>\n> Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"22","option":"A"},"focusId":"focus-q22-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-A-0\">\u003cblockquote>\n\u003cp>对随身行李的新限制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 restrictions on carry-on bags 与第四段的 carry-on bags 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>A的 restrictions on carry-on bags 是有关部门或航空公司施加的限制；原文围绕 their carry-on bags 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。\u003c/p>\n\u003cp>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.\u003c/p>\n\u003cp>Part of the issue is that airports have only so much room for screening lanes.\u003c/p>\n\u003cp>Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. New restrictions on carry-on bags.","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 造成主要机场长时间等待的一项原因是对随身行李的新限制。\n\nA的 restrictions on carry-on bags 与第四段的 carry-on bags 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。\n\nA的 restrictions on carry-on bags 是有关部门或航空公司施加的限制；原文围绕 their carry-on bags 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。\n\n另外，原文用may be，结尾又写航空公司强烈争辩这一解释。A既换掉了行为主体，也把一个尚有争议的可能因素写成了明确的新限制。不能把“旅客怎样处理行李”和“机场怎样限制行李”混成同一件事。\n\nmore people是主语，to avoid checked-baggage fees是目的，原文没有把这件事写成新的限制政策。\n\n因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"22","option":"A"},"focusId":"focus-q22-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-A-0\">\u003cblockquote>\n\u003cp>对随身行李的新限制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 restrictions on carry-on bags 与第四段的 carry-on bags 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>A的 restrictions on carry-on bags 是有关部门或航空公司施加的限制；原文围绕 their carry-on bags 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。\u003c/p>\n\u003cp>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.\u003c/p>\n\u003cp>Part of the issue is that airports have only s 释。A既换掉了行为主体，也把一个尚有争议的可能因素写成了明确的新限制。不能把“旅客怎样处理行李”和“机场怎样限制行李”混成同一件事。\u003c/p>\n\u003cp>more people是主语，to avoid checked-baggage fees是目的，原文没有把这件事写成新的限制政策。\u003c/p>\n\u003cp>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.\u003c/p>\n\u003cp>Part of the issue is that airports have only so much room for screening lanes.\u003c/p>\n\u003cp>Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\u003c/p>\n\u003cp>第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>New restrictions on carry-on bags have increased waiting times.\u003c/p>\n\u003cp>新的随身行李限制增加了等待时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文提出的是旅客可能多塞行李以避费，并注明航空公司反对这种解释；既不是新限制，也没有把它写成确定原因。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. New restrictions on carry-on bags.","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Getting Stuck in Security Lines  \n> 困在安检长队中\n\n把这个主旨直接代入22题题干：\n\n> 排队是全文的问题起点；具体成因仍要读resulted in前的并列项，主旨不能替代对秘密检查频率或行李规则的核对。\n\nA实际说的是：\n\n> New restrictions on carry-on bags.  \n> 对随身行李的新限制\n\n因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\n\n从全文推进看，这一处的作用是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta" \n\u003cp>more people是主语，to avoid checked-baggage fees是目的，原文没有把这件事写成新的限制政策。\u003c/p>\n\u003cp>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.\u003c/p>\n\u003cp>Part of the issue is that airports have only so much room for screening lanes.\u003c/p>\n\u003cp>Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\u003c/p>\n\u003cp>第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>New restrictions on carry-on bags have increased waiting times.\u003c/p>\n\u003cp>新的随身行李限制增加了等待时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文提出的是旅客可能多塞行李以避费，并注明航空公司反对这种解释；既不是新限制，也没有把它写成确定原因。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>排队是全文的问题起点；具体成因仍要读resulted in前的并列项，主旨不能替代对秘密检查频率或行李规则的核对。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>New restrictions on carry-on bags.\u003cbr>对随身行李的新限制\u003c/p>\n\u003c/blockquote>\n\u003cp>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. The declining efficiency of the TSA.","level":3,"raw":"### B. The declining efficiency of the TSA.\n\n> 运输安全管理局效率的下降\n\n**做题模式中的状态：** 第一轮B排除。当时选项呈现为“The [xxx] efficiency of the TSA.”，保留了相应遮挡。当时的定位线索是：B的 efficiency of the TSA 谈TSA办事效率；第三段的 have resulted in long waits 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。\n\n**错误类型：第三类——无中生有。**\n\nhave resulted in long waits 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 efficiency of the TSA 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。\n\nB把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。\n\n**命题人借用的原文材料：**\n\n> Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago's O'Hare International.\n>\n> It is not yet clear how much more effective airline security has become – but the lines are obvious.","context":{"mode":"image","asset":"questions","focus":[250,958,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"22","option":"B"},"focusId":"focus-q22-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-B-0\">\u003cblockquote>\n\u003cp>运输安全管理局效率的下降\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时选项呈现为“The [xxx] efficiency of the TSA.”，保留了相应遮挡。当时的定位线索是：B的 efficiency of the TSA 谈TSA办事效率；第三段的 have resulted in long waits 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>have resulted in long waits 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 efficiency of the TSA 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。\u003c/p>\n\u003cp>B把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago&#39;s O&#39;Hare International.\u003c/p>\n\u003cp>It is not yet clear how much more effective airline security has become – but the lines are obvious.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. The declining efficiency of the TSA.","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 造成主要机场长时间等待的一项原因是运输安全管理局效率的下降。\n\nB的 efficiency of the TSA 谈TSA办事效率；第三段的 have resulted in long waits 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。\n\nhave resulted in long waits 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 efficiency of the TSA 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。\n\n段末尤其要分清：作者说安保在某方面改善了多少还不清楚，但队伍看得见。这不是一份已经确定TSA效率变化的结论。第四段又分别列旅客增加、通道空间和行李做法，不能把这些不同原因压成B那一个机构效率判断。\n\n排队结果不等于效率测量，原文列出的原因也不是效率变化这件事。\n\nB把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。","context":{"mode":"image","asset":"questions","focus":[250,958,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"22","option":"B"},"focusId":"focus-q22-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-B-0\">\u003cblockquote>\n\u003cp>运输安全管理局效率的下降\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时选项呈现为“The [xxx] efficiency of the TSA.”，保留了相应遮挡。当时的定位线索是：B的 efficiency of the TSA 谈TSA办事效率；第三段的 have resulted in long waits 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>have resulted in long waits 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 efficiency of the TSA 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。\u003c/p>\n\u003c
