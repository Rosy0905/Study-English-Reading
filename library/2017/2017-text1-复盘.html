利用不足的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>unnecessary line\u003c/td>\n\u003ctd>不必要的队伍\u003c/td>\n\u003ctd>make the program work\u003c/td>\n\u003ctd>使计划奏效\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>First two hours, now three hours – this is how far in advance authorities are recommending people show up to catch a domestic flight, at least at some major U.S. airports with increasingly massive security lines.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>First two hours, / now three hours – / this is how far in advance / authorities are recommending / people show up / to catch a domestic flight, / at least at some major U.S. airports / with increasingly massive security lines.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>先是两小时，/ 现在三小时 – / 这是多久提前 / 当局正在建议 / 人们到达 / 为了赶上国内航班，/ 至少在一些主要的美国机场 / 有着越来越长的安检队伍。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>先是两小时，现在已经是三小时——这是当局建议人们为赶上国内航班需要提前到达的时间，至少在一些安检队伍越来越长的美国主要机场是这样。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Americans are willing to tolerate time-consuming security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why. But demanding too much of air travelers or providing too little security in return undermines public support for the process. And it should: Wasted time is a drag on Americans&#39; economic and private lives, not to mention infuriating.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Americans are willing to tolerate / time-consuming security procedures / in return for increased safety.\u003c/p>\n\u003cp>The crash of EgyptAir Flight 804, / which terrorists may have downed / over the Mediterranean Sea, / provides another tragic reminder / of why.\u003c/p>\n\u003cp>But demanding too much / of air travelers / or providing too little security / in return / undermines public support / for the process.\u003c/p>\n\u003cp>And it should: / Wasted time is a drag / on Americans&#39; economic and private lives, / not to mention infuriating.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>美国人愿意容忍 / 耗时的安检程序 / 以换取更高的安全性。\u003c/p>\n\u003cp>埃及航空804航班的坠毁，/ 恐怖分子可能击落的 / 在地中海上空，/ 提供了另一个悲剧性的提醒 / 关于为什么。\u003c/p>\n\u003cp>但要求太多 / 对航空旅客 / 或提供太少的安全保障 / 作为回报 / 会削弱公众支持 / 对这个过程。\u003c/p>\n\u003cp>而且这是应该的：/ 浪费的时间是一种拖累 / 对美国人的经济和私人生活，/ 更不用说令人愤怒。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>美国人愿意容忍耗时的安检程序以换取更高的安全性。恐怖分子可能在地中海上空击落的埃及航空804航班的坠毁，再次悲剧性地提醒了人们这么做的原因。但对航空旅客要求太多或提供的安全保障太少都会削弱公众对这一过程的支持。这种削弱是应该的：浪费的时间拖累了美国人的经济和私人生活，更不用说还令人愤怒。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons – both fake and real – past airport security nearly every time they tried. Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago&#39;s O&#39;Hare International. It is not yet clear how much more effective airline security has become – but the lines are obvious.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Last year, / the Transportation Security Administration (TSA) found / in a secret check / that undercover investigators / were able to sneak weapons – / both fake and real – / past airport security / nearly every time they tried.\u003c/p>\n\u003cp>Enhanced security measures / since then, / combined with a rise / in airline travel / due to the improving economy / and low oil prices, / have resulted in long waits / at major airports / such as Chicago&#39;s O&#39;Hare International.\u003c/p>\n\u003cp>It is not yet clear / how much more effective / airline security has become – / but the lines are obvious.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>去年，/ 运输安全管理局（TSA）发现 / 在一次秘密检查中 / 卧底调查员 / 能够携带武器 – / 假的和真的 – / 通过机场安检 / 几乎每次尝试都成功。\u003c/p>\n\u003cp>加强的安全措施 / 从那时起，/ 结合增长 / 在航空旅行中 / 由于经济改善 / 和低油价，/ 导致了长时间等待 / 在主要机场 / 比如芝加哥奥黑尔国际机场。\u003c/p>\n\u003cp>还不清楚 / 多么更有效 / 航空安检已经变得 – / 但队伍是明显的。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>去年，运输安全管理局（TSA）在一次秘密检查中发现，卧底调查员几乎每次尝试都能成功携带武器——无论是假的还是真的——通过机场安检。从那时起加强的安全措施，加上由于经济改善和低油价导致的航空旅行增长，导致了在芝加哥奥黑尔国际机场等主要机场的长时间等待。航空安检变得多有效还不清楚——但排队的长龙却是显而易见的。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line. Part of the issue is that airports have only so much room for screening lanes. Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Part of the issue is / that the government / did not anticipate / the steep increase / in airline travel, / so the TSA / is now rushing / to get new screeners / on the line.\u003c/p>\n\u003cp>Part of the issue is / that airports have / only so much room / for screening lanes.\u003c/p>\n\u003cp>Another factor may be / that more people / are trying to overpack / their carry-on bags / to avoid checked-baggage fees, / though the airlines / strongly dispute this.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>问题的一部分是 / 政府 / 没有预料到 / 急剧增长 / 在航空旅行中，/ 所以TSA / 现在正急于 / 让新的安检员 / 上岗。\u003c/p>\n\u003cp>问题的一部分是 / 机场只有 / 这么多空间 / 用于安检通道。\u003c/p>\n\u003cp>另一个因素可能是 / 更多人 / 正试图过度打包 / 他们的随身行李 / 为了避免托运行李费，/ 尽管航空公司 / 强烈反驳这一点。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>问题的一部分是政府没有预料到航空旅行的急剧增长，所以TSA现在正急于让新的安检员上岗。问题的另一部分是机场只有有限的空间用于安检通道。另一个因素可能是更多人为了避免托运行李费而试图过度打包随身行李，尽管航空公司强烈反驳这一点。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>There is one step the TSA could take that would not require remodeling airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>There is one step / the TSA could take / that would not require / remodeling airports / or rushing to hire: / Enroll more people / in the PreCheck program.\u003c/p>\n\u003cp>PreCheck is supposed to be / a win-win / for travelers and the TSA.\u003c/p>\n\u003cp>Passengers who pass / a background check / are eligible to use / expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA / to focus on travelers / who are higher risk, / saving time / for everyone involved.\u003c/p>\n\u003cp>The TSA wants to enroll / 25 million people / in PreCheck.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>有一个步骤 / TSA可以采取 / 不需要 / 改造机场 / 或急于招聘：/ 让更多人加入 / PreCheck计划。\u003c/p>\n\u003cp>PreCheck应该是 / 一个双赢 / 对旅客和TSA来说。\u003c/p>\n\u003cp>通过的乘客 / 背景调查 / 有资格使用 / 快速安检通道。\u003c/p>\n\u003cp>这使TSA能够 / 专注于旅客 / 风险更高的，/ 节省时间 / 对所有相关人员。\u003c/p>\n\u003cp>TSA想要招募 / 2500万人 / 加入PreCheck。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>有一个TSA可以采取的步骤，既不需要改造机场也不需要急于招聘：让更多人加入PreCheck计划。PreCheck应该对旅客和TSA来说是双赢的。通过背景调查的乘客有资格使用快速安检通道。这使TSA能够专注于高风险旅客，为所有相关人员节省时间。TSA想要招募2500万人加入PreCheck。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck&#39;s fatal flaw. Upcoming reforms might bring the price to a more reasonable level. But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>It has not gotten / anywhere close to that, / and one big reason / is sticker shock: / Passengers must pay / $85 every five years / to process their background checks.\u003c/p>\n\u003cp>Since the beginning, / this price tag / has been PreCheck&#39;s / fatal flaw.\u003c/p>\n\u003cp>Upcoming reforms / might bring the price / to a more reasonable level.\u003c/p>\n\u003cp>But Congress should look into / doing so directly, / by helping to finance / PreCheck enrollment / or to cut costs / in other ways.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>它还没有达到 / 接近那个目标，/ 一个重要原因 / 是价格震惊：/ 乘客必须支付 / 每五年85美元 / 来处理他们的背景调查。\u003c/p>\n\u003cp>从一开始，/ 这个价格标签 / 一直是PreCheck的 / 致命缺陷。\u003c/p>\n\u003cp>即将到来的改革 / 可能会把价格带到 / 一个更合理的水平。\u003c/p>\n\u003cp>但国会应该考虑 / 直接这样做，/ 通过帮助资助 / PreCheck注册 / 或削减成本 / 以其他方式。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>TSA还远没有达到这个目标，一个重要原因是价格震惊：乘客必须每五年支付85美元来处理他们的背景调查。从一开始，这个价格标签就是PreCheck的致命缺陷。即将到来的改革可能会把价格降到更合理的水平。但国会应该考虑直接采取行动，通过帮助资助PreCheck注册或以其他方式削减成本。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>The TSA cannot continue diverting resources into underused PreCheck lanes while most of the traveling public suffers in unnecessary lines. It is long past time to make the program work.\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>The TSA cannot continue / diverting resources / into underused PreCheck lanes / while most of the traveling public / suffers in unnecessary lines.\u003c/p>\n\u003cp>It is long past time / to make the program work.\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>TSA不能继续 / 转移资源 / 到未充分使用的PreCheck通道 / 当大多数旅行公众 / 在不必要的队伍中受苦。\u003c/p>\n\u003cp>早就该是时候了 / 让这个计划运作起来。\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>TSA不能继续将资源转移到未充分使用的PreCheck通道，而让大多数旅行公众在不必要的队伍中受苦。早就该让这个计划真正运作起来了。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>First two hours + now three hours – this is how far in advance：(authorities are recommending → people show up：(to catch a domestic flight))，at least at some major U.S. airports：(with increasingly massive security lines).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Americans are willing to tolerate：(time-consuming security procedures)：(in return for increased safety).\u003c/p>\n\u003cp>The crash of EgyptAir Flight 804：(which terrorists may have downed：(over the Mediterranean Sea)) → provides another tragic reminder：(of why).\u003c/p>\n\u003cp>But demanding too much：(of air travelers) // or providing too little security：(in return) → undermines public support：(for the process).\u003c/p>\n\u003cp>And it should：Wasted time is a drag：(on Americans&#39; economic and private lives) + not to mention infuriating.\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Last year → the Transportation Security Administration (TSA) found：(in a secret check)：(that undercover investigators → were able to sneak weapons – both fake and real – → past airport security：(nearly every time they tried)).\u003c/p>\n\u003cp>Enhanced security measures：(since then) + combined with a rise：(in airline travel)：(due to the improving economy + low oil prices) → have resulted in long waits：(at major airports：(such as Chicago&#39;s O&#39;Hare International)).\u003c/p>\n\u003cp>It is not yet clear：(how much more effective → airline security has become) – // but the lines are obvious.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Part of the issue is：(that the government → did not anticipate → the steep increase：(in airline travel)) → so the TSA → is now rushing：(to get new screeners：(on the line)).\u003c/p>\n\u003cp>Part of the issue is：(that airports have → only so much room：(for screening lanes)).\u003c/p>\n\u003cp>Another factor may be：(that more people → are trying to overpack → their carry-on bags：(to avoid checked-baggage fees)) // though the airlines → strongly dispute this.\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>There is one step：(the TSA could take)：(that would not require：(remodeling airports // or rushing to hire))：Enroll more people：(in the PreCheck program).\u003c/p>\n\u003cp>PreCheck is supposed to be → a win-win：(for travelers and the TSA).\u003c/p>\n\u003cp>Passengers：(who pass → a background check) → are eligible to use：(expedited screening lanes).\u003c/p>\n\u003cp>This allows the TSA → to focus on travelers：(who are higher risk) → saving time：(for everyone involved).\u003c/p>\n\u003cp>The TSA wants to enroll → 25 million people：(in PreCheck).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>It has not gotten：(anywhere close to that) + one big reason → is sticker shock：(Passengers must pay → $85 every five years：(to process their background checks)).\u003c/p>\n\u003cp>Since the beginning → this price tag → has been PreCheck&#39;s → fatal flaw.\u003c/p>\n\u003cp>Upcoming reforms → might bring the price：(to a more reasonable level).\u003c/p>\n\u003cp>But Congress should look into：(doing so directly)：(by helping to finance → PreCheck enrollment // or to cut costs：(in other ways)).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>The TSA cannot continue → diverting resources：(into underused PreCheck lanes) // while most of the traveling public → suffers：(in unnecessary lines).\u003c/p>\n\u003cp>It is long past time → to make the program work.\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>先是两小时 + 现在三小时 – 这是多久提前：(当局正在建议 → 人们到达：(为了赶上国内航班))，至少在一些主要的美国机场：(有着越来越长的安检队伍)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>美国人愿意容忍：(耗时的安检程序)：(以换取更高的安全性)。\u003c/p>\n\u003cp>埃及航空804航班的坠毁：(恐怖分子可能击落的：(在地中海上空)) → 提供了另一个悲剧性的提醒：(关于为什么)。\u003c/p>\n\u003cp>但要求太多：(对航空旅客) // 或提供太少的安全保障：(作为回报) → 会削弱公众支持：(对这个过程)。\u003c/p>\n\u003cp>而且这是应该的：浪费的时间是一种拖累：(对美国人的经济和私人生活) + 更不用说令人愤怒。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>去年 → 运输安全管理局（TSA）发现：(在一次秘密检查中)：(卧底调查员 → 能够携带武器 – 假的和真的 – → 通过机场安检：(几乎每次尝试都成功))。\u003c/p>\n\u003cp>加强的安全措施：(从那时起) + 结合增长：(在航空旅行中)：(由于经济改善 + 低油价) → 导致了长时间等待：(在主要机场：(比如芝加哥奥黑尔国际机场))。\u003c/p>\n\u003cp>还不清楚：(多么更有效 → 航空安检已经变得) – // 但队伍是明显的。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>问题的一部分是：(政府 → 没有预料到 → 急剧增长：(在航空旅行中)) → 所以TSA → 现在正急于：(让新的安检员：(上岗))。\u003c/p>\n\u003cp>问题的一部分是：(机场只有 → 这么多空间：(用于安检通道))。\u003c/p>\n\u003cp>另一个因素可能是：(更多人 → 正试图过度打包 → 他们的随身行李：(为了避免托运行李费)) // 尽管航空公司 → 强烈反驳这一点。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>有一个步骤：(TSA可以采取)：(不需要：(改造机场 // 或急于招聘))：让更多人加入：(PreCheck计划)。\u003c/p>\n\u003cp>PreCheck应该是 → 一个双赢：(对旅客和TSA来说)。\u003c/p>\n\u003cp>乘客：(通过 → 背景调查的) → 有资格使用：(快速安检通道)。\u003c/p>\n\u003cp>这使TSA能够 → 专注于旅客：(风险更高的) → 节省时间：(对所有相关人员)。\u003c/p>\n\u003cp>TSA想要招募 → 2500万人：(加入PreCheck)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>它还没有达到：(接近那个目标) + 一个重要原因 → 是价格震惊：(乘客必须支付 → 每五年85美元：(来处理他们的背景调查))。\u003c/p>\n\u003cp>从一开始 → 这个价格标签 → 一直是PreCheck的 → 致命缺陷。\u003c/p>\n\u003cp>即将到来的改革 → 可能会把价格带到：(一个更合理的水平)。\u003c/p>\n\u003cp>但国会应该考虑：(直接这样做)：(通过帮助资助 → PreCheck注册 // 或削减成本：(以其他方式))。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>TSA不能继续 → 转移资源：(到未充分使用的PreCheck通道) // 当大多数旅行公众 → 受苦：(在不必要的队伍中)。\u003c/p>\n\u003cp>早就该是时候了 → 让这个计划运作起来。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>First two hours, now three hours – this is how far in advance authorities are recommending people show up to catch a domestic flight, at least at some major U.S. airports with increasingly massive security lines.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>First two hours, / now three hours – / this is how far in advance / authorities are recommending / people show up / to catch a domestic flight, / at least at some major U.S. airports / with increasingly massive security lines.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>先是两小时，/ 现在三小时 – / 这是多久提前 / 当局正在建议 / 人们到达 / 为了赶上国内航班，/ 至少在一些主要的美国机场 / 有着越来越长的安检队伍。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把两个时长合并成变化对比。：\u003c/p>\n\u003cblockquote>\n\u003cp>原先提前两小时，如今提前三小时\u003c/p>\n\u003c/blockquote>\n\u003cp>再把建议、目的和适用范围合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>当局建议乘客为赶国内航班提前抵达，至少适用于安检长队加剧的一些美国主要机场\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>原先提前两小时，如今提前三小时；当局建议乘客为赶国内航班提前抵达，至少适用于安检长队加剧的一些美国主要机场。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>当局建议人们更早到达机场以赶上国内航班。\u003c/p>\n\u003c/blockquote>\n\u003cp>将两小时到三小时的变化放在开头；至少、一些、主要三层限制随机场保留，with短语解释那些机场的状态。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>先是两小时，现在三小时——当局建议人们为赶上国内航班，要提前这么久出现，至少在一些安检队伍越来越庞大的美国主要机场是如此。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>this回指前面的三小时，不是指航班本身飞行三小时。\u003c/p>\n\u003cp>at least at some不能扩成全美所有机场都统一要求提前三小时。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>先是两小时，现在已经是三小时——这是当局建议人们为赶上国内航班需要提前到达的时间，至少在一些安检队伍越来越长的美国主要机场是这样。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第3段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons – both fake and real – past airport security nearly every time they tried.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Last year, / the Transportation Security Administration (TSA) found / in a secret check / that undercover investigators / were able to sneak weapons – / both fake and real – / past airport security / nearly every time they tried.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>去年，/ 运输安全管理局（TSA）发现 / 在一次秘密检查中 / 卧底调查员 / 能够携带武器 – / 假的和真的 – / 通过机场安检 / 几乎每次尝试都成功。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把机构、时间和检查方式合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>去年，运输安全管理局在一次秘密检查中发现\u003c/p>\n\u003c/blockquote>\n\u003cp>再把调查人员的动作、携带物和成功频率合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>卧底调查员几乎每次尝试都能把真假武器带过机场安检\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>去年，运输安全管理局在一次秘密检查中发现；卧底调查员几乎每次尝试都能把真假武器带过机场安检。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>运输安全管理局发现调查员几乎每次都能携武器通过安检。\u003c/p>\n\u003c/blockquote>\n\u003cp>先放发现行为，再用完整分句承接that里的发现内容；真假武器是插入说明，共同受sneak支配。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>去年，运输安全管理局在一次秘密检查中发现，卧底调查员几乎每次尝试都能把武器偷偷带过机场安检，假武器和真武器都能如此。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>nearly every time是极高成功比例，但仍不是绝对每一次。\u003c/p>\n\u003cp>undercover investigators是测试人员，不译成已被证实的真实恐怖袭击者。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>去年，运输安全管理局（TSA）在一次秘密检查中发现，卧底调查员几乎每次尝试都能成功携带武器——无论是假的还是真的——通过机场安检。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Part of the issue is / that the government / did not anticipate / the steep increase / in airline travel, / so the TSA / is now rushing / to get new screeners / on the line.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>问题的一部分是 / 政府 / 没有预料到 / 急剧增长 / 在航空旅行中，/ 所以TSA / 现在正急于 / 让新的安检员 / 上岗。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把问题内容合并：did not anticipate否定的是预判能力。：\u003c/p>\n\u003cblockquote>\n\u003cp>政府没有预料到航空旅行急剧增加\u003c/p>\n\u003c/blockquote>\n\u003cp>再把so后的补救动作合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>因此运输安全管理局正急着让新的安检员上岗\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>政府没有预料到航空旅行急剧增加；因此运输安全管理局正急着让新的安检员上岗。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>政府未预料客流增长，所以机构急着补充安检员。\u003c/p>\n\u003c/blockquote>\n\u003cp>“问题的一部分是”放在两项关系前；先说没预料增长，再说现在补人，不把客流增加误当成补人的后果。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>问题有一部分在于政府没有预料航空旅行会急剧增多，所以运输安全管理局现在正急着让新安检员进入工作岗位。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>part of保留多种原因中的一部分，不写成唯一根源。\u003c/p>\n\u003cp>on the line在这里是进入安检岗位，不是在线上工作。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>问题的一部分是政府没有预料到航空旅行的急剧增长，所以TSA现在正急于让新的安检员上岗。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>25题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下列哪一项最适合作为本文的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Getting Stuck in Security Lines\u003c/strong>\u003c/p>\n\u003cp>困在安检长队中\u003c/p>\n\u003cp>B. \u003cstrong>PreCheck—a Belated Solution\u003c/strong>\u003c/p>\n\u003cp>PreCheck——一个迟来的解决办法\u003c/p>\n\u003cp>C. \u003cstrong>Less Screening for More Safety\u003c/strong>\u003c/p>\n\u003cp>更少的安检换来更高的安全\u003c/p>\n\u003cp>D. \u003cstrong>Underused PreCheck Lanes\u003c/strong>\u003c/p>\n\u003cp>使用不足的PreCheck通道\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从提前两小时变成三小时写起，展示一些美国主要机场的安检队伍和旅客耗时。\u003c/td>\n\u003ctd>先摆出眼前的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。\u003c/td>\n\u003ctd>再说为什么不能只看一头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。\u003c/td>\n\u003ctd>接着交代事情怎么变成这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。\u003c/td>\n\u003ctd>然后把几个原因分开说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。\u003c/td>\n\u003ctd>接着提出一个可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。\u003c/td>\n\u003ctd>再说这个办法卡在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\u003c/td>\n\u003ctd>最后说该让办法真正起作用了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>A. Getting Stuck in Security Lines\u003c/h3>\n\u003cp>困在安检长队中\u003c/p>\n\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>困在安检长队中\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>摆出旅客必须提前更久到机场的安检长队问题。\u003c/td>\n\u003ctd>先摆出眼前的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明安全需要与时间代价都不能忽略，安检队伍不是越长越值得支持。\u003c/td>\n\u003ctd>再说为什么不能只看一头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>交代安保加强与客流增加如何共同形成当前排队。\u003c/td>\n\u003ctd>接着交代事情怎么变成这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>分别解释招人滞后、通道空间和随身行李等可能成因。\u003c/td>\n\u003ctd>然后把几个原因分开说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提出扩大预检参与来减少普遍等待的可行办法。\u003c/td>\n\u003ctd>接着提出一个可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>指出报名高价阻碍参与，使这个分流办法难以起效。\u003c/td>\n\u003ctd>再说这个办法卡在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求修正阻碍，让预检真正缓解公众困在安检队伍中的局面。\u003c/td>\n\u003ctd>最后说该让办法真正起作用了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A的Getting Stuck先对应开头旅客需要提前两三小时，再对应后文long waits和结尾unnecessary lines。它并不是只概括“排队”一个名词：第二段讨论为什么不能让旅客承担无限时间代价，第三、四段说明长队成因，第五、六段找办法并解释办法受阻，都是在处理同一个等待问题。\u003c/p>\n\u003cp>后半篇的PreCheck不必被标题逐字点名，因为它是作者为长队问题提出的解决工具。把A代入七行，前面的现象、原因和后面的方案、障碍、催促能够按顺序相接，没有哪一大块需要另找文章中心。\u003c/p>\n\u003cp>标题说“困在长队中”，能否同时容纳作者后来寻找减少等待的办法？\u003c/p>\n\u003cp>能。解决办法始终在回应这个被困的问题，而不是另换成一个与长队无关的新话题。A保留。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>B. PreCheck—a Belated Solution\u003c/h3>\n\u003cp>PreCheck——一个迟来的解决办法\u003c/p>\n\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>PreCheck——一个迟来的解决办法\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以安检拥堵为眼前问题，指出预检解决办法本应更早出现。\u003c/td>\n\u003ctd>先摆出眼前的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明迟来的办法也必须兼顾安全与效率，不能只求速度。\u003c/td>\n\u003ctd>再说为什么不能只看一头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追溯迟迟没有采用预检解决方案怎样令排队问题累积。\u003c/td>\n\u003ctd>接着交代事情怎么变成这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>分开说明延误推出预检的行政、人员或资源原因。\u003c/td>\n\u003ctd>然后把几个原因分开说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提出终于到来的预检方案，展示它为何能够解决旧问题。\u003c/td>\n\u003ctd>接着提出一个可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明这项迟来方案推出后仍被费用等障碍卡住。\u003c/td>\n\u003ctd>再说这个办法卡在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求把迟到的方案及时落实，弥补此前错失的改进时间。\u003c/td>\n\u003ctd>最后说该让办法真正起作用了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B最吸引人的地方是PreCheck确实占了后三段。但a Belated Solution不仅点名方案，还把“迟来”作为对方案的关键判断。若按B写，第三、四段理应解释为什么这个办法迟迟未出现，第五段理应突出它终于被提出；实际第三、四段主要解释机场长队，第五段介绍的是一个已经有名称、通道和报名目标的现成计划。\u003c/p>\n\u003cp>第六段说没接近报名目标，并批评费用，不等于说方案本身刚刚出现。结尾long past time催促它真正发挥作用，也不能自动倒回成“提出方案太迟”。方案出现得迟，与已有方案迟迟没有做好，是不同时间关系。\u003c/p>\n\u003cp>已有计划应当早日运转好，是否等于作者在介绍一个刚刚迟到的方案？\u003c/p>\n\u003cp>不等于。B把改善迫切性改成方案出现的时间判断，并缩掉前半篇大量独立的长队分析，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Less Screening for More Safety\u003c/h3>\n\u003cp>更少的安检换来更高的安全\u003c/p>\n\u003ch4>如果 C 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>更少的安检换来更高的安全\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>提出安检过量反而可能损害安全的眼前问题。\u003c/td>\n\u003ctd>先摆出眼前的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>比较检查数量与真正安全效果，说明不能把查得多直接等同于安全高。\u003c/td>\n\u003ctd>再说为什么不能只看一头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>交代不分风险增加检查怎样占用资源而削弱重点防护。\u003c/td>\n\u003ctd>接着交代事情怎么变成这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>分开说明无差别检查在人员、时间和通道上的资源浪费。\u003c/td>\n\u003ctd>然后把几个原因分开说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提出减少低风险旅客检查，把力量集中到高风险者以提高安全。\u003c/td>\n\u003ctd>接着提出一个可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>指出阻碍减少无效检查的执行条件，说明怎样消除障碍。\u003c/td>\n\u003ctd>再说这个办法卡在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求落实少查低风险者而增强整体安全的方案。\u003c/td>\n\u003ctd>最后说该让办法真正起作用了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C同时出现Screening与Safety，看上去贴近第二段的安全交换，也容易让人联想到第五段的分流。然而Less Screening for More Safety要求全文建立一个很具体的方向：检查更少，所以安全更高。实际第五段明写的是让TSA关注风险更高的人、给所有人省时间，没有比较减少检查前后安全提高多少。\u003c/p>\n\u003cp>第三段还特意说安保变得怎样的效果尚不清楚，眼前能看到的是队伍。若选择C，就要把未确定的安全结果改成标题里的肯定收益。七行对照下来，成因、收费、报名规模的说明也并不是围绕“减少检查次数”安排的。\u003c/p>\n\u003cp>更有针对性地分配检查注意力，能否直接概括为少做安检便得到更多安全？\u003c/p>\n\u003cp>不能。C增加了原文没有建立的检查数量与安全提升关系，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. Underused PreCheck Lanes\u003c/h3>\n\u003cp>使用不足的PreCheck通道\u003c/p>\n\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>使用不足的PreCheck通道\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>摆出预检通道闲置、资源没有被充分利用的现象。\u003c/td>\n\u003ctd>先摆出眼前的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明通道使用率与安全把关需要同时考虑，不能为填满通道而放弃核查。\u003c/td>\n\u003ctd>再说为什么不能只看一头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追溯预检通道为何形成当前利用不足的局面。\u003c/td>\n\u003ctd>接着交代事情怎么变成这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>分别说明费用、招募和流程安排怎样让通道空闲。\u003c/td>\n\u003ctd>然后把几个原因分开说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提出提高预检通道利用率的具体招募办法。\u003c/td>\n\u003ctd>接着提出一个可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>指出提高使用率的方案仍受高价等条件阻挡。\u003c/td>\n\u003ctd>再说这个办法卡在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求消除阻碍，让这些已经设置的预检通道被充分利用。\u003c/td>\n\u003ctd>最后说该让办法真正起作用了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D在结尾能找到接近的画面：预检通道与大多数旅客排队形成对照，第六段也说报名人数不足。但把D代入全文，第一至四段就都应当围绕预检通道利用率展开；实际这些段先讨论美国机场普遍的安检队伍、旅客时间代价和多种原因，PreCheck到第五段才作为办法进入。\u003c/p>\n\u003cp>这并不是“标题出现得晚就一定错”。真正的问题是D把解决办法中一个局部的使用状态，抬成覆盖全部段落的中心。前面的空间限制、航空出行增加和安检代价，不能都改写成预检通道利用不足的成因，否则就改变了作者本来的展开对象。\u003c/p>\n\u003cp>后三段涉及的预检利用问题，能否替代前四段已经建立的整个安检长队问题？\u003c/p>\n\u003cp>不能。D覆盖一个具体障碍，却装不下全文为何讨论它，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>25题结论\u003c/h3>\n\u003cp>\u003cstrong>25. A. Getting Stuck in Security Lines\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Getting Stuck in Security Lines / 困在安检长队中\u003c/strong>\u003c/p>\n\u003ch2>21题\u003c/h2>\n\u003cblockquote>\n\u003cp>The crash of EgyptAir Flight 804 is mentioned to ______.\u003cbr>提到埃及航空804航班坠毁，是为了说明什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>例子作用题。题干要求判断“提到埃及航空804航班坠毁，是为了说明什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Americans are willing to tolerate time-consuming security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why. But demanding too much of air travelers or providing too little security in return undermines public support for the process. And it should: Wasted time is a drag on Americans&#39; economic and private lives, not to mention infuriating.\u003c/p>\n\u003c/blockquote>\n\u003cp>先说美国人愿意以耗时安检换取安全，紧接坠机案例解释why，再用But限制可接受的时间与安全交换。\u003c/p>\n\u003ch3>A. stress the urgency to strengthen security worldwide\u003c/h3>\n\u003cblockquote>\n\u003cp>强调在全球加强安保的紧迫性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“stress the [xxx] to strengthen security worldwide”，保留了相应遮挡。当时的定位线索是：A的 strengthen security worldwide 谈加强安保，第二段的 increased safety 也谈安全增加；因此回看这句以及紧接着的坠机例子，看看例子是在解释前一句，还是另起一个全球性的倡议。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>先看前一句的主语Americans和动作are willing to tolerate：这里写的是美国人为什么愿意接受安检。increased safety 是他们想换来的东西，不是作者正在向全世界发布的要求。下一句末尾的why接着问“为什么愿意”，于是坠机事件就是对这个理由的提醒。\u003c/p>\n\u003cp>A把这一步写成 strengthen security worldwide，不仅多出worldwide的范围，还把“解释已有的容忍”改成“强调加强安保”。坠机发生在地中海上空，并不使它在这段中的作用变成全球倡议；发生地点和用例目的要分开。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Americans are willing to tolerate time-consuming security procedures in return for increased safety.\u003c/p>\n\u003cp>The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到埃及航空804航班坠毁，是为了强调在全球加强安保的紧迫性。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 strengthen security worldwide 谈加强安保，第二段的 increased safety 也谈安全增加；因此回看这句以及紧接着的坠机例子，看看例子是在解释前一句，还是另起一个全球性的倡议。\u003c/p>\n\u003cp>先看前一句的主语Americans和动作are willing to tolerate：这里写的是美国人为什么愿意接受安检。increased safety 是他们想换来的东西，不是作者正在向全世界发布的要求。下一句末尾的why接着问“为什么愿意”，于是坠机事件就是对这个理由的提醒。\u003c/p>\n\u003cp>A把这一步写成 strengthen security worldwide，不仅多出worldwide的范围，还把“解释已有的容忍”改成“强调加强安保”。坠机发生在地中海上空，并不使它在这段中的作用变成全球倡议；发生地点和用例目的要分开。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Americans are willing to tolerate time-consuming security procedures in return for increased safety.\u003c/p>\n\u003cp>The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why.\u003c/p>\n\u003cp>先说美国人愿意以耗时安检换取安全，紧接坠机案例解释why，再用But限制可接受的时间与安全交换。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The crash shows that all countries must urgently strengthen security.\u003c/p>\n\u003cp>坠机表明所有国家都必须紧急加强安保。\u003c/p>\n\u003c/blockquote>\n\u003cp>全球加强安保的路线应从事故转到各国改进措施；实际why回指美国人容忍安检，随后转向耗时过多削弱支持。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题概括安检排队困境，案例应解释人们为何曾愿意承受安检；它不是要求无限加码安保，后面的转折还批评付出与回报失衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>stress the urgency to strengthen security worldwide\u003cbr>强调在全球加强安保的紧迫性\u003c/p>\n\u003c/blockquote>\n\u003cp>A把这一步写成 strengthen security worldwide，不仅多出worldwide的范围，还把“解释已有的容忍”改成“强调加强安保”。坠机发生在地中海上空，并不使它在这段中的作用变成全球倡议；发生地点和用例目的要分开。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. explain American’s tolerance of current security checks\u003c/h3>\n\u003cblockquote>\n\u003cp>解释美国人为何容忍现有安检\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 tolerance of current security checks 与第二段的 are willing to tolerate 都在说接受安检，所以回到这一句，再看下一句末尾的why究竟接着解释什么。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>B里的tolerance是名词，原文 are willing to tolerate 是“愿意忍受”这一动作，讲的是同一种态度。security checks和security procedures也指向同一套安检事情。这里还要把in return for接上：美国人接受安检，不是喜欢排队，而是为了换取更多安全。\u003c/p>\n\u003cp>所以B不是只碰到security一个词，而是保留了“例子解释容忍原因”这整个关系。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Americans are willing to tolerate time-consuming security procedures in return for increased safety.\u003c/p>\n\u003cp>The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到埃及航空804航班坠毁，是为了解释美国人为何容忍现有安检。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 tolerance of current security checks 与第二段的 are willing to tolerate 都在说接受安检，所以回到这一句，再看下一句末尾的why究竟接着解释什么。\u003c/p>\n\u003cp>B里的tolerance是名词，原文 are willing to tolerate 是“愿意忍受”这一动作，讲的是同一种态度。security checks和security procedures也指向同一套安检事情。这里还要把in return for接上：美国人接受安检，不是喜欢排队，而是为了换取更多安全。\u003c/p>\n\u003cp>后一句先提坠机，再说它提供了一个tragic reminder of why。why没有另立对象，而是回扣刚说完的容忍理由。\u003c/p>\n\u003cp>前一句给出美国人的态度与交换条件，后一例子提醒人们安全风险，使这种容忍有了具体理由。\u003c/p>\n\u003cp>所以B不是只碰到security一个词，而是保留了“例子解释容忍原因”这整个关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Americans are willing to tolerate time-consuming security procedures in return for increased safety.\u003c/p>\n\u003cp>The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why.\u003c/p>\n\u003cp>先说美国人愿意以耗时安检换取安全，紧接坠机案例解释why，再用But限制可接受的时间与安全交换。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The crash reminds Americans why they accept time-consuming checks in exchange for safety.\u003c/p>\n\u003cp>坠机提醒美国人，他们为何愿以耗时检查换取安全。\u003c/p>\n\u003c/blockquote>\n\u003cp>why承接上一句的交换关系，事故让安全收益有具体背景；例子说明容忍的原因，没有替所有安检低效辩护。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题概括安检排队困境，案例应解释人们为何曾愿意承受安检；它不是要求无限加码安保，后面的转折还批评付出与回报失衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>explain American’s tolerance of current security checks\u003cbr>解释美国人为何容忍现有安检\u003c/p>\n\u003c/blockquote>\n\u003cp>所以B不是只碰到security一个词，而是保留了“例子解释容忍原因”这整个关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. highlight the necessity of upgrading major U.S. airports\u003c/h3>\n\u003cblockquote>\n\u003cp>强调升级美国主要机场的必要性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 upgrading major U.S. airports 指机场升级；要判断这个升级要求是否由坠机例子带出，仍要看第二段的 reminder of why，因为它直接写明了例子在这里起提醒作用。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>reminder of why 往前接到美国人愿意忍受安检，提醒的是为什么需要付出一定时间换取安全。C的 upgrading major U.S. airports 却把承担动作的对象换成机场设施，还加进“升级”这一工程性的做法。\u003c/p>\n\u003cp>C把安检所在的地点当成了例子要论证的对象，机场升级不是这句why所接的内容。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到埃及航空804航班坠毁，是为了强调升级美国主要机场的必要性。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 upgrading major U.S. airports 指机场升级；要判断这个升级要求是否由坠机例子带出，仍要看第二段的 reminder of why，因为它直接写明了例子在这里起提醒作用。\u003c/p>\n\u003cp>reminder of why 往前接到美国人愿意忍受安检，提醒的是为什么需要付出一定时间换取安全。C的 upgrading major U.S. airports 却把承担动作的对象换成机场设施，还加进“升级”这一工程性的做法。\u003c/p>\n\u003cp>不能因为安检在机场发生，就把所有涉及安检的例子都理解成呼吁升级机场。这里没有说这次坠机由哪座美国机场的设施造成，也没有以此提出改建要求。第二段后面的时间浪费和生活拖累，仍在衡量旅客承受的代价，不是在列机场应当更换的设备。\u003c/p>\n\u003cp>前者解释一种态度，后者要求对另一对象采取具体措施，二者之间缺了原文没有建立的联系。\u003c/p>\n\u003cp>C把安检所在的地点当成了例子要论证的对象，机场升级不是这句why所接的内容。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why.\u003c/p>\n\u003cp>先说美国人愿意以耗时安检换取安全，紧接坠机案例解释why，再用But限制可接受的时间与安全交换。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The crash demonstrates the need to upgrade major American airports.\u003c/p>\n\u003cp>坠机表明需要升级美国主要机场。\u003c/p>\n\u003c/blockquote>\n\u003cp>升级机场应说明事故与机场设备缺陷的关系。实际这一案例承接安全需求，第五段还提出无需改建机场的办法。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题概括安检排队困境，案例应解释人们为何曾愿意承受安检；它不是要求无限加码安保，后面的转折还批评付出与回报失衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>highlight the necessity of upgrading major U.S. airports\u003cbr>强调升级美国主要机场的必要性\u003c/p>\n\u003c/blockquote>\n\u003cp>C把安检所在的地点当成了例子要论证的对象，机场升级不是这句why所接的内容。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. emphasize the importance of privacy protection\u003c/h3>\n\u003cblockquote>\n\u003cp>强调保护隐私的重要性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 privacy protection 要找的是隐私方面的保护；第二段出现了 private lives，两处都带有“私人”的意思，因此回看private lives所在的完整句，确认它说的究竟是哪一种影响。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>这里 private lives 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。真正产生影响的主语是Wasted time，后面用is a drag说明浪费时间带来的拖累。D的 privacy protection 则是防止个人信息或私人领域被侵犯，已经把“生活被耽误”换成“隐私需要保护”。\u003c/p>\n\u003cp>D把private lives的生活范围换成privacy protection的保护议题，不能解释该例子的作用。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And it should: Wasted time is a drag on Americans&#39; economic and private lives, not to mention infuriating.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到埃及航空804航班坠毁，是为了强调保护隐私的重要性。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 privacy protection 要找的是隐私方面的保护；第二段出现了 private lives，两处都带有“私人”的意思，因此回看private lives所在的完整句，确认它说的究竟是哪一种影响。\u003c/p>\n\u003cp>这里 private lives 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。真正产生影响的主语是Wasted time，后面用is a drag说明浪费时间带来的拖累。D的 privacy protection 则是防止个人信息或私人领域被侵犯，已经把“生活被耽误”换成“隐私需要保护”。\u003c/p>\n\u003cp>再把它接回题干，题干问的是坠机例子为什么被提到，而不是安检可能引出的任何社会议题。前面的why仍然回扣安全与容忍，后面的private lives也没有把它转向隐私。只抓private这个相近词，会漏掉time才是这句话正在批评的东西。\u003c/p>\n\u003cp>时间代价与隐私保护是不同问题，原文句子的主语、影响和所接例子都没有变成隐私。\u003c/p>\n\u003cp>D把private lives的生活范围换成privacy protection的保护议题，不能解释该例子的作用。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>And it should: Wasted time is a drag on Americans&#39; economic and private lives, not to mention infuriating.\u003c/p>\n\u003cp>先说美国人愿意以耗时安检换取安全，紧接坠机案例解释why，再用But限制可接受的时间与安全交换。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The crash highlights the importance of protecting passengers’ privacy.\u003c/p>\n\u003cp>坠机凸显保护乘客隐私的重要性。\u003c/p>\n\u003c/blockquote>\n\u003cp>隐私路线需要指出个人信息怎样受侵害。实际以坠机提醒安全需求，没有把事故与数据或隐私保护连接。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题概括安检排队困境，案例应解释人们为何曾愿意承受安检；它不是要求无限加码安保，后面的转折还批评付出与回报失衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>emphasize the importance of privacy protection\u003cbr>强调保护隐私的重要性\u003c/p>\n\u003c/blockquote>\n\u003cp>D把private lives的生活范围换成privacy protection的保护议题，不能解释该例子的作用。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>21题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>21. B. explain American’s tolerance of current security checks\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：先看前一句的主语Americans和动作are willing to tolerate：这里写的是美国人为什么愿意接受安检。\u003c/p>\n\u003cp>B：B里的tolerance是名词，原文 are willing to tolerate 是“愿意忍受”这一动作，讲的是同一种态度。\u003c/p>\n\u003cp>C：reminder of why 往前接到美国人愿意忍受安检，提醒的是为什么需要付出一定时间换取安全。\u003c/p>\n\u003cp>D：这里 private lives 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。\u003c/p>\n\u003ch2>22题\u003c/h2>\n\u003cblockquote>\n\u003cp>Which of the following contributes to long waits at major airports?\u003cbr>以下哪一项会造成主要机场的长时间等待？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“以下哪一项会造成主要机场的长时间等待？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons – both fake and real – past airport security nearly every time they tried. Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago&#39;s O&#39;Hare International. It is not yet clear how much more effective airline security has become – but the lines are obvious.\u003c/p>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line. Part of the issue is that airports have only so much room for screening lanes. Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\u003c/p>\n\u003c/blockquote>\n\u003cp>第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。\u003c/p>\n\u003ch3>A. New restrictions on carry-on bags.\u003c/h3>\n\u003cblockquote>\n\u003cp>对随身行李的新限制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 restrictions on carry-on bags 与第四段的 carry-on bags 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>A的 restrictions on carry-on bags 是有关部门或航空公司施加的限制；原文围绕 their carry-on bags 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。\u003c/p>\n\u003cp>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.\u003c/p>\n\u003cp>Part of the issue is that airports have only so much room for screening lanes.\u003c/p>\n\u003cp>Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>造成主要机场长时间等待的一项原因是对随身行李的新限制。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 restrictions on carry-on bags 与第四段的 carry-on bags 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。\u003c/p>\n\u003cp>A的 restrictions on carry-on bags 是有关部门或航空公司施加的限制；原文围绕 their carry-on bags 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。\u003c/p>\n\u003cp>另外，原文用may be，结尾又写航空公司强烈争辩这一解释。A既换掉了行为主体，也把一个尚有争议的可能因素写成了明确的新限制。不能把“旅客怎样处理行李”和“机场怎样限制行李”混成同一件事。\u003c/p>\n\u003cp>more people是主语，to avoid checked-baggage fees是目的，原文没有把这件事写成新的限制政策。\u003c/p>\n\u003cp>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.\u003c/p>\n\u003cp>Part of the issue is that airports have only so much room for screening lanes.\u003c/p>\n\u003cp>Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.\u003c/p>\n\u003cp>第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>New restrictions on carry-on bags have increased waiting times.\u003c/p>\n\u003cp>新的随身行李限制增加了等待时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文提出的是旅客可能多塞行李以避费，并注明航空公司反对这种解释；既不是新限制，也没有把它写成确定原因。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>排队是全文的问题起点；具体成因仍要读resulted in前的并列项，主旨不能替代对秘密检查频率或行李规则的核对。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>New restrictions on carry-on bags.\u003cbr>对随身行李的新限制\u003c/p>\n\u003c/blockquote>\n\u003cp>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. The declining efficiency of the TSA.\u003c/h3>\n\u003cblockquote>\n\u003cp>运输安全管理局效率的下降\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时选项呈现为“The [xxx] efficiency of the TSA.”，保留了相应遮挡。当时的定位线索是：B的 efficiency of the TSA 谈TSA办事效率；第三段的 have resulted in long waits 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>have resulted in long waits 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 efficiency of the TSA 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。\u003c/p>\n\u003cp>B把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago&#39;s O&#39;Hare International.\u003c/p>\n\u003cp>It is not yet clear how much more effective airline security has become – but the lines are obvious.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>造成主要机场长时间等待的一项原因是运输安全管理局效率的下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 efficiency of the TSA 谈TSA办事效率；第三段的 have resulted in long waits 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。\u003c/p>\n\u003cp>have resulted in long waits 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 efficiency of the TSA 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。\u003c/p>\n\u003cp>段末尤其要分清：作者说安保在某方面改善了多少还不清楚，但队伍看得见。这不是一份已经确定TSA效率变化的结论。第四段又分别列旅客增加、通道空间和行李做法，不能把这些不同原因压成B那一个机构效率判断。\u003c/p>\n\u003cp>排队结果不等于效率测量，原文列出的原因也不是效率变化这件事。\u003c/p>\n\u003cp>B把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago&#39;s O&#39;Hare International.\u003c/p>\n\u003cp>It is not yet clear how much more effective airline security has become – but the lines are obvious.\u003c/p>\n\u003cp>第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The TSA’s falling efficiency has been shown to lengthen the queues.\u003c/p>\n\u003cp>已有证据表明运输安全管理局效率下降使队伍变长。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者说安保效力改善多少尚不清楚，并未报告效率持续下降。客流增加和能力未同步扩充可造成队伍变长，无需额外加入效率下降趋势。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>排队是全文的问题起点；具体成因仍要读resulted in前的并列项，主旨不能替代对秘密检查频率或行李规则的核对。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>The declining efficiency of the TSA.\u003cbr>运输安全管理局效率的下降\u003c/p>\n\u003c/blockquote>\n\u003cp>B把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. An increase in the number of travelers.\u003c/h3>\n\u003cblockquote>\n\u003cp>旅客人数的增加\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 number of travelers 与第三段的 a rise in airline travel 都涉及航空出行的人数增加，所以回看这部分和后面的have resulted in，看增加与等待是否被原文明说成因果。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>a rise in airline travel 是航空出行增加，C用 number of travelers 把它落到旅客数量上，所说的变化方向都是增加。due to the improving economy and low oil prices先交代出行为什么增加；后面的have resulted in则进一步说明这些因素怎样造成long waits。两层因果不要倒着读。\u003c/p>\n\u003cp>它在have resulted in前面直接参与构成原因，且C没有把“一个因素”夸大成“唯一因素”。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago&#39;s O&#39;Hare International.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>造成主要机场长时间等待的一项原因是旅客人数的增加。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 number of travelers 与第三段的 a rise in airline travel 都涉及航空出行的人数增加，所以回看这部分和后面的have resulted in，看增加与等待是否被原文明说成因果。\u003c/p>\n\u003cp>a rise in airline travel 是航空出行增加，C用 number of travelers 把它落到旅客数量上，所说的变化方向都是增加。due to the improving economy and low oil prices先交代出行为什么增加；后面的have resulted in则进一步说明这些因素怎样造成long waits。两层因果不要倒着读。\u003c/p>\n\u003cp>原文没有说“旅客增加是唯一原因”，C也没有加only，只是在Which contributes to的问题下提供一个促成因素。combined with说明还有安保措施这个因素一同起作用，不会因此否定旅客增加本身的贡献。第四段的steep increase in airline travel也继续提到同一个增长。\u003c/p>\n\u003cp>它在have resulted in前面直接参与构成原因，且C没有把“一个因素”夸大成“唯一因素”。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago&#39;s O&#39;Hare International.\u003c/p>\n\u003cp>第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文 – past airport security nearly every time they tried.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>造成主要机场长时间等待的一项原因是频繁且出人意料的秘密检查。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 Frequent unexpected secret checks 与第三段的 a secret check 都提到秘密检查，因此回到该段第一句，再把它与后一句写长队的内容区分开。\u003c/p>\n\u003cp>原文的 a secret check 是去年一次调查检查，句子在报告调查人员在机场安检中做了什么。D却写 Frequent unexpected secret checks，把单次调查说成反复进行的、出乎意料的秘密检查，并让它直接承担排长队的原因。\u003c/p>\n\u003cp>nearly every time they tried也不能给Frequent补依据。every time修饰的是调查人员尝试带武器通过的情况，不等于航空旅客不断受到秘密抽查。后一句用since then转到之后的安保措施，再接航空出行增加与长时间等待；调查的发现和其后的安检安排，在时间顺序与行为内容上都不同。\u003c/p>\n\u003cp>尝试的主体是调查人员，而原文的秘密检查是发现情况的调查，不是反复拖慢旅客的日常程序。\u003c/p>\n\u003cp>D把调查中的多次尝试换成检查频率，又把先前调查换成长队的直接原因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons – both fake and real – past airport security nearly every time they tried.\u003c/p>\n\u003cp>第三段明确将安保加强与航空旅行增加并列为原因，第四段继续说明政府未预料增幅、人员和通道不足。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Frequent surprise inspections themselves are holding up passengers.\u003c/p>\n\u003cp>频繁的突击检查本身正使乘客滞留。\u003c/p>\n\u003c/blockquote>\n\u003cp>secret check是去年发现漏洞的一次检查，随后加强安保才参与造成排队；选项既增添频繁，又把前置调查改成眼前拥堵的直接原因。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>排队是全文的问题起点；具体成因仍要读resulted in前的并列项，主旨不能替代对秘密检查频率或行李规则的核对。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Frequent unexpected secret checks.\u003cbr>频繁且出人意料的秘密检查\u003c/p>\n\u003c/blockquote>\n\u003cp>D把调查中的多次尝试换成检查频率，又把先前调查换成长队的直接原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>22题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>22. C. An increase in the number of travelers.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：A的 restrictions on carry-on bags 是有关部门或航空公司施加的限制；原文围绕 their carry-on bags 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。\u003c/p>\n\u003cp>B：have resulted in long waits 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。\u003c/p>\n\u003cp>C：a rise in airline travel 是航空出行增加，C用 number of travelers 把它落到旅客数量上，所说的变化方向都是增加。\u003c/p>\n\u003cp>D：原文的 a secret check 是去年一次调查检查，句子在报告调查人员在机场安检中做了什么。\u003c/p>\n\u003ch2>23题\u003c/h2>\n\u003cblockquote>\n\u003cp>The word “expedited” (Para. 5) is closest in meaning to ______.\u003cbr>第五段中的expedited，意思最接近哪个词？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>词义题。题干要求判断“第五段中的expedited，意思最接近哪个词？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>There is one step the TSA could take that would not require remodeling airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003c/blockquote>\n\u003cp>通过背景审查的旅客可用专门通道，TSA于是把资源集中于较高风险者，为所有人节省时间。\u003c/p>\n\u003ch3>A. quieter\u003c/h3>\n\u003cblockquote>\n\u003cp>更安静的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>quieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\u003c/p>\n\u003cp>上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass a background check are eligible to use expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第五段expedited screening lanes中的expedited表示更安静的。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 quieter 说声音更小，而第五段的 saving time 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。\u003c/p>\n\u003cp>quieter 比较的是声音大小；saving time 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。\u003c/p>\n\u003cp>一个安静的通道并不自然导致所有人省时间。即使现实里安静与快速可以同时存在，这道词义题也只能用作者已经给出的解释来判断，不能自行给这个通道添加另一个优点。\u003c/p>\n\u003cp>上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass a background check are eligible to use expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003cp>通过背景审查的旅客可用专门通道，TSA于是把资源集中于较高风险者，为所有人节省时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass the check may use quieter lanes with less noise.\u003c/p>\n\u003cp>通过核查的乘客可使用噪声更小的安静通道。\u003c/p>\n\u003c/blockquote>\n\u003cp>更安静需要噪声或环境描述，后文却用节省时间解释通道作用，没有讨论声音。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文试图减少无谓等待，这能限定预检通道的功能方向；具体词义由saving time确认，不能凭“优待通道”猜测更宽或更便宜。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>quieter\u003cbr>更安静的\u003c/p>\n\u003c/blockquote>\n\u003cp>上下文的结果落在时间上，而quieter把比较的尺度换成了声音。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. faster\u003c/h3>\n\u003cblockquote>\n\u003cp>更快捷的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 faster 表示速度更快，后文的 saving time for everyone involved 表示给所有参与者省时间；两者能形成结果关系，所以回看背景审查、通道使用和时间节省这连续两句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文先按是否通过背景审查分出一部分旅客，让他们有资格使用某类通道，再把检查注意力放在风险更高的人身上。这种安排带来的结果明写为 saving time for everyone involved。B的 faster 正好解释了通道怎样在时间上产生改善。\u003c/p>\n\u003cp>更快的安检通道与节省时间相对应，也能放回原来的名词短语中。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass a background check are eligible to use expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第五段expedited screening lanes中的expedited表示更快捷的。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 faster 表示速度更快，后文的 saving time for everyone involved 表示给所有参与者省时间；两者能形成结果关系，所以回看背景审查、通道使用和时间节省这连续两句。\u003c/p>\n\u003cp>原文先按是否通过背景审查分出一部分旅客，让他们有资格使用某类通道，再把检查注意力放在风险更高的人身上。这种安排带来的结果明写为 saving time for everyone involved。B的 faster 正好解释了通道怎样在时间上产生改善。\u003c/p>\n\u003cp>这里不是见到time就机械选快，而是先检查它修饰的screening lanes，再看This指回的安排怎样省时。通道、分流、时间结果都接在一起，“更快的安检通道”能够顺着读下去，也没有额外引入价格或通道宽度。\u003c/p>\n\u003cp>更快的安检通道与节省时间相对应，也能放回原来的名词短语中。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass a background check are eligible to use expedited screening lanes.\u003c/p>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003cp>通过背景审查的旅客可用专门通道，TSA于是把资源集中于较高风险者，为所有人节省时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers who pass the check can use faster screening lanes.\u003c/p>\n\u003cp>通过核查的乘客可使用更快的安检通道。\u003c/p>\n\u003c/blockquote>\n\u003cp>背景筛选让现场程序加速，并把检查资源留给高风险者。faster恰能引出saving time，而非增加另一种优待。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文试图减少无谓等待，这能限定预检通道的功能方向；具体词义由saving time确认，不能凭“优待通道”猜测更宽或更便宜。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>faster\u003cbr>更快捷的\u003c/p>\n\u003c/blockquote>\n\u003cp>更快的安检通道与节省时间相对应，也能放回原来的名词短语中。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. wider\u003c/h3>\n\u003cblockquote>\n\u003cp>更宽的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 wider 说空间宽度；第五段的 saving time 说时间结果，因此回到描述通道使用条件的句子，看看通道的区别是空间变化还是检查安排。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>wider 需要的是更大的横向空间，而这两句给出的区别是“通过背景审查的人可以使用”。之后的This接着说把注意力放到高风险旅客上，最后落在 saving time，没有说通道被拓宽。\u003c/p>\n\u003cp>C把前文的空间话题搬来解释这里的通道性质，读错了当前句子的解释 e>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>wider\u003cbr>更宽的\u003c/p>\n\u003c/blockquote>\n\u003cp>C把前文的空间话题搬来解释这里的通道性质，读错了当前句子的解释关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. cheaper\u003c/h3>\n\u003cblockquote>\n\u003cp>更便宜的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 cheaper 说花钱较少，而第五段的 saving time 明写节省的对象是时间，所以回看这句结果，不把“省”一概理解成省钱。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>saving time 中time是明确的宾语；D的 cheaper 却要把它解释成价格降低。原文介绍的是旅客通过背景审查后有资格走某类通道，以及这样怎样改变TSA分配检查注意力的方式，并没有拿两个收费水平来比较。\u003c/p>\n\u003cp>原文限定了节省时间，cheaper描述的则是货币成本，比较对象已经不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第五段expedited screening lanes中的expedited表示更便宜的。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 cheaper 说花钱较少，而第五段的 saving time 明写节省的对象是时间，所以回看这句结果，不把“省”一概理解成省钱。\u003c/p>\n\u003cp>saving time 中time是明确的宾语；D的 cheaper 却要把它解释成价格降低。原文介绍的是旅客通过背景审查后有资格走某类通道，以及这样怎样改变TSA分配检查注意力的方式，并没有拿两个收费水平来比较。\u003c/p>\n\u003cp>时间节省当然可能给人带来实际好处，但好处不等于选项中的价钱便宜。这里问一个具体单词在第五段的意思，不能把通道使用的全部可能收益都装进这个形容词，更不能从“为所有人节省”里漏掉time。\u003c/p>\n\u003cp>原文限定了节省时间，cheaper描述的则是货币成本，比较对象已经不同。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.\u003c/p>\n\u003cp>通过背景审查的旅客可用专门通道，TSA于是把资源集中于较高风险者，为所有人节省时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>
