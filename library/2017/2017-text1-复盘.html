s allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck&#39;s fatal flaw. Upcoming reforms might bring the price to a more reasonable level. But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\u003c/p>\n\u003cp>The TSA cannot continue diverting resources into underused PreCheck lanes while most of the traveling public suffers in unnecessary lines. It is long past time to make the program work.\u003c/p>\n\u003c/blockquote>\n\u003cp>计划希望招募2500万人，实际远未达到；作者把高报名费称为fatal flaw，建议直接资助或另设降费办法。\u003c/p>\n\u003ch3>A. a dramatic reduction of its scale\u003c/h3>\n\u003cblockquote>\n\u003cp>规模大幅缩减\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“a dramatic [xxx] of its scale”，保留了相应遮挡。当时的定位线索是：A的 its scale 指计划规模，第六段的 not gotten anywhere close to that 回接第五段的目标人数；两处都涉及参加计划的人数，因此把这句与25 million的目标放在一起看。读完全文后，做题模式再经交叉验证排除A，最终选择D。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>第5段的2500万人是计划希望达到的报名人数，第6段的has not gotten anywhere close说明实际规模远未接近目标。两个位置组成的是实际值与目标值的差距。\u003c/p>\n\u003cp>后文用sticker shock、85美元和fatal flaw解释报名不足，再建议降低价格。D的报名费过高对应这一明确成因；A则把横向的目标差距改成了纵向的规模下降。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>PreCheck计划的一个问题是规模大幅缩减。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 its scale 指计划规模，第六段的 not gotten anywhere close to that 回接第五段的目标人数；两处都涉及参加计划的人数，因此把这句与25 million的目标放在一起看。\u003c/p>\n\u003cp>第5段的2500万人是计划希望达到的报名人数，第6段的has not gotten anywhere close说明实际规模远未接近目标。两个位置组成的是实际值与目标值的差距。\u003c/p>\n\u003cp>A说dramatic reduction of its scale，要求同一计划的规模曾较大，随后显著缩小。原文没有提供过去较大和现在较小两个实际规模，更没有下降幅度；目标没有实现不能换成规模已经骤减。\u003c/p>\n\u003cp>后文用sticker shock、85美元和fatal flaw解释报名不足，再建议降低价格。D的报名费过高对应这一明确成因；A则把横向的目标差距改成了纵向的规模下降。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks.\u003c/p>\n\u003cp>计划希望招募2500万人，实际远未达到；作者把高报名费称为fatal flaw，建议直接资助或另设降费办法。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The program has suffered a dramatic decline from its previous enrollment scale.\u003c/p>\n\u003cp>该计划的报名规模相较过去已急剧下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>规模缩减必须比较以前与现在的实际人数。原文比较实际与目标，没达到目标不能证明已经从大规模退缩。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章要让有用的预检方案真正缓解队伍，题干应回答阻碍使用的条件。人数不及目标与规模已经下降要分开，价格是否合理则有局部评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a dramatic reduction of its scale\u003cbr>规模大幅缩减\u003c/p>\n\u003c/blockquote>\n\u003cp>后文用sticker shock、85美元和fatal flaw解释报名不足，再建议降低价格。D的报名费过高对应这一明确成因；A则把横向的目标差距改成了纵向的规模下降。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. its wrongly-directed implementation\u003c/h3>\n\u003cblockquote>\n\u003cp>实施方向错误\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 wrongly-directed implementation 批评实施方向，第五段的 a win-win for travelers and the TSA 评价计划安排的用途；因此先回看这个评价，再接第六段指出的具体障碍，比较到底错在方向还是卡在推行条件。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>第五段说 a win-win for travelers and the TSA，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。这一安排的目标和基本方向得到了正面说明。B的 wrongly-directed implementation 则把问题说成实施朝错方向走。\u003c/p>\n\u003cp>B把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>PreCheck is supposed to be a win-win for travelers and the TSA.\u003c/p>\n\u003cp>Since the beginning, this price tag has been PreCheck&#39;s fatal flaw.\u003c/p>\n\u003cp>Upcoming reforms might bring the price to a more reasonable level.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>PreCheck计划的一个问题是实施方向错误。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 wrongly-directed implementation 批评实施方向，第五段的 a win-win for travelers and the TSA 评价计划安排的用途；因此先回看这个评价，再接第六段指出的具体障碍，比较到底错在方向还是卡在推行条件。\u003c/p>\n\u003cp>第五段说 a win-win for travelers and the TSA，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。这一安排的目标和基本方向得到了正面说明。B的 wrongly-directed implementation 则把问题说成实施朝错方向走。\u003c/p>\n\u003cp>第六段并没有要求把目标或分流方向改掉，而是连续指向this price tag和更合理的价格。计划还没有达到目标人数，说明实施有障碍，不等于实施方向错误；同一计划可以方向可取，却因收费条件而推不动。B把“未充分实现”与“方向选错”混成了一个判断。\u003c/p>\n\u003cp>B把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>PreCheck is supposed to be a win-win for travelers and the TSA.\u003c/p>\n\u003cp>Since the beginning, this price tag has been PreCheck&#39;s fatal flaw.\u003c/p>\n\u003cp>Upcoming reforms might bring the price to a more reasonable level.\u003c/p>\n\u003cp>计划希望招募2500万人，实际远未达到；作者把高报名费称为fatal flaw，建议直接资助或另设降费办法。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The program is failing because its risk-based direction is wrong.\u003c/p>\n\u003cp>该计划正在失败，因为按风险分配检查的方向错误。\u003c/p>\n\u003c/blockquote>\n\u003cp>方向错误应建议停止按风险分流。实际称其win-win，并要求降费扩大参与，是支持方向而修补实施条件。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章要让有用的预检方案真正缓解队伍，题干应回答阻碍使用的条件。人数不及目标与规模已经下降要分开，价格是否合理则有局部评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its wrongly-directed implementation\u003cbr>实施方向错误\u003c/p>\n\u003c/blockquote>\n\u003cp>B把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the government’s reluctance to back it\u003c/h3>\n\u003cblockquote>\n\u003cp>政府不愿支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 government’s reluctance 是政府的不愿意；第五段的 The TSA wants to enroll 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>The TSA wants to enroll 明说TSA想扩大报名人数。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。\u003c/p>\n\u003cp>C把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>PreCheck计划的一个问题是政府不愿支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 government’s reluctance 是政府的不愿意；第五段的 The TSA wants to enroll 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。\u003c/p>\n\u003cp>The TSA wants to enroll 明说TSA想扩大报名人数。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。\u003c/p>\n\u003cp>应当做某事与不愿做某事之间不能直接画等号。前者可能是在建议提高力度、改变方式或加快行动；只有原文出现明确拒绝或消极意愿，才有理由写reluctance。这里实际写了TSA的目标以及国会可采取的具体方式，不能把未做到位一律转译成主观上不愿支持。\u003c/p>\n\u003cp>should是建议，wants是已有意愿，两者都没有给出政府不愿支持这一事实。\u003c/p>\n\u003cp>C把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The TSA wants to enroll 25 million people in PreCheck.\u003c/p>\n\u003cp>But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.\u003c/p>\n\u003cp>计划希望招募2500万人，实际远未达到；作者把高报名费称为fatal flaw，建议直接资助或另设降费办法。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The government is unwilling to support the program.\u003c/p>\n\u003cp>政府不愿支持该计划。\u003c/p>\n\u003c/blockquote>\n\u003cp>不愿支持应有拒绝的态度或行动。TSA明确要扩大规模，Congress should是作者提出资助建议，不能倒推出政府已经拒绝。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章要让有用的预检方案真正缓解队伍，题干应回答阻碍使用的条件。人数不及目标与规模已经下降要分开，价格是否合理则有局部评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the government’s reluctance to back it\u003cbr>政府不愿支持\u003c/p>\n\u003c/blockquote>\n\u003cp>C把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. an unreasonable price for enrollment\u003c/h3>\n\u003cblockquote>\n\u003cp>不合理的报名价格\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“an [xxx] price for enrollment”，保留了相应遮挡。当时的定位线索是：D的 price for enrollment 与第六段的 this price tag 都说参加预检的价格，所以回到每五年支付85美元这句，再看this price tag后面的评价和改价建议。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>price for enrollment 的对象能和 this price tag 接上。先有具体金额85美元，再由this指回这个金额，接着写它是fatal flaw，下一句又提出more reasonable level。这不是路过提了一笔钱，而是把费用放在计划缺陷和改革的连续说明中。\u003c/p>\n\u003cp>报名价格正是本段明说的障碍所在，但D的具体评价词仍需结合后续整篇理解来判断。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Since the beginning, this price tag has been PreCheck&#39;s fatal flaw.\u003c/p>\n\u003cp>Upcoming reforms might bring the price to a more reasonable level.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>PreCheck计划的一个问题是不合理的报名价格。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 price for enrollment 与第六段的 this price tag 都说参加预检的价格，所以回到每五年支付85美元这句，再看this price tag后面的评价和改价建议。\u003c/p>\n\u003cp>price for enrollment 的对象能和 this price tag 接上。先有具体金额85美元，再由this指回这个金额，接着写它是fatal flaw，下一句又提出more reasonable level。这不是路过提了一笔钱，而是把费用放在计划缺陷和改革的连续说明中。\u003c/p>\n\u003cp>报名价格正是本段明说的障碍所在，但D的具体评价词仍需结合后续整篇理解来判断。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Since the beginning, this price tag has been PreCheck&#39;s fatal flaw.\u003c/p>\n\u003cp>Upcoming reforms might bring the price to a more reasonable level.\u003c/p>\n\u003cp>计划希望招募2500万人，实际远未达到；作者把高报名费称为fatal flaw，建议直接资助或另设降费办法。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The enrollment fee is unreasonably high and should be brought down.\u003c/p>\n\u003cp>报名费高得不合理，应该降低。\u003c/p>\n\u003c/blockquote>\n\u003cp>sticker shock说明高价造成阻力，fatal flaw给出评价，more reasonable level又给出改进方向，三句共同支持收费不合理。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Getting Stuck in Security Lines\u003cbr>困在安检长队中\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章要让有用的预检方案真正缓解队伍，题干应回答阻碍使用的条件。人数不及目标与规模已经下降要分开，价格是否合理则有局部评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>an unreasonable price for enrollment\u003cbr>不合理的报名价格\u003c/p>\n\u003c/blockquote>\n\u003cp>报名价格正是本段明说的障碍所在，但D的具体评价词仍需结合后续整篇理解来判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>24题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>24. D. an unreasonable price for enrollment\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：第5段的2500万人是计划希望达到的报名人数，第6段的has not gotten anywhere close说明实际规模远未接近目标。\u003c/p>\n\u003cp>B：第五段说 a win-win for travelers and the TSA，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。\u003c/p>\n\u003cp>C：The TSA wants to enroll 明说TSA想扩大报名人数。\u003c/p>\n\u003cp>D：price for enrollment 的对象能和 this price tag 接上。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：机场安检现状\u003c/strong>（段落1-2问题呈现） 当前困境：提前到达时间从2小时增至3小时（主要机场安检队伍越来越长）→ 平衡困境：【美国人愿意容忍耗时安检换取安全（埃及航空804航班坠毁的提醒）// 但过度要求或安全不足都会削弱支持】→ 负面影响：浪费时间拖累经济和私人生活\u003c/p>\n\u003cp>↓（原因分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：长队形成的原因\u003c/strong>（段落3-4原因剖析） 安检效果与现实矛盾：【去年秘密检查：武器几乎每次都能通过 → 加强安全措施 + 旅客增长（经济改善+低油价）→ 导致长时间等待】→ 具体原因：【1.政府未预料到旅客急剧增长（TSA急于招聘）+ 2.机场安检通道空间有限 + 3.乘客过度打包随身行李避免托运费（航空公司反驳）】\u003c/p>\n\u003cp>↓（解决方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：PreCheck计划的潜力\u003c/strong>（段落5解决方案） PreCheck优势：不需要改造机场或急于招聘 → 双赢机制：【通过背景调查的乘客使用快速通道 → TSA专注于高风险旅客 → 节省所有人时间】→ 目标：招募2500万人\u003c/p>\n\u003cp>↓（实施障碍）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：PreCheck的问题与改革\u003c/strong>（段落6问题分析） 核心问题：价格震惊（每五年85美元）= PreCheck的致命缺陷 → 结果：远未达到目标 → 改革方向：【即将到来的改革可能降价 + 国会应直接行动（资助注册或削减成本）】\u003c/p>\n\u003cp>↓（紧迫呼吁）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：改革的紧迫性\u003c/strong>（段落7结论呼吁） 资源错配：TSA将资源投入未充分使用的PreCheck通道 // 大多数旅客在不必要的队伍中受苦 → 结论：早就该让PreCheck真正运作起来\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：机场安检长队问题日益严重，虽然PreCheck计划提供了双赢解决方案，但其高昂的注册费用成为致命缺陷，需要国会采取行动降低成本，让这个计划真正发挥作用，解决当前资源错配和旅客痛苦的困境。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Several Pressures Behind One Queue\u003c/p>\n\u003cp>B. The Price That Keeps Participation Low\u003c/p>\n\u003cp>C. Separating Passengers by Assessed Risk\u003c/p>\n\u003cp>D. When Waiting Threatens Support for Security\u003c/p>\n\u003cp>E. A Demand to Abandon Airport Checks\u003c/p>\n\u003cp>F. Making an Existing Programme Work\u003c/p>\n\u003cp>G. Proof That Longer Lines Mean Greater Safety\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>Travellers may accept an inconvenient procedure when they believe it protects them. Their patience is not unlimited, however. Hours lost in a queue affect work, family life and confidence in the organisation responsible. A security system therefore needs public support as well as formal authority. Demanding ever more time without making the benefit clear risks weakening that support, even among people who take the possibility of an attack seriously.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>One visible queue can have several causes. More passengers may arrive, checks may become slower, staff recruitment may lag behind demand, and the building may have limited space for screening lanes. Carry-on luggage can add another complication. These possibilities should be distinguished because they imply different remedies. The length of the queue alone does not tell an airport whether it needs more staff, a redesigned process or a better way to distribute passengers.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>A pre-screening programme offers a different way to use limited resources. Passengers who complete a background check can become eligible for faster lanes. Staff may then devote more attention to travellers who require closer examination. The advantage is not that some people are simply allowed to ignore security. Rather, relevant checks occur through a different process, making it possible to save time while concentrating effort where it is most needed.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>A programme can promise a better experience and still attract too few participants. If enrolment carries a charge that passengers consider excessive, many may decline to join. The result can be a small enrolled group beside a much larger group waiting in ordinary lanes. The fee then becomes more than an individual inconvenience. It limits the scale at which the programme can relieve pressure on the whole system.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>Before creating another complicated scheme, authorities can ask why an existing one fails to achieve its intended reach. Reducing enrolment costs, improving access or helping finance background checks may increase participation. Any change should be judged by whether it actually eases ordinary queues while preserving necessary scrutiny. Underused fast lanes beside exhausted travellers are not evidence of a successful reform. A workable programme must improve the experience of the travelling public as a whole.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：D. When Waiting Threatens Support for Security / 等待何时损害对安检的支持\u003c/strong>\u003c/p>\n\u003cp>承认安全需求，再说明时间代价会侵蚀公众支持。\u003c/p>\n\u003cblockquote>\n\u003cp>Travellers may accept an inconvenient procedure when they believe it protects them.\u003c/p>\n\u003cp>Demanding ever more time without making the benefit clear risks weakening that support, even among people who take the possibility of an attack seriously.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>承认安全需求 → 再说明时间代价会侵蚀公众支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>Waiting对应工作和家庭时间损失，Threatens Support对应过高时间要求削弱公众对安检的支持；Security保留作者承认必要保护的前提。\u003c/p>\n\u003cp>最强干扰项E（A Demand to Abandon Airport Checks）容易因相同话题进入考虑。但批评无效等待不等于要求放弃检查；开头已保留安检的合理价值。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：A. Several Pressures Behind One Queue / 一条长队背后的多重压力\u003c/strong>\u003c/p>\n\u003cp>分开列出队伍形成的可能原因，说明不能凭表象选措施。\u003c/p>\n\u003cblockquote>\n\u003cp>One visible queue can have several causes.\u003c/p>\n\u003cp>The length of the queue alone does not tell an airport whether it needs more staff, a redesigned process or a better way to distribute passengers.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>分开列出队伍形成的可能原因 → 说明不能凭表象选措施。\u003c/p>\n\u003c/blockquote>\n\u003cp>Several Pressures对应客流、检查速度、人手、空间及行李因素，One Queue对应这些因素共同产生的可见长队；标题解释同一表象可能有不同成因。\u003c/p>\n\u003cp>最强干扰项G（Proof That Longer Lines Mean Greater Safety）容易因相同话题进入考虑。但队伍长度只能显示拥堵，不能独立证明实际安全性提高。\u003c/p>\n\u003cp>\u003cstrong>42题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：C. Separating Passengers by Assessed Risk / 按核查后的风险分流乘客\u003c/strong>\u003c/p>\n\u003cp>解释背景核查与快捷通道如何实现按风险分配资源。\u003c/p>\n\u003cblockquote>\n\u003cp>A pre-screening programme offers a different way to use limited resources.\u003c/p>\n\u003cp>Rather, relevant checks occur through a different process, making it possible to save time while concentrating effort where it is most needed.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释背景核查与快捷通道如何实现按风险分配资源。\u003c/p>\n\u003c/blockquote>\n\u003cp>Separating Passengers对应快捷通道和其他检查分流，Assessed Risk对应先完成背景核查再判定资格；不能把分流读成不作检查。\u003c/p>\n\u003cp>最强干扰项E（A Demand to Abandon Airport Checks）容易因相同话题进入考虑。但分流以背景核查为前提，不能概括成取消机场安全程序。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：B. The Price That Keeps Participation Low / 压低参与率的价格\u003c/strong>\u003c/p>\n\u003cp>由个人费用负担解释预检参与不足及整体分流失效。\u003c/p>\n\u003cblockquote>\n\u003cp>A programme can promise a better experience and still attract too few participants.\u003c/p>\n\u003cp>It limits the scale at which the programme can relieve pressure on the whole system.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由个人费用负担解释预检参与不足及整体分流失效。\u003c/p>\n\u003c/blockquote>\n\u003cp>Price对应报名费用，Keeps Participation Low对应乘客因费用放弃而使报名不足；标题还连接个人决定与整个体系分流效果。\u003c/p>\n\u003cp>最强干扰项A（Several Pressures Behind One Queue）容易因相同话题进入考虑。但本段已锁定报名费这个具体障碍，不是在继续罗列长队的全部成因。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Making an Existing Programme Work / 让既有计划真正奏效\u003c/strong>\u003c/p>\n\u003cp>从既有计划的执行障碍转入降低门槛、检验实际效果。\u003c/p>\n\u003cblockquote>\n\u003cp>Before creating another complicated scheme, authorities can ask why an existing one fails to achieve its intended reach.\u003c/p>\n\u003cp>A workable programme must improve the experience of the travelling public as a whole.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从既有计划的执行障碍转入降低门槛、检验实际效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>Existing Programme对应已经设立但参与不足的预检，Making It Work对应降低门槛并检验普通队伍是否真正改善；中心在执行成效。\u003c/p>\n\u003cp>最强干扰项G（Proof That Longer Lines Mean Greater Safety）容易因相同话题进入考虑。但评价标准是全体旅客等待与必要检查的平衡，不是长队本身代表成效。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>Passengers asked to arrive ever earlier for a domestic flight can see the cost of airport security in hours. They may still accept that cost when protection is credible. The challenge for authorities is to preserve safety without allowing waiting to become a needless burden on ordinary life.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Lowering that perceived cost could involve a smaller charge or help with payment. Authorities could also examine whether processing costs can be reduced. These are ways of improving access to an existing programme, not proposals to let travellers avoid the background check on which it depends.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Reducing those pressures does not always require a larger building. A programme that checks some passengers’ backgrounds in advance can make them eligible for faster screening. It can also free staff to concentrate on people who need closer examination. This creates a possible gain for both passengers and the security agency.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Improved access should be assessed by its effect on the ordinary queue. More enrolled passengers may make better use of fast lanes and release resources for other checks. But registration totals alone are insufficient: the agency must ask whether waiting falls and necessary security work remains effective.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>That possible gain depends on participation. A fast lane used by only a small minority does little for the long queue beside it. If authorities want the programme to change the whole system, they must understand why many otherwise eligible travellers do not enrol.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>One reason for not enrolling is the price. A fee attached to a background check may look modest to administrators but discouraging to a family deciding whether to join. The perceived cost can keep participation far below the level needed for the programme to fulfil its purpose.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>Waiting has grown for several reasons that should not be confused. Passenger numbers can rise at the same time as screening becomes more demanding. Staffing may fail to keep pace, while buildings leave little room for extra lanes. Together these pressures produce a problem that simply asking travellers to arrive earlier cannot solve.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>When waiting falls without weakening necessary checks, the programme has begun to justify its promise. The larger lesson is that security policy needs workable administration as well as serious intentions. Resources placed in an underused solution should be redirected toward making that solution useful to the public.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出安全与等待代价的平衡\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>提出降低门槛且保留核查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>提出背景预检的双赢方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>要求按整体等候与安全效果验收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>把预期收益转为参与率问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>回答不报名的价格原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>解释等待背后的多重压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以落实方案、改善公众体验收束\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出安全与等待代价的平衡 → 解释等待背后的多重压力 → 提出背景预检的双赢方案 → 把预期收益转为参与率问题 → 回答不报名的价格原因 → 提出降低门槛且保留核查 → 要求按整体等候与安全效果验收 → 以落实方案、改善公众体验收束\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → G → C → E → F → B → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：G、C、F、B、D。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → G → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The challenge for authorities is to preserve safety without allowing waiting to become a needless burden on ordinary life.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Waiting has grown for several reasons that should not be confused.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing those pressures does not always require a larger building.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>waiting\u003c/code>，G继续处理这一对象，完成“解释等待背后的多重压力”。到本段末尾，讨论又落到\u003ccode>these pressures\u003c/code>，这正好为下一段“提出背景预检的双赢方案”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出安全与等待代价的平衡 → 解释等待背后的多重压力 → 提出背景预检的双赢方案\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“提出背景预检的双赢方案”。它也属于同一论题，但若直接放在这里，就会跳过“解释等待背后的多重压力”这一必要环节；其段首“Reducing those pressures does not always require a larger building.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的\u003ccode>these pressures\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是G → C → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Together these pressures produce a problem that simply asking travellers to arrive earlier cannot solve.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing those pressures does not always require a larger building.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That possible gain depends on participation.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>these pressures\u003c/code>，C继续处理这一对象，完成“提出背景预检的双赢方案”。到本段末尾，讨论又落到\u003ccode>a possible gain\u003c/code>，这正好为下一段“把预期收益转为参与率问题”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释等待背后的多重压力 → 提出背景预检的双赢方案 → 把预期收益转为参与率问题\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“解释等待背后的多重压力”。它也属于同一论题，但若直接放在这里，就会跳过“提出背景预检的双赢方案”这一必要环节；其段首“Waiting has grown for several reasons that should not be confused.”需要的前提与G当前收束的对象不一致，后续也接不出E所需的\u003ccode>a possible gain\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → F → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>If authorities want the programme to change the whole system, they must understand why many otherwise eligible travellers do not enrol.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One reason for not enrolling is the price.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Lowering that perceived cost could involve a smaller charge or help with payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>do not enrol\u003c/code>，F继续处理这一对象，完成“回答不报名的价格原因”。到本段末尾，讨论又落到\u003ccode>the perceived cost\u003c/code>，这正好为下一段“提出降低门槛且保留核查”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>把预期收益转为参与率问题 → 回答不报名的价格原因 → 提出降低门槛且保留核查\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“提出降低门槛且保留核查”。它也属于同一论题，但若直接放在这里，就会跳过“回答不报名的价格原因”这一必要环节；其段首“Lowering that perceived cost could involve a smaller charge or help with payment.”需要的前提与E当前收束的对象不一致，后续也接不出B所需的\u003ccode>the perceived cost\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是F → B → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The perceived cost can keep participation far below the level needed for the programme to fulfil its purpose.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Lowering that perceived cost could involve a smaller charge or help with payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Improved access should be assessed by its effect on the ordinary queue.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the perceived cost\u003c/code>，B继续处理这一对象，完成“提出降低门槛且保留核查”。到本段末尾，讨论又落到\u003ccode>improving access\u003c/code>，这正好为下一段“要求按整体等候与安全效果验收”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>回答不报名的价格原因 → 提出降低门槛且保留核查 → 要求按整体等候与安全效果验收\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“回答不报名的价格原因”。它也属于同一论题，但若直接放在这里，就会跳过“提出降低门槛且保留核查”这一必要环节；其段首“One reason for not enrolling is the price.”需要的前提与F当前收束的对象不一致，后续也接不出D所需的\u003ccode>improving access\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是B → D → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>These are ways of improving access to an existing programme, not proposals to let travellers avoid the background check on which it depends.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Improved access should be assessed by its effect on the ordinary queue.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>When waiting falls without weakening necessary checks, the programme has begun to justify its promise.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>improving access\u003c/code>，D继续处理这一对象，完成“要求按整体等候与安全效果验收”。到本段末尾，讨论又落到\u003ccode>waiting falls\u003c/code>，这正好为下一段“以落实方案、改善公众体验收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出降低门槛且保留核查 → 要求按整体等候与安全效果验收 → 以落实方案、改善公众体验收束\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“提出降低门槛且保留核查”。它也属于同一论题，但若直接放在这里，就会跳过“要求按整体等候与安全效果验收”这一必要环节；其段首“Lowering that perceived cost could involve a smaller charge or help with payment.”需要的前提与B当前收束的对象不一致，后续也接不出H所需的\u003ccode>waiting falls\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>efficient public services\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>高效公共服务\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：生活质量\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>public trust\u003c/td>\n\u003ctd>公众信任\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a sense of responsibility\u003c/td>\n\u003ctd>责任感\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>respect for others’ time\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>尊重他人的时间\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>balanced judgement\u003c/td>\n\u003ctd>平衡的判断\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>coordinated action\u003c/td>\n\u003ctd>协调行动\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>accessible services\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>便利可及的服务\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：生活质量\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>safer travel\u003c/td>\n\u003ctd>更安全的出行\u003c/td>\n\u003ctd>社会现象类：旅游\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practical innovation\u003c/td>\n\u003ctd>务实创新\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows a long queue beside a little-used alternative route.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画显示一条长队旁边有一条利用不足的替代通道。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is losing valuable time while waiting for an essential service.\u003c/td>\n\u003ctd>A正因等待一项必要服务而损失宝贵时间。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast highlights a gap between a programme’s promise and its actual use.\u003c/td>\n\u003ctd>这一对比突出计划承诺与实际使用之间的差距。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The average waiting time increased from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>平均等待时间从X增加到Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Participation in A remained far below the intended level.\u003c/td>\n\u003ctd>A的参与人数仍远低于预期水平。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures suggest that a high fee may discourage wider participation.\u003c/td>\n\u003ctd>这些数据表明高费用可能阻碍更广泛的参与。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage examines the causes of a delay and a possible way to reduce it.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文分析延误的原因及一种可能的缓解办法。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author accepts the need for A but questions the excessive cost imposed on users.\u003c/td>\n\u003ctd>作者承认A的必要性，但质疑其给使用者带来的过高代价。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion focuses on making an existing programme work more effectively.\u003c/td>\n\u003ctd>讨论聚焦于让既有计划更有效地运行。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":8},{"label":"句内逻辑","index":36},{"label":"长难句手译","index":39},{"label":"第三鸟 · 题目复盘","index":58},{"label":"25题","index":59},{"label":"21题","index":69},{"label":"22题","index":87},{"label":"23题","index":105},{"label":"24题","index":123},{"label":"第四鸟 · 新题型","index":141},{"label":"小标题题","index":141},{"label":"排序题","index":147},{"label":"第五鸟 · 写作积累","index":153}];
const allIndices = [0,1,2,3,4,5,6,7,11,15,19,23,27,31,35,36,37,38,39,45,51,57,58,59,61,63,65,67,68,69,73,77,81,85,86,87,91,95,99,103,104,105,109,113,117,121,122,123,127,131,135,139,140,141,142,143,144,145,146,147,148,149,150,151,152,153,154];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
