const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| measure | v.衡量 | worthwhile | a.值得的 | vote | v.投票 |\n| leave | v.离开 | European Union | 欧盟 | already | ad.已经 |\n| predict | v.预测 | slow | v.放缓 | as a result | 因此 |\n| timely moment | 适当时机 | assess | v.评估 | refer to | 指的是 |","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 3重点词与语境","focus":[85,139,925,417],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>measure\u003c/td>\n\u003ctd>v.衡量\u003c/td>\n\u003ctd>worthwhile\u003c/td>\n\u003ctd>a.值得的\u003c/td>\n\u003ctd>vote\u003c/td>\n\u003ctd>v.投票\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>leave\u003c/td>\n\u003ctd>v. o assess what he was referring to.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 意群划分 · 第1段\n\nRobert F. Kennedy once said / that a country's GDP measures / \"everything except that which makes life worthwhile.\"\n\nWith Britain voting / to leave the European Union, / and GDP already predicted / to slow as a result, / it is now a timely moment / to assess / what he was referring to.","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,139,925,417],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-1-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Robert F. Kennedy once said / that a country&#39;s GDP measures / &quot;everything except that which makes life worthwhile.&quot;\u003c/p>\n\u003cp>With Britain voting / to leave the European Union, / and GDP already predicted / to slow as a result, / it is now a timely moment / to assess / what he was referring to.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 意群翻译 · 第1段\n\n罗伯特·F·肯尼迪曾经说过 / 一个国家的GDP衡量 / \"除了让生活有价值的东西之外的一切。\"\n\n随着英国投票 / 离开欧盟，/ 而且GDP已经被预测 / 将因此放缓，/ 现在是一个及时的时刻 / 来评估 / 他所指的是什么。","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,139,925,417],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-1-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Robert F. Kennedy once said / that a country&#39;s GDP measures / &quot;everything except that which makes life worthwhile.&quot;\u003c/p>\n\u003cp>With Britain voting / to leave the European Union, / and GDP already predicted / to slow as a result, / it is now a timely moment / to assess / what he was referring to.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>罗伯特·F·肯尼迪曾经说过 / 一个国家的GDP衡量 / &quot;除了让生活有价值的东西之外的一切。&quot;\u003c/p>\n\u003cp>随着英国投票 / 离开欧盟，/ 而且GDP已经被预测 / 将因此放缓，/ 现在是一个及时的时刻 / 来评估 / 他所指的是什么。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 标准译文 · 第1段\n\n罗伯特·F·肯尼迪曾说，一个国家的GDP衡量的是\"除了让生活有价值的东西之外的一切\"。随着英国投票脱欧，以及GDP预计将因此放缓，现在正是评估他这句话含义的恰当时机。","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,139,925,417],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-1-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Robert F. Kennedy once said / that a country&#39;s GDP measures / &quot;everything except that which makes life worthwhile.&quot;\u003c/p>\n\u003cp>With Britain voting / to leave the European Union, / and GDP already predicted / to slow as a result, / it is now a timely moment / to assess / what he was referring to.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>罗伯特·F·肯尼迪曾经说过 / 一个国家的GDP衡量 / &quot;除了让生活有价值的东西之外的一切。&quot;\u003c/p>\n\u003cp>随着英国投票 / 离开欧盟，/ 而且GDP已经被预测 / 将因此放缓，/ 现在是一个及时的时刻 / 来评估 / 他所指的是什么。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-3\">\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>罗伯特·F·肯尼迪曾说，一个国家的GDP衡量的是&quot;除了让生活有价值的东西之外的一切&quot;。随着英国投票脱欧，以及GDP预计将因此放缓，现在正是评估他这句话含义的恰当时机。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 完整原文 · 第2段\n\nThe question of GDP and its usefulness has annoyed policymakers for over half a century. Many argue that it is a flawed concept. It measures things that do not matter and misses things that do. By most recent measures, the UK's GDP has been the envy of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country's economic prospects?","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,570,925,674],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-2-0","html":" wth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>The question of GDP / and its usefulness / has annoyed policymakers / for over half a century.\u003c/p>\n\u003cp>Many argue / that it is a flawed concept.\u003c/p>\n\u003cp>It measures things / that do not matter / and misses things / that do.\u003c/p>\n\u003cp>By most recent measures, / the UK&#39;s GDP / has been the envy / of the Western world, / with record low unemployment / and high growth figures.\u003c/p>\n\u003cp>If everything was going so well, / then why did over 17 million people / vote for Brexit, / despite the warnings / about what it could do / to their country&#39;s economic prospects?\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>GDP的问题 / 及其有用性 / 已经困扰政策制定者 / 超过半个世纪。\u003c/p>\n\u003cp>许多人认为 / 它是一个有缺陷的概念。\u003c/p>\n\u003cp>它衡量的东西 / 并不重要 / 而错过了那些 / 重要的东西。\u003c/p>\n\u003cp>根据最近的衡量标准，/ 英国的GDP / 一直是令人羡慕的 / 在西方世界，/ 拥有创纪录的低失业率 / 和高增长数字。\u003c/p>\n\u003cp>如果一切都进展得如此顺利，/ 那么为什么超过1700万人 / 投票支持脱欧，/ 尽管有警告 / 关于这可能对 / 他们国家经济前景的影响？\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 标准译文 · 第2段\n\nGDP及其有用性的问题已经困扰政策制定者超过半个世纪。许多人认为它是一个有缺陷的概念。它衡量那些不重要的东西，却错过了重要的东西。根据最近的衡量标准，英国的GDP一直是西方世界的羡慕对象，拥有创纪录的低失业率和高增长数字。如果一切都进展得如此顺利，那么为什么超过1700万人投票支持脱欧，尽管有关于这可能对他们国家经济前景造成影响的警告？","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,570,925,674],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-2-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0 p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 完整原文 · 第3段\n\nA recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens. Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1280,925,870],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-3-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens. Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群划分 · 第3段\n\nA recent annual study / of countries and their ability / to convert growth into well-being / sheds some light / on that question.\n\nAcross the 163 countries measured, / the UK is one of the poorest performers / in ensuring that economic growth / is translated into meaningful improvements / for its citizens.\n\nRather than just focusing on GDP, / over 40 different sets of 它已经不再足够。它不包括环境质量或教育成果等重要因素——所有这些都有助于提升人们的幸福感。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第7段","level":3,"raw":"### 完整原文 · 第7段\n\nThe sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth. But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.","context":{"mode":"image","asset":"articleAnnotated","label":"第7段精读与翻译","focus":[85,3584,925,515],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-7-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-7-0\">\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth. But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第7段","level":3,"raw":"### 意群划分 · 第7段\n\nThe sharp hit to growth / predicted around the world / and in the UK / could lead to a decline / in the everyday services / we depend on / for our well-being and for growth.\n\nBut policymakers / who refocus efforts / on improving well-being / rather than simply worrying about GDP figures / could avoid the forecasted doom / and may even see progress.","context":{"mode":"image","asset":"articleAnnotated","label":"第7段精读与翻译","focus":[85,3584,925,515],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus oyed policymakers：(for over half a century).\n\nMany argue：(that it is a flawed concept).\n\nIt measures things：(that do not matter) + misses things：(that do).\n\nBy most recent measures → the UK's GDP → has been the envy：(of the Western world)：(with record low unemployment + high growth figures).\n\nIf everything was going so well // then why did over 17 million people → vote for Brexit：(despite the warnings：(about what it could do：(to their country's economic prospects)))?\n\n### 第3段\n\nA recent annual study：(of countries and their ability：(to convert growth into well-being)) → sheds some light：(on that question).\n\nAcross the 163 countries measured → the UK is one of the poorest performers：(in ensuring that economic growth → is translated into meaningful improvements：(for its citizens)).\n\nRather than just focusing on GDP → over 40 different sets of criteria：(from health + education + civil society engagement) → have been measured：(to get a more rounded assessment：(of how countries are performing)).\n\n### 第4段\n\nWhile all of these countries → face their own challenges → there are a number of consistent themes.\n\nYes → there has been a budding economic recovery：(since the 2008 global crash) // but in key indicators：(in areas such as health and education) → major economies have continued to decline.\n\nYet this isn't the case：(with all countries).\n\nSome relatively poor European countries → have seen huge improvements：(across measures：(including civil society + income equality + the environment)).\n\n### 第5段\n\nThis is a lesson：(that rich countries can learn)：When GDP is no longer regarded：(as the sole measure：(of a country's success)) → the world looks very different.\n\n### 第6段\n\nSo → what Kennedy was referring to → was that：(while GDP has been the most common method：(for measuring the economic activity of nations)) → as a measure → it is no longer enough.\n\nIt does not include → important factors：(such as environmental quality + education outcomes) – all ng on GDP → over 40 different sets of criteria：(from health + education + civil society engagement) → have been measured：(to get a more rounded assessment：(of how countries are performing)).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>While all of these countries → face their own challenges → there are a number of consistent themes.\u003c/p>\n\u003cp>Yes → there has been a budding economic recovery：(since the 2008 global crash) // but in key indicators：(in areas such as health and education) → major economies have continued to decline.\u003c/p>\n\u003cp>Yet this isn&#39;t the case：(with all countries).\u003c/p>\n\u003cp>Some relatively poor European countries → have seen huge improvements：(across measures：(including civil society + income equality + the environment)).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>This is a lesson：(that rich countries can learn)：When GDP is no longer regarded：(as the sole measure：(of a country&#39;s success)) → the world looks very different.\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>So → what Kennedy was referring to → was that：(while GDP has been the most common method：(for measuring the economic activity of nations)) → as a measure → it is no longer enough.\u003c/p>\n\u003cp>It does not include → important factors：(such as environmental quality + education outcomes) – all things：(that contribute → to a person&#39;s sense of well-being).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>The sharp hit to growth：(predicted around the world + in the UK) → could lead to a decline：(in the everyday services：(we depend on：(for our well-being and for growth))).\u003c/p>\n\u003cp>But policymakers：(who refocus efforts：(on improving well-being)：(rather than simply worrying about GDP figures)) → could avoid the forecasted doom + may even see progress.\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n罗伯特·F·肯尼迪曾经说过：(一个国家的GDP衡量 → \"除了让生活有价值的东西之外的一切\")。\n\n随着英国投票：(离开欧盟) + GDP已经被预测：(将因此放缓) → 现在是一个及时的时刻 → 来评估：(他所指的是什么)。\n\n### 第2段\n\nGDP的问题 + 其有用性 → 已经困扰政策制定者：(超过半个世纪)。\n\n许多人认为：(它是一个有缺陷的概念)。\n\n它衡量的东西：(并不重要) + 错过了那些：(重要的)。\n\n根据最近的衡量标准 → 英国的GDP → 一直是令人羡慕的：(在西方世界)：(拥有创纪录的低失业率 + 高增长数字)。\n\n如果一切都进展得如此顺利 // 那么为什么超过1700万人 → 投票支持脱欧：(尽管有警告：(关于这可能对：(他们国家经济前景的影响)))?\n\n### 第3段\n\n最近的一项年度研究：(关于各国及其能力：(将增长转化为幸福感)) → 为某个问题带来了一些启示。\n\n在被衡量的163个国家中 → 英国是表现最差的国家之一：(在确保经济增长 → 转化为有意义的改善：(为其公民))。\n\n而不是仅仅关注GDP → 超过40套不同的标准：(来自健康 + 教育 + 公民社会参与) → 已被衡量：(以获得更全面的评估：(关于各国的表现))。\n\n### 第4段\n\n虽然所有这些国家 → 面临各自的挑战 → 有一些一致的主题。\n\n是的 → 已经有了初步的经济复苏：(自2008年全球崩溃以来) // 但在关键指标上：(在健康和教育等领域) → 主要经济体继续下降。\n\n然而这并非如此：(对所有国家)。\n\n一些相对贫穷的欧洲国家 → 已经看到巨大的改善：(在各项指标上：(包括公民社会 + 收入平等 + 环境))。\n\n### 第5段\n\n这是一个教训：(富裕国家可以学习的)：当GDP不再被视为：(唯一的衡量标准：(一个国家成功的)) → 世界看起来非常不同。\n\n### 第6段\n\n所以 → 肯尼迪所指的 → 是：(虽然GDP一直是最常见的方法：(用于衡量国家的经济活动)) → 作为一种衡量标准 → 它不再足够。\n\n它不包括 → 重要因素：(如环境质量 + 教育成果) – 所有这些：(都有助于 → 一个人的幸福感)。\n\n### 第7段\n\n增长的急剧打击：(在全世界被预测 + 在英国) → 可能导致下降：(在日常服务中：(我们依赖的：(为了我们的幸福和增长)))。\n\n但政策制定者：(重新聚焦努力的：(在改善幸福感上)：(而不是简单地担心GDP数字)) → 可以避免预测的厄运 + 甚至可能看到进步。","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>罗伯特·F·肯尼迪曾经说过：(一个国家的GDP衡量 → &quot;除了让生活有价值的东西之外的一切&quot;)。\u003c/p>\n\u003cp>随着英国投票：(离开欧盟) + GDP已经被预测：(将因此放缓) → 现在是一个及时的时刻 → 来评估：(他所指的是什么)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>GDP的问题 + 其有用性 → 已经困扰政策制定者：(超过半个世纪)。\u003c/p>\n\u003cp>许多人认为：(它是一个有缺陷的概念)。\u003c/p>\n\u003cp>它衡量的东西：(并不重要) + 错过了那些：(重要的)。\u003c/p>\n\u003cp>根据最近的衡量标准 → 英国的GDP → 一直是令人羡慕的：(在西方世界)：(拥有创纪录的低失业率 + 高增长数字)。\u003c/p>\n\u003cp>如果一切都进展得如此顺利 // 那么为什么超过1700万人 → 投票支持脱欧：(尽管有警告：(关于这可能对：(他们国家经济前景的影响)))?\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>最近的一项年度研究：(关于各国及其能力：(将增长转化为幸福感)) → 为某个问题带来了一些启示。\u003c/p>\n\u003cp>在被衡量的163个国家中 → 英国是表现最差的国家之一：(在确保经济增长 → 转化为有意义的改善：(为其公民))。\u003c/p>\n\u003cp>而不是仅仅关注GDP → 超过40套不同的标准：(来自健康 + 教育 + 公民社会参与) → 已被衡量：(以获得更全面的评估：(关于各国的表现))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n u003c/h3>\n\u003cblockquote>\n\u003cp>所以，/ 肯尼迪所指的 / 是 / 虽然GDP一直是最常见的方法 / 用于衡量国家的经济活动，/ 作为一种衡量标准，/ 它不再足够。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-3\">\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并肯尼迪所指的核心内容。：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪所指的是一种衡量方法已经不够\u003c/p>\n\u003c/blockquote>\n\u003cp>再把while引出的让步条件与主判断合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>GDP虽一直是衡量国家经济活动最常用的方法，但作为衡量标准已不充分\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪所指的是一种衡量方法已经不够；GDP虽一直是衡量国家经济活动最常用的方法，但作为衡量标准已不充分。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段第1句","level":3,"raw":"### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 肯尼迪的意思是：GDP虽然常用，但已不足以完成评价。\n\n先放“肯尼迪所指”，再在解释里用“虽然……但……”；as a measure连接是否充分，不是再列一个统计结果。\n\n按照中文语序调整后是：\n\n> 所以，肯尼迪指的是：GDP虽然向来是测量国家经济活动最常见的方法，但作为一种衡量办法，它已不够用了。","context":{"mode":"image","asset":"articleAnnotated","label":"第6段第1句","focus":[85,3132,925,202],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false,"partIndex":4,"kind":"standard"},"focusId":"focus-long-3-4","html":"\u003csection class=\"revealPart\" id=\"focus-long-3-0\">\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>So, what Kennedy was referring to was that while GDP has been the most common method for measuring the economic activity of nations, as a measure, it is no longer enough.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-1\">\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>So, / what Kennedy was referring to / was that / while GDP has been the most common method / for measuring the economic activity of nations, / as a measure, / it is no longer enough.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-2\">\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>所以，/ 肯尼迪 \u003c/h3>\n\u003cblockquote>\n\u003cp>So, / what Kennedy was referring to / was that / while GDP has been the most common method / for measuring the economic activity of nations, / as a measure, / it is no longer enough.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-2\">\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>所以，/ 肯尼迪所指的 / 是 / 虽然GDP一直是最常见的方法 / 用于衡量国家的经济活动，/ 作为一种衡量标准，/ 它不再足够。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-3\">\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并肯尼迪所指的核心内容。：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪所指的是一种衡量方法已经不够\u003c/p>\n\u003c/blockquote>\n\u003cp>再把while引出的让步条件与主判断合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>GDP虽一直是衡量国家经济活动最常用的方法，但作为衡量标准已不充分\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪所指的是一种衡量方法已经不够；GDP虽一直是衡量国家经济活动最常用的方法，但作为衡量标准已不充分。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-4\">\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪的意思是：GDP虽然常用，但已不足以完成评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>先放“肯尼迪所指”，再在解释里用“虽然……但……”；as a measure连接是否充分，不是再列一个统计结果。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>所以，肯尼迪指的是：GDP虽然向来是测量国家经济活动最常见的方法，但作为一种衡量办法，它已不够用了。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>no longer enough强调不充分，不是完全错误或不再使用。\u003c/p>\n\u003cp>economic activity与更全面的生活质量必须区分，这是让步之后仍需补充指标的原因。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>所以，肯尼迪所指的是，虽然GDP一直是衡量国家经济活动最常见的方法，但作为一种衡量标准，它已经不再足够。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"35题 · 题干、题型与核心出处","level":2,"raw":"## 35题\n\n**Which of the following is the best title for the text?**\n\n下列哪一项最适合作为本文的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Brexit, the UK’s Gateway to Well-being**\n\n英国脱欧，英国通向福祉的大门\n\nB. **Robert F. Kennedy, a Terminator of GDP**\n\n罗伯特·F.肯尼迪，GDP的终结者\n\nC. **High GDP But Inadequate Well-being, a UK Lesson**\n\n高GDP却福祉不足，英国的一课\n\nD. **GDP Figures, a Window on Global Economic Health**\n\nGDP数字，观察全球经济健康的窗口\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。 | 先说一句话带出的疑问 |\n| 2 | 对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。 | 再把眼前的反差拿来追问 |\n| 3 | 引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。 | 接着拿一项调查作解释 |\n| 4 | 把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。 | 然后换几种情况放在一起看 |\n| 5 | 提醒富国：不再把GDP置于原来那个衡量位置，看到的国家成功景象会不同。 | 再把前面的比较变成提醒 |\n| 6 | 回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。 | 接着回到开头说清真正的问题 |\n| 7 | 说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。 | 最后说应该把力气放在哪里 |","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"35","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下列哪一项最适合作为本文的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Brexit, the UK’s Gateway to Well-being\u003c/strong>\u003c/p>\n\u003cp>英国脱欧，英国通向福祉的大门\u003c/p>\n\u003cp>B. \u003cstrong>Robert F. Kennedy, a Terminator of GDP\u003c/strong>\u003c/p>\n\u003cp>罗伯特·F.肯尼迪，GDP的终结者\u003c/p>\n\u003cp>C. \u003cstrong>High GDP But Inadequate Well-being, a UK Lesson\u003c/strong>\u003c/p>\n\u003cp>高GDP却福祉不足，英国的一课\u003c/p>\n\u003cp>D. \u003cstrong>GDP Figures, a Window on Global Economic Health\u003c/strong>\u003c/p>\n\u003cp>GDP数字，观察全球经济健康的窗口\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。\u003c/td>\n\u003ctd>先说一句话带出的疑问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/td>\n\u003ctd>再把眼前的反差拿来追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。\u003c/td>\n\u003ctd>接着拿一项调查作解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。\u003c/td>\n\u003ctd>然后换几种情况放在一起看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提醒富国：不再把GDP置于原来那个衡量位置，看到的国家成功景象会不同。\u003c/td>\n\u003ctd>再把前面的比较变成提醒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。\u003c/td>\n\u003ctd>接着回到开头说清真正的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。\u003c/td>\n\u003ctd>最后说应该把力气放在哪里\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Brexit, the UK’s Gateway to Well-being","level":3,"raw":"**Which of the following is the best title for the text?**\n\n### A. Brexit, the UK’s Gateway to Well-being\n\n英国脱欧，英国通向福祉的大门","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>英国脱欧，英国通向福祉的大门\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Brexit, the UK’s Gateway to Well-being","level":3,"raw":"#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n英国脱欧，英国通向福祉的大门\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 以衡量好生活的引语提出英国脱欧为何可能成为通向福祉的新入口。 | 先说一句话带出的疑问 |\n| 2 | 用脱欧前高增长与民众不满的反差，追问旧安排为何没有带来幸福。 | 再把眼前的反差拿来追问 |\n| 3 | 用调查说明脱欧能够释放哪些原先受限制的民生改善空间。 | 接着拿一项调查作解释 |\n| 4 | 比较不同国家脱离旧制度后的福祉变化，为英国脱欧提供可比经验。 | 然后换几种情况放在一起看 |\n| 5 | 提醒英国抓住脱欧机会，将主权或政策自主转为实际生活改善。 | 再把前面的比较变成提醒 |\n| 6 | 回到开头说明脱欧的意义在于打开福祉通道，而非只追求GDP。 | 接着回到开头说清真正的问题 |\n| 7 | 提出英国脱欧后应怎样配置政策，把这扇通向幸福的大门真正打开。 | 最后说应该把力气放在哪里 |\n\nA把Brexit写成Gateway，意思是脱欧本身能把英国带向福祉。文章确实由脱欧切入，也确实把福祉作为后面的关注对象，但这两个名词出现在同一篇里，不代表作者建立了“脱欧带来福祉”的正面因果。第一段反而提GDP被预测放缓，最后一段也讨论增长受到打击可能使服务下降。\n\n第三段研究比较的是各国将增长转成公民改善的能力，不是脱欧前后生活质量的实验；第四段也不是按是否脱欧分组。因此A的第三、四行会要求文章提供根本没有提供的比较。\n\n借脱欧选择提出GDP的问题，能不能改写成作者主张脱欧是幸福之门？\n\n不能。脱欧是引出反差的事件，不是被证实能提升福祉的办法，A排除。\n\n---\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>英国脱欧，英国通向福祉的大门\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-A-1\">\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>英国脱欧，英国通向福祉的大门\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以衡量好生活的引语提出英国脱欧为何可能成为通向福祉的新入口。\u003c/td>\n\u003ctd>先说一句话带出的疑问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>用脱欧前高增长与民众不满的反差，追问旧安排为何没有带来幸福。\u003c/td>\n\u003ctd>再把眼前的反差拿来追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>用调查说明脱欧能够释放哪些原先受限制的民生改善空间。\u003c/td>\n\u003ctd>接着拿一项调查作解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>比较不同国家脱离旧制度后的福祉变化，为英国脱欧提供可比经验。\u003c/td>\n\u003ctd>然后换几种情况放在一起看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提醒英国抓住脱欧机会，将主权或政策自主转为实际生活改善。\u003c/td>\n\u003ctd>再把前面的比较变成提醒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到开头说明脱欧的意义在于打开福祉通道，而非只追求GDP。\u003c/td>\n\u003ctd>接着回到开头说清真正的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>提出英国脱欧后应怎样配置政策，把这扇通向幸福的大门真正打开。\u003c/td>\n\u003ctd>最后说应该把力气放在哪里\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A把Brexit写成Gateway，意思是脱欧本身能把英国带向福祉。文章确实由脱欧切入，也确实把福祉作为后面的关注对象，但这两个名词出现在同一篇里，不代表作者建立了“脱欧带来福祉”的正面因果。第一段反而提GDP被预测放缓，最后一段也讨论增长受到打击可能使服务下降。\u003c/p>\n\u003cp>第三段研究比较的是各国将增长转成公民改善的能力，不是脱欧前后生活质量的实验；第四段也不是按是否脱欧分组。因此A的第三、四行会要求文章提供根本没有提供的比较。\u003c/p>\n\u003cp>借脱欧选择提出GDP的问题，能不能改写成作者主张脱欧是幸福之门？\u003c/p>\n\u003cp>不能。脱欧是引出反差的事件，不是被证实能提升福祉的办法，A排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Robert F. Kennedy, a Terminator of GDP","level":3,"raw":"**Which of the following is the best title for the text?**\n\n### B. Robert F. Kennedy, a Terminator of GDP\n\n罗伯特·F.肯尼迪，GDP的终结者","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>罗伯特·F.肯尼迪，GDP的终结者\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Robert F. Kennedy, a Terminator of GDP","level":3,"raw":"#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n罗伯特·F.肯尼迪，GDP的终结者\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 引用肯尼迪对GDP的质疑，追问他如何成为结束GDP主导地位的关键人物。 | 先说一句话带出的疑问 |\n| 2 | 用当前GDP与生活感受的反差说明肯尼迪的挑战为何仍有意义。 | 再把眼前的反差拿来追问 |\n| 3 | 拿调查说明其观点怎样促成GDP尺度被替代，解释他产生的影响。 | 接着拿一项调查作解释 |\n| 4 | 比较不同地方受肯尼迪思想影响后结束GDP独尊地位的情况。 | 然后换几种情况放在一起看 |\n| 5 | 提醒各国认识肯尼迪终结旧尺度的贡献并采纳其方向。 | 再把前面的比较变成提醒 |\n| 6 | 回到引语解释他怎样从思想上瓦解GDP作为唯一标准的权威。 | 接着回到开头说清真正的问题 |\n| 7 | 提出继续落实其替代尺度，把终结GDP独尊的任务推进下去。 | 最后说应该把力气放在哪里 |\n\nB的Terminator很强，要求肯尼迪不仅批评GDP，而且是把GDP终结掉的人。原文开头借他说话，第六段再解释其所指，确实有首尾照应；但这并不使整篇变成人物文章。中间的英国选择、年度研究与国家比较，都在讨论衡量标准与生活改善，不在介绍肯尼迪如何推动一项制度结束。\n\n尤其第六段承认GDP是衡量经济活动最常用的方法，然后说as a measure it is no longer enough。不够全面需要看更多因素，并不等于必须终结GDP。第三段的Rather than just focusing也是否定只看它，而非排除它。\n\nGDP作为单一尺度不够用，是否就意味着作者让肯尼迪充当GDP的终结者？\n\n不能。B既把引语人物抬成中心，也把不足扩大成彻底终结，排除。\n\n---\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>罗伯特·F.肯尼迪，GDP的终结者\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-B-1\">\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>罗伯特·F.肯尼迪，GDP的终结者\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>引用肯尼迪对GDP的质疑，追问他如何成为结束GDP主导地位的关键人物。\u003c/td>\n\u003ctd>先说一句话带出的疑问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>用当前GDP与生活感受的反差说明肯尼迪的挑战为何仍有意义。\u003c/td>\n\u003ctd>再把眼前的反差拿来追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>拿调查说明其观点怎样促成GDP尺度被替代，解释他产生的影响。\u003c/td>\n\u003ctd>接着拿一项调查作解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>比较不同地方受肯尼迪思想影响后结束GDP独尊地位的情况。\u003c/td>\n\u003ctd>然后换几种情况放在一起看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提醒各国认识肯尼迪终结旧尺度的贡献并采纳其方向。\u003c/td>\n\u003ctd>再把前面的比较变成提醒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到引语解释他怎样从思想上瓦解GDP作为唯一标准的权威。\u003c/td>\n\u003ctd>接着回到开头说清真正的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>提出继续落实其替代尺度，把终结GDP独尊的任务推进下去。\u003c/td>\n\u003ctd>最后说应该把力气放在哪里\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的Terminator很强，要求肯尼迪不仅批评GDP，而且是把GDP终结掉的人。原文开头借他说话，第六段再解释其所指，确实有首尾照应；但这并不使整篇变成人物文章。中间的英国选择、年度研究与国家比较，都在讨论衡量标准与生活改善，不在介绍肯尼迪如何推动一项制度结束。\u003c/p>\n\u003cp>尤其第六段承认GDP是衡量经济活动最常用的方法，然后说as a measure it is no longer enough。不够全面需要看更多因素，并不等于必须终结GDP。第三段的Rather than just focusing也是否定只看它，而非排除它。\u003c/p>\n\u003cp>GDP作为单一尺度不够用，是否就意味着作者让肯尼迪充当GDP的终结者？\u003c/p>\n\u003cp>不能。B既把引语人物抬成中心，也把不足扩大成彻底终结，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. High GDP But Inadequate Well-being, a UK Lesson","level":3,"raw":"**Which of the following is the best title for the text?**\n\n### C. High GDP But Inadequate Well-being, a UK Lesson\n\n高GDP却福祉不足，英国的一课","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. High GDP But Inadequate Well-being, a UK Lesson","level":3,"raw":"#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n高GDP却福祉不足，英国的一课\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 借肯尼迪的引语提出疑问：GDP为何会遗漏生活中真正值得重视的事。 | 先说一句话带出的疑问 |\n| 2 | 以英国高增长、低失业与大量脱欧投票的反差追问经济成绩为何不等于幸福。 | 再把眼前的反差拿来追问 |\n| 3 | 用多维度研究解释英国将增长转成公民福祉的能力不足。 | 接着拿一项调查作解释 |\n| 4 | 比较富裕与相对贫穷国家的健康、教育、平等变化，表明GDP高低不足以代表福祉。 | 然后换几种情况放在一起看 |\n| 5 | 把对比转成提醒：富国应放弃把GDP当作唯一成功尺度。 | 再把前面的比较变成提醒 |\n| 6 | 回到肯尼迪，说明环境与教育等遗漏才是经济数字不足的真正问题。 | 接着回到开头说清真正的问题 |\n| 7 | 要求决策者把努力投向具体福祉，从英国反差中吸取教训。 | 最后说应该把力气放在哪里 |\n\nC中的High GDP But Inadequate Well-being保留了全文最重要的反差：漂亮的增长数字并不能保证生活改善充分。a UK Lesson又说明英国不是全部研究对象，而是用来给读者和其他富国提供提醒的案例。这样既可以放进英国的具体材料，也能容纳后面的多国比较。\n\n第一、二段提出问题，第三、四段用研究与国家差异解释，第五段明确说rich countries can learn，第六段概括GDP为何不够，第七段转到政策应该关注的福祉。C无需把任何一大段的对象改成脱欧优越性、人物成就或GDP万能。\n\nC能否同时覆盖“英国反差”“多国研究”“不能只看GDP”和“改进福祉的建议”？\n\n能。四者都是增长数字不等于充分生活改善这一提醒的不同层次。C保留。\n\n---\n\n判断：\n\n**C 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-C-1\">\u003ch4>如果 C 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>高GDP却福祉不足，英国的一课\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>借肯尼迪的引语提出疑问：GDP为何会遗漏生活中真正值得重视的事。\u003c/td>\n\u003ctd>先说一句话带出的疑问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>以英国高增长、低失业与大量脱欧投票的反差追问经济成绩为何不等于幸福。\u003c/td>\n\u003ctd>再把眼前的反差拿来追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>用多维度研究解释英国将增长转成公民福祉的能力不足。\u003c/td>\n\u003ctd>接着拿一项调查作解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>比较富裕与相对贫穷国家的健康、教育、平等变化，表明GDP高低不足以代表福祉。\u003c/td>\n\u003ctd>然后换几种情况放在一起看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>把对比转成提醒：富国应放弃把GDP当作唯一成功尺度。\u003c/td>\n\u003ctd>再把前面的比较变成提醒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到肯尼迪，说明环境与教育等遗漏才是经济数字不足的真正问题。\u003c/td>\n\u003ctd>接着回到开头说清真正的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求决策者把努力投向具体福祉，从英国反差中吸取教训。\u003c/td>\n\u003ctd>最后说应该把力气放在哪里\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C中的High GDP But Inadequate Well-being保留了全文最重要的反差：漂亮的增长数字并不能保证生活改善充分。a UK Lesson又说明英国不是全部研究对象，而是用来给读者和其他富国提供提醒的案例。这样既可以放进英国的具体材料，也能容纳后面的多国比较。\u003c/p>\n\u003cp>第一、二段提出问题，第三、四段用研究与国家差异解释，第五段明确说rich countries can learn，第六段概括GDP为何不够，第七段转到政策应该关注的福祉。C无需把任何一大段的对象改成脱欧优越性、人物成就或GDP万能。\u003c/p>\n\u003cp>C能否同时覆盖“英国反差”“多国研究”“不能只看GDP”和“改进福祉的建议”？\u003c/p>\n\u003cp>能。四者都是增长数字不等于充分生活改善这一提醒的不同层次。C保留。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. GDP Figures, a Window on Global Economic Health","level":3,"raw":"**Which of the following is the best title for the text?**\n\n### D. GDP Figures, a Window on Global Economic Health\n\nGDP数字，观察全球经济健康的窗口","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>GDP数字，观察全球经济健康的窗口\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. GDP Figures, a Window on Global Economic Health","level":3,"raw":"#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\nGDP数字，观察全球经济健康的窗口\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 以一段关于GDP的引语提出它为什么能成为观察全球经济健康的窗口。 | 先说一句话带出的疑问 |\n| 2 | 用经济数字与公众感受的反差，追问GDP应怎样解读才能看清经济状况。 | 再把眼前的反差拿来追问 |\n| 3 | 拿跨国调查解释GDP数据与经济健康之间可以观察到的关系。 | 接着拿一项调查作解释 |\n| 4 | 比较几种国家的GDP走势与经济运行，展示这个窗口的不同读法。 | 然后换几种情况放在一起看 |\n| 5 | 提醒各国认真使用GDP信息来识别全球经济机会和风险。 | 再把前面的比较变成提醒 |\n| 6 | 回到开头说明GDP虽有限，仍怎样为经济健康判断提供核心线索。 | 接着回到开头说清真正的问题 |\n| 7 | 提出把政策分析力量投向更充分地使用GDP窗口，监测全球经济变化。 | 最后说应该把力气放在哪里 |\n\nD把GDP写成观察Global Economic Health的窗口，整篇若照此发展，应该不断验证GDP作为观察工具的有效性。实际第二段追问好看数字为何解释不了人的选择，第三段用GDP以外的四十多组标准补充，第六段明说no longer enough。它们并不是在展示GDP这一窗口有多可靠。\n\n经济活动的多少与人的福祉不是相同对象。原文承认GDP常用于测量经济活动，但正因为文章需要看健康、教育等被它漏掉的东西，才展开后面分析。D保留了一个高频名词，却削掉了作者对该名词适用范围的质疑，也漏掉英国教训和福祉方向。\n\n一篇反复说明GDP不够的文章，能否概括成赞示GDP数字观察整体健康的功能？\n\n不能。D把受检验的尺度写成足够的观察依据，整体方向不合，排除。\n\n---\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>GDP数字，观察全球经济健康的窗口\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-D-1\">\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>GDP数字，观察全球经济健康的窗口\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以一段关于GDP的引语提出它为什么能成为观察全球经济健康的窗口。\u003c/td>\n\u003ctd>先说一句话带出的疑问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>用经济数字与公众感受的反差，追问GDP应怎样解读才能看清经济状况。\u003c/td>\n\u003ctd>再把眼前的反差拿来追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>拿跨国调查解释GDP数据与经济健康之间可以观察到的关系。\u003c/td>\n\u003ctd>接着拿一项调查作解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>比较几种国家的GDP走势与经济运行，展示这个窗口的不同读法。\u003c/td>\n\u003ctd>然后换几种情况放在一起看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提醒各国认真使用GDP信息来识别全球经济机会和风险。\u003c/td>\n\u003ctd>再把前面的比较变成提醒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到开头说明GDP虽有限，仍怎样为经济健康判断提供核心线索。\u003c/td>\n\u003ctd>接着回到开头说清真正的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>提出把政策分析力量投向更充分地使用GDP窗口，监测全球经济变化。\u003c/td>\n\u003ctd>最后说应该把力气放在哪里\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D把GDP写成观察Global Economic Health的窗口，整篇若照此发展，应该不断验证GDP作为观察工具的有效性。实际第二段追问好看数字为何解释不了人的选择，第三段用GDP以外的四十多组标准补充，第六段明说no longer enough。它们并不是在展示GDP这一窗口有多可靠。\u003c/p>\n\u003cp>经济活动的多少与人的福祉不是相同对象。原文承认GDP常用于测量经济活动，但正因为文章需要看健康、教育等被它漏掉的东西，才展开后面分析。D保留了一个高频名词，却削掉了作者对该名词适用范围的质疑，也漏掉英国教训和福祉方向。\u003c/p>\n\u003cp>一篇反复说明GDP不够的文章，能否概括成赞示GDP数字观察整体健康的功能？\u003c/p>\n\u003cp>不能。D把受检验的尺度写成足够的观察依据，整体方向不合，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"35题结论","level":2,"raw":"### 35题结论\n\n**35. C. High GDP But Inadequate Well-being, a UK Lesson**\n\n这句话就是本文后续做题的主旨底牌：\n\n**High GDP But Inadequate Well-being, a UK Lesson / 高GDP却福祉不足，英国的一课**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"35","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>35. C. High GDP But Inadequate Well-being, a UK Lesson\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>High GDP But Inadequate Well-being, a UK Lesson / 高GDP却福祉不足，英国的一课\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"31题 · 题干、题型与核心出处","level":2,"raw":"## 31题\n\n> Robert F. Kennedy is cited because he ______.  \n> 引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？\n\n### 题型\n\n引语作用题。题干要求判断“引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Robert F. Kennedy once said that a country's GDP measures \"everything except that which makes life worthwhile.\" With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\n>\n> The question of GDP and its usefulness has annoyed policymakers for over half a century. Many argue that it is a flawed concept. It measures things that do not matter and misses things that do. By most recent measures, the UK's GDP has been the envy of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country's economic prospects?\n\n肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"31","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Robert F. Kennedy is cited because he ______.\u003cbr>引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>引语作用题。题干要求判断“引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003cp>The question of GDP and its usefulness has annoyed policymakers for over half a century. Many argue that it is a flawed concept. It measures things that do not matter and misses things that do. By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003cp>肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. praised the UK for its GDP","level":3,"raw":"### A. praised the UK for its GDP\n\n> 赞扬英国的国内生产总值\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 praised the UK 把肯尼迪的评价限定到英国，第一段的 a country’s GDP 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\n\n**错误类型：第三类——无中生有。**\n\na country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 praised the UK 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。\n\nA把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。\n\n**命题人借用的原文材料：**\n\n> Robert F. Kennedy once said that a country's GDP measures \"everything except that which makes life worthwhile.\" With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"A"},"focusId":"focus-q31-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>赞扬英国的国内生产总值\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 praised the UK 把肯尼迪的评价限定到英国，第一段的 a country’s GDP 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>a country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 praised the UK 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。\u003c/p>\n\u003cp>A把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. praised the UK for its GDP","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 引用肯尼迪，是因为他赞扬英国的国内生产总值。\n\nA的 praised the UK 把肯尼迪的评价限定到英国，第一段的 a country’s GDP 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\n\na country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 praised the UK 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。\n\n第二段的低失业率和高增长也不能倒灌给肯尼迪。那是作者讨论英国现状时摆出的数字，与前面引用某人的话不是同一层叙述。看到全文前两段都提GDP，就把英国的数字表现归到肯尼迪名下，会同时读错说话人和态度。\n\n引语既没有专指英国，也没有赞美GDP，而是在指出它未能衡量的重要内容。\n\nA把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"31","option":"A"},"focusId":"focus-q31-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>赞扬英国的国内生产总值\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 praised the UK 把肯尼迪的评价限定到英国，第一段的 a country’s GDP 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>a country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 praised the UK 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。\u003c/p>\n\u003cp>A把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用肯尼迪，是因为他赞扬英国的国内生产总值。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 praised the UK 把肯尼迪的评价限定到英国，第一段的 a country’s GDP 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\u003c/p>\n\u003cp>a country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 praised the UK 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。\u003c/p>\n\u003cp>第二段的低失业率和高增长也不能倒灌给肯尼迪。那是作者讨论英国现状时摆出的数字，与前面引用某人的话不是同一层叙述。看到全文前两段都提GDP，就把英国的数字表现归到肯尼迪名下，会同时读错说话人和态度。\u003c/p>\n\u003cp>引语既没有专指英国，也没有赞美GDP，而是在指出它未能衡量的重要内容。\u003c/p>\n\u003cp>A把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. praised the UK for its GDP","level":4,"raw":"#### 写作视角法\n\n原文第1、2段是这样写的：\n\n> Robert F. Kennedy once said that a country's GDP measures \"everything except that which makes life worthwhile.\" With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\n>\n> 肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。\n\n把这一处放回全文，它承担的写作任务是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Kennedy praised the United Kingdom for its outstanding GDP figures.\n>\n> 肯尼迪因英国出色的GDP数字而赞扬英国。\n\n引语并未提到英国，英国是作者稍后带入的现实背景；要赞扬英国需由肯尼迪本人评价该国数据，不能把两个叙述层拼成一人发言。","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"31","option":"A"},"focusId":"focus-q31-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>赞扬英国的国内生产总值\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 praised the UK 把肯尼迪的评价限定到英国，第一段的 a country’s GDP 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\u003c/p>\n\u003cp>\u003cstrong>错 DP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Kennedy argued that a high GDP was the same thing as a happy life.\n>\n> 肯尼迪认为高GDP等同于幸福生活。\n\neverything except恰好将GDP与生活价值拉开，假设取消这个排除关系，会使后面的指标质疑失去出发点。","context":{"mode":"image","asset":"questions","focus":[250,429,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"31","option":"B"},"focusId":"focus-q31-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-B-0\">\u003cblockquote>\n\u003cp>把国内生产总值等同于幸福\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 identified GDP with happiness 说两者等同，第一段的 except that which makes life worthwhile 则直接限定GDP没有量到什么，因此回看except这个转折点后面的内容。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>except that which makes life worthwhile 不是给GDP增加一项功能，而是从everything里面划出一个例外：让生活值得过的东西不在GDP的衡量之中。B的 identified GDP with happiness 却把二者说成同一回事，方向正好相反。\u003c/p>\n\u003cp>不要只读everything，再看到life就认为GDP与幸福有关，因此B也对。真正决定关系的是except。第二段进一步说它衡量不重要的东西，却漏掉重要的东西，仍在强调遗漏，而不是补上一条GDP等于幸福的定义。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用肯尼迪，是因为他把国内生产总值等同于幸福。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 identified GDP with happiness 说两者等同，第一段的 except that which makes life worthwhile 则直接限定GDP没有量到什么， 的定位线索是：C的 misinterpreted the role of GDP 要求作者指出肯尼迪理解有误；第二段的 It measures things that do not matter and misses things that do 继续评价GDP的衡量范围，因此把这句与引语一起看，确认作者是在纠错还是沿着同一问题往下说。\n\n**错误类型：第一类——歪曲原意。**\n\nIt measures things that do not matter and misses things that do 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。C的 misinterpreted the role of GDP 则把肯尼迪当成理解错误、需要被纠正的对象。原文后续并没有给他纠错，反而沿着“量到了什么、漏掉了什么”展开问题。\n\n“某人批评一个指标”和“作者认为这个人误解指标”不能互换。要使C成立，作者需要指出肯尼迪哪一处说错，再提供相反解释；现在读到的是同向补充。这里不能把被批评的GDP换成正在被批评的肯尼迪。\n\n**命题人借用的原文材料：**\n\n> It measures things that do not matter and misses things that do.","context":{"mode":"image","asset":"questions","focus":[250,517,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"C"},"focusId":"focus-q31-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-C-0\">\u003cblockquote>\n\u003cp>误解了国内生产总值的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 misinterpreted the role of GDP 要求作者指出肯尼迪理解有误；第二段的 It measures things that do not matter and misses things that do 继续评价GDP的衡量范围，因此把这句与引语一起看，确认作者是在纠错还是沿着同一问题往下说。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>It measures things that do not matter and misses things that do 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。C的 misinterpreted the role of GDP 则把肯尼迪当成理解错误、需要被纠正的对象。原文后续并没有给他纠错，反而沿着“量到了什么、漏掉了什么”展开问题。\u003c/p>\n\u003cp>“某人批评一个指标”和“作者认为这个人误解指标”不能互换。要使C成立，作者需要指出肯尼迪哪一处说错，再提供相反解释；现在读到的是同向补充。这里不能把被批评的GDP换成正在被批评的肯尼迪。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It measures things that do not matter and misses things that do.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. misinterpreted the role of GDP","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 引用肯尼迪，是因为他误解了国内生产总值的作用。\n\nC的 misinterpreted the
