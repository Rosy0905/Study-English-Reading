态：** 第一轮D保留。当时选项呈现为“had a [xxx] opinion of GDP”，保留了相应遮挡。当时的定位线索是：D的 opinion of GDP 指肯尼迪对GDP的看法，第一段的 everything except 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。\n\n**选项类型：正确同义改写。**\n\nopinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。everything except 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。\n\nexcept指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\n\n**正确选项的原文依据：**\n\n> Robert F. Kennedy once said that a country's GDP measures \"everything except that which makes life worthwhile.\" With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"D"},"focusId":"focus-q31-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-D-0\">\u003cblockquote>\n\u003cp>对国内生产总值评价不高\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“had a [xxx] opinion of GDP”，保留了相应遮挡。当时的定位线索是：D的 opinion of GDP 指肯尼迪对GDP的看法，第一段的 everything except 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。everything except 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。\u003c/p>\n\u003cp>except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. had a low opinion of GDP"," 后到底排除了什么。\u003c/p>\n\u003cp>opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。everything except 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。\u003c/p>\n\u003cp>不过其他三项分别增加英国这个对象、把排除关系写成等同、把肯尼迪改成被纠错的人，都已与引语及接下来的叙述不合。D保留了真正正在发生的事情：作者引用一个人对GDP的评价。\u003c/p>\n\u003cp>except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. had a low opinion of GDP","level":4,"raw":"#### 写作视角法\n\n原文第1、2段是这样写的：\n\n> Robert F. Kennedy once said that a country's GDP measures \"everything except that which makes life worthwhile.\" With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\n>\n> 肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。\n\n把这一处放回全文，它承担的写作任务是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Kennedy regarded GDP as an inadequate measure of what makes life worthwhile.\n>\n> 肯尼迪认为GDP不足以衡量使生活值得过的东西。\n\n评价不高具体指衡量生活意义的能力有限，不是GDP没有任何用途。后文以福祉指标继续展开这一限度。","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"31","option":"D"},"focusId":"focus-q31-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-D-0\">\u003cblockquote>\n\u003cp>对国内生产总值评价不高\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“had a [xxx] opinion of GDP”，保留了相应遮挡。当时的定位线索是：D的 opinion of GDP 指肯尼迪对GDP的看法，第一段的 everything except 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。everything except 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。\u003c/p>\n\u003cp>except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\u003c/p>\n\u003cp>\u003cstr :"D. had a low opinion of GDP","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> High GDP But Inadequate Well-being, a UK Lesson  \n> 高GDP却福祉不足，英国的一课\n\n把这个主旨直接代入31题题干：\n\n> 高GDP与幸福不足的反差要求从对GDP指标局限的批评起笔。引用此人是引入问题，不是认定他否定一切经济活动。\n\nD实际说的是：\n\n> had a low opinion of GDP  \n> 对国内生产总值评价不高\n\nexcept指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\n\n从全文推进看，这一处的作用是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\n\n这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\n\n**复盘判断：D正确。**","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"31","option":"D"},"focusId":"focus-q31-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-D-0\">\u003cblockquote>\n\u003cp>对国内生产总值评价不高\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“had a [xxx] opinion of GDP”，保留了相应遮挡。当时的定位线索是：D的 opinion of GDP 指肯尼迪对GDP的看法，第一段的 everything except 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。everything except 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。\u003c/p>\n\u003cp>except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用肯尼迪，是因为他对国内生产总值评价不高。\u003c/p>\n\u003c/blockquote>\n\u003cp>D 失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"31题结论","level":2,"raw":"### 31题结论\n\n> **31. D. had a low opinion of GDP**\n\nA：a country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。\n\nB：except that which makes life worthwhile 不是给GDP增加一项功能，而是从everything里面划出一个例外：让生活值得过的东西不在GDP的衡量之中。\n\nC：It measures things that do not matter and misses things that do 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。\n\nD：opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"31","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>31. D. had a low opinion of GDP\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：a country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。\u003c/p>\n\u003cp>B：except that which makes life worthwhile 不是给GDP增加一项功能，而是从everything里面划出一个例外：让生活值得过的东西不在GDP的衡量之中。\u003c/p>\n\u003cp>C：It measures things that do not matter and misses things that do 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。\u003c/p>\n\u003cp>D：opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"32题 · 题干、题型与核心出处","level":2,"raw":"## 32题\n\n> It can be inferred from Paragraph 2 that ______.  \n> 从第二段可以推知什么？\n\n### 题型\n\n局部推断题。题干要求判断“从第二段可以推知什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> The question of GDP and its usefulness has annoyed policymakers for over half a century. Many argue that it is a flawed concept. It measures things that do not matter and misses things that do. By most recent measures, the UK's GDP has been the envy of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country's economic prospects?\n\n作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"32","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It can be inferred from Paragraph 2 that ______.\u003cbr>从第二段可以推知什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部推断题。题干要求判断“从第二段可以推知什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The question of GDP and its usefulness has annoyed policymakers for over half a century. Many argue that it is a flawed concept. It measures things that do not matter and misses things that do. By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. GDP as the measure of success is widely defied in the UK","level":3,"raw":"### A. GDP as the measure of success is widely defied in the UK\n\n> 将国内生产总值作为成功尺度在英国受到广泛质疑\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\n\n**选项类型：正确同义改写。**\n\n作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\n\nA保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\n\n**正确选项的原文依据：**\n\n> By most recent measures, the UK's GDP has been the envy of the Western world, with record low unemployment and high growth figures.\n>\n> If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country's economic prospects?","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"A"},"focusId":"focus-q32-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>将国内生产总值作为成功尺度在英国受到广泛质疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\u003c/p>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures.\u003c/p>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. GDP as the measure of success is widely defied in the UK","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第二段表明，将国内生产总值作为成功尺度在英国受到广泛质疑。\n\nA的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\n\n作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\n\nwidely可以由一千七百多万人的规模得到支撑；被质疑的是GDP“作为成功尺度”，不是GDP数字必然造假，也不是所有经济活动都不重要。把A的限定读全，它与反问关注的“为什么数字好却不能代表大家认可现状”能够接上。\n\n反问的力量正在于按GDP看似成功，却不能解释如此广泛的不满或不同选择。\n\nA保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"32","option":"A"},"focusId":"focus-q32-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>将国内生产总值作为成功尺度在英国受到广泛质疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\u003c/p>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures.\u003c/p>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段表明，将国内生产总值作为成功尺度在英国受到广泛质疑。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\u003c/p>\n\u003cp>作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\u003c/p>\n\u003cp>widely可以由一千七百多万人的规模得到支撑；被质疑的是GDP“作为成功尺度”，不是GDP数字必然造假，也不是所有经济活动都不重要。把A的限定读全，它与反问关注的“为什么数字好却不能代表大家认可现状”能够接上。\u003c/p>\n\u003cp>反问的力量正在于按GDP看似成功，却不能解释如此广泛的不满或不同选择。\u003c/p>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. GDP as the measure of success is widely defied in the UK","level":4,"raw":"#### 写作视角法\n\n原文第2段是这样写的：\n\n> By most recent measures, the UK's GDP has been the envy of the Western world, with record low unemployment and high growth figures.\n>\n> If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country's economic prospects?\n>\n> 作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\n\n把这一处放回全文，它承担的写作任务是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Many people in Britain question whether GDP alone represents national success.\n>\n> 英国许多人质疑单凭GDP能否代表国家成功。\n\nmany argue提供广泛质疑，经济数据与投票反差使质疑落到英国案例。这里不是说全国所有人都拒绝统计GDP。","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"32","option":"A"},"focusId":"focus-q32-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>将国内生产总值作为成功尺度在英国受到广泛质疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\u003c/p>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures.\u003c/p>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段表明，将国内生产总值作为成功尺度在英国受到广泛质疑。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\u003c/p>\n\u003cp>作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\u003c/p>\n\u003cp>widely可以由一千七百多万人的规模得到支撑；被质疑的是GDP“作为成功尺度”，不是GDP数字必然造假，也不是所有经济活动都不重要。把A的限定读全，它与反问关注的“为什么数字好却不能代表大家认可现状”能够接上。\u003c/p>\n\u003cp>反问的力量正在于按GDP看似成功，却不能解释如此广泛的不满或不同选择。\u003c/p>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>By most recent measures, the UK&#39;s GDP has been the envy of the Western world e the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Many people in Britain question whether GDP alone represents national success.\u003c/p>\n\u003cp>英国许多人质疑单凭GDP能否代表国家成功。\u003c/p>\n\u003c/blockquote>\n\u003cp>many argue提供广泛质疑，经济数据与投票反差使质疑落到英国案例。这里不是说全国所有人都拒绝统计GDP。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国案例警示GDP不足以单独度量成功，本题应回答对这一尺度的质疑；不能把质疑指标直接变成决策者已减少使用它。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>GDP as the measure of success is widely defied in the UK\u003cbr>将国内生产总值作为成功尺度在英国受到广泛质疑\u003c/p>\n\u003c/blockquote>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. policymakers in the UK are paying less attention to GDP","level":3,"raw":"### B. policymakers in the UK are paying less attention to GDP\n\n> 英国决策者正减少对国内生产总值的关注\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的 paying less attention to GDP 是关注程度随时间下降，原文的 for over half a century 却是在交代GDP有用性问题持续了多久，因此回看带policymakers的首句。\n\n**错误类型：第三类——无中生有。**\n\nfor over half a century 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。B的 paying less attention to GDP 却要求有越来越少关注的变化。持续争论GDP有没有用，与已经减少注意力，是两种不同的事情。\n\n争论持续的时间不是关注减少的趋势，原文也没有给出前后关注程度的对照。\n\n**命题人借用的原文材料：**\n\n> The question of GDP and its usefulness has annoyed policymakers for over half a century.\n>\n> Many argue that it is a flawed concept.\n>\n> It measures things that do not matter and misses things that do.","context":{"mode":"image","asset":"questions","focus":[250,958,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"B"},"focusId":"focus-q32-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-B-0\">\u003cblockquote>\n\u003cp>英国决策者正减少对国内生产总值的关注\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 paying less attention to GDP 是关注程度随时间下降，原文的 for over half a century 却是在交代GDP有用性问题持续了多久，因此回看带policymakers的首句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>for over half a century 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。B的 paying less attention to GDP 却要求有越来越少关注的变化。持续争论GDP有没有用，与已经减少注意力，是两种不同的事情。\u003c/p>\n\u003cp>争论持续的时间不是关注减少的趋势，原文也没有给出前后关注程度的对照。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The question of GDP and its usefulness has annoyed policymakers for over half a century.\u003c/p>\n\u003cp>Many argue that it is a flawed concept.\u003c/p>\n\u003cp>It measures things that do not matter and misses things that do.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. policymakers in the UK are paying less attention to GDP","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第二段表明，英国决策者正减少对国内生产总值的关注。\n\nB的 paying less attention to GDP 是关注程度随时间下降，原文的 for over half a century 却是在交代GDP有用性问题持续了多久，因此回看带policymakers的首句。\n\nfor over half a century 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。B的 paying less attention to GDP 却要求有越来越少关注的变化。持续争论GDP有没有用，与已经减少注意力，是两种不同的事情。\n\nMany argue的主体还是many，没有把所有议论者都限定成英国政策制定者。下文介绍英国的高增长与脱欧选择，也是在说明GDP难以解释现状，并不等于政府机构减少了对它的关注。B同时补上特定主体和注意力变化，超出了该段所写的争论。\ 鸟 · 题目复盘","title":"D. the UK is reluctant to remold its economic pattern","level":3,"raw":"### D. the UK is reluctant to remold its economic pattern\n\n> 英国不愿重塑经济模式\n\n**做题模式中的状态：** 第一轮D排除。当时选项呈现为“the UK is reluctant to [xxx] its economic pattern”，保留了相应遮挡。当时的定位线索是：D的 is reluctant to 说国家不愿采取某个动作，第二段的 vote for Brexit 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。\n\n**错误类型：第三类——无中生有。**\n\nvote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 is reluctant to 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。\n\n反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\n\n**命题人借用的原文材料：**\n\n> If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country's economic prospects?","context":{"mode":"image","asset":"questions","focus":[250,1134,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"D"},"focusId":"focus-q32-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-D-0\">\u003cblockquote>\n\u003cp>英国不愿重塑经济模式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“the UK is reluctant to [xxx] its economic pattern”，保留了相应遮挡。当时的定位线索是：D的 is reluctant to 说国家不愿采取某个动作，第二段的 vote for Brexit 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>vote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 is reluctant to 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。\u003c/p>\n\u003cp>反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the UK is reluctant to remold its economic pattern","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第二段表明，英国不愿重塑经济模式。\n\nD的 is reluctant to 说国家不愿采取某个动作，第二段的 vote for Brexit 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。\n\nvote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 is reluctant to 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。\n\n它们并不是反问句中的投票者、投票行为与经济前景。不能把一个群体作了某种选择，直接写成国家不愿对经济模式做事。\n\n反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。","context":{"mode":"image","asset":"questions","focus":[250,1134,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"32","option":"D"},"focusId":"focus-q32-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-D-0\">\u003cblockquote>\n\u003cp>英国不愿重塑经济模式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“the UK is reluctant to [xxx] its economic pattern”，保留了相应遮挡。当时的定位线索是：D的 is reluctant to 说国家不愿采取某个动作，第二段的 vote for Brexit 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>vote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 is reluctant to 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。\u003c/p>\n\u003cp>反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段表明，英国不愿重塑经济模式。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 is reluctant to 说国家不愿采取某个动作，第二段的 vote for Brexit 则是大量人的具体选择，因此回到反问句 id over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段表明，英国不愿重塑经济模式。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 is reluctant to 说国家不愿采取某个动作，第二段的 vote for Brexit 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。\u003c/p>\n\u003cp>vote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 is reluctant to 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。\u003c/p>\n\u003cp>它们并不是反问句中的投票者、投票行为与经济前景。不能把一个群体作了某种选择，直接写成国家不愿对经济模式做事。\u003c/p>\n\u003cp>反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Britain refuses to change its economic model.\u003c/p>\n\u003cp>英国拒绝改变其经济模式。\u003c/p>\n\u003c/blockquote>\n\u003cp>对GDP尺度的争议不同于拒绝经济结构改革。原文没有说明英国被要求怎样重塑模式或怎样拒绝。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the UK is reluctant to remold its economic pattern","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> High GDP But Inadequate Well-being, a UK Lesson  \n> 高GDP却福祉不足，英国的一课\n\n把这个主旨直接代入32题题干：\n\n> 英国案例警示GDP不足以单独度量成功，本题应回答对这一尺度的质疑；不能把质疑指标直接变成决策者已减少使用它。\n\nD实际说的是：\n\n> the UK is reluctant to remold its economic pattern  \n> 英国不愿重塑经济模式\n\n反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\n\n从全文推进看，这一处的作用是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\n 3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Britain refuses to change its economic model.\u003c/p>\n\u003cp>英国拒绝改变其经济模式。\u003c/p>\n\u003c/blockquote>\n\u003cp>对GDP尺度的争议不同于拒绝经济结构改革。原文没有说明英国被要求怎样重塑模式或怎样拒绝。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国案例警示GDP不足以单独度量成功，本题应回答对这一尺度的质疑；不能把质疑指标直接变成决策者已减少使用它。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the UK is reluctant to remold its economic pattern\u003cbr>英国不愿重塑经济模式\u003c/p>\n\u003c/blockquote>\n\u003cp>反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"32题结论","level":2,"raw":"### 32题结论\n\n> **32. A. GDP as the measure of success is widely defied in the UK**\n\nA：作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。\n\nB：for over half a century 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。\n\nC：their country’s economic prospects 是这个国家自身的前景，不是它在 world economy 中贡献了多少。\n\nD：vote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"32","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>32. A. GDP as the measure of success is widely defied in the UK\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。\u003c/p>\n\u003cp>B：for over half a century 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。\u003c/p>\n\u003cp>C：their country’s economic prospects 是这个国家自身的前景，不是它在 world economy 中贡献了多少。\u003c/p>\n\u003cp>D：vote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"33题 · 题干、题型与核心出处","level":2,"raw":"## 33题\n\n> Which of the following is true about the recent annual study?  \n> 关于最近的年度研究，下列哪一项正确？\n\n### 题型\n\n具体细节题。题干要求判断“关于最近的年度研究，下列哪一项正确？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens. Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\n>\n> While all of these countries face their own challenges, there are a number of consistent themes. Yes, there has been a budding economic recovery since the 2008 global crash, but in key indicators in areas such as health and education, major economies have continued to decline. Yet this isn't the case with all countries. Some relatively poor European countries have seen huge improvements across measures including civil society, income equality and the environment.\n\n研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"33","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Which of the following is true about the recent annual study?\u003cbr>关于最近的年度研究，下列哪一项正确？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>具体细节题。题干要求判断“关于最近的年度研究，下列哪一项正确？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens. Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003cp>While all of these countries face their own challenges, there are a number of consistent themes. Yes, there has been a budding economic recovery since the 2008 global crash, but in key indicators in areas such as health and education, major economies have continued to decline. Yet this isn&#39;t the case with all countries. Some relatively poor European countries have seen huge improvements across measures including civil society, income equality and the environment.\u003c/p>\n\u003c/blockquote>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. It excludes GDP as an indicator.","level":3,"raw":"### A. It excludes GDP as an indicator.\n\n> 它排除了国内生产总值这一指标\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\n\n**错误类型：第一类——歪曲原意。**\n\nRather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\n\njust限定的是关注范围单一，删去just才会变成对GDP本身的排除。\n\n**命题人借用的原文材料：**\n\n> Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"A"},"focusId":"focus-q33-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>它排除了国内生产总值这一指标\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. It excludes GDP as an indicator.","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 关于这项年度研究，正确说法是：它排除了国内生产总值这一指标。\n\nA的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\n\nRather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\n\n段首还说研究各国把增长转成福祉的能力，经济增长与福祉都在讨论中。研究不是把增长赶出视野，而是问增长有没有带来人的改善。A看到了rather than，却漏了just，于是把不再局限于一个指标误写成彻底排除这个指标。\n\njust限定的是关注范围单一，删去just才会变成对GDP本身的排除。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>它排除了国内生产总值这一指标\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于这项年度研究，正确说法是：它排除了国内生产总值这一指标。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>段首还说研究各国把增长转成福祉的能力，经济增长与福祉都在讨论中。研究不是把增长赶出视野，而是问增长有没有带来人的改善。A看到了rather than，却漏了just，于是把不再局限于一个指标误写成彻底排除这个指标。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. It excludes GDP as an indicator.","level":4,"raw":"#### 写作视角法\n\n原文第3、4段是这样写的：\n\n> Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\n>\n> 研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\n\n把这一处放回全文，它承担的写作任务是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The study entirely excludes GDP from its indicators.\n>\n> 该研究把GDP完全排除在指标之外。\n\nrather than just focusing on意味着不只看GDP，仍可保留GDP再加入其他标准；假设把补充扩大成完全删除。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>它排除了国内生产总值这一指标\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于这项年度研究，正确说法是：它排除了国内生产总值这一指标。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>段首还说研究各国把增长转成福祉的能力，经济增长与福祉都在讨论中。研究不是把增长赶出视野，而是问增长有没有带来人的改善。A看到了rather than，却漏了just，于是把不再局限于一个指标误写成彻底排除这个指标。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The study entirely excludes GDP from its indicators.\u003c/p>\n\u003cp>该研究把GDP完全排除在指标之外。\u003c/p>\n\u003c/blockquote>\n\u003cp>rather than just focusing on意味着不只看GDP，仍可保留GDP再加入其他标准；假设把补充扩大成完全删除。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. It excludes GDP as an indicator.","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> High GDP But Inadequate Well-being, a UK Lesson  \n> 高GDP却福祉不足，英国的一课\n\n把这个主旨直接代入33题题干：\n\n> 标题中的英国教训需要更完整的衡量方法来揭示，因此题干应回答研究怎样帮助理解反差；研究覆盖多少国家不等于由谁出资。\n\nA实际说的是：\n\n> It excludes GDP as an indicator.  \n> 它排除了国内生产总值这一指标\n\njust限定的是关注范围单一，删去just才会变成对GDP本身的排除。\n\n从全文推进看，这一处的作用是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>它排除了国内生产总值这一指标\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于这项年度研究，正确说法是：它排除了国内生产总值这一指标。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>段首还说研究各国把增长转成福祉的能力，经济增长与福祉都在讨论中。研究不是把增长赶出视野，而是问增长有没有带来人的改善。A看到了rather than，却漏了just，于是把不再局限于一个指标误写成彻底排除这个指标。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The study entirely excludes GDP from its indicators.\u003c/p>\n\u003cp>该研究把GDP完全排除在指标之外。\u003c/p>\n\u003c/blockquote>\n\u003cp>rather than just focusing on意味着不只看GDP，仍可保留GDP再加入其他标准；假设把补充扩大成完全删除。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题中的英国教训需要更完整的衡量方法来揭示，因此题干应回答研究怎样帮助理解反差；研究覆盖多少国家不等于由谁出资。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>It excludes GDP as an indicator.\u003cbr>它排除了国内生产总值这一指标\u003c/p>\n\u003c/blockquote>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. It is sponsored by 163 countries.","level":3,"raw":"### B. It is sponsored by 163 countries.\n\n> 它由163个国家资助\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的 sponsored by 163 countries 与第三段的 the 163 countries measured 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。\n\n**错误类型：第三类——无中生有。**\n\nthe 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 sponsored by 163 countries 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。\n\n被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。\n\n**命题人借用的原文材料：**\n\n> Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.","context":{"mode":"image","asset":"questions","focus":[250,1486,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"B"},"focusId":"focus-q33-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-B-0\">\u003cblockquote>\n\u003cp>它由163个国家资助\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 sponsored by 163 countries 与第三段的 the 163 countries measured 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>the 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 sponsored by 163 countries 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。\u003c/p>\n\u003cp>被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. It is sponsored by 163 countries.","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 关于这项年度研究，正确说法是：它由163个国家资助。\n\nB的 sponsored by 163 countries 与第三段的 the 163 countries measured 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。\n\nthe 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 sponsored by 163 countries 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。\n\nAcr 实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,1486,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"33","option":"B"},"focusId":"focus-q33-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-B-0\">\u003cblockquote>\n\u003cp>它由163个国家资助\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 sponsored by 163 countries 与第三段的 the 163 countries measured 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>the 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 sponsored by 163 countries 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。\u003c/p>\n\u003cp>被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于这项年度研究，正确说法是：它由163个国家资助。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 sponsored by 163 countries 与第三段的 the 163 countries measured 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。\u003c/p>\n\u003cp>the 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 sponsored by 163 countries 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。\u003c/p>\n\u003cp>Across之后比较英国在这些国家中的表现，也进一步说明163是样本覆盖范围：作者在一个国家集合中作横向比较。原段没有说资金从哪里来、谁委托了研究、哪些国家共同组织。不能因为数目完全相同，就忽略数目前后的动作不同。\u003c/p>\n\u003cp>被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q  question 说这项研究帮助解释了前面的问题。C的 criteria are questionable 却把怀疑落到研究的标准上。作者确实正在追问GDP作为尺度是否足够，但那不能自动变成“新研究采用的健康、教育等标准也可疑”。\n\n后半段是在说明研究扩展了哪些衡量项目，并没有逐项指出它们存在错误，也没有否定这些项目所得到的解释。把一个旧衡量方法受到质疑，与用于回答该质疑的新研究混在一起，便会把批评对象转错。这里作者借研究帮助理解英国表现，而不是接着拆穿这项研究。\n\n**命题人借用的原文材料：**\n\n> A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.\n>\n> Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.","context":{"mode":"image","asset":"questions","focus":[250,1574,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"C"},"focusId":"focus-q33-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-C-0\">\u003cblockquote>\n\u003cp>它的评价标准值得怀疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 criteria are questionable 评价研究标准不可靠，第三段的 sheds some light on that question 则说明研究对前面疑问的作用，因此把段首评价与段末列标准的部分一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>sheds some light on that question 说这项研究帮助解释了前面的问题。C的 criteria are questionable 却把怀疑落到研究的标准上。作者确实正在追问GDP作为尺度是否足够，但那不能自动变成“新研究采用的健康、教育等标准也可疑”。\u003c/p>\n\u003cp>后半段是在说明研究扩展了哪些衡量项目，并没有逐项指出它们存在错误，也没有否定这些项目所得到的解释。把一个旧衡量方法受到质疑，与用于回答该质疑的新研究混在一起，便会把批评对象转错。这里作者借研究帮助理解英国表现，而不是接着拆穿这项研究。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.\u003c/p>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries ured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.","context":{"mode":"image","asset":"questions","focus":[250,1662,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"D"},"focusId":"focus-q33-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-D-0\">\u003cblockquote>\n\u003cp>它的结果具有启发性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“Its results are [xxx].”，保留了相应遮挡。当时的定位线索是：D的 Its results 指研究发现，第三段的 sheds some light on that question 直接说研究能帮助理解前面的疑问，因此回看首句，再看英国的表现这一具体发现。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>Its results 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。\u003c/p>\n\u003cp>首句直接写sheds some light，随后用英国的具体表现展开这个解释。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.\u003c/p>\n\u003cp>Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Its results are enlightening.","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 关于这项年度研究，正确说法是：它的结果具有启发性。\n\nD的 Its results 指研究发现，第三段的 sheds some light on that question 直接说研究能帮助理解前面的疑问，因此回看首句，再看英国的表现这一具体发现。\n\nIts results 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。\n\n但是它至少没有说研究删除GDP、由样本国家资助或标准被否定。结合已经读到的研究用途，D是保留下来的对结果性质的概括。这里先理解结果在段落中帮助回答了什么，再决定它有没有与其余三项同样的对象错误。\n\n首句直接写sheds some light，随后用英国的具体表现展开这个解释。\n\n研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\n\nenlightening概括sheds some light：它揭示增长转为福祉的效率问题，后面的富国与较穷国家对照继续说明这一启发。","context":{"mode":"image"," 、公民社会等方面的表现放在一起比较。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"33题结论","level":2,"raw":"### 33题结论\n\n> **33. D. Its results are enlightening.**\n\nA：Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。\n\nB：the 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。\n\nC：sheds some light on that question 说这项研究帮助解释了前面的问题。\n\nD：Its results 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"33","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>33. D. Its results are enlightening.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。\u003c/p>\n\u003cp>B：the 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。\u003c/p>\n\u003cp>C：sheds some light on that question 说这项研究帮助解释了前面的问题。\u003c/p>\n\u003cp>D：Its results 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"34题 · 题干、题型与核心出处","level":2,"raw":"## 34题\n\n> In the last two paragraphs, the author suggests that ______.  \n> 在最后两段，作者提出什么建议？\n\n### 题型\n\n作者建议题。题干要求判断“在最后两段，作者提出什么建议？”，先按第6、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> So, what Kennedy was referring to was that while GDP has been the most common method for measuring the economic activity of nations, as a measure, it is no longer enough. It does not include important factors such as environmental quality or education outcomes – all things that contribute to a person's sense of well-being.\n>\n> The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth. But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\n\n倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"question":"34","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>In the last two paragraphs, the author suggests that ______.\u003cbr>在最后两段，作者提出什么建议？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者建议题。题干要求判断“在最后两段，作者提出什么建议？”，先按第6、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>So, what Kennedy was referring to was that while GDP has been the most common method for measuring the economic activity of nations, as a measure, it is no longer enough. It does not include important factors such as environmental quality or education outcomes – all things that contribute to a person&#39;s sense of well-being.\u003c/p>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth. But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\u003c/p>\n\u003c/blockquote>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. the UK is preparing for an economic boom","level":3,"raw":"### A. the UK is preparing for an economic boom\n\n> 英国正为经济繁荣作准备\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 an economic boom 指经济繁荣，第七段的 a decline in the everyday services 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。\n\n**错误类型：第三类——无中生有。**\n\n原文先说增长受打击，可能造成 a decline in the everyday services，与出现 an economic boom 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。\n\n原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\n\n**命题人借用的原文材料：**\n\n> The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"A"},"focusId":"focus-q34-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>英国正为经济繁荣作准备\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 an economic boom 指经济繁荣，第七段的 a decline in the everyday services 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文先说增长受打击，可能造成 a decline in the everyday services，与出现 an economic boom 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。\u003c/p>\n\u003cp>原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. the UK is preparing for an economic boom","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 最后两段中作者建议：英国正为经济繁荣作准备。\n\nA的 an economic boom 指经济繁荣，第七段的 a decline in the everyday services 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。\n\n原文先说增长受打击，可能造成 a decline in the everyday services，与出现 an economic boom 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。\n\nA还加了is preparing for，要求英国已经在为繁荣准备。原文只是提出政策制定者可以怎样用力，并没有报道英国正在开展一套迎接繁荣的行动。不能把一种有条件的可能改善，扩大成国家正在准备的经济繁荣。\n\n原文的背景是增长风险，改善是有条件的可能结果，A却把 is preparing for an economic boom","level":4,"raw":"#### 写作视角法\n\n原文第6、7段是这样写的：\n\n> The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\n>\n> 倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\n\n把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Britain is preparing for a period of rapid economic expansion.\n>\n> 英国正为一段快速经济扩张时期作准备。\n\n实际预期是sharp hit to growth，建议意在避免坏结果，不是宣布繁荣准备已经开始。","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"34","option":"A"},"focusId":"focus-q34-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>英国正为经济繁荣作准备\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 an economic boom 指经济繁荣，第七段的 a decline in the everyday services 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文先说增长受打击，可能造成 a decline in the everyday services，与出现 an economic boom 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。\u003c/p>\n\u003cp>原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最后两段中作者建议：英国正为经济繁荣作准备。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 an economic boom 指经济繁荣，第七段的 a decline in the everyday services 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。\u003c/p>\n\u003cp>原文先说增长受打击，可能造成 a decline in the everyday services，与出现 an economic boom 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。\u003c/p>\n\u003cp>A还加了is preparing for，要求英国已经在为繁荣准备。原文只是提出政策制定者可以怎样用力，并没有报道英国正在开展一套迎接繁荣的行动。不能把一种有条件的可能改善，扩大成国家正在准备的经济繁荣。\u003c/p>\n\u003cp>原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Britain is preparing for a period of rapid economic expansion.\u003c/p>\n\u003cp>英国正为一段快速经济扩张时期作准备。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际预期是sharp hit to growth，建议意在避免坏结果，不是宣布繁荣准备已经开始。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. the UK is preparing for an economic boom","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> High GDP But Inadequate Well-being, a UK Lesson  \n> 高GDP却福祉不足，英国的一课\n\n把这个主旨直接代入34题题干：\n\n> 英国教训指向衡量与行动的扩展。本题应说需要兼顾GDP以外的生活因素，而不能将坏预期泛化成谨慎处理一切经济事务。\n\nA实际说的是：\n\n> the UK is preparing for an economic boom  \n> 英国正为经济繁荣作准备\n\n原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\n\n从全文推进看，这一处的作用是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[25 e important factors：这些是GDP没有涵盖，却又影响幸福感的东西。作者还明确说it is no longer enough，先否定“GDP已经够用”，再解释为什么不够。B的动作consider，至少与作者把这些遗漏因素重新放进讨论相容。\n\n不能因为作者说重要，就直接替它填一个熟悉形容词。现在B的对象和动作很贴近第六段；D又可能概括第七段政策怎样处理问题，两个层面还要分清。\n\n**正确选项的原文依据：**\n\n> It does not include important factors such as environmental quality or education outcomes – all things that contribute to a person's sense of well-being.","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"B"},"focusId":"focus-q34-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>考虑国内生产总值以外的因素至关重要\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“it is [xxx] to consider factors beyond GDP”，保留了相应遮挡。当时的定位线索是：B的 factors beyond GDP 与第六段的 It does not include important factors 正好涉及被GDP遗漏的因素，因此回看作者先说够不够，再列遗漏内容的这两句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>factors beyond GDP 可以接到 It does not include important factors：这些是GDP没有涵盖，却又影响幸福感的东西。作者还明确说it is no longer enough，先否定“GDP已经够用”，再解释为什么不够。B的动作consider，至少与作者把这些遗漏因素重新放进讨论相容。\u003c/p>\n\u003cp>不能因为作者说重要，就直接替它填一个熟悉形容词。现在B的对象和动作很贴近第六段；D又可能概括第七段政策怎样处理问题，两个层面还要分清。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It does not include important factors such as environmental quality or education outcomes – all things that contribute to a person&#39;s sense of well-being.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. it is essential to consider factors beyond GDP","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 最后两段中作者建议：考虑国内生产总值以外的因素至关重要。\n\nB的 factors beyond GDP 与第六段的 It does not include important factors 正好涉及被GDP遗漏的因素，因此回看作者先说够不够，再列遗漏内容的这两句。\n\nfactors beyond GDP 可以接到 It does not 3,"raw":"### C. high GDP foreshadows an economic decline\n\n> 高国内生产总值预示经济衰退\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C的 high GDP foreshadows 把高GDP当作未来下滑的信号，第七段的 hit to growth 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。\n\n**错误类型：第一类——歪曲原意。**\n\nhit to growth 是增长受到打击，后面could lead to接日常服务下降。C的 high GDP foreshadows 却让高GDP成为预示经济下滑的信号，主语、所接结果和关系都被改动。高增长数字未必反映生活很好，与高GDP会预示增长下滑，是两个不同判断。\n\n原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\n\n**命题人借用的原文材料：**\n\n> The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.","context":{"mode":"image","asset":"questions","focus":[250,2102,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"C"},"focusId":"focus-q34-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-C-0\">\u003cblockquote>\n\u003cp>高国内生产总值预示经济衰退\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 high GDP foreshadows 把高GDP当作未来下滑的信号，第七段的 hit to growth 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>hit to growth 是增长受到打击，后面could lead to接日常服务下降。C的 high GDP foreshadows 却让高GDP成为预示经济下滑的信号，主语、所接结果和关系都被改动。高增长数字未必反映生活很好，与高GDP会预示增长下滑，是两个不同判断。\u003c/p>\n\u003cp>原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. high GDP foreshadows an economic decline","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 最后两段中作者建议：高国内生产总值预示经济衰退。\n\nC的 high GDP foreshadows 把高GDP当作未来下滑的信号，第七段的 hit to growth 才是原文放在因果链前端的东西，因此回 不到生活质量”误读成“能够预报经济衰退”，恰好给GDP添上了原文从未给出的预测作用。\u003c/p>\n\u003cp>原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. high GDP foreshadows an economic decline","level":4,"raw":"#### 写作视角法\n\n原文第6、7段是这样写的：\n\n> The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\n>\n> 倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\n\n把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果C真是作者的意思，文章至少得写成：\n\n> A high level of GDP predicts that an economic decline will follow.\n>\n> 高GDP预示随后会出现经济衰退。\n\n作者说增长将受冲击，又说GDP不足以衡量幸福，没有建立高GDP导致或预示衰退的关系。","context":{"mode":"image","asset":"questions","focus":[250,2102,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"34","option":"C"},"focusId":"focus-q34-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-C-0\">\u003cblockquote>\n\u003cp>高国内生产总值预示经济衰退\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 high GDP foreshadows 把高GDP当作未来下滑的信号，第七段的 hit to growth 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>hit to growth 是增长受到打击，后面could lead to接日常服务下降。C的 high GDP foreshadows 却让高GDP成为预示经济下滑的信号，主语、所接结果和关系都被改动。高增长数字未必反映生活很好，与高GDP会预示增长下滑，是两个不同判断。\u003c/p>\n\u003cp>原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最后两段中作者建议：高国内生产总值预示经济衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 high GDP foreshadows 把高GDP当作未来下滑的信号，第七段的 hit to growth 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。\u003c/p>\n\u003cp>hit to growth 是增长受到打击，后面could lead to接日常服务下降。C的 high GDP foreshadows 却让高GDP成为预示经济下滑的信号，主语、所接结果和关系都被改动。高增长数字未必反映生活很好，与高GDP会预示增长下滑，是两个不同判断。\u003c/p>\n\u003cp>第六段说的是GDP作为衡量不够，因为没有包括影响福祉的重要因素；它并没有说GDP一高，经济就会开始走低。把“衡量不到生活质量”误读成“能够预报经济衰退”，恰好给GDP添上了原文从未给出的预测作用。\u003c/p>\n\u003cp>原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>A high level of GDP predicts that an economic decline will follow.\u003c/p>\n\u003cp>高GDP预示随后会出现经济衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者说增长将受冲击，又说GDP不足以衡量幸福，没有建立高GDP导致或预示衰退的关系。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. high GDP foreshadows an economic decline","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> High GDP But Inadequate Well-being, a UK Lesson  \n> 高GDP却福祉不足，英国的一课\n\n把这个主旨直接代入34题题干：\n\n> 英国教训指向衡量与行动的扩展。本题应说需要兼顾GDP以外的生活因素，而不能将坏预期泛化成谨慎处理一切经济事务。\n\nC实际说的是：\n\n> high GDP foreshadows an economic decline  \n> 高国内生产总值预示经济衰退\n\n原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\n\n从全文推进看，这一处的作用是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：C错误。**","context":{"mode":"image UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>A high level of GDP predicts that an economic decline will follow.\u003c/p>\n\u003cp>高GDP预示随后会出现经济衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者说增长将受冲击，又说GDP不足以衡量幸福，没有建立高GDP导致或预示衰退的关系。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国教训指向衡量与行动的扩展。本题应说需要兼顾GDP以外的生活因素，而不能将坏预期泛化成谨慎处理一切经济事务。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>high GDP foreshadows an economic decline\u003cbr>高国内生产总值预示经济衰退\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. it requires caution to handle economic issues","level":3,"raw":"### D. it requires caution to handle economic issues\n\n> 处理经济问题需要谨慎\n\n**做题模式中的状态：** 第一轮D保留。当时选项呈现为“it requires [xxx] to handle economic issues”，保留了相应遮挡。当时的定位线索是：D的 handle economic issues 谈政策如何处理经济问题，第七段的 policymakers who 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。读完全文后，做题模式再经交叉验证排除D，最终选择B。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n第6段先承认GDP是常见经济活动指标，再指出它不包括环境质量和教育结果等重要因素。第7段紧接着要求把努力重新集中到改善福祉，而不是仅仅担忧GDP数字。\n\n如果只采纳D，决策者仍可能非常谨慎地只盯GDP；这恰好没有完成作者的建议。B把GDP之外的因素纳入考虑，能够直接回应最后两段所列出的遗漏与行动方向。\n\n**命题人借用的原文材料：**\n\n> But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.","context":{"mode":"image","asset":"questions","focus":[250,2190,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"D"},"focusId":"focus-q34-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-D-0\">\u003cblockquote>\n\u003cp>处理经济问题需要谨慎\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“it requires [xxx] to handle economic issues”，保留了相应遮挡。当时的定位线索是：D的 handle economic issues 谈政策如何处理经济问题，第七段的 policymakers who 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。读完全文后，做题模式再经交叉验证排除D，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>第6段先承认GDP是常见经济活动指标，再指出它不包括环境质量和教育结果等重要因素。第7段紧接着要求把努力重新集中到改善福祉，而不是仅仅担忧GDP数字。\u003c/p>\n\u003cp>如果只采纳D，决策者仍可能非常谨慎地只盯GDP；这恰好没有完成作者的建议。B把GDP之外的因素纳入考虑，能够直接回应最后两段所列出的遗漏与行动方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. it requires caution to handle economic issues","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 最后两段中作者建议：处理经济问题需要谨慎。\n\nD的 handle economic issues 谈政策如何处理经济问题，第七段的 policymakers who 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。\n\n第6段先承认GDP是常见经济活动指标，再指出它不包括环境质量和教育结果等重要因素。第7段紧接着要求把努力重新集中到改善福祉，而不是仅仅担忧GDP数字。\n\nD的cautious on economic issues只说处理经济问题要谨慎，可以与很多经济评论相容，却没有交代这篇文章究竟要求把什么放进评价。作者要的不是笼统小心，而是扩展指标和政策目标。\n\n如果只采纳D，决策者仍可能非常谨慎地只盯GDP；这恰好没 uires caution to handle economic issues","level":4,"raw":"#### 写作视角法\n\n原文第6、7段是这样写的：\n\n> But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\n>\n> 倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\n\n把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Policymakers should handle economic issues cautiously.\n>\n> 政策制定者应谨慎处理经济问题。\n\n谨慎是一种宽泛方式，实际结尾给出具体目标转换：提高福祉，而非只担心GDP。把明确建议降成一般谨慎，遗漏题干要求的建议内容。","context":{"mode":"image","asset":"questions","focus":[250,2190,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"34","option":"D"},"focusId":"focus-q34-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-D-0\">\u003cblockquote>\n\u003cp>处理经济问题需要谨慎\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“it requires [xxx] to handle economic issues”，保留了相应遮挡。当时的定位线索是：D的 handle economic issues 谈政策如何处理经济问题，第七段的 policymakers who 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。读完全文后，做题模式再经交叉验证排除D，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>第6段先承认GDP是常见经济活动指标，再指出它不包括环境质量和教育结果等重要因素。第7段紧接着要求把努力重新集中到改善福祉，而不是仅仅担忧GDP数字。\u003c/p>\n\u003cp>如果只采纳D，决策者仍可能非常谨慎地只盯GDP；这恰好没有完成作者的建议。B把GDP之外的因素纳入考虑，能够直接回应最后两段所列出的遗漏与行动方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u0
