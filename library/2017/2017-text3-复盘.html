itle for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. GDP Figures, a Window on Global Economic Health\u003c/h3>\n\u003cp>GDP数字，观察全球经济健康的窗口\u003c/p>\n\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>GDP数字，观察全球经济健康的窗口\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以一段关于GDP的引语提出它为什么能成为观察全球经济健康的窗口。\u003c/td>\n\u003ctd>先说一句话带出的疑问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>用经济数字与公众感受的反差，追问GDP应怎样解读才能看清经济状况。\u003c/td>\n\u003ctd>再把眼前的反差拿来追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>拿跨国调查解释GDP数据与经济健康之间可以观察到的关系。\u003c/td>\n\u003ctd>接着拿一项调查作解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>比较几种国家的GDP走势与经济运行，展示这个窗口的不同读法。\u003c/td>\n\u003ctd>然后换几种情况放在一起看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>提醒各国认真使用GDP信息来识别全球经济机会和风险。\u003c/td>\n\u003ctd>再把前面的比较变成提醒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到开头说明GDP虽有限，仍怎样为经济健康判断提供核心线索。\u003c/td>\n\u003ctd>接着回到开头说清真正的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>提出把政策分析力量投向更充分地使用GDP窗口，监测全球经济变化。\u003c/td>\n\u003ctd>最后说应该把力气放在哪里\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D把GDP写成观察Global Economic Health的窗口，整篇若照此发展，应该不断验证GDP作为观察工具的有效性。实际第二段追问好看数字为何解释不了人的选择，第三段用GDP以外的四十多组标准补充，第六段明说no longer enough。它们并不是在展示GDP这一窗口有多可靠。\u003c/p>\n\u003cp>经济活动的多少与人的福祉不是相同对象。原文承认GDP常用于测量经济活动，但正因为文章需要看健康、教育等被它漏掉的东西，才展开后面分析。D保留了一个高频名词，却削掉了作者对该名词适用范围的质疑，也漏掉英国教训和福祉方向。\u003c/p>\n\u003cp>一篇反复说明GDP不够的文章，能否概括成赞示GDP数字观察整体健康的功能？\u003c/p>\n\u003cp>不能。D把受检验的尺度写成足够的观察依据，整体方向不合，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>35题结论\u003c/h3>\n\u003cp>\u003cstrong>35. C. High GDP But Inadequate Well-being, a UK Lesson\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>High GDP But Inadequate Well-being, a UK Lesson / 高GDP却福祉不足，英国的一课\u003c/strong>\u003c/p>\n\u003ch2>31题\u003c/h2>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy is cited because he ______.\u003cbr>引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>引语作用题。题干要求判断“引用罗伯特·F.肯尼迪，是因为他怎样看待GDP？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003cp>The question of GDP and its usefulness has annoyed policymakers for over half a century. Many argue that it is a flawed concept. It measures things that do not matter and misses things that do. By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003cp>肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。\u003c/p>\n\u003ch3>A. praised the UK for its GDP\u003c/h3>\n\u003cblockquote>\n\u003cp>赞扬英国的国内生产总值\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 praised the UK 把肯尼迪的评价限定到英国，第一段的 a country’s GDP 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>a country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 praised the UK 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。\u003c/p>\n\u003cp>A把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用肯尼迪，是因为他赞扬英国的国内生产总值。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 praised the UK 把肯尼迪的评价限定到英国，第一段的 a country’s GDP 却是他引语中的对象，所以回看引语，再看Britain在什么位置才出现。\u003c/p>\n\u003cp>a country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。A的 praised the UK 不仅把引语对象收窄为英国，还把肯尼迪对衡量范围的质疑改成了表扬。everything后面的except不能跳过：它恰好指出GDP漏掉了使生活值得过的东西。\u003c/p>\n\u003cp>第二段的低失业率和高增长也不能倒灌给肯尼迪。那是作者讨论英国现状时摆出的数字，与前面引用某人的话不是同一层叙述。看到全文前两段都提GDP，就把英国的数字表现归到肯尼迪名下，会同时读错说话人和态度。\u003c/p>\n\u003cp>引语既没有专指英国，也没有赞美GDP，而是在指出它未能衡量的重要内容。\u003c/p>\n\u003cp>A把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003cp>肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Kennedy praised the United Kingdom for its outstanding GDP figures.\u003c/p>\n\u003cp>肯尼迪因英国出色的GDP数字而赞扬英国。\u003c/p>\n\u003c/blockquote>\n\u003cp>引语并未提到英国，英国是作者稍后带入的现实背景；要赞扬英国需由肯尼迪本人评价该国数据，不能把两个叙述层拼成一人发言。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>高GDP与幸福不足的反差要求从对GDP指标局限的批评起笔。引用此人是引入问题，不是认定他否定一切经济活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>praised the UK for its GDP\u003cbr>赞扬英国的国内生产总值\u003c/p>\n\u003c/blockquote>\n\u003cp>A把作者后来谈的英国现状移给了肯尼迪，又反转了引语的评价方向。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. identified GDP with happiness\u003c/h3>\n\u003cblockquote>\n\u003cp>把国内生产总值等同于幸福\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 identified GDP with happiness 说两者等同，第一段的 except that which makes life worthwhile 则直接限定GDP没有量到什么，因此回看except这个转折点后面的内容。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>except that which makes life worthwhile 不是给GDP增加一项功能，而是从everything里面划出一个例外：让生活值得过的东西不在GDP的衡量之中。B的 identified GDP with happiness 却把二者说成同一回事，方向正好相反。\u003c/p>\n\u003cp>不要只读everything，再看到life就认为GDP与幸福有关，因此B也对。真正决定关系的是except。第二段进一步说它衡量不重要的东西，却漏掉重要的东西，仍在强调遗漏，而不是补上一条GDP等于幸福的定义。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用肯尼迪，是因为他把国内生产总值等同于幸福。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 identified GDP with happiness 说两者等同，第一段的 except that which makes life worthwhile 则直接限定GDP没有量到什么，因此回看except这个转折点后面的内容。\u003c/p>\n\u003cp>except that which makes life worthwhile 不是给GDP增加一项功能，而是从everything里面划出一个例外：让生活值得过的东西不在GDP的衡量之中。B的 identified GDP with happiness 却把二者说成同一回事，方向正好相反。\u003c/p>\n\u003cp>不要只读everything，再看到life就认为GDP与幸福有关，因此B也对。真正决定关系的是except。第二段进一步说它衡量不重要的东西，却漏掉重要的东西，仍在强调遗漏，而不是补上一条GDP等于幸福的定义。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003cp>肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Kennedy argued that a high GDP was the same thing as a happy life.\u003c/p>\n\u003cp>肯尼迪认为高GDP等同于幸福生活。\u003c/p>\n\u003c/blockquote>\n\u003cp>everything except恰好将GDP与生活价值拉开，假设取消这个排除关系，会使后面的指标质疑失去出发点。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>高GDP与幸福不足的反差要求从对GDP指标局限的批评起笔。引用此人是引入问题，不是认定他否定一切经济活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>identified GDP with happiness\u003cbr>把国内生产总值等同于幸福\u003c/p>\n\u003c/blockquote>\n\u003cp>不要只读everything，再看到life就认为GDP与幸福有关，因此B也对。真正决定关系的是except。第二段进一步说它衡量不重要的东西，却漏掉重要的东西，仍在强调遗漏，而不是补上一条GDP等于幸福的定义。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. misinterpreted the role of GDP\u003c/h3>\n\u003cblockquote>\n\u003cp>误解了国内生产总值的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 misinterpreted the role of GDP 要求作者指出肯尼迪理解有误；第二段的 It measures things that do not matter and misses things that do 继续评价GDP的衡量范围，因此把这句与引语一起看，确认作者是在纠错还是沿着同一问题往下说。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>It measures things that do not matter and misses things that do 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。C的 misinterpreted the role of GDP 则把肯尼迪当成理解错误、需要被纠正的对象。原文后续并没有给他纠错，反而沿着“量到了什么、漏掉了什么”展开问题。\u003c/p>\n\u003cp>“某人批评一个指标”和“作者认为这个人误解指标”不能互换。要使C成立，作者需要指出肯尼迪哪一处说错，再提供相反解释；现在读到的是同向补充。这里不能把被批评的GDP换成正在被批评的肯尼迪。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It measures things that do not matter and misses things that do.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用肯尼迪，是因为他误解了国内生产总值的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 misinterpreted the role of GDP 要求作者指出肯尼迪理解有误；第二段的 It measures things that do not matter and misses things that do 继续评价GDP的衡量范围，因此把这句与引语一起看，确认作者是在纠错还是沿着同一问题往下说。\u003c/p>\n\u003cp>It measures things that do not matter and misses things that do 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。C的 misinterpreted the role of GDP 则把肯尼迪当成理解错误、需要被纠正的对象。原文后续并没有给他纠错，反而沿着“量到了什么、漏掉了什么”展开问题。\u003c/p>\n\u003cp>“某人批评一个指标”和“作者认为这个人误解指标”不能互换。要使C成立，作者需要指出肯尼迪哪一处说错，再提供相反解释；现在读到的是同向补充。这里不能把被批评的GDP换成正在被批评的肯尼迪。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It measures things that do not matter and misses things that do.\u003c/p>\n\u003cp>肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Kennedy misunderstood GDP, and the author corrects his mistake.\u003c/p>\n\u003cp>肯尼迪误解了GDP，而作者纠正了他的错误。\u003c/p>\n\u003c/blockquote>\n\u003cp>若在纠正误解，后文应恢复GDP作为充分尺度的合理性。作者却接着列它遗漏的事物，与肯尼迪的批评同向。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>高GDP与幸福不足的反差要求从对GDP指标局限的批评起笔。引用此人是引入问题，不是认定他否定一切经济活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>misinterpreted the role of GDP\u003cbr>误解了国内生产总值的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>“某人批评一个指标”和“作者认为这个人误解指标”不能互换。要使C成立，作者需要指出肯尼迪哪一处说错，再提供相反解释；现在读到的是同向补充。这里不能把被批评的GDP换成正在被批评的肯尼迪。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. had a low opinion of GDP\u003c/h3>\n\u003cblockquote>\n\u003cp>对国内生产总值评价不高\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“had a [xxx] opinion of GDP”，保留了相应遮挡。当时的定位线索是：D的 opinion of GDP 指肯尼迪对GDP的看法，第一段的 everything except 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。everything except 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。\u003c/p>\n\u003cp>except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用肯尼迪，是因为他对国内生产总值评价不高。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 opinion of GDP 指肯尼迪对GDP的看法，第一段的 everything except 正是他评价GDP的关键表达，因此回看except之后到底排除了什么。\u003c/p>\n\u003cp>opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。everything except 又把“使生活值得过的内容”放到GDP没有衡量的那一边，这使引语明显不是无条件称赞，而是在批评它的不足。\u003c/p>\n\u003cp>不过其他三项分别增加英国这个对象、把排除关系写成等同、把肯尼迪改成被纠错的人，都已与引语及接下来的叙述不合。D保留了真正正在发生的事情：作者引用一个人对GDP的评价。\u003c/p>\n\u003cp>except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Robert F. Kennedy once said that a country&#39;s GDP measures &quot;everything except that which makes life worthwhile.&quot; With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.\u003c/p>\n\u003cp>肯尼迪指出GDP漏掉让生活值得过的事物，作者借英国脱欧与经济预测重提GDP衡量成功的局限。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Kennedy regarded GDP as an inadequate measure of what makes life worthwhile.\u003c/p>\n\u003cp>肯尼迪认为GDP不足以衡量使生活值得过的东西。\u003c/p>\n\u003c/blockquote>\n\u003cp>评价不高具体指衡量生活意义的能力有限，不是GDP没有任何用途。后文以福祉指标继续展开这一限度。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>高GDP与幸福不足的反差要求从对GDP指标局限的批评起笔。引用此人是引入问题，不是认定他否定一切经济活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>had a low opinion of GDP\u003cbr>对国内生产总值评价不高\u003c/p>\n\u003c/blockquote>\n\u003cp>except指出衡量上的遗漏，评价对象就是GDP，人物也没有换掉。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：借肯尼迪指出GDP漏掉使生活值得过的内容，再以英国脱欧与增长预测引出重看这一说法。对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>31题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>31. D. had a low opinion of GDP\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：a country’s GDP 是泛指一个国家的GDP；Britain在引语结束后的作者叙述中才出现。\u003c/p>\n\u003cp>B：except that which makes life worthwhile 不是给GDP增加一项功能，而是从everything里面划出一个例外：让生活值得过的东西不在GDP的衡量之中。\u003c/p>\n\u003cp>C：It measures things that do not matter and misses things that do 与引语的except方向一致：两处都指出GDP会漏掉重要的生活内容。\u003c/p>\n\u003cp>D：opinion of GDP 在人物与评价对象上都接得上：说话人是肯尼迪，所评价的是GDP。\u003c/p>\n\u003ch2>32题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be inferred from Paragraph 2 that ______.\u003cbr>从第二段可以推知什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部推断题。题干要求判断“从第二段可以推知什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The question of GDP and its usefulness has annoyed policymakers for over half a century. Many argue that it is a flawed concept. It measures things that do not matter and misses things that do. By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures. If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n\u003ch3>A. GDP as the measure of success is widely defied in the UK\u003c/h3>\n\u003cblockquote>\n\u003cp>将国内生产总值作为成功尺度在英国受到广泛质疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\u003c/p>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures.\u003c/p>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段表明，将国内生产总值作为成功尺度在英国受到广泛质疑。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 widely defied in the UK 涉及英国人对一种成功判断的不接受，第二段的 over 17 million people vote for Brexit 给出大规模选择，因此回看这项选择与前面高增长数字之间的反问关系。\u003c/p>\n\u003cp>作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。这个反问使数字所展示的成功，与大量人的实际选择发生冲突。A的 widely defied in the UK 是在概括这种冲突，而不是说所有人都公开讨论过GDP统计方法。\u003c/p>\n\u003cp>widely可以由一千七百多万人的规模得到支撑；被质疑的是GDP“作为成功尺度”，不是GDP数字必然造假，也不是所有经济活动都不重要。把A的限定读全，它与反问关注的“为什么数字好却不能代表大家认可现状”能够接上。\u003c/p>\n\u003cp>反问的力量正在于按GDP看似成功，却不能解释如此广泛的不满或不同选择。\u003c/p>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>By most recent measures, the UK&#39;s GDP has been the envy of the Western world, with record low unemployment and high growth figures.\u003c/p>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Many people in Britain question whether GDP alone represents national success.\u003c/p>\n\u003cp>英国许多人质疑单凭GDP能否代表国家成功。\u003c/p>\n\u003c/blockquote>\n\u003cp>many argue提供广泛质疑，经济数据与投票反差使质疑落到英国案例。这里不是说全国所有人都拒绝统计GDP。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国案例警示GDP不足以单独度量成功，本题应回答对这一尺度的质疑；不能把质疑指标直接变成决策者已减少使用它。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>GDP as the measure of success is widely defied in the UK\u003cbr>将国内生产总值作为成功尺度在英国受到广泛质疑\u003c/p>\n\u003c/blockquote>\n\u003cp>A保留的是指标作为成功尺度的有效性问题，并没有说英国人废除了GDP。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. policymakers in the UK are paying less attention to GDP\u003c/h3>\n\u003cblockquote>\n\u003cp>英国决策者正减少对国内生产总值的关注\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 paying less attention to GDP 是关注程度随时间下降，原文的 for over half a century 却是在交代GDP有用性问题持续了多久，因此回看带policymakers的首句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>for over half a century 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。B的 paying less attention to GDP 却要求有越来越少关注的变化。持续争论GDP有没有用，与已经减少注意力，是两种不同的事情。\u003c/p>\n\u003cp>争论持续的时间不是关注减少的趋势，原文也没有给出前后关注程度的对照。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The question of GDP and its usefulness has annoyed policymakers for over half a century.\u003c/p>\n\u003cp>Many argue that it is a flawed concept.\u003c/p>\n\u003cp>It measures things that do not matter and misses things that do.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段表明，英国决策者正减少对国内生产总值的关注。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 paying less attention to GDP 是关注程度随时间下降，原文的 for over half a century 却是在交代GDP有用性问题持续了多久，因此回看带policymakers的首句。\u003c/p>\n\u003cp>for over half a century 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。B的 paying less attention to GDP 却要求有越来越少关注的变化。持续争论GDP有没有用，与已经减少注意力，是两种不同的事情。\u003c/p>\n\u003cp>Many argue的主体还是many，没有把所有议论者都限定成英国政策制定者。下文介绍英国的高增长与脱欧选择，也是在说明GDP难以解释现状，并不等于政府机构减少了对它的关注。B同时补上特定主体和注意力变化，超出了该段所写的争论。\u003c/p>\n\u003cp>争论持续的时间不是关注减少的趋势，原文也没有给出前后关注程度的对照。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The question of GDP and its usefulness has annoyed policymakers for over half a century.\u003c/p>\n\u003cp>Many argue that it is a flawed concept.\u003c/p>\n\u003cp>It measures things that do not matter and misses things that do.\u003c/p>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>British policymakers have already reduced the attention they give to GDP.\u003c/p>\n\u003cp>英国政策制定者已经降低了对GDP的关注。\u003c/p>\n\u003c/blockquote>\n\u003cp>annoyed说明争论长期困扰决策者，不报告其注意力已经下降。后文仍要建议重新聚焦福祉，可见不能把建议提前改成已完成的政策变化。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国案例警示GDP不足以单独度量成功，本题应回答对这一尺度的质疑；不能把质疑指标直接变成决策者已减少使用它。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>policymakers in the UK are paying less attention to GDP\u003cbr>英国决策者正减少对国内生产总值的关注\u003c/p>\n\u003c/blockquote>\n\u003cp>争论持续的时间不是关注减少的趋势，原文也没有给出前后关注程度的对照。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the UK will contribute less to the world economy\u003c/h3>\n\u003cblockquote>\n\u003cp>英国对世界经济的贡献将减少\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 world economy 把判断放在全球，第二段的 their country’s economic prospects 说的却是英国自己的经济前景，因此回看反问句末尾的警告对象与表达程度。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>their country’s economic prospects 是这个国家自身的前景，不是它在 world economy 中贡献了多少。C还用了will contribute less，把一个关于可能影响的警告改成未来贡献一定减少的结论。原文用what it could do，并没有给出这项确定预测，更没有计算英国在世界经济中的份额。\u003c/p>\n\u003cp>这句话的作用是让漂亮的国内经济数字与大量投票者的选择相碰撞，追问GDP衡量出了什么。不能把提到经济警告的背景，抽出来改写成全文未提供的国际经济结论。英国经济变化和英国对全球的贡献，即使有关联，也需要另外的论证。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段表明，英国对世界经济的贡献将减少。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 world economy 把判断放在全球，第二段的 their country’s economic prospects 说的却是英国自己的经济前景，因此回看反问句末尾的警告对象与表达程度。\u003c/p>\n\u003cp>their country’s economic prospects 是这个国家自身的前景，不是它在 world economy 中贡献了多少。C还用了will contribute less，把一个关于可能影响的警告改成未来贡献一定减少的结论。原文用what it could do，并没有给出这项确定预测，更没有计算英国在世界经济中的份额。\u003c/p>\n\u003cp>这句话的作用是让漂亮的国内经济数字与大量投票者的选择相碰撞，追问GDP衡量出了什么。不能把提到经济警告的背景，抽出来改写成全文未提供的国际经济结论。英国经济变化和英国对全球的贡献，即使有关联，也需要另外的论证。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Britain will account for a smaller share of the world economy.\u003c/p>\n\u003cp>英国占世界经济的份额将变小。\u003c/p>\n\u003c/blockquote>\n\u003cp>国内GDP预计放缓不自动说明其世界占比下降；还需要其他经济体的相对变化，第二段没有这样的全球贡献比较。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国案例警示GDP不足以单独度量成功，本题应回答对这一尺度的质疑；不能把质疑指标直接变成决策者已减少使用它。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the UK will contribute less to the world economy\u003cbr>英国对世界经济的贡献将减少\u003c/p>\n\u003c/blockquote>\n\u003cp>这句话的作用是让漂亮的国内经济数字与大量投票者的选择相碰撞，追问GDP衡量出了什么。不能把提到经济警告的背景，抽出来改写成全文未提供的国际经济结论。英国经济变化和英国对全球的贡献，即使有关联，也需要另外的论证。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. the UK is reluctant to remold its economic pattern\u003c/h3>\n\u003cblockquote>\n\u003cp>英国不愿重塑经济模式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“the UK is reluctant to [xxx] its economic pattern”，保留了相应遮挡。当时的定位线索是：D的 is reluctant to 说国家不愿采取某个动作，第二段的 vote for Brexit 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>vote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 is reluctant to 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。\u003c/p>\n\u003cp>反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段表明，英国不愿重塑经济模式。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 is reluctant to 说国家不愿采取某个动作，第二段的 vote for Brexit 则是大量人的具体选择，因此回到反问句，看原文是否把这种选择解释成英国对经济模式的意愿。\u003c/p>\n\u003cp>vote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。D的 is reluctant to 则给整个英国添加不愿意的心理判断，动作对象还是its economic pattern。原文没有交代某项经济模式调整建议，也没有说英国拒绝执行它。\u003c/p>\n\u003cp>它们并不是反问句中的投票者、投票行为与经济前景。不能把一个群体作了某种选择，直接写成国家不愿对经济模式做事。\u003c/p>\n\u003cp>反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country&#39;s economic prospects?\u003c/p>\n\u003cp>作者先写many认为GDP有缺陷，再以英国漂亮数据与大量脱欧投票形成反差，追问它为何不能代表民众感受。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Britain refuses to change its economic model.\u003c/p>\n\u003cp>英国拒绝改变其经济模式。\u003c/p>\n\u003c/blockquote>\n\u003cp>对GDP尺度的争议不同于拒绝经济结构改革。原文没有说明英国被要求怎样重塑模式或怎样拒绝。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国案例警示GDP不足以单独度量成功，本题应回答对这一尺度的质疑；不能把质疑指标直接变成决策者已减少使用它。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the UK is reluctant to remold its economic pattern\u003cbr>英国不愿重塑经济模式\u003c/p>\n\u003c/blockquote>\n\u003cp>反问没有给出这种意愿解释，也没有提出D所说的经济模式行动。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照低失业率、高增长与大量人的脱欧选择，追问这些数字是否足以显示成功。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>32题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>32. A. GDP as the measure of success is widely defied in the UK\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：作者先摆record low unemployment与high growth figures，再用If everything was going so well追问：既然按这些指标一切很好，为什么还有 over 17 million people vote for Brexit。\u003c/p>\n\u003cp>B：for over half a century 表示这个问题延续了很久，不是对“以前关注多少、现在关注多少”的比较。\u003c/p>\n\u003cp>C：their country’s economic prospects 是这个国家自身的前景，不是它在 world economy 中贡献了多少。\u003c/p>\n\u003cp>D：vote for Brexit 指投票者的政治选择，作者拿它与好看的增长数字对照。\u003c/p>\n\u003ch2>33题\u003c/h2>\n\u003cblockquote>\n\u003cp>Which of the following is true about the recent annual study?\u003cbr>关于最近的年度研究，下列哪一项正确？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>具体细节题。题干要求判断“关于最近的年度研究，下列哪一项正确？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question. Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens. Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003cp>While all of these countries face their own challenges, there are a number of consistent themes. Yes, there has been a budding economic recovery since the 2008 global crash, but in key indicators in areas such as health and education, major economies have continued to decline. Yet this isn&#39;t the case with all countries. Some relatively poor European countries have seen huge improvements across measures including civil society, income equality and the environment.\u003c/p>\n\u003c/blockquote>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n\u003ch3>A. It excludes GDP as an indicator.\u003c/h3>\n\u003cblockquote>\n\u003cp>它排除了国内生产总值这一指标\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于这项年度研究，正确说法是：它排除了国内生产总值这一指标。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 excludes GDP 与第三段的 Rather than just focusing on GDP 都涉及研究怎样对待GDP，因此回看just这个限定，再看后面增加了哪些标准。\u003c/p>\n\u003cp>Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。A的 excludes GDP 却把否定范围移成GDP本身，意思变成完全不把它作为指标。增加健康、教育等维度，并不等于原有GDP从研究中被删除。\u003c/p>\n\u003cp>段首还说研究各国把增长转成福祉的能力，经济增长与福祉都在讨论中。研究不是把增长赶出视野，而是问增长有没有带来人的改善。A看到了rather than，却漏了just，于是把不再局限于一个指标误写成彻底排除这个指标。\u003c/p>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The study entirely excludes GDP from its indicators.\u003c/p>\n\u003cp>该研究把GDP完全排除在指标之外。\u003c/p>\n\u003c/blockquote>\n\u003cp>rather than just focusing on意味着不只看GDP，仍可保留GDP再加入其他标准；假设把补充扩大成完全删除。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题中的英国教训需要更完整的衡量方法来揭示，因此题干应回答研究怎样帮助理解反差；研究覆盖多少国家不等于由谁出资。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>It excludes GDP as an indicator.\u003cbr>它排除了国内生产总值这一指标\u003c/p>\n\u003c/blockquote>\n\u003cp>just限定的是关注范围单一，删去just才会变成对GDP本身的排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. It is sponsored by 163 countries.\u003c/h3>\n\u003cblockquote>\n\u003cp>它由163个国家资助\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 sponsored by 163 countries 与第三段的 the 163 countries measured 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>the 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 sponsored by 163 countries 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。\u003c/p>\n\u003cp>被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于这项年度研究，正确说法是：它由163个国家资助。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 sponsored by 163 countries 与第三段的 the 163 countries measured 用了同一个数目，因此回到measured，确认这163个国家在研究中承担的是什么角色。\u003c/p>\n\u003cp>the 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。B的 sponsored by 163 countries 却把这些对象变成了资助者，角色变了。一个国家被纳入研究，不意味着它为这项研究付钱。\u003c/p>\n\u003cp>Across之后比较英国在这些国家中的表现，也进一步说明163是样本覆盖范围：作者在一个国家集合中作横向比较。原段没有说资金从哪里来、谁委托了研究、哪些国家共同组织。不能因为数目完全相同，就忽略数目前后的动作不同。\u003c/p>\n\u003cp>被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.\u003c/p>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The study is funded by all 163 countries that it examines.\u003c/p>\n\u003cp>该研究由它考察的全部163个国家资助。\u003c/p>\n\u003c/blockquote>\n\u003cp>163 countries measured是研究对象数，不是资助者名单。需要额外财务来源信息才能写sponsored by。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题中的英国教训需要更完整的衡量方法来揭示，因此题干应回答研究怎样帮助理解反差；研究覆盖多少国家不等于由谁出资。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>It is sponsored by 163 countries.\u003cbr>它由163个国家资助\u003c/p>\n\u003c/blockquote>\n\u003cp>被研究的一方与出资的一方属于不同角色，measured不能换成sponsored by。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. Its criteria are questionable.\u003c/h3>\n\u003cblockquote>\n\u003cp>它的评价标准值得怀疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 criteria are questionable 评价研究标准不可靠，第三段的 sheds some light on that question 则说明研究对前面疑问的作用，因此把段首评价与段末列标准的部分一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>sheds some light on that question 说这项研究帮助解释了前面的问题。C的 criteria are questionable 却把怀疑落到研究的标准上。作者确实正在追问GDP作为尺度是否足够，但那不能自动变成“新研究采用的健康、教育等标准也可疑”。\u003c/p>\n\u003cp>后半段是在说明研究扩展了哪些衡量项目，并没有逐项指出它们存在错误，也没有否定这些项目所得到的解释。把一个旧衡量方法受到质疑，与用于回答该质疑的新研究混在一起，便会把批评对象转错。这里作者借研究帮助理解英国表现，而不是接着拆穿这项研究。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.\u003c/p>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于这项年度研究，正确说法是：它的评价标准值得怀疑。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 criteria are questionable 评价研究标准不可靠，第三段的 sheds some light on that question 则说明研究对前面疑问的作用，因此把段首评价与段末列标准的部分一起看。\u003c/p>\n\u003cp>sheds some light on that question 说这项研究帮助解释了前面的问题。C的 criteria are questionable 却把怀疑落到研究的标准上。作者确实正在追问GDP作为尺度是否足够，但那不能自动变成“新研究采用的健康、教育等标准也可疑”。\u003c/p>\n\u003cp>后半段是在说明研究扩展了哪些衡量项目，并没有逐项指出它们存在错误，也没有否定这些项目所得到的解释。把一个旧衡量方法受到质疑，与用于回答该质疑的新研究混在一起，便会把批评对象转错。这里作者借研究帮助理解英国表现，而不是接着拆穿这项研究。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.\u003c/p>\n\u003cp>Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.\u003c/p>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The study uses unreliable criteria, so its conclusions should be doubted.\u003c/p>\n\u003cp>该研究采用不可靠的标准，因此其结论应受到怀疑。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际用rounded assessment肯定评价更全面，并据研究继续给富国提教训；没有质疑标准可靠性的转折。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题中的英国教训需要更完整的衡量方法来揭示，因此题干应回答研究怎样帮助理解反差；研究覆盖多少国家不等于由谁出资。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Its criteria are questionable.\u003cbr>它的评价标准值得怀疑\u003c/p>\n\u003c/blockquote>\n\u003cp>后半段是在说明研究扩展了哪些衡量项目，并没有逐项指出它们存在错误，也没有否定这些项目所得到的解释。把一个旧衡量方法受到质疑，与用于回答该质疑的新研究混在一起，便会把批评对象转错。这里作者借研究帮助理解英国表现，而不是接着拆穿这项研究。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. Its results are enlightening.\u003c/h3>\n\u003cblockquote>\n\u003cp>它的结果具有启发性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“Its results are [xxx].”，保留了相应遮挡。当时的定位线索是：D的 Its results 指研究发现，第三段的 sheds some light on that question 直接说研究能帮助理解前面的疑问，因此回看首句，再看英国的表现这一具体发现。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>Its results 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。\u003c/p>\n\u003cp>首句直接写sheds some light，随后用英国的具体表现展开这个解释。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.\u003c/p>\n\u003cp>Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于这项年度研究，正确说法是：它的结果具有启发性。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 Its results 指研究发现，第三段的 sheds some light on that question 直接说研究能帮助理解前面的疑问，因此回看首句，再看英国的表现这一具体发现。\u003c/p>\n\u003cp>Its results 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。\u003c/p>\n\u003cp>但是它至少没有说研究删除GDP、由样本国家资助或标准被否定。结合已经读到的研究用途，D是保留下来的对结果性质的概括。这里先理解结果在段落中帮助回答了什么，再决定它有没有与其余三项同样的对象错误。\u003c/p>\n\u003cp>首句直接写sheds some light，随后用英国的具体表现展开这个解释。\u003c/p>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n\u003cp>enlightening概括sheds some light：它揭示增长转为福祉的效率问题，后面的富国与较穷国家对照继续说明这一启发。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.\u003c/p>\n\u003cp>Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.\u003c/p>\n\u003cp>研究衡量各国将增长转化为福祉的能力，加入健康、教育等40多套标准，解释英国增长与公民实际改善脱节。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The study sheds light on why growth has not always improved citizens’ lives.\u003c/p>\n\u003cp>该研究阐明了为什么增长并不总能改善公民生活。\u003c/p>\n\u003c/blockquote>\n\u003cp>enlightening概括sheds some light：它揭示增长转为福祉的效率问题，后面的富国与较穷国家对照继续说明这一启发。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题中的英国教训需要更完整的衡量方法来揭示，因此题干应回答研究怎样帮助理解反差；研究覆盖多少国家不等于由谁出资。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Its results are enlightening.\u003cbr>它的结果具有启发性\u003c/p>\n\u003c/blockquote>\n\u003cp>首句直接写sheds some light，随后用英国的具体表现展开这个解释。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引入增长转福祉的年度研究，说明英国在公民改善方面表现靠后，并列GDP以外的衡量标准。把主要经济体与一些较穷欧洲国家在健康、教育、公民社会等方面的表现放在一起比较。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>33题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>33. D. Its results are enlightening.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：Rather than just focusing on GDP 否定的是just focusing，即“只关注GDP”。\u003c/p>\n\u003cp>B：the 163 countries measured 是“被衡量的163个国家”，measured修饰countries，说明它们是研究对象。\u003c/p>\n\u003cp>C：sheds some light on that question 说这项研究帮助解释了前面的问题。\u003c/p>\n\u003cp>D：Its results 可以接到后面英国在增长转化为公民改善方面表现靠后的发现。\u003c/p>\n\u003ch2>34题\u003c/h2>\n\u003cblockquote>\n\u003cp>In the last two paragraphs, the author suggests that ______.\u003cbr>在最后两段，作者提出什么建议？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者建议题。题干要求判断“在最后两段，作者提出什么建议？”，先按第6、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>So, what Kennedy was referring to was that while GDP has been the most common method for measuring the economic activity of nations, as a measure, it is no longer enough. It does not include important factors such as environmental quality or education outcomes – all things that contribute to a person&#39;s sense of well-being.\u003c/p>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth. But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\u003c/p>\n\u003c/blockquote>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n\u003ch3>A. the UK is preparing for an economic boom\u003c/h3>\n\u003cblockquote>\n\u003cp>英国正为经济繁荣作准备\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 an economic boom 指经济繁荣，第七段的 a decline in the everyday services 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文先说增长受打击，可能造成 a decline in the everyday services，与出现 an economic boom 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。\u003c/p>\n\u003cp>原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最后两段中作者建议：英国正为经济繁荣作准备。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 an economic boom 指经济繁荣，第七段的 a decline in the everyday services 却是增长受打击可能引出的后果，因此回看这一预测与后面may even see progress分别属于哪一层。\u003c/p>\n\u003cp>原文先说增长受打击，可能造成 a decline in the everyday services，与出现 an economic boom 的方向相反。后一句的may even see progress也不是已发生的繁荣：它在But后的政策选择下，表达可能取得进步，且进步围绕improving well-being。\u003c/p>\n\u003cp>A还加了is preparing for，要求英国已经在为繁荣准备。原文只是提出政策制定者可以怎样用力，并没有报道英国正在开展一套迎接繁荣的行动。不能把一种有条件的可能改善，扩大成国家正在准备的经济繁荣。\u003c/p>\n\u003cp>原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Britain is preparing for a period of rapid economic expansion.\u003c/p>\n\u003cp>英国正为一段快速经济扩张时期作准备。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际预期是sharp hit to growth，建议意在避免坏结果，不是宣布繁荣准备已经开始。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国教训指向衡量与行动的扩展。本题应说需要兼顾GDP以外的生活因素，而不能将坏预期泛化成谨慎处理一切经济事务。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the UK is preparing for an economic boom\u003cbr>英国正为经济繁荣作准备\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的背景是增长风险，改善是有条件的可能结果，A却把两者改成正在准备的繁荣。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. it is essential to consider factors beyond GDP\u003c/h3>\n\u003cblockquote>\n\u003cp>考虑国内生产总值以外的因素至关重要\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“it is [xxx] to consider factors beyond GDP”，保留了相应遮挡。当时的定位线索是：B的 factors beyond GDP 与第六段的 It does not include important factors 正好涉及被GDP遗漏的因素，因此回看作者先说够不够，再列遗漏内容的这两句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>factors beyond GDP 可以接到 It does not include important factors：这些是GDP没有涵盖，却又影响幸福感的东西。作者还明确说it is no longer enough，先否定“GDP已经够用”，再解释为什么不够。B的动作consider，至少与作者把这些遗漏因素重新放进讨论相容。\u003c/p>\n\u003cp>不能因为作者说重要，就直接替它填一个熟悉形容词。现在B的对象和动作很贴近第六段；D又可能概括第七段政策怎样处理问题，两个层面还要分清。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It does not include important factors such as environmental quality or education outcomes – all things that contribute to a person&#39;s sense of well-being.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最后两段中作者建议：考虑国内生产总值以外的因素至关重要。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 factors beyond GDP 与第六段的 It does not include important factors 正好涉及被GDP遗漏的因素，因此回看作者先说够不够，再列遗漏内容的这两句。\u003c/p>\n\u003cp>factors beyond GDP 可以接到 It does not include important factors：这些是GDP没有涵盖，却又影响幸福感的东西。作者还明确说it is no longer enough，先否定“GDP已经够用”，再解释为什么不够。B的动作consider，至少与作者把这些遗漏因素重新放进讨论相容。\u003c/p>\n\u003cp>不能因为作者说重要，就直接替它填一个熟悉形容词。现在B的对象和动作很贴近第六段；D又可能概括第七段政策怎样处理问题，两个层面还要分清。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It does not include important factors such as environmental quality or education outcomes – all things that contribute to a person&#39;s sense of well-being.\u003c/p>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Policymakers must consider education, environmental quality and other sources of well-being beyond GDP.\u003c/p>\n\u003cp>政策制定者必须考虑GDP之外的教育、环境质量和其他福祉来源。\u003c/p>\n\u003c/blockquote>\n\u003cp>GDP不够与转向福祉构成前后两步：先补足评价对象，再调整行动重点，essential概括其必要性。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国教训指向衡量与行动的扩展。本题应说需要兼顾GDP以外的生活因素，而不能将坏预期泛化成谨慎处理一切经济事务。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it is essential to consider factors beyond GDP\u003cbr>考虑国内生产总值以外的因素至关重要\u003c/p>\n\u003c/blockquote>\n\u003cp>不能因为作者说重要，就直接替它填一个熟悉形容词。现在B的对象和动作很贴近第六段；D又可能概括第七段政策怎样处理问题，两个层面还要分清。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. high GDP foreshadows an economic decline\u003c/h3>\n\u003cblockquote>\n\u003cp>高国内生产总值预示经济衰退\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 high GDP foreshadows 把高GDP当作未来下滑的信号，第七段的 hit to growth 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>hit to growth 是增长受到打击，后面could lead to接日常服务下降。C的 high GDP foreshadows 却让高GDP成为预示经济下滑的信号，主语、所接结果和关系都被改动。高增长数字未必反映生活很好，与高GDP会预示增长下滑，是两个不同判断。\u003c/p>\n\u003cp>原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最后两段中作者建议：高国内生产总值预示经济衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 high GDP foreshadows 把高GDP当作未来下滑的信号，第七段的 hit to growth 才是原文放在因果链前端的东西，因此回看究竟什么引出日常服务可能下降。\u003c/p>\n\u003cp>hit to growth 是增长受到打击，后面could lead to接日常服务下降。C的 high GDP foreshadows 却让高GDP成为预示经济下滑的信号，主语、所接结果和关系都被改动。高增长数字未必反映生活很好，与高GDP会预示增长下滑，是两个不同判断。\u003c/p>\n\u003cp>第六段说的是GDP作为衡量不够，因为没有包括影响福祉的重要因素；它并没有说GDP一高，经济就会开始走低。把“衡量不到生活质量”误读成“能够预报经济衰退”，恰好给GDP添上了原文从未给出的预测作用。\u003c/p>\n\u003cp>原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.\u003c/p>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>A high level of GDP predicts that an economic decline will follow.\u003c/p>\n\u003cp>高GDP预示随后会出现经济衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者说增长将受冲击，又说GDP不足以衡量幸福，没有建立高GDP导致或预示衰退的关系。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国教训指向衡量与行动的扩展。本题应说需要兼顾GDP以外的生活因素，而不能将坏预期泛化成谨慎处理一切经济事务。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>high GDP foreshadows an economic decline\u003cbr>高国内生产总值预示经济衰退\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的因果起点不是高GDP，也没有建立这种高低反转的预测关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. it requires caution to handle economic issues\u003c/h3>\n\u003cblockquote>\n\u003cp>处理经济问题需要谨慎\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“it requires [xxx] to handle economic issues”，保留了相应遮挡。当时的定位线索是：D的 handle economic issues 谈政策如何处理经济问题，第七段的 policymakers who 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。读完全文后，做题模式再经交叉验证排除D，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>第6段先承认GDP是常见经济活动指标，再指出它不包括环境质量和教育结果等重要因素。第7段紧接着要求把努力重新集中到改善福祉，而不是仅仅担忧GDP数字。\u003c/p>\n\u003cp>如果只采纳D，决策者仍可能非常谨慎地只盯GDP；这恰好没有完成作者的建议。B把GDP之外的因素纳入考虑，能够直接回应最后两段所列出的遗漏与行动方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最后两段中作者建议：处理经济问题需要谨慎。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 handle economic issues 谈政策如何处理经济问题，第七段的 policymakers who 引出政策制定者的做法，因此回看这些人把努力放向什么，以及这种做法可能有什么结果。\u003c/p>\n\u003cp>第6段先承认GDP是常见经济活动指标，再指出它不包括环境质量和教育结果等重要因素。第7段紧接着要求把努力重新集中到改善福祉，而不是仅仅担忧GDP数字。\u003c/p>\n\u003cp>D的cautious on economic issues只说处理经济问题要谨慎，可以与很多经济评论相容，却没有交代这篇文章究竟要求把什么放进评价。作者要的不是笼统小心，而是扩展指标和政策目标。\u003c/p>\n\u003cp>如果只采纳D，决策者仍可能非常谨慎地只盯GDP；这恰好没有完成作者的建议。B把GDP之外的因素纳入考虑，能够直接回应最后两段所列出的遗漏与行动方向。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.\u003c/p>\n\u003cp>倒数第二段列GDP遗漏的环境、教育因素，末段承认增长受挫风险，再建议决策者把努力转向改善福祉。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Policymakers should handle economic issues cautiously.\u003c/p>\n\u003cp>政策制定者应谨慎处理经济问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>谨慎是一种宽泛方式，实际结尾给出具体目标转换：提高福祉，而非只担心GDP。把明确建议降成一般谨慎，遗漏题干要求的建议内容。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>High GDP But Inadequate Well-being, a UK Lesson\u003cbr>高GDP却福祉不足，英国的一课\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>英国教训指向衡量与行动的扩展。本题应说需要兼顾GDP以外的生活因素，而不能将坏预期泛化成谨慎处理一切经济事务。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it requires caution to handle economic issues\u003cbr>处理经济问题需要谨慎\u003c/p>\n\u003c/blockquote>\n\u003cp>如果只采纳D，决策者仍可能非常谨慎地只盯GDP；这恰好没有完成作者的建议。B把GDP之外的因素纳入考虑，能够直接回应最后两段所列出的遗漏与行动方向。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到肯尼迪，明确说GDP作为尺度已经不够，会遗漏影响幸福感的重要因素。说明增长冲击可能影响日常服务，建议把努力放在改善福祉，而不是只担心GDP数字。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>34题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>34. B. it is essential to consider factors beyond GDP\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文先说增长受打击，可能造成 a decline in the everyday services，与出现 an economic boom 的方向相反。\u003c/p>\n\u003cp>B：factors beyond GDP 可以接到 It does not include important factors：这些是GDP没有涵盖，却又影响幸福感的东西。\u003c/p>\n\u003cp>C：hit to growth 是增长受到打击，后面could lead to接日常服务下降。\u003c/p>\n\u003cp>D：第6段先承认GDP是常见经济活动指标，再指出它不包括环境质量和教育结果等重要因素。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：引入主题——GDP的局限性\u003c/strong>（段落1-2） 肯尼迪观点：GDP衡量&quot;除了让生活有价值的东西之外的一切&quot; → 英国脱欧背景：（GDP预计放缓）→ 评估时机 → GDP困扰政策制定者50年：【缺陷：衡量不重要的 + 错过重要的】→ 英国悖论：（GDP表现优异：低失业率+高增长 // 但1700万人投票脱欧）\u003c/p>\n\u003cp>↓（研究发现）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：研究揭示的问题\u003c/strong>（段落3） 年度研究结果：【163国对比：英国是将经济增长转化为民众幸福感表现最差的国家之一】→ 研究方法：（40多套标准：健康+教育+公民社会参与）→ 更全面的评估\u003c/p>\n\u003cp>↓（具体表现）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：国家间的对比\u003c/strong>（段落4） 共同主题：2008年后经济复苏 // 但主要经济体在健康和教育等关键指标上继续下降 → 反例：一些相对贫穷的欧洲国家在多项指标上取得巨大改善（公民社会+收入平等+环境）\u003c/p>\n\u003cp>↓（核心教训）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：核心观点\u003c/strong>（段落5-6） 教训：当GDP不再是唯一衡量标准时，世界看起来非常不同 → 肯尼迪观点的解释：【GDP虽是最常见方法 // 但已不够：缺少环境质量+教育成果等影响幸福感的因素】\u003c/p>\n\u003cp>↓（政策建议）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：未来展望\u003c/strong>（段落7） 挑战：增长下滑可能导致日常服务下降 → 解决方案：政策制定者聚焦改善幸福感而非GDP数字 → 结果：可避免厄运+甚至取得进步\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：GDP作为衡量国家成功的唯一标准已经不够，英国虽然GDP表现优异但民众幸福感转化差的案例说明，需要采用更全面的指标体系来衡量国家发展，政策制定者应聚焦于提升民众幸福感而非仅关注GDP增长。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Assuming Every Rich Country Performs Best\u003c/p>\n\u003cp>B. Learning from Countries with Less Wealth\u003c/p>\n\u003cp>C. Putting Well-being at the Centre of Policy\u003c/p>\n\u003cp>D. Giving Up Economic Measurement Entirely\u003c/p>\n\u003cp>E. Economic Strength beside Political Discontent\u003c/p>\n\u003cp>F. Measuring What Growth Becomes\u003c/p>\n\u003cp>G. A Familiar Number with an Incomplete View\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A measure becomes powerful partly because people become accustomed to using it. GDP offers a familiar way to describe economic activity, making it convenient in arguments about national success. Convenience, however, should not be mistaken for completeness. A single figure cannot tell us everything about health, education or the conditions in which people live. The question is not whether the number contains information, but whether it has been asked to carry more meaning than it can support.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>A country may record growth and relatively low unemployment while many citizens remain dissatisfied with its direction. Their response can look puzzling if output is assumed to explain the whole of public experience. It looks less puzzling when services, security and opportunities are considered as well. Political unease beside favourable economic figures is therefore a reason to examine the gap between reported performance and daily life, rather than to dismiss citizens as incapable of understanding numbers.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>A broader assessment asks what countries achieve with the resources they possess. Does growth translate into better health, stronger education and meaningful participation in society? Comparing several kinds of outcomes shifts attention from the amount produced to the value of that production for citizens. Such an approach can reveal weaknesses hidden by a rising total. It can also distinguish the capacity to generate wealth from the capacity to convert it into a better life.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>Wealthier countries do not always improve fastest on every measure of social progress. A less prosperous country may make gains in equality or the environment while a major economy struggles with education or health. These comparisons should not be turned into a claim that poverty is desirable. They show that money and policy results are not identical, and that rich nations can learn from choices made in places with fewer resources.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>For policymakers, the practical consequence is to define success in terms of improvements people can experience. Economic growth remains relevant because resources matter. Yet attention to growth should be joined to questions about public services, environmental quality and opportunity. This wider focus does not guarantee an easy solution to every problem. It does make policy less likely to celebrate a favourable total while overlooking the conditions that give prosperity its human meaning.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：G. A Familiar Number with an Incomplete View / 熟悉数字所呈现的不完整图景\u003c/strong>\u003c/p>\n\u003cp>承认GDP有信息价值，同时指出不能包办国家成功的评价。\u003c/p>\n\u003cblockquote>\n\u003cp>A measure becomes powerful partly because people become accustomed to using it.\u003c/p>\n\u003cp>The question is not whether the number contains information, but whether it has been asked to carry more meaning than it can support.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>承认GDP有信息价值 → 同时指出不能包办国家成功的评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>Familiar Number对应常用的GDP，Incomplete View对应其不能穷尽健康、教育及生活条件；标题保留“有用”与“不充分”两层。\u003c/p>\n\u003cp>最强干扰项D（Giving Up Economic Measurement Entirely）容易因相同话题进入考虑。但质疑完整性不等于取消全部经济统计，段落明确保留数字的信息作用。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：E. Economic Strength beside Political Discontent / 经济强劲与政治不满并存\u003c/strong>\u003c/p>\n\u003cp>以经济数字与公众不满并存揭示评价缺口。\u003c/p>\n\u003cblockquote>\n\u003cp>A country may record growth and relatively low unemployment while many citizens remain dissatisfied with its direction.\u003c/p>\n\u003cp>Political unease beside favourable economic figures is therefore a reason to examine the gap between reported performance and daily life, rather than to dismiss citizens as incapable of understanding numbers.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以经济数字与公众不满并存揭示评价缺口。\u003c/p>\n\u003c/blockquote>\n\u003cp>Economic Strength对应增长与低失业，Political Discontent对应公民仍不满国家方向；beside强调二者并存，迫使读者检查数字之外的生活。\u003c/p>\n\u003cp>最强干扰项A（Assuming Every Rich Country Performs Best）容易因相同话题进入考虑。但良好经济指标不能保证全部生活层面领先，正是本段要拆开的假定。\u003c/p>\n\u003cp>\u003cstrong>42题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Measuring What Growth Becomes / 衡量增长转化成了什么\u003c/strong>\u003c/p>\n\u003cp>从产出总量转向财富如何转化为健康、教育和参与。\u003c/p>\n\u003cblockquote>\n\u003cp>A broader assessment asks what countries achieve with the resources they possess.\u003c/p>\n\u003cp>It can also distinguish the capacity to generate wealth from the capacity to convert it into a better life.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从产出总量转向财富如何转化为健康、教育和参与。\u003c/p>\n\u003c/blockquote>\n\u003cp>Measuring对应用多类结果进行评价，What Growth Becomes对应产出增长是否转成健康、教育和公民参与；重点是转化效果而非总量。\u003c/p>\n\u003cp>最强干扰项D（Giving Up Economic Measurement Entirely）容易因相同话题进入考虑。但增加评价维度不是放弃衡量，而是以更多结果指标补足评价。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：B. Learning from Countries with Less Wealth / 向财富较少的国家学习\u003c/strong>\u003c/p>\n\u003cp>借贫富国家不同表现说明富国也可向他国学习。\u003c/p>\n\u003cblockquote>\n\u003cp>Wealthier countries do not always improve fastest on every measure of social progress.\u003c/p>\n\u003cp>They show that money and policy results are not identical, and that rich nations can learn from choices made in places with fewer resources.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>借贫富国家不同表现说明富国也可向他国学习。\u003c/p>\n\u003c/blockquote>\n\u003cp>Countries with Less Wealth对应在某些社会指标上取得进步的较贫穷国家，Learning对应富国可借鉴其政策选择；不是赞美贫困本身。\u003c/p>\n\u003cp>最强干扰项A（Assuming Every Rich Country Performs Best）容易因相同话题进入考虑。但段落直接反对财富较多就必然各方面表现最好的推定。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：C. Putting Well-being at the Centre of Policy / 以福祉为政策中心\u003c/strong>\u003c/p>\n\u003cp>把多维衡量落实为改善真实生活的政策目标。\u003c/p>\n\u003cblockquote>\n\u003cp>For policymakers, the practical consequence is to define success in terms of improvements people can experience.\u003c/p>\n\u003cp>It does make policy less likely to celebrate a favourable total while overlooking the conditions that give prosperity its human meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>把多维衡量落实为改善真实生活的政策目标。\u003c/p>\n\u003c/blockquote>\n\u003cp>Well-being对应服务、环境和机会等可体验的改善，Centre of Policy对应把这些结果放进政策成功标准，而不是仅庆祝经济总量。\u003c/p>\n\u003cp>最强干扰项D（Giving Up Economic Measurement Entirely）容易因相同话题进入考虑。但资源和增长仍被明确保留，改变的是政策目标的中心和覆盖范围。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>GDP is often treated as a quick answer to the question of how a country is doing. It measures economic activity and is useful for that purpose. Trouble begins when its answer is taken to describe every aspect of national success, including the quality of citizens’ lives.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Public dissatisfaction can therefore be a clue rather than a statistical mystery. When voters express unease despite apparently strong growth, analysts should ask what the headline figure leaves out. The next step is to compare the economic resources available with the outcomes people actually experience.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>The quality of citizens’ lives includes conditions that output alone cannot capture. Health, education, environmental quality and opportunities to participate all matter. A country can increase production while making disappointing progress in these areas. That possibility explains why a favourable economic figure need not settle public dissatisfaction.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>A claim to be the best society may look different under such an assessment. A rich country can perform poorly in turning growth into improvements for citizens. Meanwhile, a poorer neighbour may improve particular services or reduce inequality. The comparison separates the size of an economy from the effectiveness of its choices.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>Comparing those outcomes requires a broader set of indicators. Researchers can examine health, education and civic engagement alongside economic measures. The purpose is to assess how effectively wealth becomes well-being, rather than to assume that the largest amount of wealth automatically produces the best society.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>The effectiveness of those choices gives richer countries something to learn. A successful improvement elsewhere may suggest a better way to use existing resources. Learning from it does not require celebrating poverty or abandoning growth. It requires admitting that wealth is a means whose value depends partly on what governments do with it.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>If wealth is a means, policymakers should be judged on more than increasing its total. They should ask whether services improve, opportunities widen and people become more secure. This changes the focus of policy discussion from defending a single headline number to explaining the practical results of public decisions.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>Practical results give economic measurement its wider purpose. GDP can remain one part of the evidence without being the final verdict on national progress. A fuller account connects resources with well-being and makes visible the parts of ordinary life that an impressive total can too easily conceal.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出GDP适用范围与被过度使用的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>从不满转为研究增长转化结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>补充生活质量维度并解释不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>用国家比较拆开财富和政策表现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>介绍多维指标及其转化评价目的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>引出富国向资源较少国家学习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>把财富工具观转为政策评价标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>总结保留GDP并扩展福祉评价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出GDP适用范围与被过度使用的问题 → 补充生活质量维度并解释不满 → 从不满转为研究增长转化结果 → 介绍多维指标及其转化评价目的 → 用国家比较拆开财富和政策表现 → 引出富国向资源较少国家学习 → 把财富工具观转为政策评价标准 → 总结保留GDP并扩展福祉评价\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → C → B → E → D → F → G → H\u003c/strong>\u003c/p>\n\u003cp>41—45：C、B、D、F、G。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → C → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Trouble begins when its answer is taken to describe every aspect of national success, including the quality of citizens’ lives.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The quality of citizens’ lives includes conditions that output alone cannot capture.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Public dissatisfaction can therefore be a clue rather than a statistical mystery.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>quality of citizens’ lives\u003c/code>，C继续处理这一对象，完成“补充生活质量维度并解释不满”。到本段末尾，讨论又落到\u003ccode>public dissatisfaction\u003c/code>，这正好为下一段“从不满转为研究增长转化结果”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出GDP适用范围与被过度使用的问题 → 补充生活质量维度并解释不满 → 从不满转为研究增长转化结果\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“从不满转为研究增长转化结果”。它也属于同一论题，但若直接放在这里，就会跳过“补充生活质量维度并解释不满”这一必要环节；其段首“Public dissatisfaction can therefore be a clue rather than a statistical mystery.”需要的前提与A当前收束的对象不一致，后续也接不出B所需的\u003ccode>public dissatisfaction\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是C → B → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>That possibility explains why a favourable economic figure need not settle public dissatisfaction.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Public dissatisfaction can therefore be a clue rather than a statistical mystery.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Comparing those outcomes requires a broader set of indicators.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>public dissatisfaction\u003c/code>，B继续处理这一对象，完成“从不满转为研究增长转化结果”。到本段末尾，讨论又落到\u003ccode>outcomes\u003c/code>，这正好为下一段“介绍多维指标及其转化评价目的”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>补充生活质量维度并解释不满 → 从不满转为研究增长转化结果 → 介绍多维指标及其转化评价目的\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“补充生活质量维度并解释不满”。它也属于同一论题，但若直接放在这里，就会跳过“从不满转为研究增长转化结果”这一必要环节；其段首“The quality of citizens’ lives includes conditions that output alone cannot capture.”需要的前提与C当前收束的对象不一致，后续也接不出E所需的\u003ccode>outcomes\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → D → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The purpose is to assess how effectively wealth becomes well-being, rather than to assume that the largest amount of wealth automatically produces the best society.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A claim to be the best society may look different under such an assessment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The effectiveness of those choices gives richer countries something to learn.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the best society\u003c/code>，D继续处理这一对象，完成“用国家比较拆开财富和政策表现”。到本段末尾，讨论又落到\u003ccode>effectiveness of its choices\u003c/code>，这正好为下一段“引出富国向资源较少国家学习”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>介绍多维指标及其转化评价目的 → 用国家比较拆开财富和政策表现 → 引出富国向资源较少国家学习\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“引出富国向资源较少国家学习”。它也属于同一论题，但若直接放在这里，就会跳过“用国家比较拆开财富和政策表现”这一必要环节；其段首“The effectiveness of those choices gives richer countries something to learn.”需要的前提与E当前收束的对象不一致，后续也接不出F所需的\u003ccode>effectiveness of its choices\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是D → F → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The comparison separates the size of an economy from the effectiveness of its choices.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The effectiveness of those choices gives richer countries something to learn.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>If wealth is a means, policymakers should be judged on more than increasing its total.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>effectiveness of its choices\u003c/code>，F继续处理这一对象，完成“引出富国向资源较少国家学习”。到本段末尾，讨论又落到\u003ccode>wealth is a means\u003c/code>，这正好为下一段“把财富工具观转为政策评价标准”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>用国家比较拆开财富和政策表现 → 引出富国向资源较少国家学习 → 把财富工具观转为政策评价标准\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“用国家比较拆开财富和政策表现”。它也属于同一论题，但若直接放在这里，就会跳过“引出富国向资源较少国家学习”这一必要环节；其段首“A claim to be the best society may look different under such an assessment.”需要的前提与D当前收束的对象不一致，后续也接不出G所需的\u003ccode>wealth is a means\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是F → G → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It requires admitting that wealth is a means whose value depends partly on what governments do with it.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>If wealth is a means, policymakers should be judged on more than increasing its total.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Practical results give economic measurement its wider purpose.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>wealth is a means\u003c/code>，G继续处理这一对象，完成“把财富工具观转为政策评价标准”。到本段末尾，讨论又落到\u003ccode>practical results\u003c/code>，这正好为下一段“总结保留GDP并扩展福祉评价”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>引出富国向资源较少国家学习 → 把财富工具观转为政策评价标准 → 总结保留GDP并扩展福祉评价\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“引出富国向资源较少国家学习”。它也属于同一论题，但若直接放在这里，就会跳过“把财富工具观转为政策评价标准”这一必要环节；其段首“The effectiveness of those choices gives richer countries something to learn.”需要的前提与F当前收束的对象不一致，后续也接不出H所需的\u003ccode>practical results\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的
