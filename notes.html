<!DOCTYPE html>
<html lang="zh-CN" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手写笔记</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --pri:#f8bbd0;
  --pri-rgb:248,187,208;
  --pri-ink:#c2185b;
  --pri-hover:#fce4ec;
  --accent:#8b6fc4;
  --accent-deep:#6a4fa3;
  --line:#e0d6f0;
  --text:#2e2640;
  --text-sub:#7a6f8f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f4fb;font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text);
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

/* ===== 顶栏 ===== */
#top{position:fixed;left:0;right:0;top:0;z-index:40;min-height:50px;
  display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 14px;
  background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px)}
.tbtn{border:1px solid var(--line);background:#fff;color:var(--text-sub);
  border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;flex:0 0 auto;font-family:inherit}
.tbtn:hover{color:var(--accent-deep);border-color:var(--accent)}
#back{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;color:var(--text-sub);
  border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none;flex:0 0 auto;font-family:inherit}
#back:hover{color:var(--accent-deep);border-color:var(--accent)}
#back .bkArrow{font-size:13px}
#underlayRow{position:absolute;inset:0;width:100%;height:100%;display:flex;pointer-events:none;}
#underlayRow img{width:50%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#underlayRow.hiddenU{visibility:hidden}
#title{font-size:14px;font-weight:600;color:var(--accent-deep);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{border:1px solid var(--line);background:#fff;color:var(--text-sub);
  border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;flex:0 0 auto;font-family:inherit}
.tbtn:hover{color:var(--accent-deep);border-color:var(--accent)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
/* 顶栏按钮统一成做题页那款（紫边紫字，hover 浅紫底） */
.tbtn{border:1.5px solid #b9a1e6;color:#5a3f96;font-family:inherit}
.tbtn:hover{background:#efe9f9;color:#5a3f96;border-color:#b9a1e6}
#back{border:1.5px solid #b9a1e6;color:#5a3f96}
#back:hover{background:#efe9f9;color:#5a3f96;border-color:#b9a1e6}

/* ===== 纸张 ===== */
#desk{position:fixed;left:0;right:0;top:50px;bottom:0;overflow:auto;
  -webkit-overflow-scrolling:touch;padding:18px 14px 40px}
#paperWrap{position:relative;margin:0 auto;background:#fff;
  border-radius:6px;box-shadow:0 4px 24px rgba(46,38,64,.12);
  /* 宽度=可用高度×底稿比例（双页并排约1.414），撑满视口；窄屏则取 100%。
     --z 是双指捏合缩放倍数，>1 时超宽部分横向滚动 */
  --ar:1.414;--z:1;aspect-ratio:var(--ar);
  width:min(calc(100% * var(--z)),calc((100vh - 128px)*var(--ar)*var(--z)));
  opacity:0;transition:opacity .12s}
#paperWrap.ready{opacity:1}
@media(max-width:760px){#paperWrap{border-radius:0;box-shadow:none}}
</style>
</head>
<body>

<div id="top">
  <a id="back" href="index.html" title="返回主页"><span class="bkArrow">⬅</span><span>主页</span></a>
  <div id="title">手写笔记</div>
  <button class="tbtn" id="uToggle" title="显示/隐藏真题底稿" style="display:none">底稿</button>
  <button class="tbtn" id="exportBtn" title="导出批注（图片 / PDF）">导出</button>
</div>

<div id="desk">
  <div id="paperWrap">
    <div id="underlayRow">
      <img id="underlayA" alt="" draggable="false">
      <img id="underlayQ" alt="" draggable="false">
    </div>
  </div>
</div>

<script src="manifest.js?v=20261004n"></script>
<script src="assets/ekz-db.js?v=20261004n"></script>
<script src="assets/ink-toolbar.js?v=20261004n"></script>
<script src="assets/ekz-export.js?v=20261004n"></script>
<script src="assets/ekz-pdf.js?v=20261004n"></script>
<script src="assets/ink-paper.js?v=20261004n"></script>
<script src="assets/ekz-nav.js?v=20261004n"></script>
<script>
/* ============================================================
   手写笔记页（单张纸 · 与真题页批注共用同一套引擎和工具栏）
   ============================================================ */
const params=new URLSearchParams(location.search);
/* 自由笔记（没带 id 进来的）必须有一个稳定的 ID。
   原来这里直接用 free-Date.now()，每次刷新都是一个新 ID ——
   于是 dbGet 永远读不到旧记录，写进去的笔记刷新一次就"消失"了
   （存是存进了库里，只是再也找不回来，属于静默丢数据，最坏的一种）。
   现在把第一次生成的 ID 存进 sessionStorage，之后一直用它；
   点【清空所有数据】会清 sessionStorage，那时重新开一个空白纸，符合预期。 */
const FREEKEY='ekz.freeNoteId';
function resolveNoteId(){
  const fromUrl=params.get('id');
  if(fromUrl)return fromUrl;
  try{
    const saved=sessionStorage.getItem(FREEKEY);
    if(saved){sessionStorage.setItem(FREEKEY,saved);return saved;}
    const made='free-'+Date.now();
    sessionStorage.setItem(FREEKEY,made);
    return made;
  }catch(e){
    return 'free-'+Date.now();   /* 隐私模式禁 sessionStorage，只能退化成一次性 */
  }
}
const NOTE_ID=resolveNoteId();

let item=null;
(function findItem(){
  for(const y of Object.keys(LIBRARY)){
    const hit=(LIBRARY[y]||[]).find(it=>it.id===NOTE_ID);
    if(hit){item={...hit,year:y};return;}
  }
})();
const NOTE_TITLE=item?item.year+' · '+item.label:'自由笔记';
document.getElementById('title').textContent=NOTE_TITLE+' · 手写笔记';
document.title=NOTE_TITLE+' · 手写笔记';
const EXPORT_NAME=(item?item.id.replace(/[^0-9a-z-]/gi,''):'note')+'-手写笔记.png';

/* ---- 顶栏互跳：真题页 -> 【做题】【复盘】（她 2026-10-03 加） ---- */
if(item) EkzNav.mountNav('zhen',{item:item,year:item.year,btnCls:'tbtn'});

/* ---- 存取 ---- */
/* ekz-db.js 正常加载时走它（内部复用连接、事务挂全 onabort）。
   下面的 fallback 只在脚本加载失败时兜底，版本号必须跟 ekz-db.js 一致，
   否则库已是 v2 时 open(...,1) 会抛 VersionError，笔记页整页静默失效。 */
let _fbDB=null;
function openDB(){
  if(window.ekzDB)return window.ekzDB.open();
  if(_fbDB)return Promise.resolve(_fbDB);
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('ekz-notes-v2',2);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('notes'))db.createObjectStore('notes',{keyPath:'id'});};
    req.onsuccess=()=>{_fbDB=req.result;resolve(_fbDB);};
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(new Error('数据库被其他标签页占用'));
  });
}
function runTx(db,mode,fn){
  return new Promise((resolve,reject)=>{
    let tx;
    try{tx=db.transaction('notes',mode);}catch(e){reject(e);return;}
    let out=null;
    try{out=fn(tx.objectStore('notes'));}catch(e){try{tx.abort();}catch(_){}reject(e);return;}
    tx.oncomplete=()=>resolve(out&&out.result!==undefined?out.result:out);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error||new Error('事务被中止'));
  });
}
/* 读请求必须在 onsuccess 里取result：IDBRequest 自己也有 result 属性（指向自身），
   在 oncomplete 时反查会拿到 request 对象而不是数据。 */
function reqTx(db,fn){
  return new Promise((resolve,reject)=>{
    let tx;
    try{tx=db.transaction('notes','readonly');}catch(e){reject(e);return;}
    const r=fn(tx.objectStore('notes'));
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
    tx.onabort=()=>reject(tx.error||new Error('事务被中止'));
    tx.onerror=()=>reject(tx.error);
  });
}
async function dbGet(id){
  if(window.ekzDB&&window.ekzDB.get)return window.ekzDB.get(id);
  const db=await openDB();
  const r=await reqTx(db,st=>st.get(id));
  return r===undefined?null:r;
}
async function dbPut(rec){
  if(window.ekzDB&&window.ekzDB.put)return window.ekzDB.put(rec);
  const db=await openDB();
  return runTx(db,'readwrite',st=>{st.put(rec);return 1;});
}

let strokes=[]; /* 持久数组：引擎直接往里 push，保存时整体快照 */
let dirty=false,saveTimer=null,saving=false;
function markDirty(){
  dirty=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,700);
}
async function doSave(){
  if(!dirty||saving)return;
  saving=true;
  /* 记下这一轮要存的笔数：await 期间新画的笔不算在这次里，
     存完只把 dirty 清回「仍然脏」而不是直接false，否则新笔迹被吞。 */
  const snapLen=strokes.length;
  try{
    await dbPut({id:NOTE_ID,strokes:strokes,migratedV4:'1',ts:Date.now()});
    dirty=strokes.length!==snapLen;
    if(dirty&&!saveTimer)saveTimer=setTimeout(doSave,700);
  }catch(err){
    console.error('保存失败',err);
    dirty=true;
  }finally{
    saving=false;
  }
}
/* 三个出口都挂上：beforeunload 在移动端常常根本不触发，
   pagehide 和 visibilitychange 才是真正可靠的路径。 */
window.addEventListener('pagehide',()=>{if(dirty)doSave();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)doSave();});
window.addEventListener('beforeunload',()=>{if(dirty)doSave();});

/* ---- 启动：加载笔迹 → 工具栏 + 纸张 ---- */
(async function init(){
  try{
    if(!window.ekzDB)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='assets/ekz-db.js?v=20261004n';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    await window.ekzDB.migrate();
  }catch(_){}

  try{
    const rec=await dbGet(NOTE_ID);
    if(rec){
      if(rec.migratedV4==='1'&&Array.isArray(rec.strokes)){
        strokes=rec.strokes;
      }else if(Array.isArray(rec.pages)){
        /* 旧版迁移：多页合并成一张纸。
           v3 宽纸（左文右题）的笔迹横向压缩一半，更早的单页笔迹原样搬 */
        const wide=rec.migratedV3==='1';
        strokes=rec.pages.reduce((acc,page)=>acc.concat(page||[]),[]).map(s=>({
          ...s,pts:(s.pts||[]).map(q=>{
            const a=Array.isArray(q)?{x:q[0],y:q[1],p:.5}:{x:q.x,y:q.y,p:(q.p===undefined?.5:q.p)};
            return {...a,x:wide?a.x*.5:a.x};
          })
        }));
      }else if(Array.isArray(rec.strokes)){
        strokes=rec.strokes;
      }
    }
  }catch(err){console.error('读取笔记失败',err);}

  /* 工具栏（她的那套，和真题页共用 ink-toolbar.js） */
  const undoStack=[],redoStack=[];
  const bar=window.EkzInkBar.create({
    onChange:function(kind){
      if(!paper)return;
      if(kind==='eye')paper.redraw();
      else if(kind==='undo')undo();
      else if(kind==='redo')redo();
      else if(kind==='clear'){
        if(strokes.length){undoStack.push({t:'clear',s:strokes.splice(0)});redoStack.length=0;paper.redraw();markDirty();}
      }
      else if(kind==='export')doExport();
    }
  });

  /* 撤销/重做 */
  function undo(){
    const op=undoStack.pop();if(!op)return;
    if(op.t==='add'){const i=strokes.indexOf(op.s);if(i>=0)strokes.splice(i,1);redoStack.push(op);}
    else if(op.t==='clear'){strokes.push.apply(strokes,op.s);redoStack.push(op);}
    paper.redraw();markDirty();
  }
  function redo(){
    const op=redoStack.pop();if(!op)return;
    if(op.t==='add'){strokes.push(op.s);undoStack.push(op);}
    else if(op.t==='clear'){op.s=strokes.splice(0);undoStack.push(op);}
    paper.redraw();markDirty();
  }

  /* 底稿：左边文章页、右边题目页，可一键显隐 */
  const UNDERLAYS=(item&&Array.isArray(item.underlay))?item.underlay:[];
  /* 去污染：file:// 直开时浏览器把本地图片当成跨源，canvas 会"污染"导致导出失败，
     所以 file:// 下要换成数据包里的 dataURL（scripts/make-imgdata.py 生成）。
     而 https/http（GitHub Pages 等）下图片与页面同源，不存在污染，直接用 png 路径即可，
     免去二次下载大 base64 的等待。 */
  if(UNDERLAYS.length && location.protocol==='file:'){
    const ds=document.createElement('script');
    ds.src='assets/pdfimg/'+NOTE_ID+'.js';
    ds.onload=function(){
      const data=window.EKZ_IMGDATA&&window.EKZ_IMGDATA[NOTE_ID];
      if(!data)return;
      if(data[0])underlayA.src=data[0];
      if(data[1])underlayQ.src=data[1];
    };
    document.head.appendChild(ds);
  }
  const underlayA=document.getElementById('underlayA'),underlayQ=document.getElementById('underlayQ');
  const underlayRow=document.getElementById('underlayRow'),uTog=document.getElementById('uToggle');
  let uVisible=true;
  if(UNDERLAYS.length){
    uTog.style.display='';
    if(UNDERLAYS[0])underlayA.src=UNDERLAYS[0];
    if(UNDERLAYS[1])underlayQ.src=UNDERLAYS[1];
    const revealPaper=()=>{document.getElementById('paperWrap').classList.add('ready');if(paper)paper.redraw();};
    underlayA.addEventListener('load',function(){
      const ar=(underlayA.naturalWidth*2/underlayA.naturalHeight).toFixed(4);
      document.getElementById('paperWrap').style.setProperty('--ar',ar);
      revealPaper();
    });
    /* 图片加载失败也别把纸藏没了 */
    underlayA.addEventListener('error',revealPaper);
    setTimeout(revealPaper,2000);
    uTog.addEventListener('click',function(){
      uVisible=!uVisible;
      underlayRow.classList.toggle('hiddenU',!uVisible);
      uTog.classList.toggle('on',!uVisible);
      if(paper)paper.redraw();
    });
  }else{
    document.getElementById('paperWrap').classList.add('ready');
  }

  /* 纸张（共用引擎） */
  let zoom=1, z0=1;
  window.paper=window.EkzInkPaper.create({
    host:document.getElementById('paperWrap'),
    strokes:strokes,
    state:bar.st,
    toast:bar.toast,
    /* 双指捏合缩放：围绕捏合中心缩放并补偿滚动 */
    onPinchStart:function(){ z0=zoom; },
    onPinch:function(f,cx,cy){
      const desk=document.getElementById('desk'), wrap=document.getElementById('paperWrap');
      const r=desk.getBoundingClientRect();
      const px=cx-r.left+desk.scrollLeft, py=cy-r.top+desk.scrollTop;
      const oldW=wrap.offsetWidth;
      zoom=Math.min(3,Math.max(1,z0*f));
      wrap.style.setProperty('--z',zoom.toFixed(3));
      const k=oldW?wrap.offsetWidth/oldW:1;
      desk.scrollLeft=px*k-(cx-r.left);
      desk.scrollTop=py*k-(cy-r.top);
    },
    onDirty:function(){
      undoStack.push({t:'add',s:strokes[strokes.length-1]});
      redoStack.length=0;
      markDirty();
    }
  });
  paper.setEditing(true);

  /* 导出（顶栏）：弹窗选图片 / PDF */
  document.getElementById('exportBtn').addEventListener('click',async()=>{
    try{
      if(dirty)await doSave();
      EkzExport.menu({
        title:'导出手写笔记',
        sub:'当前笔记页，含笔迹和底稿',
        items:[
          {label:'导出为图片',sub:'PNG · 单张笔记图',onClick:exportNoteImage},
          {label:'导出为 PDF',sub:'单页 PDF 文件',onClick:exportNotePdf}
        ]
      });
    }catch(err){console.error(err);bar.toast('打开导出失败');}
  });
  function exportNoteImage(){
    const out=paper.exportCanvas();
    if(!out){return;}
    out.toBlob(blob=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=EXPORT_NAME;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      bar.toast('已导出');
    },'image/png');
  }
  function exportNotePdf(){
    const out=paper.exportCanvas();
    if(!out){return;}
    EkzPdf.build([out]).then(blob=>{
      EkzPdf.download(blob,EXPORT_NAME.replace(/\.png$/i,'')+'.pdf');
      bar.toast('已导出');
    });
  }
})();
</script>
</body>
</html>
